 li' in poi il\n  //     collegato e' lui: il dispositivo di prima, se ci riprova, trova «Accesso bloccato»;\n  //   - se il primo torna a dare segnali prima dello «Sblocca», torna «In corso» e lo «Sblocca» sparisce;\n  //   - chi e' fermo su «Accesso bloccato» ribussa da solo ogni 5 secondi (vedi startBloccoWatcher);\n  //   - RIENTRO DALLO STESSO DISPOSITIVO entro 30 minuti dall'ultima attività: libero, senza blocco;\n  //   - «Sospendi» vince su tutto; classe in ESERCITAZIONE → nessun blocco, si rientra sempre.\n  function cloudCheckAccesso(pin, cb, tentativo){\n    if(!SB){ cb && cb({ allow:true }); return; }\n    STATE.riammesso = false; // sessione pulita: si accende solo se il cloud dice \"riammesso\"\n    /* (19/09/2026) RITENTA, come il login. Prima un solo buco di rete qui faceva entrare l'alunno SENZA GETTONE:\n       per tutta l'ora il cloud gli rifiutava bozza, battito e consegna, e dopo due battiti rifiutati compariva\n       «Sessione chiusa». Cinque tentativi in una dozzina di secondi; se proprio il cloud tace lo faccio entrare\n       lo stesso (meglio lavorare che restare fuori) e il gettone se lo fa ridare il battito: vedi cloudPresenza.\n       Ribussare dallo STESSO dispositivo non blocca nessuno: la porta lo riconosce. */\n    var t = tentativo || 0;\n    var muta = function(){\n      if(t >= 4){ cb && cb({ allow:true }); return; }\n      try{ var e = byId('err-alunno'); if(e && byId('gate').style.display !== 'none') e.textContent = 'Il collegamento è debole: sto riprovando…'; }catch(x){}\n      setTimeout(function(){ cloudCheckAccesso(pin, cb, t + 1); }, 1200 + t * 800);\n    };\n    try{\n      // 18/09/2026: tutta la regola (riammissione, verifica gia' consegnata, esercitazione, secondo ingresso,\n      // rientro dallo stesso telefono entro mezz'ora) sta nella porta cf_accesso, sul server. Qui resta solo\n      // il gettone che il server ci consegna: senza quello questo dispositivo non puo' scrivere niente.\n      SB.rpc('cf_accesso', { p_pin: pin, p_dispositivo: idDispositivo() }).then(function(res){\n        var d = (res && !res.error) ? res.data : null;\n        // Rete muta: ritento; e se alla fine tace ancora NON blocco nessuno. Meglio far lavorare che chiudere fuori per un buco di wifi.\n        if(!d){ muta(); return; }\n        if(d.trovato === false){ cb && cb({ allow:true }); return; }\n        if(d.sessione){\n          STATE.sessToken = d.sessione;\n          STATE.sessTokenConfirmed = true;\n          try{ sessionStorage.setItem('cf_sess', d.sessione); }catch(e){}\n        }\n        if(d.riammesso) STATE.riammesso = true;\n        if(d.allow){ cb && cb({ allow:true }); return; }\n        cb && cb({ allow:false, consegnata: !!d.consegnata });\n      }, function(){ muta(); });\n    }catch(e){ muta(); }\n  }\n  // Il gettone di questo dispositivo (sopravvive a un F5 nella stessa scheda).\n  function sessMia(){\n    if(STATE.sessToken) return STATE.sessToken;\n    try{ return sessionStorage.getItem('cf_sess') || null; }catch(e){ return null; }\n  }\n  // ESERCITAZIONE di classe (lista in ced_config.esercitazione_classi), come nella dashboard verifiche:\n  // nessun blocco sul PIN e, alla consegna, l'alunno vede subito la soluzione a confronto.\n  // cb(true/false). Se il cloud non risponde → false: valgono le regole normali della verifica.\n  function cloudClasseInEsercitazione(classe, cb){\n    if(!SB || !classe){ cb && cb(false); return; }\n    // Il DOCENTE legge la tabella (ha i poteri); l'ALUNNO lo chiede alla porta, che risponde per la sua classe.\n    try{\n      if(sonoDocente()){\n        SB.from('ced_config').select('esercitazione_classi').eq('id', 1).maybeSingle().then(function(r){\n          var arr = (r && !r.error && r.data && Array.isArray(r.data.esercitazione_classi)) ? r.data.esercitazione_classi : null;\n          if(arr) STATE.esercitazioneClassi = arr;\n          cb && cb(!!(arr && arr.indexOf(classe) !== -1));\n        }, function(){ cb && cb(false); });\n        return;\n      }\n      var pinE = STATE.studente ? STATE.studente.pin : null;\n      if(!pinE){ cb && cb(false); return; }\n      SB.rpc('cf_stato', { p_pin: pinE }).then(function(r){\n        var d = (r && !r.error) ? r.data : null;\n        cb && cb(!!(d && d.esercitazione));\n      }, function(){ cb && cb(false); });\n    }catch(e){ cb && cb(false); }\n  }\n  function classeInEsercitazione(classe){ return !!(classe && (STATE.esercitazioneClassi || []).indexOf(classe) !== -1); }\n  // Docente: mette/toglie la classe in ESERCITAZIONE. Come per la sospensione, nessun annuncio senza la conferma\n  // del cloud. Accendendola, chi era rimasto «Bloccato» viene sbloccato come con «Sblocca» (via libera + stato\n  // azzerato): chi è fermo sulla schermata di blocco rientra da solo, chi l'ha chiusa rientra col PIN.\n  function cloudSetEsercitazioneClasse(classe, on, cb){\n    if(!classe){ cb && cb(false, 'nessuna classe'); return; }\n    if(!SB){ cb && cb(false, 'nessun collegamento al cloud'); return; }\n    try{\n      SB.from('ced_config').select('esercitazione_classi').eq('id', 1).maybeSingle().then(function(r0){\n        if(!r0 || r0.error){ cb && cb(false, (r0 && r0.error && r0.error.message) || 'il cloud non ha risposto'); return; }\n        var arr = (r0.data && Array.isArray(r0.data.esercitazione_classi)) ? r0.data.esercitazione_classi.slice() : [];\n        var i = arr.indexOf(classe);\n        if(on && i === -1) arr.push(classe);\n        if(!on && i !== -1) arr.splice(i, 1);\n        SB.from('ced_config').update({ esercitazione_classi: arr }).eq('id', 1).select('esercitazione_classi').then(function(res){\n          if(!res || res.error || !res.data || !res.data.length){ cb && cb(false, (res && res.error && res.error.message) || 'il cloud non ha confermato'); return; }\n          var scritte = res.data[0].esercitazione_classi;\n          var davvero = Array.isArray(scritte) ? (scritte.indexOf(classe) !== -1) : false;\n          if(davvero !== !!on){ cb && cb(false, 'il cloud ha risposto, ma la classe non risulta come previsto'); return; }\n          STATE.esercitazioneClassi = Array.isArray(scritte) ? scritte : arr;\n          if(!on){ cb && cb(true, null); return; }\n          try{\n            SB.from('ced_studenti').update({ stato:'non_iniziato', riammesso:true, ultimo_accesso:null }).eq('classe', classe).eq('stato', 'bloccato').eq('consegnata', false).then(function(){ cb && cb(true, null); }, function(){ cb && cb(true, null); });\n          }catch(e){ cb && cb(true, null); }\n        }, function(){ cb && cb(false, 'il cloud non ha risposto'); });\n      }, function(){ cb && cb(false, 'il cloud non ha risposto'); });\n    }catch(e){ cb && cb(false, 'errore imprevisto'); }\n  }\n  function cloudSetStato(pin, stato){\n    if(!SB || !pin) return;\n    try{ SB.from('ced_studenti').update({ stato:stato }).eq('pin', pin).then(function(){}, function(){}); }catch(e){}\n    if(CLOUD_STUD[pin]) CLOUD_STUD[pin].stato = stato;\n  }\n  // azzeraConsegne=true (pulsante \"Riammetti\", dopo consegna): l'alunno torna IN CORSO e tutte le sue\n  //   fatture tornano DA CONSEGNARE (le consegne nel cloud vengono cancellate). Il suo lavoro resta salvato\n  //   sul suo dispositivo (chiavi cf_lavoro per fattura), così rientrando lo ritrova e può riconsegnare.\n  // azzeraConsegne=false (pulsante \"Sblocca\", doppio accesso): lo fa solo rientrare, senza toccare le consegne.\n  function cloudRiammetti(pin, azzeraConsegne){\n    if(!SB || !pin) return;\n    if(azzeraConsegne){\n      // RIAMMETTI (dopo consegna): torna IN CORSO e tutte le sue fatture tornano DA CONSEGNARE.\n      // IMPORTANTE: le consegne NON si cancellano più (prima si perdeva il lavoro!). Si \"riaprono\" mettendo\n      // completato=false: così non contano più come consegnate (dashboard/export/consegnate-locali guardano\n      // completato=true), ma il LAVORO resta nel cloud dentro risposte.dashboardAlunno e l'alunno se lo ritrova\n      // rientrando anche da un ALTRO dispositivo o dopo giorni (backup/ripristino compresi).\n      // (25/09/2026, regola di Mauro: «riapre sempre») Anche un cedolino ASSEGNATO che risulta consegnato nei\n      // compiti (fatto a casa, o diventato «svolto in classe · consegnato» con un Reset) si riapre: quella consegna\n      // diventa una consegna di classe riaperta (modalita 'allenamento', completato=false), cioe' esattamente come\n      // le altre che Riammetti riapre, e da li' recupero del lavoro, riconsegna, consegna forzata e Reset la\n      // trattano gia'. Prima il pulsante diceva «riammesso» e la lasciava chiusa: l'alunno tornava «consegnato».\n      // Le consegne dei compiti di cedolini NON assegnati restano come sono.\n      // Prima si riaprono le consegne, POI si da' il via libera all'alunno: se arrivasse prima, il suo dispositivo\n      // troverebbe ancora la consegna chiusa e tornerebbe «consegnato».\n      var idsAss = effectiveAssignedList(pin).map(function(x){ return x.id; });\n      var riaperture = [];\n      try{ riaperture.push(SB.from('ced_tentativi').update({ completato:false }).eq('pin', pin).eq('completato', true).neq('modalita', 'compiti')); }catch(e){}\n      if(idsAss.length){\n        try{ riaperture.push(SB.from('ced_tentativi').update({ completato:false, modalita:'allenamento' }).eq('pin', pin).eq('completato', true).eq('modalita', 'compiti').in('fattura_id', idsAss)); }catch(e){}\n      }\n      var viaLibera = function(){ try{ SB.from('ced_studenti').update({ riammesso:true, stato:'in_corso', consegnata:false }).eq('pin', pin).then(function(){}, function(){}); }catch(e){} };\n      Promise.all(riaperture.map(function(p){ return Promise.resolve(p).then(function(x){ return x; }, function(){ return null; }); })).then(viaLibera, viaLibera);\n      if(CLOUD_STUD[pin]){ CLOUD_STUD[pin].stato = 'in_corso'; CLOUD_STUD[pin].consegnata = false; CLOUD_STUD[pin].riammesso = true; }\n      CLOUD_CONS[pin] = {};\n    } else {\n      // SBLOCCA (doppio accesso): AUTORITARIO dal docente → azzero SUBITO lo stato bloccato nel cloud (così la\n      // dashboard si sblocca all'istante anche se l'alunno ha chiuso la scheda) e mando comunque il \"via libera\"\n      // (riammesso) per chi è ancora sulla schermata di blocco. Se aveva GIÀ consegnato resta 'consegnato'.\n      var giaCons = !!(CLOUD_STUD[pin] && CLOUD_STUD[pin].consegnata);\n      var upd = giaCons\n        ? { riammesso:true, stato:'consegnato', ultimo_accesso:null, fattura_corrente:null }\n        : { riammesso:true, stato:'non_iniziato', ultimo_accesso:null, fattura_corrente:null, livello_corrente:null };\n      try{ SB.from('ced_studenti').update(upd).eq('pin', pin).then(function(){}, function(){}); }catch(e){}\n      if(!giaCons){ try{ SB.from('ced_tentativi').delete().eq('pin', pin).eq('modalita', 'forzata').then(function(){}, function(){}); }catch(e){} }\n      if(CLOUD_STUD[pin]){ CLOUD_STUD[pin].stato = (giaCons ? 'consegnato' : 'non_iniziato'); CLOUD_STUD[pin].ultimo_accesso = null; CLOUD_STUD[pin].riammesso = true; }\n    }\n  }\n  // Il docente ha AZZERATO la verifica (Reset classe, o ha ricaricato la classe). Il dispositivo dell'alunno\n  // deve CHIUDERSI DA SOLO: ferma tutti i sorveglianti, ferma il battito di presenza e CANCELLA la propria\n  // presenza dal cloud. Così la dashboard del docente resta pulita: niente alunni \"Collegato\" fantasma.\n  // Chiude la sessione di VERIFICA dell'alunno e lo porta dove ha senso (compiti, o gate se sta per arrivare\n  // una verifica nuova). La chiamano tre situazioni diverse: il docente ha RESETTATO, ha SOSPESO la verifica,\n  // o ha segnato QUESTO alunno assente. In tutti e tre i casi il lavoro resta salvo nel cloud: qui si spengono\n  // solo i timer e la presenza (così al rientro non scatta il blocco anti-doppio-accesso).\n  // (23/09/2026) perReset = true: il docente ha fatto Reset o ricaricato la classe. Allora il lavoro NON si mette\n  // al sicuro (e' proprio quello che il docente ha cancellato): lo butto da questo dispositivo, non lo rimando al\n  // cloud, e l'alunno torna alla schermata del PIN (niente rientro automatico). Sospendi e Assente restano come prima.\n  function terminaSessioneVerifica(perReset){\n    if(STATE.sessioneChiusa) return;      // una volta sola\n    if(!perReset) mettiAlSicuroLavoro();  // gli ultimi tasti prima di tutto, finche' so ancora di chi e' il foglio\n    STATE.sessioneChiusa = true;\n    var pin = STATE.studente ? STATE.studente.pin : '';\n    stopSessioneWatcher();\n    stopAssegnazioneWatcher(); stopConsegnaWatcher(); stopBloccoWatcher(); stopAttesaWatcher(); stopCompitiWatcher();\n    stopPresenza();                       // niente più battiti: non può più resuscitare\n    if(pin) cloudClearPresenza(pin);      // e cancello subito quello già scritto\n    if(perReset && pin){\n      buttaLavoroAzzerato(pin);\n      STATE.bozzaLetta = false;           // nessun invio della bozza parte piu' da questa sessione\n      try{ localStorage.removeItem('cf_ultimo_pin'); sessionStorage.removeItem('cf_studente_attivo'); }catch(e){}\n    }\n    STATE.mieAssegnate = []; STATE.assegnataId = null; STATE.multiMode = false; STATE.consegnata = false;\n    byId('topbar-info').innerHTML = '';   // via i comandi della verifica ormai finita\n    if(!pin || perReset){ goGate(); return; }\n    // (24/09/2026) Sospendi, Assente, cedolino tolto: si va SEMPRE ai compiti (regola di Mauro), senza chiedere\n    // al cloud. Prima lo si chiedeva, e con la rete che perde la risposta l'alunno finiva sulla schermata del\n    // PIN (visto nel collaudo con la rete disturbata). Se poi il docente riassegna, il sorvegliante dei compiti\n    // lo riporta sul cedolino.\n    avviaCompitiACasa();\n  }\n  // GETTONE DI SESSIONE: un ALTRO dispositivo ha \"piantato\" il suo gettone (di solito dopo uno «Sblocca» del\n  // docente) → questo dispositivo è stato sostituito. Si chiude da solo SENZA toccare il cloud (la riga ora è\n  // dell'altro: se cancellassi la presenza spegnerei lui). Fermo solo i MIEI timer e mostro un messaggio chiaro.\n  // true se un ALTRO dispositivo ha piantato il suo gettone: il mio è confermato nel cloud ma ora ce n'è uno diverso.\n  function sessioneSorpassata(sessioneCloud){\n    return !!(STATE.sessTokenConfirmed && STATE.sessToken && sessioneCloud && sessioneCloud !== STATE.sessToken);\n  }\n  function terminaSessionePerAltroDispositivo(){\n    if(STATE.sessioneChiusa) return;\n    // Il cloud non accetta piu' niente da qui, ma nel TELEFONO l'ultima versione ci deve restare.\n    try{ if(STATE.saveTimer){ clearTimeout(STATE.saveTimer); STATE.saveTimer = null; } if(!STATE.caricamentoFoglio && byId('editor').style.display !== 'none') salvaLavoro(); }catch(e){}\n    STATE.sessioneChiusa = true;\n    stopSessioneWatcher(); stopAssegnazioneWatcher(); stopConsegnaWatcher(); stopBloccoWatcher(); stopAttesaWatcher();\n    stopPresenza();                       // niente più battiti da questo dispositivo (non deve resuscitare)\n    STATE.proprietario = false;           // non sono più il proprietario: non scrivo più presenza né consegne\n    try{ sessionStorage.removeItem('cf_studente_attivo'); }catch(e){}\n    byId('topbar-info').innerHTML = '';\n    mostraBloccoMsg('🔒', 'Sessione spostata', 'Questa verifica è stata aperta su un altro dispositivo, quindi qui è stata chiusa. Se è un errore, avvisa il prof.', '#8a6d3b');\n  }\n  /* ---------- Guardia della SESSIONE (lato alunno): vale su QUALSIASI schermata ----------\n     Il docente ha resettato o ricaricato la classe? Allora nel cloud l'alunno torna 'non_iniziato' E resta\n     SENZA assegnazione. Questa coppia significa una cosa sola: la verifica è stata azzerata. Il dispositivo\n     si scollega da solo e cancella la propria presenza, così sulla dashboard non resta nessun fantasma\n     \"Collegato\" — nemmeno se l'alunno ha lasciato la scheda aperta.\n     NB: si \"arma\" solo dopo che il cloud ha confermato la sessione (altrimenti si autoterminerebbe al login).\n     Lo \"Sblocca\" del docente rimette 'non_iniziato' ma LASCIA l'assegnazione → non scatta. Giusto così. */\n  function stopSessioneWatcher(){ if(STATE.sessTimer){ clearInterval(STATE.sessTimer); STATE.sessTimer = null; } }\n  function startSessioneWatcher(){\n    stopSessioneWatcher();\n    if(!SB) return;\n    STATE.sessArmed = false;\n    STATE.sessioneChiusa = false;\n    // SORVEGLIANTE UNICO della riga dell'alunno: una sola lettura ogni 3 secondi per consegna forzata E sessione.\n    STATE.sessArmed = false;\n  }\n  // La riga arriva dal battito: qui si guarda solo se qualcun altro ha preso la sessione o se il docente\n  // ha resettato. Nessuna richiesta in piu' al cloud.\n  function applicaSessioneWatcher(s){\n      (function(){\n        if(!s || !STATE.studente || STATE.consegnata) return;\n        // GETTONE: se il MIO gettone è confermato nel cloud ma ora ce n'è un ALTRO, sono stato sostituito → mi chiudo.\n        if(sessioneSorpassata(s.sessione)){ terminaSessionePerAltroDispositivo(); return; }\n        var st = s.stato || 'non_iniziato';\n        // 'bloccato' mentre lavoro = qualcuno ha provato a entrare col mio PIN. Io NON mi fermo: il blocco è\n        // per lui, e il docente lo vede. Se il docente lo sblocca, lui pianta il suo gettone e qui scatta il\n        // controllo qui sopra («Sessione spostata»).\n        if(!STATE.sessArmed){ if(st !== 'non_iniziato') STATE.sessArmed = true; return; }\n        if(st === 'non_iniziato' && !s.fattura_assegnata) terminaSessioneVerifica();   // cedolino tolto: ai compiti (il Reset lo riconosce il contrassegno)\n      })();\n  }\n  // Assegnazione cambiata dal docente, o alunno segnato assente: me ne accorgo dalla riga del battito, e solo\n  // ALLORA faccio il giro completo (che e' quello che apre i pop-up). In condizioni normali: zero richieste.\n  // true = nell'assegnazione c'e' un esercizio che questo dispositivo non ha ancora (una verifica vera arriva\n  // solo a chi ce l'ha assegnata, quindi DOPO l'assegnazione): ho richiesto l'archivio, si riprova al giro dopo.\n  // Una richiesta sola per ogni assegnazione diversa, senza insistere. (19/09/2026)\n  function archivioDaRichiedere(lista){\n    var manca = (lista || []).some(function(x){ return !FATTURE.some(function(f){ return f.id === x.id; }); });\n    if(!manca) return false;\n    var firma = serializeAssegnazione(lista);\n    if(STATE.archivioChiestoPer === firma) return false;\n    STATE.archivioChiestoPer = firma;\n    // Se la richiesta fallisce (in classe partono venticinque telefoni nello stesso istante) si RICHIEDE al giro\n    // dopo: prima restava segnata come fatta, e l'alunno rimaneva piantato su «In attesa» (19/09/2026).\n    cloudAggiornaArchivio(function(ok){ if(!ok && STATE.archivioChiestoPer === firma) STATE.archivioChiestoPer = null; });\n    return true;\n  }\n  function controllaAssegnazioneDaRiga(riga){\n    if(!riga || !STATE.studente || STATE.consegnata) return;\n    if(byId('attesa').style.display !== 'none' || byId('blocco').style.display !== 'none') return;\n    if(STATE.assModaleAperta) return;\n    if(riga.assente || riga.sospesa){ terminaSessioneVerifica(); return; }   // (24/09/2026) anche Sospendi, dal battito ogni 5 s, come in Fattura Facile\n    if(archivioDaRichiedere(parseAssegnazione(riga.fattura_assegnata))) return;\n    var oraStr = (riga.fattura_assegnata || '');\n    var mieStr = (STATE.mieAssegnate || []).map(function(x){ return x.id + ':' + (x.liv || 1); }).join(',');\n    if(STATE.ultimaAssegnStr === undefined) STATE.ultimaAssegnStr = oraStr;\n    var cambiata = (oraStr !== STATE.ultimaAssegnStr);\n    STATE.ultimaAssegnStr = oraStr;\n    if(!cambiata && oraStr && mieStr) return;     // tutto come prima: niente da chiedere al cloud\n    giroAssegnazione();\n  }\n  /* ---------- Sorvegliante del CAMBIO ASSEGNAZIONE in tempo reale (lato alunno) ---------- */\n  function assegnazioniUguali(a, b){\n    var sa = (a||[]).map(function(x){ return x.id + ':' + x.liv; }).sort().join(';');\n    var sb = (b||[]).map(function(x){ return x.id + ':' + x.liv; }).sort().join(';');\n    return sa === sb;\n  }\n  function stopAssegnazioneWatcher(){ if(STATE.assWatchTimer){ clearInterval(STATE.assWatchTimer); STATE.assWatchTimer = null; } }\n  // Ogni 30 secondi UNA richiesta sola, leggera: serve a sapere se il docente ha premuto «Sospendi» (o\n  // «Esercitazione»). Tutto il resto viaggia sul battito. Il giro completo (giroAssegnazione) si fa solo\n  // quando c'e' davvero qualcosa di cambiato.\n  function startAssegnazioneWatcher(){\n    stopAssegnazioneWatcher();\n    if(!SB) return;\n    STATE.assWatchTimer = setInterval(function(){\n      if(!STATE.studente || STATE.assModaleAperta || STATE.modalitaCompiti) return;\n      if(byId('attesa').style.display !== 'none' || byId('blocco').style.display !== 'none') return; // gestiti altrove\n      var cl = STATE.classeAlunno || (STATE.studente && STATE.studente.classe) || null;\n      if(!cl) return;\n      try{\n        SB.rpc('cf_stato', { p_pin: STATE.studente.pin }).then(function(r){\n          var d = (r && !r.error) ? r.data : null;\n          if(!d) return;   // rete muta: non deduco niente\n          if(d.sospesa || d.assente) terminaSessioneVerifica();\n        }, function(){});\n      }catch(e){}\n    }, 30000);\n  }\n  // Il giro completo: lo chiama il battito quando vede un'assegnazione diversa. E' l'unico che apre i pop-up.\n  function giroAssegnazione(){\n      if(!STATE.studente || STATE.assModaleAperta) return;\n      cloudLeggiContestoAlunno(STATE.studente.pin, function(ctx){\n        if(!STATE.studente || STATE.assModaleAperta) return;\n        // (0) IL CLOUD NON HA RISPOSTO (wifi ballerino): non so nulla, quindi NON FACCIO NULLA.\n        //     Senza questa riga un buco di rete di 30s veniva scambiato per «il docente ha resettato»:\n        //     l'alunno veniva sbattuto fuori dalla verifica e riversato nei compiti a casa, la sua presenza\n        //     cancellata, e la «Consegna classe» lo saltava perché ormai risultava «Non collegato».\n        if(!ctx || ctx.errore){ STATE.resetConferme = 0; return; }\n        // (23/09/2026) Il contrassegno del Reset e' cambiato: e' un Reset certo, non serve la doppia conferma.\n        if(ctx.azzCambiato){ terminaSessioneVerifica(true); return; }\n        // (0-bis) Il docente ha SOSPESO la verifica (o ha segnato assente proprio lui): la verifica si chiude\n        //     qui, adesso. Il lavoro resta salvo nel cloud e l'alunno atterra sui compiti, dove può allenarsi\n        //     quanto vuole finché il docente non preme «Riprendi». Nessuna consegna, nessuna forzatura.\n        //     Sta sopra a tutto il resto perché una verifica chiusa non deve nemmeno essere guardata.\n        if(ctx.chiusa){ terminaSessioneVerifica(); return; }\n        // (1) Il docente ha RIAMMESSO l'alunno mentre è in sessione (anche fermo sul menù \"tutte consegnate\"):\n        //     tutte le fatture tornano DA CONSEGNARE, col suo lavoro salvato dentro.\n        if(ctx && ctx.riammesso && STATE.consegnata && !STATE.riammConsumando){ applicaRiammissioneInSessione(); return; }\n        // (2) Cambio assegnazione dal docente — solo se non ha già consegnato tutto.\n        if(STATE.consegnata) return;\n        if(ctx && ctx.stato === 'consegnato') return;\n        var nuova = ((ctx && ctx.lista) || []).filter(function(x){ return FATTURE.some(function(f){ return f.id === x.id; }); });\n        // L'alunno AVEVA un'assegnazione e ora NON ce l'ha più → il docente ha fatto RESET (o ha ricaricato la\n        // classe). La sua sessione non ha più senso: lo scollego e CANCELLO la sua presenza dal cloud.\n        // Senza questo, una scheda lasciata aperta continua a pingare ogni 30s e resuscita l'alunno come\n        // «Collegato» su una dashboard che il docente ha appena azzerato: il classico fantasma.\n        // CINTURA DI SICUREZZA: buttare fuori un alunno dalla verifica è irreversibile per lui, quindi lo\n        // faccio solo dopo DUE letture pulite di fila che dicono la stessa cosa. Una risposta strana isolata\n        // (rete che torna a metà, riga letta mentre il docente sta scrivendo) non basta più.\n        if(!nuova.length){\n          if((STATE.mieAssegnate || []).length){\n            STATE.resetConferme = (STATE.resetConferme || 0) + 1;\n            if(STATE.resetConferme >= 2) terminaSessioneVerifica();   // cedolino tolto dal docente: ai compiti\n          }\n          return;\n        }\n        STATE.resetConferme = 0;\n        if(assegnazioniUguali(nuova, STATE.mieAssegnate)) return; // nessun cambio\n        var vecchia = STATE.mieAssegnate || [];\n        var nuoveId = {}; nuova.forEach(function(x){ nuoveId[x.id] = true; });\n        // Fatture TOLTE dall'assegnazione che l'alunno aveva GIÀ APERTO almeno una volta: buttarle via col suo\n        // lavoro richiede il suo consenso (pop-up), ovunque lui si trovi (dentro un'altra fattura o al menù).\n        var pin = STATE.studente.pin;\n        var rimosseIniziate = vecchia.filter(function(x){ return !nuoveId[x.id] && fatturaIniziata(pin, x.id); });\n        if(rimosseIniziate.length){ chiediCambioAssegnazione(nuova, vecchia, rimosseIniziate); }\n        else { applicaNuovaAssegnazione(nuova); } // nessuna fattura iniziata viene tolta → aggiornamento silenzioso\n      });\n  }\n  function applicaNuovaAssegnazione(nuova){\n    STATE.mieAssegnate = nuova;\n    STATE.multiMode = nuova.length > 1;\n    // Se è nel menù, ricostruiscilo: le fatture rimosse spariscono, le nuove compaiono. Se sta compilando una\n    // fattura che RESTA, nessun disturbo: la lista in memoria è aggiornata e il menù lo rifletterà al rientro.\n    if(byId('menu-fatture').style.display !== 'none'){ renderMenuFatture(); }\n  }\n  function chiediCambioAssegnazione(nuova, vecchia, rimosse){\n    STATE.assModaleAperta = true;\n    rimosse = rimosse || [];\n    var pin = STATE.studente ? STATE.studente.pin : '';\n    var inEditor = (byId('editor').style.display !== 'none');\n    var staCompilandoRimossa = inEditor && !!STATE.assegnataId && rimosse.some(function(x){ return x.id === STATE.assegnataId; });\n    var corpo = staCompilandoRimossa\n      ? 'Il docente ha cambiato i cedolini assegnati: quello che stai compilando non è più tra questi. Il tuo lavoro resta salvato e lo ritrovi nei compiti. Vuoi accettare il cambiamento oppure rifiutarlo e continuare?'\n      : 'Il docente ha cambiato i cedolini assegnati: uno che avevi iniziato non è più tra questi. Il tuo lavoro resta salvato e lo ritrovi nei compiti. Vuoi accettare il cambiamento oppure rifiutarlo e tenerlo?';   // (24/09/2026) col foglio unico il lavoro non si perde piu'\n    var ov = document.createElement('div'); ov.className = 'modal-overlay';\n    ov.innerHTML = '\u003cdiv class=\"modal-card\" style=\"max-width:540px;\">'\n      + '\u003cdiv class=\"prev-title\" style=\"padding:18px 26px 4px; font-weight:800; font-size:16px; color:#3f6b52;\">Assegnazione modificata dal docente\u003c/div>'\n      + '\u003cdiv class=\"modal-body\" style=\"padding:6px 26px 4px; font-size:15px; line-height:1.5;\">' + corpo + '\u003c/div>'\n      + '\u003cdiv class=\"modal-actions\">'\n        + '\u003cbutton type=\"button\" class=\"modal-btn modal-btn-cancel\">Rifiuta\u003c/button>'\n        + '\u003cbutton type=\"button\" class=\"modal-btn modal-btn-ok\">Accetta\u003c/button>'\n      + '\u003c/div>\u003c/div>';\n    ov.querySelector('.modal-btn-ok').addEventListener('click', function(){\n      closeModal(ov); STATE.assModaleAperta = false;\n      // Accetta: adotta la nuova assegnazione. (24/09/2026) Il lavoro dei cedolini tolti NON si butta piu': e' il suo\n      // foglio, resta nel cloud e nei compiti lo ritrova «Svolto in classe · da consegnare».\n      rimosse.forEach(function(x){ rimuoviIniziata(pin, x.id); rimuoviConsegnataLocale(pin, x.id); });\n      STATE.mieAssegnate = nuova; STATE.multiMode = nuova.length > 1;\n      if(staCompilandoRimossa){\n        // stava compilando proprio un cedolino tolto → ne esce col lavoro salvato e rientra dalla porta normale,\n        // che sa anche se il cedolino nuovo l'ha gia' consegnato (allora vede il consegnato, non il foglio)\n        mettiAlSicuroLavoro();\n        STATE.assegnataId = null; STATE.consegnata = false; STATE.avviatoPin = null; STATE.avvioInCorsoDa = 0;\n        cloudLeggiContestoAlunno(pin, avviaAlunnoConLista);\n      } else if(byId('menu-fatture').style.display !== 'none'){\n        renderMenuFatture(); // era al menù → aggiorna la lista (compare la nuova, sparisce la tolta)\n      }\n      // altrimenti sta compilando una fattura che RESTA: nessun disturbo, la lista è aggiornata per quando torna al menù\n    });\n    ov.querySelector('.modal-btn-cancel').addEventListener('click', function(){\n      closeModal(ov); STATE.assModaleAperta = false;\n      // Rifiuta: annulla il cambiamento. Ripristina la VECCHIA assegnazione nel cloud (la dashboard del docente\n      // torna com'era) e tiene le fatture rimosse col loro lavoro.\n      if(SB && STATE.studente){\n        try{ SB.rpc('cf_tieni_assegnazione', { p_pin: pin, p_sess: sessMia(), p_dispositivo: idDispositivo(), p_assegnata: serializeAssegnazione(vecchia), p_livello: (vecchia[0] && vecchia[0].liv != null ? String(vecchia[0].liv) : null) }).then(function(){}, function(){}); }catch(e){}\n      }\n      STATE.mieAssegnate = vecchia;\n      if(byId('menu-fatture').style.display !== 'none'){ renderMenuFatture(); }\n    });\n    document.body.appendChild(ov);\n    ov.querySelector('.modal-btn-ok').focus();\n  }\n  // Riammissione ricevuta mentre l'alunno è GIÀ in sessione (di solito fermo sul menù dopo aver consegnato tutto):\n  // il docente gli ha ridato accesso → tutte le fatture tornano DA CONSEGNARE (il suo lavoro è salvato sul dispositivo,\n  // lo ritrova riaprendo), e lui torna al menù per rivederle/finirle e riconsegnarle.\n  function applicaRiammissioneInSessione(){\n    var pin = STATE.studente ? STATE.studente.pin : null; if(!pin) return;\n    STATE.riammConsumando = true;\n    STATE.riammesso = true;\n    STATE.consegnata = false;\n    STATE.consegnaArmed = false; // si riarma quando il watcher vede l'alunno di nuovo al lavoro (evita ri-blocco su 'consegnato' residuo)\n    // Consuma il flag lato cloud e riporta lo stato \"in corso\".\n    try{ if(SB) SB.rpc('cf_riammissione_presa', { p_pin: pin, p_sess: sessMia(), p_dispositivo: idDispositivo() }).then(function(){}, function(){}); }catch(e){}\n    // Le consegne sono state cancellate dal docente: ricostruendo dal cloud nessuna fattura risulta più consegnata.\n    rebuildConsegnateLocali(pin, function(){\n      STATE.riammConsumando = false;\n      if((STATE.mieAssegnate || []).length === 1){ apriFatturaMenu(STATE.mieAssegnate[0]); }\n      else { mostraMenuFatture(); }\n    });\n  }\n  /* ---------- CONSEGNA FORZATA dal docente (campanella di fine verifica) ----------\n     SEMPRE lato docente: marca «non svolta» le fatture non consegnate e segna consegnato.\n     Il dispositivo dell'alunno (se connesso) si limita a bloccare lo schermo (startConsegnaWatcher). */\n  // Consegna forzata dal docente, a DUE FASI (così NON si perde il lavoro in corso dell'alunno):\n  //  (1) se l'alunno è COLLEGATO → gli segnalo 'da_consegnare': il SUO dispositivo consegna il lavoro reale di\n  //      tutte le sue fatture (come se premesse \"Consegna\" lui). Dopo ~6,5s colmo i buchi (finalizza).\n  //  (2) se è SCOLLEGATO → nessun dispositivo da cui catturare: colmo subito le fatture mancanti (nonSvolta).\n  // La finalizzazione tardiva è anche la rete di sicurezza se il dispositivo dell'alunno non risponde.\n  function forzaConsegna(pin){\n    var st = statoAlunno(pin);\n    if(SB && (st.on || st.part)){\n      try{ SB.from('ced_studenti').update({ stato:'da_consegnare' }).eq('pin', pin).then(function(){}, function(){}); }catch(e){}\n      if(CLOUD_STUD[pin]) CLOUD_STUD[pin].stato = 'da_consegnare';\n      // 12 secondi (erano 6,5): il telefono se ne accorge al battito dopo (fino a 5 secondi) e poi deve spedire\n      // la consegna, che e' la richiesta piu' pesante; con poco campo in 6,5 secondi non ce la faceva, e il docente\n      // finalizzava con la bozza del cloud invece che col foglio vero (19/09/2026).\n      setTimeout(function(){ finalizzaConsegnaForzata(pin); }, 12000);\n    } else {\n      finalizzaConsegnaForzata(pin);\n    }\n  }\n  // Consegna forzata SEMPRE lato docente (affidabile, indipendente dal dispositivo dell'alunno):\n  // legge FRESCO dal cloud cosa ha davvero consegnato, poi marca «non svolta» SOLO le fatture mancanti e segna consegnato.\n  // Avviso UNICO (non 20 pop-up con una classe intera): la consegna forzata non e' riuscita per qualcuno.\n  function avvisaForzataFallita(nome){\n    STATE.forzataFalliti = (STATE.forzataFalliti || []);\n    if(STATE.forzataFalliti.indexOf(nome) === -1) STATE.forzataFalliti.push(nome);\n    if(STATE.forzataAvvisoTimer) clearTimeout(STATE.forzataAvvisoTimer);\n    STATE.forzataAvvisoTimer = setTimeout(function(){\n      var l = STATE.forzataFalliti || []; STATE.forzataFalliti = [];\n      if(!l.length) return;\n      showAlert('ATTENZIONE: la consegna NON e\\' riuscita per ' + l.length + (l.length === 1 ? ' alunno' : ' alunni')\n        + ' (' + l.join(', ') + '). Il cloud non ha risposto. NON ho segnato niente, quindi il loro lavoro e\\' intatto:'\n        + ' controlla la connessione e ripremi «Consegna classe».');\n    }, 1500);\n  }\n  // Salva il lavoro di un alunno partendo dalla sua BOZZA nel cloud, dal dispositivo del DOCENTE.\n  // Serve quando l'alunno e' scollegato (e' andato a casa, ha chiuso il portatile) ma il suo lavoro\n  // e' nel cloud: prima veniva marcato «non svolta» e il ragazzo prendeva zero pur avendo lavorato.\n  // Riusa l'editor del docente (che in dashboard non sta usando) per ricostruire cortesia e dashboard.\n  function catturaDaBozza(pin, x, html, nomeCompleto, cognome, classe){\n    var f = (typeof FATTURE !== 'undefined' && FATTURE) ? FATTURE.find(function(y){ return y.id === x.id; }) : null;\n    var ed = byId('editor');\n    var cortAl = '', dashAl = '', cortCorr = '', dashCorr = '';\n    try{\n      ed.innerHTML = html; wireEditor(); reidrataDinamici(); sbloccaEditorRipristinato(); commitValues(ed);\n      dashAl = ed.innerHTML;\n      cortAl = buildCortesia(raccogli());\n      if(f){\n        cortCorr = buildCortesia(f.soluzione);\n        var solPrec = STATE.soluzioneCorrente;\n        STATE.soluzioneCorrente = f.soluzione;\n        mostraSoluzioneCompilatore(true); commitValues(ed); dashCorr = ed.innerHTML;\n        STATE.soluzioneCorrente = solPrec;\n      }\n    }catch(e){}\n    try{ resetEditor(); }catch(e){}   // rimetto l'editor del docente pulito\n    try{\n      SB.from('ced_tentativi').insert({ pin:pin, classe:classe, fattura_id:x.id, modalita:'forzata', completato:true,\n        risposte:{ titolo:(f ? f.titolo : x.id), nome:nomeCompleto, cognome:cognome, nonSvolta:false,\n                   cortesiaAlunno:cortAl, cortesiaCorretta:cortCorr, dashboardAlunno:dashAl, dashboardCorretta:dashCorr,\n                   daBozza:true, data:new Date().toISOString() } }).then(function(){}, function(){});\n    }catch(e){}\n    CLOUD_CONS[pin] = CLOUD_CONS[pin] || {}; CLOUD_CONS[pin][x.id] = true;\n  }\n  function finalizzaConsegnaForzata(pin){\n    if(!SB) return;\n    var assigned = effectiveAssignedList(pin);\n    if(!assigned.length){\n      // Nessuna fattura assegnata (il docente l'ha tolta): niente da marcare, ma NON devo lasciare l'alunno\n      // incollato su \"In consegna…\". Chiudo comunque la pratica invece di uscire senza fare nulla.\n      try{ SB.from('ced_studenti').update({ stato:'consegnato', consegnata:true, fattura_corrente:null }).eq('pin', pin).then(function(){}, function(){}); }catch(e){}\n      if(CLOUD_STUD[pin]){ CLOUD_STUD[pin].stato = 'consegnato'; CLOUD_STUD[pin].consegnata = true; }\n      renderDocente();\n      return;\n    }\n    var al = (CLASSE && CLASSE.alunni) ? CLASSE.alunni.find(function(a){ return a.pin === pin; }) : null;\n    var nomeCompleto = al ? ((al.cognome||'') + ' ' + (al.nome||'')).trim() : pin;\n    var cognome = al ? (al.cognome||'') : '';\n    try{\n      SB.from('ced_tentativi').select('id,fattura_id,completato,risposte').eq('pin', pin).neq('modalita', 'compiti').order('created_at', { ascending:true }).then(function(res){\n        // LA RETE NON HA RISPOSTO: non so cosa ha gia' consegnato, quindi NON SEGNO NIENTE. Prima invece\n        // res.data era null, done restava vuoto, e marcavo «non svolta» TUTTE le sue fatture: il lavoro\n        // vero spariva dall'export e l'alunno prendeva zero pur avendo fatto la verifica.\n        if(!res || res.error){ avvisaForzataFallita(nomeCompleto); return; }\n        var done = {}, riapribile = {};\n        ((res && res.data) || []).forEach(function(t){\n          if(!t.fattura_id) return;\n          if(t.completato){ done[t.fattura_id] = true; return; }\n          // riga \"riaperta\" dal Riammetti: contiene ancora il LAVORO dell'alunno → si recupera, non si butta.\n          var rr = t.risposte || {};\n          if(!rr.nonSvolta && rr.dashboardAlunno) riapribile[t.fattura_id] = t.id;\n        });\n        // Prima di dichiarare «non svolta» qualcosa, guardo se l'alunno ha una BOZZA nel cloud: e' il caso\n        // classico di chi ha lavorato e se n'e' andato col portatile chiuso. Se il cloud non mi risponde\n        // nemmeno su questo, mi fermo: meglio non segnare che segnare il falso.\n        SB.from('ced_studenti').select('bozza_corrente,classe').eq('pin', pin).maybeSingle().then(function(rb){\n          if(!rb || rb.error){ avvisaForzataFallita(nomeCompleto); return; }\n          var bozza = (rb.data && rb.data.bozza_corrente && typeof rb.data.bozza_corrente === 'object') ? rb.data.bozza_corrente : {};\n          var classeAlunno = (rb.data && rb.data.classe) || (CLOUD_STUD[pin] && CLOUD_STUD[pin].classe) || (CLASSE && CLASSE.classe) || '';\n          assigned.forEach(function(x){\n            if(done[x.id]) return; // già consegnata davvero → non toccare\n            // L'alunno è scollegato ma nel cloud c'è il suo lavoro (riaperto dal Riammetti): lo RICONSEGNO,\n            // invece di buttarlo via marcandolo «non svolta». Niente più lavoro perso.\n            if(riapribile[x.id]){\n              try{ SB.from('ced_tentativi').update({ completato:true }).eq('id', riapribile[x.id]).then(function(){}, function(){}); }catch(e){}\n              CLOUD_CONS[pin] = CLOUD_CONS[pin] || {}; CLOUD_CONS[pin][x.id] = true;\n              return;\n            }\n            // Ha una bozza in corso per questa fattura: e' lavoro VERO, lo salvo io dal mio dispositivo.\n            var b = bozza[x.id];\n            var htmlBozza = b ? (typeof b === 'string' ? b : b.html) : null;\n            if(htmlBozza){ try{ catturaDaBozza(pin, x, htmlBozza, nomeCompleto, cognome, classeAlunno); return; }catch(e){} }\n            var f = (typeof FATTURE!=='undefined') ? FATTURE.find(function(y){ return y.id === x.id; }) : null;\n            var cortCorr = ''; try{ if(f) cortCorr = buildCortesia(f.soluzione); }catch(e){}\n            // anche qui: la classe è quella dell'ALUNNO (dal cloud), non quella attiva sul mio schermo\n            try{ SB.from('ced_tentativi').insert({ pin:pin, classe:classeAlunno, fattura_id:x.id, modalita:'forzata', completato:true,\n              risposte:{ titolo:(f?f.titolo:x.id), nome:nomeCompleto, cognome:cognome, nonSvolta:true, cortesiaAlunno:'', cortesiaCorretta:cortCorr, dashboardAlunno:'', dashboardCorretta:'', data:new Date().toISOString() } }).then(function(){}, function(){}); }catch(e){}\n            CLOUD_CONS[pin] = CLOUD_CONS[pin] || {}; CLOUD_CONS[pin][x.id] = true;\n          });\n          try{ SB.from('ced_studenti').update({ stato:'consegnato', consegnata:true, fattura_corrente:null }).eq('pin', pin).then(function(){}, function(){}); }catch(e){}\n          if(CLOUD_STUD[pin]){ CLOUD_STUD[pin].stato = 'consegnato'; CLOUD_STUD[pin].consegnata = true; }\n          renderDocente(); // riflette subito lo stato (poi il refresh periodico riconcilia col cloud)\n        }, function(){ avvisaForzataFallita(nomeCompleto); });\n      }, function(){ avvisaForzataFallita(nomeCompleto); });\n    }catch(e){}\n  }\n  function forzaConsegnaClasse(){\n    if(!(CLASSE && CLASSE.alunni && CLASSE.alunni.length)){ showAlert('Nessuna classe caricata.'); return; }\n    var cl = (CLASSE.classe || '');\n    // CHI HA LAVORATO MA NON E' PIU' COLLEGATO NON DEVE ESSERE SALTATO. Prima i destinatari erano solo\n    // st.on || st.part: l'alunno che aveva lavorato mezz'ora e poi aveva chiuso il portatile (o era rimasto\n    // senza rete) veniva IGNORATO dalla «Consegna classe» — nessuna consegna, lavoro sepolto nella bozza,\n    // invisibile nell'export: zero in pagella pur avendo fatto la verifica. Ora chiedo al cloud chi ha una\n    // bozza in corso e includo anche loro (il loro lavoro lo salvo io, da qui: vedi catturaDaBozza).\n    var prosegui = function(conLavoro, letturaOk){\n      // (29/09/2026) Il lavoro che conta e' quello sui cedolini ASSEGNATI a lui: la bozza di un compito a casa non fa\n      // di nessuno un alunno «da consegnare». Prima chi aveva solo compiti finiva «Consegnato» senza niente di assegnato,\n      // e chi non aveva aperto la verifica ma aveva un compito a casa in bozza si trovava la verifica «non svolta».\n      var lavoroSuiSuoi = function(a){\n        var ids = conLavoro[a.pin]; if(!ids || !ids.length) return false;\n        return effectiveAssignedList(a.pin).some(function(x){ return ids.indexOf(x.id) !== -1; });\n      };\n      var targets = CLASSE.alunni.filter(function(a){ var st = statoAlunno(a.pin); return st.on || st.part || lavoroSuiSuoi(a); });\n      if(!targets.length){ showAlert('Nessun alunno in corso: non c\\'è niente da consegnare.'); return; }\n      var scollegatiConLavoro = targets.filter(function(a){ var st = statoAlunno(a.pin); return !st.on && !st.part && lavoroSuiSuoi(a); }).length;\n      showConfirm('Consegnare ORA la verifica per i ' + targets.length + (targets.length===1?' alunno':' alunni') + ' che hanno iniziato? Viene salvato il lavoro che hanno fatto finora (come se consegnassero loro).'\n        + (scollegatiConLavoro ? ('\\n\\n🛟 Ne includo ' + scollegatiConLavoro + (scollegatiConLavoro===1 ? ' che non è più collegato ma ha lavoro salvato nel cloud: lo recupero io.' : ' che non sono più collegati ma hanno lavoro salvato nel cloud: lo recupero io.')) : '')\n        + (letturaOk ? '' : '\\n\\n⚠ Non sono riuscito a controllare chi ha lavoro non consegnato (rete): potrei saltare qualche alunno scollegato. Se puoi, riprova.')\n        + '\\n\\nSolo un cedolino mai aperto risulterà «non svolto». Chi non ha iniziato non viene toccato.', function(){\n        targets.forEach(function(a){ forzaConsegna(a.pin); });\n        refreshCloudStud(function(){ refreshConsegne(renderDocente); });\n        showAlert('Consegna in corso per ' + targets.length + (targets.length===1?' alunno':' alunni') + '. Attendi qualche secondo che i dispositivi salvino il lavoro.');\n      });\n    };\n    if(!SB || !cl){ prosegui({}, false); return; }\n    try{\n      SB.from('ced_studenti').select('pin,bozza_corrente').eq('classe', cl).then(function(res){\n        if(!res || res.error){ prosegui({}, false); return; }\n        var conLavoro = {};\n        ((res.data) || []).forEach(function(s){\n          var b = s.bozza_corrente;\n          if(b && typeof b === 'object' && Object.keys(b).length) conLavoro[s.pin] = Object.keys(b);   // i cedolini con una bozza\n        });\n        prosegui(conLavoro, true);\n      }, function(){ prosegui({}, false); });\n    }catch(e){ prosegui({}, false); }\n  }\n  // Sorvegliante schermata di blocco: appena il docente sblocca (riammesso), l'alunno entra da solo.\n  function stopBloccoWatcher(){ if(STATE.bloccoTimer){ clearInterval(STATE.bloccoTimer); STATE.bloccoTimer = null; } }\n  function startBloccoWatcher(continua){\n    stopBloccoWatcher();\n    if(!SB) return;\n    // SCADENZA. Prima questo sorvegliante era IMMORTALE: una scheda «Accesso bloccato» lasciata aperta ieri\n    // continuava a interrogare il cloud all'infinito e, la lezione dopo, poteva marcare «Bloccato» un alunno\n    // che stava lavorando tranquillo. Ora dopo un'ora si arrende e chiede di ricaricare la pagina.\n    // (chi ribussa riparte con `continua`: l'ora di nascita resta quella del primo blocco, non si rinnova.)\n    if(!continua || !STATE.bloccoNato) STATE.bloccoNato = Date.now();\n    var nato = STATE.bloccoNato;\n    var VITA_MAX = 60 * 60 * 1000;\n    STATE.bloccoTimer = setInterval(function(){\n      if(!STATE.studente){ stopBloccoWatcher(); return; }\n      if(Date.now() - nato > VITA_MAX){\n        stopBloccoWatcher();\n        mostraBloccoMsg('⏳', 'Sessione scaduta', 'Questa pagina è rimasta aperta troppo a lungo. Ricaricala e rientra col tuo PIN.', '#8a6d3b');\n        return;\n      }\n      var pin = STATE.studente.pin;\n      if(STATE.sbloccoInCorso) return;\n      // Rete lenta: se la domanda di prima e' ancora per strada (da meno di 8 secondi) non ne accodo un'altra.\n      if(STATE.bloccoStatoInVolo && (Date.now() - STATE.bloccoStatoInVolo) \u003c 8000) return;\n      STATE.bloccoStatoInVolo = Date.now();\n      // Tutto dalla porta: lo stato lo leggo con cf_stato, e lo sblocco lo prendo con cf_accesso, che decide\n      // sul server chi vince (un dispositivo solo) e mi restituisce il gettone nuovo. 18/09/2026.\n      SB.rpc('cf_stato', { p_pin: pin }).then(function(res){\n        STATE.bloccoStatoInVolo = 0;\n        var s = (res && !res.error) ? res.data : null;\n        if(!s) return;\n        if(s.riammesso){\n          STATE.sbloccoInCorso = true;\n          SB.rpc('cf_accesso', { p_pin: pin, p_dispositivo: idDispositivo() }).then(function(r2){\n            STATE.sbloccoInCorso = false;\n            var d = (r2 && !r2.error) ? r2.data : null;\n            if(!d) return;\n            if(d.sessione){\n              STATE.sessToken = d.sessione; STATE.sessTokenConfirmed = true;\n              try{ sessionStorage.setItem('cf_sess', d.sessione); }catch(e){}\n            }\n            if(!d.allow){\n              // Sblocco di una verifica GIÀ consegnata: resta su «Verifica consegnata», niente lavoro riaperto.\n              // Se invece ha vinto un altro dispositivo, qui non cambia nulla e resto bloccato.\n              if(d.consegnata){\n                STATE.consegnata = true;\n                mostraConsegnatoAlunno(null, 'Il docente ti ha sbloccato: la consegna resta. Se ti riammette, potrai rientrare.');\n              }\n              return;\n            }\n            stopBloccoWatcher();\n            STATE.riammesso = true;\n            // (25/09/2026) Un Riammetti e' un avvio NUOVO e voluto: la guardia «un avvio solo» non deve scambiarlo per\n            // un doppione. Serviva quando l'alunno era su «Allenati» (foglio aperto): il rientro veniva scartato e il\n            // via libera, gia' consumato, lo lasciava fermo su «consegnato».\n            STATE.avviatoPin = null; STATE.avvioInCorsoDa = 0;\n            rebuildConsegnateLocali(pin, function(){ cloudLeggiContestoAlunno(pin, avviaAlunnoConLista); });\n          }, function(){ STATE.sbloccoInCorso = false; });\n          return;\n        }\n        // (24/09/2026) Chi e' fermo sul suo CONSEGNATO segue il docente:\n        //   Reset (contrassegno nuovo) → schermata del PIN; Sospendi, Assente o cedolino tolto → compiti;\n        //   cedolino nuovo non ancora consegnato → rientra da solo e lo fa.\n        if(typeof s.azzeramento === 'string' && typeof STATE.azzVisto === 'string' && s.azzeramento !== STATE.azzVisto){\n          stopBloccoWatcher(); STATE.sessioneChiusa = false; terminaSessioneVerifica(true); return;\n        }\n        if(STATE.consegnata && (s.sospesa || s.assente || !s.fattura_assegnata)){\n          stopBloccoWatcher(); STATE.consegnata = false; avviaCompitiACasa(); return;\n        }\n        if(STATE.consegnata && !s.consegnata && s.stato === 'non_iniziato' && s.fattura_assegnata){\n          stopBloccoWatcher(); STATE.consegnata = false; entraStudenteNormale(STATE.studente); return;\n        }\n        if(s.consegnata || s.stato === 'consegnato') return;\n        /* RIBUSSO (19/09/2026). Se il cloud non mi segna 'bloccato' vuol dire che quando ho bussato il\n           proprietario era collegato (respinta silenziosa), oppure che e' tornato dopo. Ribusso da solo: finche'\n           lui e' collegato non succede niente e resto fuori; appena non lo e' piu', il cloud segna 'bloccato' e\n           al docente compare lo «Sblocca», senza che l'alunno debba ridigitare il PIN. Decide tutto cf_accesso. */\n        if(!s.esercitazione && (s.stato !== 'in_corso' || s.sospesa || s.assente)) return;\n        stopBloccoWatcher();\n        SB.rpc('cf_accesso', { p_pin: pin, p_dispositivo: idDispositivo() }).then(function(r3){\n          var d3 = (r3 && !r3.error) ? r3.data : null;\n          if(d3 && d3.sessione){\n            STATE.sessToken = d3.sessione; STATE.sessTokenConfirmed = true;\n            try{ sessionStorage.setItem('cf_sess', d3.sessione); }catch(e){}\n          }\n          if(!d3 || !d3.allow){ startBloccoWatcher(true); return; }\n          rebuildConsegnateLocali(pin, function(){ cloudLeggiContestoAlunno(pin, avviaAlunnoConLista); });\n        }, function(){ startBloccoWatcher(true); });\n      }, function(){ STATE.bloccoStatoInVolo = 0; });\n    }, 5000);\n  }\n  /* ---------- Consegne: salvataggio + Esporta HTML + Backup/Ripristina ---------- */\n  function cloudSalvaConsegna(cb){\n    if(!SB || !STATE.studente){ if(cb) cb(false); return; }\n    var payload = {\n      pin: STATE.studente.pin,\n      // La classe è quella DELL'ALUNNO, non quella caricata su questo dispositivo. Prima si prendeva da CLASSE:\n      // se un alunno della 3B entrava su un PC dove il docente     + '.pdf-page .cx-page{max-width:none;box-shadow:none;border:1px solid #dbe4f2;margin:0;font-size:11px;line-height:1.2;}'\n      + '.pdf-page .cx-muted{line-height:1.2;}'\n      + '.pdf-page .cx-head{padding:10px 18px;}'\n      + '.pdf-page .cx-seller{font-size:15.5px;margin-bottom:2px;}'\n      + '.pdf-page .cx-doc-title{font-size:17.5px;}'\n      + '.pdf-page .cx-dest{margin-top:8px;padding:7px 12px;}'\n      + '.pdf-page .cx-body{padding:8px 18px 3px;}'\n      + '.pdf-page .cx-items thead th{padding:3px 6px;}'\n      + '.pdf-page .cx-items tbody td{padding:2px 6px;}'\n      + '.pdf-page .cx-sumwrap{padding:2px 18px 0;}'\n      + '.pdf-page .cx-row{padding:1px 0;}'\n      + '.pdf-page .cx-pay{margin:6px 18px 0;font-size:11px;}'\n      + '.pdf-page .cx-note{margin:6px 18px 0;padding-top:6px;font-size:10px;}'\n      + '.pdf-page .cx-foot{display:none;}'\n      + '.pdf-traccia{background:#f7f9fc;border:1px solid #e3ebf5;border-radius:10px;padding:8px 14px;margin-bottom:9px;}'\n      + '.pdf-traccia p{margin:0 0 3px;font-size:10px;line-height:1.28;color:#3a475c;}'\n      + '.pdf-traccia p:last-child{margin-bottom:0;}'\n      + '.pdf-mini{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#5b6b82;margin:0 0 4px;}'\n      + '.pdf-mini.alu{color:#5c8b73;margin:2px 0 5px;}'\n      + '.pdf-val-top{display:flex;gap:12px;background:#eef3fb;border:1px solid #cddcf0;border-radius:12px;padding:14px 16px;margin-bottom:12px;}'\n      + '.pdf-vcell{flex:1;text-align:center;}'\n      + '.pdf-vlab{font-size:11px;color:#5b6b82;margin-bottom:4px;}'\n      + '.pdf-vval{font-size:19px;color:#3f6b52;font-weight:600;}'\n      + '.pdf-vbig{font-size:30px;line-height:1;}'\n      + '.pdf-vrow{border:1px solid #e3e7ee;border-radius:10px;padding:12px 14px;margin-bottom:10px;}'\n      + '.pdf-vrh{font-weight:600;color:#3f6b52;margin-bottom:6px;}'\n      + '.pdf-vg{white-space:pre-wrap;background:#f9fafb;border:1px solid #eef1f5;border-radius:8px;padding:9px 11px;font-size:14px;line-height:1.5;}';\n    var cl = esc(classe || '');\n    var body = '';\n    data.forEach(function(s){\n      var nome = s.nome || s.cognome || s.pin;\n      (s.fatture || []).forEach(function(f){\n        var q = pdfQuando(f.consegna);\n        // UNA pagina per fattura: il TESTO dell'esercizio (traccia) + la fattura svolta dall'alunno.\n        // NIENTE pagina «corretta»: la correzione sta nella valutazione (come un compito di matematica).\n        var tracciaHtml = '';\n        if(f.traccia && f.traccia.length){\n          tracciaHtml = '\u003cdiv class=\"pdf-traccia\">\u003cdiv class=\"pdf-mini\">Testo dell\\'esercizio\u003c/div>';\n          f.traccia.forEach(function(p){ tracciaHtml += '\u003cp>' + esc(p) + '\u003c/p>'; });\n          tracciaHtml += '\u003c/div>';\n        }\n        var contenuto = tracciaHtml\n          + '\u003cdiv class=\"pdf-mini alu\">Cedolino compilato dall\\'alunno\u003c/div>'\n          + '\u003cdiv class=\"cx-page\">' + (f.cortesiaAlunno || '\u003ci>&#8212;\u003c/i>') + '\u003c/div>';\n        body += pagina(nome, q, 'Classe ' + cl + ' &middot; Cedolino n.' + esc(String(f.num)), false, '', contenuto);\n      });\n      // Pagina valutazione SOLO se c'è davvero una valutazione (voto o giudizi). Se è un'esercitazione non\n      // valutata, niente pagina vuota: la valutazione non si stampa proprio.\n      var haVal = s.val && (s.val.voto_finale || (s.val.items && s.val.items.length));\n      if(haVal){\n        body += pagina(nome, '', 'Classe ' + cl + ' &middot; Valutazione', false, 'Voto: ' + esc(String(s.val.voto_finale || '—')),\n          pdfValutazioneBlocco(s.val));\n      }\n    });\n    var doc = '\u003c!DOCTYPE html>\u003chtml lang=\"it\">\u003chead>\u003cmeta charset=\"utf-8\">\u003ctitle>Valutazioni ' + esc(classe) + '\u003c/title>\u003cstyle>' + css + pcss + '\u003c/style>\u003c/head>\u003cbody>' + body + '\u003c/body>\u003c/html>';\n    var ifr = document.createElement('iframe');\n    ifr.setAttribute('aria-hidden', 'true');\n    // (26/09/2026) larga come un A4 (794 px) e fuori schermo: cosi' zoomConsegne misura le pagine come sulla carta\n    ifr.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;height:1123px;border:0;visibility:hidden;';\n    document.body.appendChild(ifr);\n    var stampato = false;\n    function vai(){ if(stampato) return; stampato = true; try{ zoomConsegne(ifr.contentDocument); }catch(e){} try{ ifr.contentWindow.focus(); ifr.contentWindow.print(); }catch(e){ showAlert('Stampa non riuscita: ' + e.message); } }\n    ifr.onload = function(){ setTimeout(vai, 250); };   // do' tempo ai font/immagini di sistemarsi\n    try{ ifr.contentWindow.onafterprint = function(){ setTimeout(function(){ if(ifr.parentNode) ifr.parentNode.removeChild(ifr); }, 300); }; }catch(e){}\n    ifr.srcdoc = doc;\n    setTimeout(function(){ if(!stampato) vai(); }, 1200);   // rete di sicurezza se onload non scatta\n  }\n  // Export dei COMPITI A CASA: come l'export verifiche, ma prende TUTTI i compiti consegnati (modalita='compiti'),\n  // senza il vincolo dell'assegnazione (nei compiti l'alunno sceglie da sé quali fare).\n  function esportaCompitiHTML(classe, archivioPronto){\n    if(!SB){ showAlert('Cloud non disponibile.'); return; }\n    if(!archivioPronto){\n      archivioDocente(function(ok){\n        if(!ok){ showAlert('Esportazione NON fatta: non riesco a leggere dal cloud le soluzioni degli esercizi, e senza quelle cedolino e dashboard corretti uscirebbero vuoti. Controlla il collegamento e riprova.'); return; }\n        esportaCompitiHTML(classe, true);\n      });\n      return;\n    }\n    var senzaClasse = (!classe || classe === '—');\n    var q = SB.from('ced_tentativi').select('pin,classe,fattura_id,risposte,created_at').eq('modalita', 'compiti').eq('completato', true);\n    // Ogni cartella esporta SOLO il proprio contenuto: «Senza classe» non deve tirar dentro le altre classi.\n    if(!senzaClasse) q = q.eq('classe', classe);\n    q.order('created_at', {ascending:true}).then(function(res){\n      var rows = (res && res.data) ? res.data : [];\n      if(senzaClasse) rows = rows.filter(function(r){ return !r.classe; });\n      if(!rows.length){ showAlert('Nessun compito da esportare.'); return; }\n      var byPin = {};\n      rows.forEach(function(r){ var rr=r.risposte||{}; if(!byPin[r.pin]) byPin[r.pin]={ nome:(rr.nome||r.pin), cognome:(rr.cognome||''), items:{} }; byPin[r.pin].items[r.fattura_id] = { titolo:(rr.titolo||r.fattura_id||''), cortesiaAlunno:(rr.cortesiaAlunno||''), cortesiaCorretta:(rr.cortesiaCorretta||''), dashboardAlunno:(rr.dashboardAlunno||''), dashboardCorretta:(rr.dashboardCorretta||'') }; });\n      var data = [], cache = {};\n      Object.keys(byPin).forEach(function(pin){\n        var s = byPin[pin];\n        var ids = Object.keys(s.items).sort(function(a,b){ return (parseInt(numeroFattura(a),10)||0)-(parseInt(numeroFattura(b),10)||0); });\n        // 22/09/2026: la versione corretta manca nelle consegne dal 18/09 (l'alunno non ha la soluzione): viene dall'archivio.\n        var fatture = ids.map(function(id){ return cedolinoPerExport(id, s.items[id], false, true, cache); });\n        data.push({ pin:pin, nome:s.nome, cognome:s.cognome, nums:fatture.map(function(f){ return f.num; }).join(' · '), fatture:fatture });\n      });\n      try{ resetEditor(); }catch(e){}   // l'editor usato per disegnare le dashboard torna pulito\n      data.sort(function(a,b){ return profInCima(a,b) || (a.cognome||a.nome).localeCompare((b.cognome||b.nome), 'it'); });\n      // Il titolo del file dice la verità: se sto esportando «Senza classe», non spaccio i compiti\n      // per quelli della classe attiva (prima ci scriveva il nome della classe sbagliata).\n      buildExportDoc(data, senzaClasse ? '' : classe, 'Compiti a casa', 'compiti');\n    }, function(){ showAlert('Errore nel recupero dei compiti.'); });\n  }\n  // BACKUP DELLA SOLA CLASSE ATTIVA (versione 2). Nel file finiscono SOLO i suoi alunni e le SUE consegne,\n  // più l'archivio fatture e il fatto che la classe fosse o no in \"compiti a casa\". Le altre classi NON\n  // vengono toccate, né salvate: così il ripristino non può disturbarle.\n  // cb: chiamata con true se il backup è stato scaricato, false se è fallito. silenzioso: niente showAlert propri\n  // (usato dal backup AUTOMATICO prima del Reset, dove i messaggi li gestisce il chiamante).\n  function backupClasse(cb, silenzioso){\n    var fallito = function(msg){ if(silenzioso){ if(cb) cb(false); } else { showAlert(msg); } };\n    if(!SB){ fallito('Cloud non disponibile.'); return; }\n    var cl = (CLASSE && CLASSE.classe) || STATE.classeAttiva || '';\n    if(!cl){ fallito('Nessuna classe selezionata: scegli prima la classe da salvare.'); return; }\n    SB.from('ced_studenti').select('*').eq('classe', cl).then(function(r1){\n      if(r1 && r1.error){ fallito('Errore backup (alunni).'); return; }\n      var studenti = (r1 && r1.data) ? r1.data : [];\n      if(!studenti.length){ if(silenzioso){ if(cb) cb(true); } else { showAlert('Nessun alunno nella classe ' + cl + ': niente da salvare.'); } return; }\n      var pins = studenti.map(function(s){ return s.pin; });\n      SB.from('ced_config').select('archivio,compiti_classi').eq('id', 1).maybeSingle().then(function(r2){\n        if(r2 && r2.error){ fallito('Errore backup (archivio).'); return; }\n        var cfg = (r2 && r2.data) ? r2.data : null;\n        var inCompiti = !!(cfg && Array.isArray(cfg.compiti_classi) && cfg.compiti_classi.indexOf(cl) !== -1);\n        // le consegne le prendo per PIN (più sicuro del campo classe, che su righe vecchie può mancare)\n        SB.from('ced_tentativi').select('*').in('pin', pins).then(function(r3){\n          if(r3 && r3.error){ fallito('Errore backup (consegne).'); return; }\n          var tentativi = (r3 && r3.data) ? r3.data : [];\n          var snap = { app:'fattura-facile', versione:2, classe:cl, data:new Date().toISOString(),\n                       studenti:studenti, tentativi:tentativi,\n                       archivio:(cfg ? cfg.archivio : null), compitiClasse:inCompiti };\n          cf_download('backup_' + cl + '_' + cf_dateStamp() + '.json', JSON.stringify(snap, null, 2), 'application/json');\n          if(!silenzioso){\n            showAlert('Backup della classe ' + cl + ' salvato: ' + studenti.length + ' alunni e ' + tentativi.length\n              + (tentativi.length === 1 ? ' consegna.' : ' consegne.') + ' Nel file c\\'è SOLO questa classe.');\n          }\n          if(cb) cb(true);\n        }, function(){ fallito('Errore backup (consegne).'); });\n      }, function(){ fallito('Errore backup (archivio).'); });\n    }, function(){ fallito('Errore backup (alunni).'); });\n  }\n  // RIPRISTINO DELLA SOLA CLASSE del file. Rimette alunni + consegne di QUELLA classe e la riporta com'era\n  // (dashboard o compiti a casa). NON sovrascrive la configurazione globale: dell'archivio aggiorna solo le\n  // fatture, e della lista \"compiti a casa\" tocca SOLO questa classe. Le altre classi restano intatte.\n  // Le consegne si ri-inseriscono senza cancellare nulla: i compiti fatti nel frattempo non si perdono.\n  // Nel ripristino: vince il voto ATTUALE del cloud se il backup non ne ha uno, oppure se il cloud è PIÙ RECENTE\n  // (confronto la data ISO dentro la valutazione). Così un voto vecchio del backup non cancella una rivalutazione.\n  function vinceVotoCloud(votoBackup, votoCloud){\n    if(!votoCloud) return false;\n    if(!votoBackup) return true;\n    var d = function(v){ return (v && v.data) ? String(v.data) : ''; };\n    return d(votoCloud) > d(votoBackup);\n  }\n  function ripristinaClasse(j){\n    if(!SB){ showAlert('Cloud non disponibile.'); return; }\n    if(!j || !Array.isArray(j.studenti) || !j.studenti.length){ showAlert('File di backup non valido.'); return; }\n    var v2 = (j.versione >= 2) || !!j.classe;\n    var classe = j.classe || (j.studenti[0] && j.studenti[0].classe) || '';\n    // Backup VECCHIO (conteneva tutte le classi): tengo solo gli alunni della classe del file, per non\n    // ribaltare le altre classi con dati ormai sorpassati.\n    var studenti = v2 ? j.studenti : j.studenti.filter(function(s){ return (s.classe || '') === classe; });\n    var pinsMap = {}; studenti.forEach(function(s){ pinsMap[s.pin] = true; });\n    var pinsArr = studenti.map(function(s){ return s.pin; });\n    var tentativi = (Array.isArray(j.tentativi) ? j.tentativi : []).filter(function(t){ return pinsMap[t.pin]; });\n    var vuoleCompiti = v2 ? !!j.compitiClasse\n      : !!(j.config && Array.isArray(j.config.compiti_classi) && j.config.compiti_classi.indexOf(classe) !== -1);\n    // L'ARCHIVIO FATTURE È UNICO PER TUTTE LE CLASSI: il ripristino di una classe NON deve riscriverlo,\n    // altrimenti riporta indietro le fatture anche alle altre classi (che magari stanno facendo i compiti).\n    // Del backup lo uso solo in locale, e solo se qui non ne ho già uno.\n    var archivioDalBackup = v2 ? j.archivio : (j.config ? j.config.archivio : null);\n\n    // Un ripristino NON deve MAI cancellare in silenzio un voto messo DOPO il backup: prima leggo i voti\n    // attuali, e dove il backup non ne ha uno tengo quello che c'è già.\n    SB.from('ced_studenti').select('pin,valutazione,valutazione_snapshot').in('pin', pinsArr).then(function(resVoti){\n      // Se non riesco a leggere i voti ATTUALI mi fermo: senza saperli, il ripristino li sovrascriverebbe\n      // con quelli (vecchi) del backup e una valutazione fatta dopo il backup sparirebbe in silenzio.\n      // La rete caduta arrivava qui come \"nessun voto trovato\", cioe' esattamente come una classe senza voti.\n      if(!resVoti || resVoti.error){ showAlert('Ripristino ANNULLATO: non riesco a leggere i voti attuali dal cloud, e senza quelli rischierei di cancellarti una valutazione fatta dopo il backup. Non ho toccato niente: controlla la connessione e riprova.'); return; }\n      var attuali = {}; ((resVoti.data) || []).forEach(function(s){ attuali[s.pin] = s; });\n      var votiSalvati = 0;\n      var righe = studenti.map(function(s){\n        var r = {}; for(var k in s) r[k] = s[k];\n        var ora = attuali[s.pin];\n        var oraVal = ora && ora.valutazione;\n        // Tengo SEMPRE il voto PIÙ RECENTE tra quello del backup e quello attuale nel cloud (vedi vinceVotoCloud).\n        // Prima si teneva il voto attuale SOLO se il backup non ne aveva uno: così un voto vecchio nel backup\n        // poteva sovrascrivere in silenzio una rivalutazione più recente.\n        if(oraVal && vinceVotoCloud(r.valutazione, oraVal)){\n          r.valutazione = ora.valutazione;\n          r.valutazione_snapshot = ora.valutazione_snapshot;\n          votiSalvati++;\n        }\n        // CONGELAMENTO DEL TEMPO: il ripristino NON deve \"congelare\" anche il lucchetto della presenza.\n        // Al momento del backup l'alunno risultava collegato (stato in_corso, ultimo_accesso recente): se lo\n        // rimettessi così, al rientro col PIN il sistema penserebbe \"eri già dentro ieri → possibile secondo\n        // dispositivo → BLOCCATO\". Invece: spengo la presenza (nessuno è collegato ORA) e do il VIA LIBERA\n        // (riammesso=true, come un \"Riammetti\" di classe): ognuno rientra col PIN, uno alla volta (il claim su\n        // riammesso è atomico), e riprende ESATTAMENTE da dov'era (la sua bozza_corrente è nel backup). Chi\n        // aveva già consegnato resta consegnato: al rientro rivede \"Verifica consegnata\".\n        r.ultimo_accesso = null;\n        r.fattura_corrente = null;\n        r.livello_corrente = null;\n        r.riammesso = true;\n        return r;\n      });\n\n      SB.from('ced_studenti').upsert(righe, { onConflict:'pin' }).then(function(r1){\n        if(r1 && r1.error){ showAlert('RIPRISTINO FALLITO (alunni): ' + r1.error.message + '. Non è stato ripristinato nulla: riprova.'); return; }\n        var poi = function(){\n          // compiti a casa: tocco SOLO questa classe dentro la lista, senza riscrivere quella delle altre\n          SB.from('ced_config').select('compiti_classi').eq('id', 1).maybeSingle().then(function(res){\n            var arr = (res && res.data && Array.isArray(res.data.compiti_classi)) ? res.data.compiti_classi.slice() : [];\n            var i = arr.indexOf(classe);\n            // Mai rimettere una classe fra le «nascoste», nemmeno se il file di backup è vecchio e lo dice:\n            // le classi ora sono permanenti. Dal ripristino si esce sempre con la classe in dashboard.\n            if(i !== -1) arr.splice(i, 1);\n            STATE.compitiClassi = arr;\n            SB.from('ced_config').update({ compiti_classi:arr }).eq('id', 1).then(function(){}, function(){});\n\n            // in LOCALE: rendo attiva la classe ripristinata\n            try{\n              CLASSE = { classe:classe, alunni:studenti.map(function(s){ return { pin:s.pin, nome:s.nome, cognome:s.cognome }; }) };\n              localStorage.setItem('cf_classe', JSON.stringify(CLASSE));\n              STATE.classeAttiva = classe;\n              if(archivioDalBackup && (typeof FATTURE === 'undefined' || !FATTURE || !FATTURE.length)){\n                FATTURE = adattaArchivio(archivioDalBackup);           // solo se qui non ho già le fatture\n                localStorage.setItem('cf_archivio', JSON.stringify(FATTURE));\n              }\n              var conAss = studenti.find(function(s){ return s.fattura_assegnata; });\n              if(conAss){\n                STATE.assegnate = parseAssegnazione(conAss.fattura_assegnata);\n                STATE.assegnataId = assegnPrimoId(conAss.fattura_assegnata);\n                localStorage.setItem('cf_assegnata', conAss.fattura_assegnata);\n                if(conAss.livello_assegnato) localStorage.setItem('cf_livello', String(conAss.livello_assegnato));\n              } else {\n                STATE.assegnate = []; STATE.assegnataId = null; try{ localStorage.removeItem('cf_assegnata'); }catch(e){}\n              }\n              buildRubrica();\n            }catch(e){}\n\n            showAlert('Classe ' + (classe || '—') + ' ripristinata: ' + studenti.length + ' alunni e ' + tentativi.length\n              + (tentativi.length === 1 ? ' consegna rimessi com\\'erano.' : ' consegne rimessi com\\'erano.')\n              + (votiSalvati ? (' ' + votiSalvati + (votiSalvati === 1 ? ' voto messo dopo il backup è stato CONSERVATO.' : ' voti messi dopo il backup sono stati CONSERVATI.')) : '')\n              + ' La classe è in dashboard.'\n              + ' Le altre classi e l\\'archivio dei cedolini non sono stati toccati.');\n            refreshCloudStud(function(){ refreshConsegne(function(){ if(typeof renderDocente === 'function') renderDocente(); }); });\n          }, function(){ showAlert('Ripristino a metà: gli alunni sono tornati, ma non ho potuto aggiornare la modalità della classe.'); });\n        };\n\n        if(!tentativi.length){ poi(); return; }\n        SB.from('ced_tentativi').upsert(tentativi, { onConflict:'id' }).then(function(r2){\n          if(r2 && r2.error){ showAlert('RIPRISTINO A METÀ: gli alunni sono tornati, ma le ' + tentativi.length + ' consegne NON sono state ripristinate (' + r2.error.message + '). NON cancellare il file di backup: riprova.'); return; }\n          poi();\n        }, function(){ showAlert('RIPRISTINO A METÀ: le consegne non sono state ripristinate. NON cancellare il file di backup: riprova.'); });\n      }, function(){ showAlert('RIPRISTINO FALLITO: il cloud non ha risposto. Non è stato ripristinato nulla: riprova.'); });\n    }, function(){ showAlert('Ripristino non avviato: non riesco a leggere i voti attuali. Riprova.'); });\n  }\n  // Chiusura della pagina: cancello la presenza SOLO se ero io il proprietario della sessione.\n  // (Prima anche il dispositivo respinto lo faceva, e cancellava la presenza di chi stava lavorando.)\n  /* 18/09/2026. Su telefono 'pagehide' scatta anche solo bloccando lo schermo o passand
