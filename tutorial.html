nimation:none;}\n\n/* ---- il cedolino finale, il PROSPETTO PAGA (rifatto il 15/09/2026 sul mockup approvato da Mauro):\n   una parte generale (le voci, la retribuzione lorda, l'imponibile fiscale, il netto) e i dati di\n   dettaglio, come nel suo cedolino NoiPA. Niente codici, niente conti a vista, linee sempre piene.\n   Vive dentro la copia di cortesia e nei file esportati: niente scudo. */\n.ced-sheet{background:#fff; color:#1c1c1a; width:100%; max-width:960px; margin:0 auto; border:1px solid #2f2f2a; padding:18px;\n  font-family:'Schibsted Grotesk', Arial, 'Segoe UI', sans-serif; font-size:13.5px; line-height:1.4;}\n.ced-l{display:block; font-size:9px; letter-spacing:.07em; text-transform:uppercase; color:#5f5f58; font-weight:700; margin-bottom:3px;}\n.ced-v{display:block; font-size:13.5px; font-weight:500; min-height:1.4em;}\n.ced-v.n{text-align:right; font-variant-numeric:tabular-nums;}\n.ced-titolo{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap;\n  border:1px solid #2f2f2a; border-bottom:none; background:#efeee8; padding:7px 9px;}\n.ced-titolo b{font-size:13px; letter-spacing:.12em; text-transform:uppercase;}\n.ced-titolo span{font-size:11px; color:#5f5f58;}\n.ced-griglia{display:grid; border:1px solid #2f2f2a;}\n.ced-griglia + .ced-griglia, .ced-griglia.ced-sotto{border-top:none;}\n.ced-griglia > div{padding:6px 9px; border-left:1px solid #2f2f2a; min-width:0;}\n.ced-griglia > div:first-child{border-left:none;}\n.ced-az{grid-template-columns:2fr 1fr 1.2fr;}\n.ced-dip{grid-template-columns:1.6fr 1.5fr .6fr 1.5fr;}\n.ced-fascia-t{border:1px solid #2f2f2a; border-top:none; background:#efeee8; padding:4px 9px;\n  font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:#3c3c36;}\n.ced-tot{background:#efeee8;}\n.ced-scroll{overflow-x:auto; margin-top:10px;}\n.ced-corpo{width:100%; border-collapse:collapse; border:1px solid #2f2f2a; min-width:560px; font-size:13.5px;}\n.ced-corpo th{background:#efeee8; font-size:9px; letter-spacing:.07em; text-transform:uppercase; color:#5f5f58; font-weight:700;\n  text-align:left; padding:6px 9px; border-bottom:1px solid #2f2f2a;}\n.ced-corpo td{padding:5px 9px; border-bottom:1px solid #d9d8cf; vertical-align:top;}\n.ced-corpo th + th, .ced-corpo td + td{border-left:1px solid #2f2f2a;}\n.ced-corpo .n{width:108px; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}\n.ced-corpo .a{width:72px;}\n.ced-corpo .ced-nr{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}\n.ced-corpo tr.ced-gruppo td{font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:#3c3c36;\n  background:#f8f7f3; padding:4px 9px;}\n.ced-corpo tr.ced-subtot td{font-weight:700; background:#efeee8; border-top:1px solid #2f2f2a; border-bottom:1px solid #2f2f2a;}\n.ced-corpo .ced-spiega{font-weight:400; color:#5f5f58; font-size:12px;}\n.ced-corpo tr.ced-netto-riga td{font-weight:700; background:#efeee8; border-top:1px solid #2f2f2a; border-bottom:none;}\n.ced-dettaglio{margin-top:10px;}\n.ced-dettaglio .ced-fascia-t.primo{border-top:1px solid #2f2f2a;}\n.ced-fondo{grid-template-columns:1fr 1fr 1.3fr; margin-top:10px;}\n.ced-netto{background:#efeee8;}\n.ced-netto .ced-l{color:#1c1c1a;}\n.ced-netto .ced-v{font-size:22px; font-weight:700;}\n.ced-sol-tab{width:100%; max-width:640px; border-collapse:collapse; font-size:14px; margin-top:10px;}\n.ced-sol-tab td{padding:7px 12px; border:1px solid #2f2f2a;}\n.ced-sol-tab td.n{text-align:right; font-variant-numeric:tabular-nums;}\n.ced-sol-tab tr.netto td{background:#efeee8; font-weight:700;}\n@media (max-width:640px){\n  /* html:not(.misura-stampa): durante la misura della stampa (zoomUnFoglio) il cedolino si dispone come sulla carta */\n  html:not(.misura-stampa) .ced-sheet{padding:12px;}\n  html:not(.misura-stampa) .ced-griglia{grid-template-columns:1fr 1fr !important;}\n  html:not(.misura-stampa) .ced-griglia > div{border-left:none; border-top:1px solid #d9d8cf;}\n  html:not(.misura-stampa) .ced-griglia > div:nth-child(-n+2){border-top:none;}\n  html:not(.misura-stampa) .ced-griglia > div:nth-child(even){border-left:1px solid #2f2f2a;}\n  html:not(.misura-stampa) .ced-fondo{grid-template-columns:1fr !important;}\n  html:not(.misura-stampa) .ced-fondo > div{border-left:none !important; border-top:1px solid #2f2f2a;}\n  html:not(.misura-stampa) .ced-fondo > div:first-child{border-top:none;}\n}\n\u003c/style>\n\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"topbar\">\n  \u003cdiv class=\"topbar-inner\">\n    \u003cdiv class=\"ff-badge\">\u003cspan class=\"ff\">CF\u003c/span>\u003cspan class=\"fold\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"ff-word\">Cedolino\u003cbr/>Facile\u003c/div>\n    \u003cdiv class=\"ff-sub\" id=\"topbar-info\">\u003c/div>\n    \u003cbutton class=\"esci-top\" id=\"btn-esci-top\" style=\"display:none;\">\u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-right:6px;\">\u003cpath d=\"M14 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-2\"/>\u003cpath d=\"M9 12h12l-3-3m0 6 3-3\"/>\u003c/svg>Esci\u003c/button>\n  \u003c/div>\n\u003c/header>\n\n\u003c!-- ============ MASCHERA DI ACCESSO ============ -->\n\u003cdiv id=\"gate\">\n  \u003cdiv class=\"gate-card\">\n    \u003cdiv class=\"gate-body\">\n      \u003cdiv class=\"gate-badge\">\u003cspan class=\"ff\">CF\u003c/span>\u003cspan class=\"fold\">\u003c/span>\u003c/div>\n      \u003cdiv class=\"gate-brand\">Cedolino Facile\u003c/div>\n\n      \u003cdiv id=\"gate-pin\">\n        \u003ch1 class=\"gate-title\">Accesso studente\u003c/h1>\n        \u003cp class=\"gate-sub\">Inserisci il PIN personale a 5 cifre.\u003c/p>\n        \u003cdiv class=\"pin-box\">\u003cinput id=\"in-pin\" class=\"pin-input\" maxlength=\"5\" inputmode=\"numeric\" placeholder=\"•••••\" autocomplete=\"off\" />\u003c/div>\n        \u003cdiv class=\"gate-err\" id=\"err-alunno\">\u003c/div>\n        \u003cbutton class=\"btn-entra\" id=\"btn-entra-alunno\">Entra ›\u003c/button>\n        \u003cdiv class=\"gate-link\" id=\"link-docente\">Accesso docente\u003c/div>\n      \u003c/div>\n\n      \u003cdiv id=\"gate-doc\" style=\"display:none;\">\n        \u003ch1 class=\"gate-title\">Accesso docente\u003c/h1>\n        \u003cp class=\"gate-sub\">Email e password del tuo accesso.\u003c/p>\n        \u003cinput id=\"in-mail\" class=\"pass-input\" type=\"email\" placeholder=\"Email\" autocomplete=\"username\" style=\"margin-bottom:10px;\" />\n        \u003cinput id=\"in-pass\" class=\"pass-input\" type=\"password\" placeholder=\"Password\" autocomplete=\"current-password\" />\n        \u003cdiv class=\"gate-err\" id=\"err-docente\">\u003c/div>\n        \u003cbutton class=\"btn-entra\" id=\"btn-entra-docente\">Entra ›\u003c/button>\n        \u003cdiv class=\"gate-link\" id=\"link-alunno\">‹ Torna all'accesso studente\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- ============ AREA DOCENTE ============ -->\n\u003cdiv id=\"docente\" class=\"wrap\" style=\"display:none;\">\n  \u003cdiv class=\"doc-head\">\n    \u003ch1>Area docente\u003c/h1>\n    \u003cspan class=\"pill\" id=\"doc-classe\">Nessuna classe caricata\u003c/span>\n    \u003cselect id=\"sel-classe\" class=\"sel-classe\" style=\"display:none;\">\u003c/select>\n  \u003c/div>\n  \u003cdiv class=\"toolbar-doc\" style=\"margin-bottom:10px;\">\n    \u003cbutton class=\"btn-ghost\" id=\"btn-carica-classe\">Carica classe\u003c/button>\n    \u003cinput type=\"file\" id=\"file-classe\" accept=\".json,application/json\" style=\"display:none;\" />\n    \u003cbutton class=\"btn-ghost\" id=\"btn-esporta-html\">Esporta HTML\u003c/button>\n    \u003cbutton class=\"btn-ghost\" id=\"btn-esporta-pdf\">Esporta PDF\u003c/button>\n    \u003cbutton class=\"btn-archivio\" id=\"btn-archivio-compiti\">\u003csvg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-right:7px;\">\u003cpath d=\"M9 4h3l2 2h5a2 2 0 0 1 2 2v7a2 2 0 0 1 -2 2h-9a2 2 0 0 1 -2 -2v-9a2 2 0 0 1 2 -2\"/>\u003cpath d=\"M17 17v2a2 2 0 0 1 -2 2h-9a2 2 0 0 1 -2 -2v-9a2 2 0 0 1 2 -2h2\"/>\u003c/svg>Archivio compiti\u003c/button>\n    \u003cbutton class=\"btn-ghost\" id=\"btn-backup\">Backup\u003c/button>\n    \u003cbutton class=\"btn-ghost\" id=\"btn-ripristina\">Ripristina\u003c/button>\n    \u003cinput type=\"file\" id=\"file-ripristina\" accept=\".json,application/json\" style=\"display:none;\" />\n    \u003cbutton class=\"btn-red\" id=\"btn-reset\" style=\"margin-left:auto;\">Reset\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"toolbar-doc\">\n    \u003cbutton class=\"btn-sospendi\" id=\"btn-sospendi\">\u003csvg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-right:7px;\">\u003cpath d=\"M6 5h4v14h-4z\"/>\u003cpath d=\"M14 5h4v14h-4z\"/>\u003c/svg>\u003cspan id=\"btn-sospendi-txt\">Sospendi\u003c/span>\u003c/button>\n    \u003cbutton class=\"btn-lavanda\" id=\"btn-consegna-classe\">\u003csvg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-right:7px;\">\u003cpath d=\"M22 2 11 13\"/>\u003cpath d=\"m22 2-7 20-4-9-9-4z\"/>\u003c/svg>Consegna classe\u003c/button>\n    \u003cbutton class=\"btn-lavanda\" id=\"btn-riammetti-classe\">\u003csvg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-right:7px;\">\u003cpath d=\"M9 14l-4 -4l4 -4\"/>\u003cpath d=\"M5 10h11a4 4 0 0 1 0 8h-1\"/>\u003c/svg>Riammetti classe\u003c/button>\n    \u003cbutton class=\"btn-pubblica\" id=\"btn-pubblica-voti\">\u003csvg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-right:7px;\">\u003cpath d=\"M3 11l18 -5v12l-18 -5v-2z\"/>\u003cpath d=\"M11.6 16.8a3 3 0 1 1 -5.8 -1.6\"/>\u003c/svg>Pubblica voti\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"toolbar-doc\">\n    \u003cspan style=\"font-size:14px; color:var(--muted);\">Assegna a tutta la classe:\u003c/span>\n    \u003cbutton class=\"btn-scegli-ass\" id=\"btn-scegli-fatture\">Scegli cedolini\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"doc-tiles\">\n    \u003cdiv class=\"tile\">\u003cdiv class=\"tile-num\" id=\"tile-collegati\">0\u003c/div>\u003cdiv class=\"tile-lbl\">Collegati\u003c/div>\u003c/div>\n    \u003cdiv class=\"tile\">\u003cdiv class=\"tile-num\" id=\"tile-incorso\">0\u003c/div>\u003cdiv class=\"tile-lbl\">In corso\u003c/div>\u003c/div>\n    \u003cdiv class=\"tile\">\u003cdiv class=\"tile-num\" id=\"tile-consegnati\">0\u003c/div>\u003cdiv class=\"tile-lbl\">Consegnati\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"roster-scroll\">\n  \u003ctable class=\"roster\">\n    \u003cthead>\u003ctr>\u003cth style=\"width:36px;\">#\u003c/th>\u003cth style=\"width:230px;\">Cognome e nome\u003c/th>\u003cth style=\"width:90px;\">PIN\u003c/th>\u003cth style=\"width:210px;\">Esercizio assegnato\u003c/th>\u003cth style=\"width:210px;\">Stato\u003c/th>\u003cth style=\"width:120px;\">Azioni\u003c/th>\u003cth style=\"width:80px; text-align:center;\">Voto\u003c/th>\u003cth style=\"width:100px; text-align:center;\">Valuta\u003c/th>\u003c/tr>\u003c/thead>\n    \u003ctbody id=\"roster-body\">\u003c/tbody>\n  \u003c/table>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- ============ VISTA IN ATTESA (studente senza esercitazione assegnata) ============ -->\n\u003cdiv id=\"attesa\" class=\"wrap\" style=\"display:none;\">\n  \u003cdiv class=\"attesa-card\">\n    \u003cdiv class=\"attesa-badge\">\u003cspan class=\"ff\">CF\u003c/span>\u003cspan class=\"fold\">\u003c/span>\u003c/div>\n    \u003ch1 class=\"attesa-title\">In attesa dell'esercitazione\u003c/h1>\n    \u003cp class=\"attesa-msg\">Il docente non ha ancora assegnato l'esercitazione. Appena la assegna, comparirà qui.\u003c/p>\n    \u003cdiv class=\"attesa-nome\" id=\"attesa-nome\">\u003c/div>\n    \u003cbutton class=\"btn-ghost\" id=\"btn-esci-attesa\">Esci\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- ============ VISTA ACCESSO BLOCCATO (doppio accesso) ============ -->\n\u003cdiv id=\"blocco\" class=\"wrap\" style=\"display:none;\">\n  \u003cdiv class=\"attesa-card\" style=\"border-color:#e6c3ba; max-width:520px; margin:56px auto 0; text-align:center;\">\n    \u003cdiv style=\"font-size:50px; line-height:1; margin-bottom:6px;\" id=\"blocco-icona\">🔒\u003c/div>\n    \u003ch1 class=\"attesa-title\" id=\"blocco-title\" style=\"color:#b4472f;\">Accesso bloccato\u003c/h1>\n    \u003cp class=\"attesa-msg\" id=\"blocco-msg\">Hai già effettuato l'accesso in precedenza. Per continuare, devi chiedere lo sblocco al docente.\u003c/p>\n    \u003cdiv class=\"attesa-nome\" id=\"blocco-nome\">\u003c/div>\n    \u003cbutton class=\"btn-ghost\" id=\"btn-esci-blocco\">Esci\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- ============ MENÙ FATTURE (studente con più fatture assegnate) ============ -->\n\u003cdiv id=\"menu-fatture\" class=\"wrap\" style=\"display:none;\">\n  \u003cdiv class=\"attesa-card\" style=\"max-width:640px;\">\n    \u003cdiv class=\"attesa-badge\">\u003cspan class=\"ff\">CF\u003c/span>\u003cspan class=\"fold\">\u003c/span>\u003c/div>\n    \u003ch1 class=\"attesa-title\" id=\"menu-title\">I tuoi cedolini\u003c/h1>\n    \u003cp class=\"attesa-msg\" id=\"menu-sub\">Scegli un cedolino da compilare.\u003c/p>\n    \u003cdiv id=\"menu-list\">\u003c/div>\n    \u003cbutton class=\"btn-ghost\" id=\"btn-esci-menu\" style=\"margin-top:18px;\">Esci\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- ============ BARRA TESTO ESERCITAZIONE (studente) ============ -->\n\u003cdiv class=\"wrap\" id=\"verifica-bar\" style=\"display:none; padding-bottom:0;\">\n  \u003cdiv class=\"verifica\">\n    \u003cdiv class=\"verifica-head\">\n      \u003cdiv class=\"tit\" id=\"ver-tit\">Testo dell'esercitazione\u003c/div>\n      \u003cbutton class=\"toggle\" id=\"ver-toggle\" title=\"Nascondi/mostra il testo\">–\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"verifica-body\" id=\"ver-body\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"wrap\" id=\"editor\" style=\"display:none;\">\n  \u003cdiv id=\"sol-banner\">\n    \u003cspan class=\"sb-tag\">SOLUZIONE\u003c/span>\n    \u003cspan>Stai vedendo i passaggi attesi della soluzione, in sola lettura. Confrontali con la tua compilazione.\u003c/span>\n    \u003cbutton type=\"button\" class=\"sb-btn\" id=\"btnSolEsci\">Torna alla soluzione\u003c/button>\n  \u003c/div>\n  \u003cdiv id=\"livello-bar\" style=\"display:none;\">\u003c!-- per ora tutto Manuale (deciso da Mauro il 20/07) -->\n    \u003cspan class=\"lv-lbl\">Livello di compilazione\u003c/span>\n    \u003cdiv class=\"lv-seg\">\n      \u003cbutton type=\"button\" class=\"lv-btn\" data-lv=\"1\">Manuale\u003c/button>\n      \u003cbutton type=\"button\" class=\"lv-btn\" data-lv=\"2\">Guidata\u003c/button>\n      \u003cbutton type=\"button\" class=\"lv-btn\" data-lv=\"3\">Automatica\u003c/button>\n    \u003c/div>\n    \u003cspan class=\"lv-hint\" id=\"lv-hint\">\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"cedolino\" id=\"ced-editor\">\n    \u003cdiv class=\"foglio\">\n      \u003cdiv class=\"foglio-h\">Il tuo cedolino \u003cspan class=\"r\" id=\"ced-stato-testo\">\u003c/span>\u003c/div>\n      \u003cdiv class=\"foglio-b\">\n\n        \u003cdiv class=\"vuoto\" id=\"ced-vuoto\">\n          \u003cb>Il cedolino lo costruisci tu.\u003c/b>\n          \u003cspan>Quali voci servono, e in che ordine, lo decidi tu.\u003c/span>\n        \u003c/div>\n\n        \u003cdiv id=\"blocchi\" style=\"display:flex; flex-direction:column; gap:14px;\">\u003c/div>\n\n        \u003cdiv class=\"mwrap mwrap-root\">\n          \u003cbutton type=\"button\" class=\"ins\" id=\"btn-root\" aria-expanded=\"false\" aria-haspopup=\"true\">＋ Inserisci voce\u003c/button>\n        \u003c/div>\n\n        \u003cdiv class=\"chiusura\">\n          \u003cspan class=\"avviso-segni\" id=\"ced-avviso-segni\" hidden>\u003c/span>\n          \u003cdiv class=\"sp\">\n            \u003cbutton type=\"button\" class=\"btn p\" id=\"btn-fin\" disabled>Finalizza il cedolino\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cp class=\"mini\">«Finalizza» si accende quando c'è almeno una voce con un importo. Da lì si genera il cedolino.\u003c/p>\n\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"ced-stato\" data-stato=\"\" style=\"display:none;\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"cortesia-view\" style=\"display:none;\">\n  \u003cdiv class=\"wrap\" style=\"padding-top:22px;\">\n    \u003cdiv class=\"banner banner-cortesia\" id=\"cortesia-banner\">\u003csvg viewBox=\"0 0 24 24\" width=\"17\" height=\"17\" fill=\"none\" stroke=\"#3f6b52\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"vertical-align:-3px;margin-right:7px;\">\u003cpath d=\"M14 3v4a1 1 0 0 0 1 1h4\"/>\u003cpath d=\"M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z\"/>\u003cpath d=\"M9 13l6 0\"/>\u003cpath d=\"M9 17l6 0\"/>\u003c/svg>Questo è il tuo \u003cb>cedolino\u003c/b>, con i valori che hai inserito. Controllalo bene prima di consegnare.\u003c/div>\n    \u003cdiv class=\"cx-actions\">\n      \u003cbutton class=\"btn-ghost\" id=\"btnIndietro\">&larr; Torna alla compilazione\u003c/button>\n      \u003cbutton class=\"btn-red-solid\" id=\"btnChiudi\">Chiudi e consegna\u003c/button>\n    \u003c/div>\n    \u003cdiv id=\"cortesia-page\" class=\"cx-page\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"soluzione-view\" style=\"display:none;\">\n  \u003cdiv class=\"wrap\" style=\"padding-top:22px;\">\n    \u003cdiv class=\"banner\" id=\"sol-view-banner\">\u003c/div>\n    \u003cdiv class=\"cx-actions\" id=\"sol-view-actions\">\u003c/div>\n    \u003cdiv id=\"soluzione-page\" class=\"cx-page\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"valuta-view\" style=\"display:none;\">\n  \u003cdiv class=\"wrap\" style=\"padding-top:22px;\">\n    \u003cdiv id=\"valuta-bar\" style=\"margin-bottom:16px;\">\u003c/div>\n    \u003cdiv id=\"valuta-body\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdatalist id=\"motivi-sconto\">\n  \u003coption value=\"Quantità\">\u003c/option>\n  \u003coption value=\"Promozionale\">\u003c/option>\n  \u003coption value=\"Redistribuzione\">\u003c/option>\n  \u003coption value=\"Mercantile\">\u003c/option>\n\u003c/datalist>\n\u003cdatalist id=\"voci-accessoria\">\n  \u003coption value=\"Trasporto\">\u003c/option>\n  \u003coption value=\"Imballaggio fatturato\">\u003c/option>\n  \u003coption value=\"Confezionamento\">\u003c/option>\n  \u003coption value=\"Etichettatura\">\u003c/option>\n  \u003coption value=\"Collaudo\">\u003c/option>\n  \u003coption value=\"Spese d'incasso\">\u003c/option>\n\u003c/datalist>\n\u003cdatalist id=\"voci-anticipata\">\n  \u003coption value=\"Bollo\">\u003c/option>\n  \u003coption value=\"Trasporto\">\u003c/option>\n  \u003coption value=\"Imballaggio\">\u003c/option>\n  \u003coption value=\"Etichettatura\">\u003c/option>\n  \u003coption value=\"Collaudo\">\u003c/option>\n  \u003coption value=\"Analisi di laboratorio\">\u003c/option>\n  \u003coption value=\"Bolli e diritti\">\u003c/option>\n\u003c/datalist>\n\u003cdatalist id=\"voci-cauzione\">\n  \u003coption value=\"Pallet a rendere\">\u003c/option>\n  \u003coption value=\"Casse/contenitori a rendere\">\u003c/option>\n\u003c/datalist>\n\u003cdatalist id=\"voci-interessi\">\n  \u003coption value=\"Interessi di dilazione\">\u003c/option>\n\u003c/datalist>\n\u003cdatalist id=\"metodi-pag\">\n  \u003coption value=\"Bonifico bancario\">\u003c/option>\n  \u003coption value=\"Contanti\">\u003c/option>\n  \u003coption value=\"Assegno\">\u003c/option>\n  \u003coption value=\"RiBa\">\u003c/option>\n  \u003coption value=\"POS\">\u003c/option>\n\u003c/datalist>\n\u003cdatalist id=\"termini-pag\">\n  \u003coption value=\"Immediato\">\u003c/option>\n  \u003coption value=\"30 giorni\">\u003c/option>\n  \u003coption value=\"60 giorni\">\u003c/option>\n  \u003coption value=\"90 giorni\">\u003c/option>\n\u003c/datalist>\n\n\u003cscript>\n(function(){\n  /* ---------- helpers (verificato) ---------- */\n  function fmt(n){ n = (typeof n === 'number' && isFinite(n)) ? n : 0; var neg = n \u003c 0; n = Math.abs(n); var pr = n.toFixed(2).split('.'); pr[0] = pr[0].replace(/\\B(?=(\\d{3})+(?!\\d))/g, '.'); return (neg ? '-' : '') + pr[0] + ',' + pr[1]; }\n  function num(v){\n    var s = String(v == null ? '' : v).replace(/[^0-9.,-]/g, '').trim();\n    if(s === '') return 0;\n    if(s.indexOf(',') >= 0){ s = s.replace(/\\./g, '').replace(',', '.'); }\n    else if(/^-?\\d{1,3}(\\.\\d{3})+$/.test(s)){ s = s.replace(/\\./g, ''); }\n    var n = parseFloat(s);\n    return isNaN(n) ? 0 : n;\n  }\n  function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }\n  function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;'); }\n  // «Becattini Mauro» e' l'alunno dimostrativo del docente: negli elenchi sta sempre in cima.\n  function eProf(x){ var s = x ? ((x.cognome||'') + ' ' + (x.nome||'')) : ''; return /\\bbecattini\\b/i.test(s) && /\\bmauro\\b/i.test(s); }\n  function profInCima(a, b){ return (eProf(b) ? 1 : 0) - (eProf(a) ? 1 : 0); }\n  function autogrow(t){ t.style.height='auto'; t.style.height=(t.scrollHeight)+'px'; }\n  function isEmpty(v){ return !v || !String(v).trim(); }\n  function byId(id){ return document.getElementById(id); }\n  function eur(n){ return '€ ' + fmt(n); }\n  function dataIt(s){ s=String(s||''); if(/^\\d{4}-\\d{2}-\\d{2}$/.test(s)){ var p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; } return s; }\n  function attachMoney(inp){\n    inp.addEventListener('focus', function(){ inp.value = inp.value.replace(/[€\\s]/g,''); });\n    inp.addEventListener('blur', function(){ inp.value = isEmpty(inp.value) ? '' : ('€ ' + fmt(num(inp.value))); });\n  }\n  function attachMoneyNeg(inp){\n    inp.addEventListener('focus', function(){ inp.value = inp.value.replace(/[−\\-€\\s]/g,''); });\n    inp.addEventListener('blur', function(){ inp.value = isEmpty(inp.value) ? '' : ('− € ' + fmt(num(inp.value))); });\n  }\n  function attachMoneyPos(inp){\n    inp.addEventListener('focus', function(){ inp.value = inp.value.replace(/[+€\\s]/g,''); });\n    inp.addEventListener('blur', function(){ inp.value = isEmpty(inp.value) ? '' : ('+ € ' + fmt(num(inp.value))); });\n  }\n  function attachNumber(inp){\n    inp.addEventListener('focus', function(){ inp.value = inp.value.replace(/\\s/g,''); });\n    inp.addEventListener('blur', function(){ inp.value = isEmpty(inp.value) ? '' : fmt(num(inp.value)); });\n  }\n\n  /* ---------- Modali eleganti (sostituiscono alert/confirm nativi) ---------- */\n  function closeModal(ov){ if(ov && ov.parentNode) ov.parentNode.removeChild(ov); }\n  function showAlert(msg, onClose){\n    var ov = document.createElement('div'); ov.className = 'modal-overlay';\n    ov.innerHTML = '\u003cdiv class=\"modal-card\">\u003cdiv class=\"modal-body\">\u003c/div>' +\n      '\u003cdiv class=\"modal-actions\">\u003cbutton type=\"button\" class=\"modal-btn modal-btn-ok\">OK\u003c/button>\u003c/div>\u003c/div>';\n    ov.querySelector('.modal-body').textContent = msg;\n    function done(){ closeModal(ov); if(typeof onClose === 'function') onClose(); }\n    ov.querySelector('.modal-btn-ok').addEventListener('click', done);\n    ov.addEventListener('mousedown', function(e){ if(e.target === ov) done(); });\n    document.body.appendChild(ov);\n    ov.querySelector('.modal-btn-ok').focus();\n  }\n  // onAnnulla (facoltativo): serve dove anche il \"no\" ha qualcosa da dire — es. il Reset, che deve\n  // rassicurare che non ha cancellato niente. Chi passa solo onOk continua a funzionare come prima.\n  function showConfirm(msg, onOk, onAnnulla){\n    var ov = document.createElement('div'); ov.className = 'modal-overlay';\n    ov.innerHTML = '\u003cdiv class=\"modal-card\">\u003cdiv class=\"modal-body\">\u003c/div>' +\n      '\u003cdiv class=\"modal-actions\">' +\n        '\u003cbutton type=\"button\" class=\"modal-btn modal-btn-cancel\">Annulla\u003c/button>' +\n        '\u003cbutton type=\"button\" class=\"modal-btn modal-btn-ok\">OK\u003c/button>' +\n      '\u003c/div>\u003c/div>';\n    ov.querySelector('.modal-body').textContent = msg;\n    var annulla = function(){ closeModal(ov); if(typeof onAnnulla === 'function') onAnnulla(); };\n    ov.querySelector('.modal-btn-cancel').addEventListener('click', annulla);\n    ov.addEventListener('mousedown', function(e){ if(e.target === ov) annulla(); });\n    ov.querySelector('.modal-btn-ok').addEventListener('click', function(){ closeModal(ov); if(typeof onOk === 'function') onOk(); });\n    document.body.appendChild(ov);\n    ov.querySelector('.modal-btn-ok').focus();\n  }\n\n  var toolbar = byId('toolbar');\n\n  /* ---------- stato applicazione ---------- */\n  var CLASSE = null;\n  var FATTURE = [];\n  var RUBRICA = [];\n  var TESTO_FINE_ALLENAMENTO = 'Fine - vedi soluzione';   // il pulsante in fondo all'allenamento (27/09/2026: trattino corto; «Fine» resta perche' dopo l'OK il foglio si blocca e non si continua)\n  var STATE = { assegnataId:null, assegnate:[], mieAssegnate:[], multiMode:false, studente:null, verificaCorrente:null, soluzioneCorrente:null, consegnata:false, myDashboardHTML:null, myCortesiaHTML:null, correctCortesiaHTML:null, correctDashboardHTML:null, attesaTimer:null };\n  var PRISTINE_EDITOR = '';\n  var ANA_FIELDS = { v:['indirizzo','cap','comune','prov','piva','cf'], c:['indirizzo','cap','comune','prov','piva','cf','pec'] };\n  /* Livello di compilazione attivo: 1 Manuale · 2 Guidata · 3 Automatica. Predefinito Guidata. */\n  var LIVELLO = 1;\n\n  /* ================= Cloud (Supabase) — passo 1a ================= */\n  var SB = null;\n  var SB_URL = 'https://zwuutlrafdmfqexbnohc.supabase.co';\n  var SB_KEY = 'sb_publishable_6oCmDuDh_8ibf-p4ZAcfZg_muXXuO8N';\n  /* TEMPO MASSIMO SU OGNI RICHIESTA (19/09/2026). Col telefono che prende poco una richiesta puo' restare\n     APPESA: non fallisce e non risponde, e tutto quello che aspettava la risposta («Invio in corso…», «Chiudi e\n     consegna», il ribusso di «Accesso bloccato») restava fermo per sempre, perche' i ritentativi scattano solo\n     davanti a un errore. Dopo 25 secondi la richiesta appesa viene troncata: diventa un errore come gli altri,\n     e i ritentativi che gia' esistono fanno il loro mestiere. */\n  var TEMPO_MASSIMO_RICHIESTA_MS = 25000;\n  function fetchConTempoMassimo(risorsa, opzioni){\n    if(typeof AbortController === 'undefined') return fetch(risorsa, opzioni);\n    var ac = new AbortController();\n    var o = {}; for(var k in (opzioni || {})) o[k] = opzioni[k];\n    if(o.signal){ try{ o.signal.addEventListener('abort', function(){ ac.abort(); }); }catch(e){} }\n    o.signal = ac.signal;\n    var sveglia = setTimeout(function(){ try{ ac.abort(); }catch(e){} }, TEMPO_MASSIMO_RICHIESTA_MS);\n    return fetch(risorsa, o).then(function(r){ clearTimeout(sveglia); return r; }, function(e){ clearTimeout(sveglia); throw e; });\n  }\n  try{ if(window.supabase){ SB = window.supabase.createClient(SB_URL, SB_KEY, { global: { fetch: fetchConTempoMassimo } }); } }catch(e){}\n  /* MESSAGGIO CHE DEVE PARTIRE ANCHE SE IL TELEFONO CONGELA LA PAGINA (18/09/2026).\n     Quando l'alunno abbassa la scheda, passa a un'altra app o blocca lo schermo, Android congela la pagina\n     nel giro di un istante: la richiesta normale del cloud viene troncata a meta' e non arriva mai. E' per\n     questo che l'app «in secondo piano» finiva lo stesso in «Non collegato» dopo 40 secondi: il telefono\n     non faceva in tempo a dire «sono ancora qui, solo dietro». `keepalive` e' la promessa del browser di\n     spedire comunque quel messaggio, anche a pagina congelata o chiusa. Vale per due soli messaggi, brevi:\n     «sono passato in secondo piano» e «ho chiuso». */\n  function rpcSubito(nome, corpo){\n    try{\n      return fetch(SB_URL + '/rest/v1/rpc/' + nome, {\n        method:'POST', keepalive:true, mode:'cors', cache:'no-store',\n        headers:{ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer ' + SB_KEY },\n        body: JSON.stringify(corpo)\n      }).catch(function(){});\n    }catch(e){ return null; }\n  }\n  /* PALLINO ROSSO (21/09/2026, chiesto da Mauro: «esattamente come nella dashboard delle verifiche»).\n     Mentre l'alunno lavora, la pagina dice al cloud se e' DAVANTI o no: scheda cambiata, finestra abbassata,\n     altra app, schermo spento, clic fuori dalla finestra. Lo dice dentro il battito (p_fuori) e, a ogni\n     cambio, subito, col messaggio che parte anche a pagina congelata (rpcSubito). p_seq e' l'ora di questo\n     dispositivo, sempre crescente: il cloud ignora un segnale piu' vecchio dell'ultimo, cosi' un «sono fuori»\n     rimasto per strada non puo' sorpassare il «sono tornato». Solo il pallino: niente blocchi, niente avvisi. */\n  var ULTIMO_SEQ = 0;\n  function prossimoSeq(){ var n = Date.now(); if(n \u003c= ULTIMO_SEQ) n = ULTIMO_SEQ + 1; ULTIMO_SEQ = n; return n; }\n  /* FINESTRA RIMPICCIOLITA (22/09/2026, chiesto da Mauro). Un alunno ha tenuto l'app davanti, col fuoco, in una\n     finestra piccola, e di fianco un altro browser da cui leggere: il pallino non si accendeva, perche' guardare\n     un'altra finestra non toglie il fuoco a nessuno. La pagina non vede le altre finestre, ma sa quanto e' grande\n     la sua rispetto allo schermo del dispositivo: se occupa meno del 90% in larghezza o dell'85% in altezza e'\n     «fuori» (finestra non ingrandita, schermo diviso, finestra mobile del telefono). Si confronta con lo schermo\n     GIA' senza la barra delle applicazioni (availWidth/availHeight), quindi vale per qualunque dispositivo.\n     Sui telefoni l'altezza non si guarda mentre si scrive in una casella: la tastiera puo' accorciare la finestra. */\n  /* IPHONE: CONTA SOLO LA PAGINA NASCOSTA (24/09/2026). In 4G, sulla dashboard verifiche, tre alunni con\n     l'iPhone avevano il pallino acceso fisso pur rispondendo alle domande (le risposte arrivavano, il battito ogni\n     5 secondi pure): su certi iPhone, soprattutto con il link aperto da Classroom dentro il suo visore, la pagina\n     risulta senza fuoco o piu' bassa dello schermo anche quando e' davanti. Sull'iPhone pero' due app insieme non\n     si possono tenere (niente schermo diviso, niente finestre mobili): se l'alunno va altrove la pagina diventa\n     NASCOSTA, sempre. Quindi sull'iPhone «fuori» = pagina nascosta, e basta. L'iPad (schermo diviso) e gli\n     Android restano con tutti i controlli. */\n  /* 26/09/2026: anche l'iPhone con «Richiedi sito web desktop». Li' Safari si presenta come un Mac («Macintosh»,\n     come l'iPad), ma resta uno schermo a tocco e piccolo: il Mac vero non ha il tocco (maxTouchPoints 0), l'iPad\n     piu' piccolo ha il lato corto di 744 px, ogni iPhone al massimo 440. */\n  function iPhoneSoloSchermo(){\n    try{\n      var ua = navigator.userAgent || '';\n      if(/iPhone|iPod/.test(ua)) return true;\n      if(!/Macintosh/.test(ua) || !(navigator.maxTouchPoints > 1)) return false;\n      var lato = Math.min(screen.width || 0, screen.height || 0);\n      return lato > 0 && lato \u003c 600;\n    }catch(e){ return false; }\n  }\n  function finestraRistretta(){\n    try{\n      if(iPhoneSoloSchermo()) return false;\n      var sw = screen.availWidth || screen.width, sh = screen.availHeight || screen.height;\n      var fw = window.outerWidth || window.innerWidth, fh = window.outerHeight || window.innerHeight;\n      if(!sw || !sh || !fw || !fh) return false;\n      // iPhone e iPad danno lo schermo sempre in verticale: lo giro se la finestra e' in orizzontale\n      if((window.innerWidth > window.innerHeight) !== (sw > sh)){ var t = sw; sw = sh; sh = t; }\n      if(fw \u003c sw * 0.90) return true;\n      var tocco = false;\n      try{ tocco = window.matchMedia && window.matchMedia('(pointer: coarse)').matches; }catch(e){}\n      var a = document.activeElement;\n      var scrive = !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable));\n      if(tocco && scrive) return false;\n      return fh \u003c sh * 0.85;\n    }catch(e){ return false; }\n  }\n  /* TENDINE E SELETTORI DEL TELEFONO (22/09/2026, stessa regola delle altre due app). Su telefoni e tablet una\n     tendina del sistema o la tastiera possono togliere il fuoco alla pagina pur restando in vista: se la pagina e'\n     in vista e il fuoco sta su un campo del cedolino, l'alunno e' qui. Solo sui dispositivi a tocco: al computer\n     il clic su un'altra finestra deve accendere il pallino anche se il cursore era in una casella. */\n  function campoDelTelefono(){\n    try{\n      if(document.visibilityState === 'hidden') return false;\n      if(!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches)) return false;\n      var a = document.activeElement;\n      return !!(a && /^(SELECT|INPUT|TEXTAREA)$/.test(a.tagName));\n    }catch(e){ return false; }\n  }\n  function fuoriAdesso(){ try{ if(iPhoneSoloSchermo()) return document.visibilityState === 'hidden'; return document.visibilityState === 'hidden' || (!document.hasFocus() && !campoDelTelefono()) || finestraRistretta(); }catch(e){ return false; } }\n  function segnalaPagina(fuori){\n    // (29/09/2026) nei compiti la pagina tace: chi fa i compiti non e' collegato (regola di Mauro)\n    if(!STATE.studente || !STATE.proprietario || STATE.salutato || !STATE.presenzaTimer || STATE.modalitaCompiti) return;\n    rpcSubito('cf_battito', {\n      p_pin: STATE.studente.pin, p_sess: sessMia(), p_dispositivo: idDispositivo(),\n      p_fattura: (STATE.assegnataId || null),\n      p_livello: (typeof LIVELLO !== 'undefined' ? String(LIVELLO) : null),\n      p_consegnata: !!STATE.consegnata,\n      p_sfondo: (document.visibilityState === 'hidden'),\n      p_fuori: !!fuori, p_seq: prossimoSeq()\n    });\n  }\n  // cb(ok, errore): «Carica classe» e' l'atto che mette gli alunni NEL CLOUD. Se fallisce, loro col PIN\n  // non entrano proprio (per il sistema non esistono), quindi l'esito non si puo' ignorare: prima l'app\n  // diceva «Classe caricata: 10 alunni» anche quando il cloud non aveva ricevuto niente, e te ne accorgevi\n  // in aula, con la classe che non riesce ad accedere.\n  function cloudUpsertClasse(j, cb){\n    if(!SB || !j || !Array.isArray(j.alunni)){ if(cb) cb(false, 'cloud non disponibile'); return; }\n    // Ricaricare una classe = foglio bianco: azzero anche stato e valutazioni, così il vecchio\n    // voto/verifica non resta appiccicato dopo un Reset. È l'atto con cui riparte una nuova verifica.\n    // Azzero anche «assente»: l'appello è di OGGI. Se restasse appiccicato, l'assente della settimana scorsa\n    // resterebbe chiuso fuori dalla verifica nuova senza che il docente lo sappia — un danno muto, il peggiore.\n    // (23/09/2026) Tutto da capo vale anche per le bozze e per i dispositivi: stesso contrassegno del Reset.\n    var azz = nuovoAzzeramento();\n    var rows =j.alunni.map(function(a){ return { pin:a.pin, nome:a.nome, cognome:a.cognome, classe:j.classe||'', ultimo_accesso:null, fattura_corrente:null, livello_corrente:null, fattura_assegnata:null, livello_assegnato:null, consegnata:false, stato:'non_iniziato', riammesso:false, valutazione:null, valutazione_snapshot:null, assente:false, motivo_assenza:null, bozza_corrente:null, azzeramento:azz, dispositivo:null, ultima_attivita:null }; });\n    try{\n      SB.from('ced_studenti').upsert(rows, { onConflict:'pin' }).then(function(res){\n        if(!res || res.error){ if(cb) cb(false, (res && res.error && res.error.message) || 'nessuna risposta'); return; }\n        if(cb) cb(true);\n      }, function(){ if(cb) cb(false, 'nessuna risposta'); });\n    }catch(e){ if(cb) cb(false, e.message); }\n  }\n  // Conta le consegne di VERIFICA rimaste a una classe (i compiti a casa NON si contano: quelli sono\n  // l'archivio, e non c'entrano con la verifica nuova). cb(numero) — cb(-1) se il cloud non risponde:\n  // «non lo so» non è «zero», e su un forse non si cancella niente.\n  // NB: in questo progetto «allenamento» è il nome che l'app dà alle consegne di VERIFICA (r.1922):\n  // l'unica modalità davvero diversa è 'compiti'. Per questo si filtra per esclusione, come il Reset.\n  function cloudContaConsegneVerifica(classe, cb){\n    if(!SB || !classe){ cb && cb(-1); return; }\n    try{\n      SB.from('ced_tentativi').select('pin').eq('classe', classe).neq('modalita', 'compiti').then(function(res){\n        if(!res || res.error || !res.data){ cb && cb(-1); return; }\n        cb && cb(res.data.length);\n      }, function(){ cb && cb(-1); });\n    }catch(e){ cb && cb(-1); }\n  }\n  function cloudCancellaConsegneVerifica(classe, cb){\n    if(!SB || !classe){ cb && cb(false, 'nessun collegamento al cloud'); return; }\n    try{\n      SB.from('ced_tentativi').delete().eq('classe', classe).neq('modalita', 'compiti').select('pin').then(function(res){\n        if(!res || res.error){ cb && cb(false, (res && res.error && res.error.message) || 'il cloud non ha confermato'); return; }\n        cb && cb(true, null, (res.data || []).length);   // quante righe ha DAVVERO cancellato\n      }, function(){ cb && cb(false, 'il cloud non ha risposto'); });\n    }catch(e){ cb && cb(false, 'errore imprevisto'); }\n  }\n  /* ---------- Assegnazione MULTIPLA (fino a 3 fatture, ognuna col suo livello) ----------\n     Codifica compatta salvata nei campi esistenti (assegnata_id / fattura_assegnata):\n     \"ES04:1;ES07:3;ES09:3\"  → lista di {id, liv}. Un id \"nudo\" (senza :liv) resta valido\n     (retrocompatibile con le assegnazioni singole vecchie). */\n  var MAX_FATTURE = 3;\n  function parseAssegnazione(str){\n    var out = [];\n    if(!str) return out;\n    String(str).split(';').forEach(function(tok){\n      tok = (tok||'').trim(); if(!tok) return;\n      var p = tok.split(':');\n      var id = (p[0]||'').trim();\n      var liv = (p.length > 1 && p[1] !== '') ? (Number(p[1]) || null) : null;\n      if(id) out.push({ id:id, liv:liv });\n    });\n    return out;\n  }\n  function serializeAssegnazione(list){\n    return (list || []).map(function(x){ return (x.liv != null) ? (x.id + ':' + x.liv) : x.id; }).join(';');\n  }\n  function assegnPrimoId(str){ var l = parseAssegnazione(str); return l.length ? l[0].id : null; }\n  function assegnPrimoLiv(str){ var l = parseAssegnazione(str); return (l.length && l[0].liv != null) ? String(l[0].liv) : null; }\n  var LIV_NOMI = { 1:'Manuale', 2:'Guidata', 3:'Automatica' };\n  var LIV_INIZ = { 1:'M', 2:'G', 3:'A' };\n  function descriviAssegnazione(list){\n    if(!list || !list.length) return 'nessuna assegnazione';\n    return list.map(function(x){\n      var f = (typeof FATTURE !== 'undefined') ? FATTURE.find(function(y){ return y.id === x.id; }) : null;\n      var nome = f ? f.titolo : x.id;\n      return nome + (x.liv != null ? ' [' + (LIV_NOMI[x.liv] || x.liv) + ']' : '');\n    }).join('  ·  ');\n  }\n  /* Numero dell'esercizio come lo vede l'alunno. Viene dal campo \"numero\" dell'archivio, NON dall'id:\n     l'id è la chiave con cui sono salvate le consegne (ced_tentativi.fattura_id) e non si tocca mai,\n     così una fattura nuova si può infilare in mezzo cambiando solo i \"numero\".\n     Ripiego sulle cifre dell'id (\"ES04\" → \"4\") per gli archivi vecchi, che il campo non ce l'hanno,\n     e per gli id che non stanno più nell'archivio (consegne di esercizi rimossi). */\n  function numeroFattura(id){\n    if(typeof FATTURE !== 'undefined' && FATTURE && FATTURE.length){\n      for(var i = 0; i \u003c FATTURE.length; i++){\n        if(FATTURE[i] && FATTURE[i].id === id && FATTURE[i].numero != null && FATTURE[i].numero !== '') return String(FATTURE[i].numero);\n      }\n    }\n    var m = String(id || '').match(/(\\d+)/); return m ? String(Number(m[1])) : String(id || '');\n  }\n  /* Forma breve per la colonna alunno: \"10(G) · 4(A) · 3(A)\" (nell'ordine dato). G/A/M = livello. */\n  function descriviAssegnazioneBreve(list){\n    if(!list || !list.length) return '—';\n    return (list || []).slice().sort(function(a, b){ return (parseInt(numeroFattura(a.id), 10) || 0) - (parseInt(numeroFattura(b.id), 10) || 0); })\n      .map(function(x){ return numeroFattura(x.id) + '(' + (LIV_INIZ[x.liv] || '?') + ')'; }).join(' · ');\n  }\n  /* ---------- Consegne multiple: tracciamento (locale per lo studente, cloud per il docente) ---------- */\n  var CLOUD_CONS = {}; // pin -> { fattura_id: true } letto da ced_tentativi (consegne fatte)\n  function consegnateLocali(pin){\n    try{ var r = localStorage.getItem('cf_consegnate_' + pin); var a = r ? JSON.parse(r) : []; return Array.isArray(a) ? a : []; }catch(e){ return []; }\n  }\n  function aggiungiConsegnataLocale(pin, id){\n    if(!pin || !id) return;\n    var a = consegnateLocali(pin); if(a.indexOf(id) === -1) a.push(id);\n    try{ localStorage.setItem('cf_consegnate_' + pin, JSON.stringify(a)); }catch(e){}\n  }\n  function rimuoviConsegnataLocale(pin, id){\n    if(!pin || !id) return;\n    var a = consegnateLocali(pin).filter(function(x){ return x !== id; });\n    try{ localStorage.setItem('cf_consegnate_' + pin, JSON.stringify(a)); }catch(e){}\n  }\n  // Fatture che l'alunno ha APERTO almeno una volta (anche senza scriverci): se il docente ne toglie una\n  // di queste, chiediamo conferma (pop-up) invece di spazzarla via col suo lavoro.\n  function iniziateLocali(pin){\n    try{ var r = localStorage.getItem('cf_iniziate_' + pin); var a = r ? JSON.parse(r) : []; return Array.isArray(a) ? a : []; }catch(e){ return []; }\n  }\n  function segnaIniziata(pin, id){\n    if(!pin || !id) return;\n    var a = iniziateLocali(pin); if(a.indexOf(id) === -1){ a.push(id); try{ localStorage.setItem('cf_iniziate_' + pin, JSON.stringify(a)); }catch(e){} }\n  }\n  function rimuoviIniziata(pin, id){\n    if(!pin || !id) return;\n    var a = iniziateLocali(pin).filter(function(x){ return x !== id; });\n    try{ localStorage.setItem('cf_iniziate_' + pin, JSON.stringify(a)); }catch(e){}\n  }\n  function fatturaIniziata(pin, id){\n    return iniziateLocali(pin).indexOf(id) !== -1 || consegnateLocali(pin).indexOf(id) !== -1;\n  }\n  // Lista assegnata EFFETTIVA per un alunno: SOLO la sua, ad personam. NIENTE ripiego su STATE.assegnate:\n  // quello era l'assegnazione di un COMPAGNO (STATE.assegnate = quella del primo alunno trovato), quindi un\n  // alunno a cui il docente aveva TOLTO la fattura mostrava lo stesso quella di classe, e la consegna forzata\n  // gli creava una \"non svolta\" fantasma. Se non ha nulla, la sua lista è vuota (nessuna assegnazione).\n  function effectiveAssignedList(pin){\n    var cs = CLOUD_STUD[pin] || {};\n    return parseAssegnazione(cs.fattura_assegnata);\n  }\n  // Sottoinsieme davvero consegnato (incrocio tra assegnate e tentativi cloud).\n  function deliveredList(pin, assigned){\n    var set = CLOUD_CONS[pin] || {};\n    return (assigned || []).filter(function(x){ return set[x.id]; });\n  }\n  // Carica dal cloud quali fatture ha già consegnato ciascun alunno (una riga per consegna in ced_tentativi).\n  function refreshConsegne(cb){\n    if(!SB){ cb && cb(); return; }\n    try{\n      SB.from('ced_tentativi').select('pin,fattura_id').eq('completato', true).neq('modalita', 'compiti').then(function(res){\n        // come sopra: se il cloud non risponde tengo l'elenco delle consegne che avevo, non lo azzero.\n        // Azzerarlo faceva sparire i badge «Consegnato 4 · 7» e disarmava la rete di sicurezza che\n        // riconosce come consegnato chi il lavoro l'ha davvero mandato.\n        if(!res || res.error){ cb && cb(); return; }\n        CLOUD_CONS = {};\n        ((res.data) || []).forEach(function(t){ if(!t.pin || !t.fattura_id) return; (CLOUD_CONS[t.pin] = CLOUD_CONS[t.pin] || {})[t.fattura_id] = true; });\n        cb && cb();\n      }, function(){ cb && cb(); });\n    }catch(e){ cb && cb(); }\n  }\n  // true se lo studente ha consegnato TUTTE le fatture a lui assegnate.\n  function multiTutteConsegnate(){\n    if(!STATE.multiMode) return true;\n    var pin = STATE.studente ? STATE.studente.pin : '';\n    var done = consegnateLocali(pin);\n    return (STATE.mieAssegnate || []).every(function(x){ return done.indexOf(x.id) !== -1; });\n  }\n  /* Schermata di blocco riutilizzabile (doppio accesso / consegnato dal docente). */\n  function mostraBloccoMsg(icona, titolo, msg, color){\n    var i = byId('blocco-icona'), t = byId('blocco-title'), m = byId('blocco-msg');\n    if(i) i.textContent = icona;\n    if(t){ t.textContent = titolo; t.style.color = color || '#b4472f'; }\n    if(m) m.textContent = msg;\n    show('blocco');\n    cartaValutazioneBlocco(titolo === 'Verifica consegnata' ? function(){ mostraBloccoMsg(icona, titolo, msg, color); } : null);\n  }\n  /* Cattura e salva nel cloud la consegna della fattura CORRENTE (senza mostrare viste). */\n  function catturaConsegnaCorrente(cb){\n    if(!STATE.studente || !STATE.assegnataId){ if(cb) cb(false); return; }\n    var pin = STATE.studente.pin, id = STATE.assegnataId, compiti = STATE.modalitaCompiti; // fisso ORA (l'esito del cloud arriva dopo)\n    // Metto al sicuro l'ultimissimo lavoro in locale PRIMA di bloccare l'editor: se il cloud fallisce, al rientro\n    // (entraAlunnoView / apriCompito) l'alunno ritrova esattamente quello che aveva scritto e può riprovare.\n    try{ commitValues(byId('editor')); localStorage.setItem(chiaveLavoro(pin, id), JSON.stringify({ esercizioId:id, html: byId('editor').innerHTML, ts: Date.now() })); }catch(e){}\n    // FOTOGRAFO PRIMA DI BLOCCARE. lockEditor() mette readonly/disabled, e quegli attributi RESTANO SCRITTI\n    // dentro l'HTML: fotografando dopo, il lavoro finiva nel cloud congelato in SOLA LETTURA. Poi il docente\n    // riammetteva l'alunno, lui rientrava da un altro dispositivo, si ritrovava la sua fattura... e non poteva\n    // piu' scriverci niente. (Per i lavori GIA' salvati bloccati c'e' sbloccaEditorRipristinato, al recupero.)\n    STATE.myDashboardHTML = ripulisciHtmlAlunno(byId('editor').innerHTML);\n    lockEditor();\n    STATE.myCortesiaHTML = buildCortesia(raccogli());\n    if(STATE.soluzioneCorrente){\n      STATE.correctCortesiaHTML = buildCortesia(STATE.soluzioneCorrente);\n      try{ mostraSoluzioneCompilatore(true); commitValues(byId('editor')); STATE.correctDashboardHTML = byId('editor').innerHTML; }catch(e){ STATE.correctDashboardHTML = ''; }\n    } else {\n      // In verifica l'alunno non ha la soluzione: la versione corretta la ridisegna il docente nella Valuta.\n      STATE.correctCortesiaHTML = '';\n      STATE.correctDashboardHTML = '';\n    }\n    cloudSalvaConsegna(function(ok){\n      // Il marker locale \"consegnata\" (solo verifiche) si mette SOLO se il cloud ha confermato: così una consegna\n      // fallita non risulta \"già consegnata\" (che farebbe saltare la ri-cattura nella consegna forzata).\n      if(ok && !compiti){ try{ aggiungiConsegnataLocale(pin, id); }catch(e){} }\n      if(cb) cb(ok);\n    });\n    // NON cancello il lavoro salvato (chiave per fattura): se il docente la riammette, l'alunno lo ritrova\n    // e può ricontrollare/riconsegnare. Viene ripulito al cambio classe / Reset (gestore 'storage').\n  }\n  /* Consegna forzata dal DOCENTE, eseguita sul dispositivo dell'ALUNNO (quando connesso):\n     cattura la fattura in corso (lavoro reale), segna \"non svolta\" le altre non consegnate,\n     poi blocca lo schermo. */\n  // Blocca lo schermo dell'alunno quando il DOCENTE ha consegnato al posto suo (nessuna scrittura: le fa il docente).\n  function bloccaPerConsegnaDocente(){\n    if(STATE.consegnata) return;\n    mettiAlSicuroLavoro();           // l'ultima versione resta almeno nel telefono e nella bozza: serve se il docente riammette\n    STATE.consegnata = true;\n    stopConsegnaWatcher();\n    stopPresenza();\n    try{ sessionStorage.removeItem('cf_studente_attivo'); }catch(e){}\n    mostraConsegnatoAlunno(null, 'Il docente ha consegnato il tuo lavoro. Se ti riammette, potrai rientrare.');   // titolo giusto: verifica o esercitazione (24/09/2026)\n    startBloccoWatcher();\n  }\n  // Consegna forzata ESEGUITA SUL DISPOSITIVO DELL'ALUNNO: consegna DAVVERO il lavoro reale di tutte le sue\n  // fatture (quella aperta + quelle con lavoro salvato non ancora consegnato), esattamente come se avesse\n  // premuto \"Consegna\" su ognuna. Le fatture mai aperte le lascerà il docente come «non svolta» (finalizza).\n  function consegnaForzataLocale(){\n    if(STATE.consegnata) return;\n    var pin = STATE.studente ? STATE.studente.pin : '';\n    // FLUSH DEGLI ULTIMI TASTI — DEVE STARE QUI, PRIMA DELLA GUARDIA.\n    // salvaLavoro() si autoblocca se STATE.consegnata è già true: metterlo dopo lo rendeva CODICE MORTO,\n    // e la consegna forzata partiva senza le ultime modifiche (il cliente appena scelto dalla rubrica,\n    // la riga articolo appena aggiunta, lo sconto, gli ultimi caratteri digitati). L'alunno consegnava\n    // una fattura AMPUTATA e prendeva un voto su quella. Era il bug più subdolo dell'app.\n    try{ if(byId('editor').style.display !== 'none') salvaLavoro(); }catch(e){}\n    STATE.consegnata = true;         // guardia: niente doppie catture né ri-blocco\n    stopConsegnaWatcher();\n    if(!pin || !SB){ bloccaPerConsegnaDocente(); return; }\n    var lista = (STATE.mieAssegnate && STATE.mieAssegnate.length)\n                  ? STATE.mieAssegnate.slice()\n                  : (STATE.assegnataId ? [{ id:STATE.assegnataId, liv:(typeof LIVELLO!=='undefined'?LIVELLO:2) }] : []);\n    var done = consegnateLocali(pin);\n    STATE.forzataLocale = true;   // le catture qui sotto partono subito: sono consegne del DOCENTE, non dell'alunno\n    lista.forEach(function(x){\n      if(done.indexOf(x.id) !== -1) return;                                  // già consegnata davvero\n      var raw = null; try{ raw = localStorage.getItem(chiaveLavoro(pin, x.id)); }catch(e){}\n      // Guardo ANCHE la bozza nel cloud: se l'alunno e' rientrato su questo dispositivo dopo uno «Sblocca»,\n      // il suo lavoro sta in STATE.bozzaMappa ma NON nel localStorage di questa macchina. Prima veniva\n      // ignorato e finiva marcato «non svolta» dal docente.\n      var haBozza = !!(STATE.bozzaMappa && STATE.bozzaMappa[x.id]);\n      if(!raw && !haBozza) return;                                           // mai aperta/nessun lavoro → la marca il docente\n      try{ catturaFatturaPerForzata(x); }catch(e){}\n    });\n    STATE.forzataLocale = false;\n    try{ SB.rpc('cf_segna_consegnato', { p_pin: pin, p_sess: sessMia(), p_dispositivo: idDispositivo() }).then(function(){}, function(){}); }catch(e){}\n    stopPresenza();\n    try{ sessionStorage.removeItem('cf_studente_attivo'); }catch(e){}\n    mostraConsegnatoAlunno(null, 'Il docente ha consegnato il tuo lavoro. Se ti riammette, potrai rientrare.');   // titolo giusto: verifica o esercitazione (24/09/2026)\n    startBloccoWatcher();\n  }\n  // Carica una fattura col suo lavoro salvato e la consegna nel cloud senza interazione (riusa il caricamento\n  // provato di entraAlunnoView + la cattura di catturaConsegnaCorrente). Usata SOLO dalla consegna forzata.\n  function catturaFatturaPerForzata(x){\n    var f = (typeof FATTURE!=='undefined' && FATTURE) ? FATTURE.find(function(y){ return y.id === x.id; }) : null;\n    if(!f || !STATE.studente) return;\n    STATE.assegnataId = x.id;\n    LIVELLO = Number(x.liv) || 1;\n    try{ localStorage.setItem('cf_livello', String(x.liv || 1)); }catch(e){}\n    STATE.verificaCorrente = f.testo; STATE.soluzioneCorrente = f.soluzione; STATE.titoloCorrente = f.titolo;\n    buildRubrica();\n    resetEditor();\n    var ripristinato = false;\n    try{\n      var raw = localStorage.getItem(chiaveLavoro(STATE.studente.pin, x.id));\n      var htmlLav = null;\n      if(raw){ var saved = JSON.parse(raw); if(saved && saved.esercizioId === x.id && saved.html) htmlLav = saved.html; }\n      // se su questa macchina non c'e' la copia locale, uso la bozza del cloud (vedi consegnaForzataLocale)\n      if(!htmlLav && STATE.bozzaMappa && STATE.bozzaMappa[x.id]){\n        var b = STATE.bozzaMappa[x.id];\n        htmlLav = (typeof b === 'string') ? b : (b && b.html);\n      }\n      if(htmlLav){ byId('editor').innerHTML = htmlLav; wireEditor(); reidrataDinamici(); sbloccaEditorRipristinato(); ripristinato = true; }\n    }catch(e){}\n    applicaLivello(LIVELLO, !ripristinato); // se ho ripristinato il lavoro, NON azzero le anagrafiche già compilate\n    aggiornaNeretto();\n    catturaConsegnaCorrente();  // cattura myDashboard/myCortesia/correct* + salva la consegna reale nel cloud\n  }\n  function stopConsegnaWatcher(){ STATE.consegnaWatch = false; if(STATE.consegnaTimer){ clearInterval(STATE.consegnaTimer); STATE.consegnaTimer = null; } }\n  // Sorvegliante lato ALUNNO: se il docente segna la sua verifica come consegnata, BLOCCA lo schermo.\n  function startConsegnaWatcher(){\n    stopConsegnaWatcher();\n    if(!SB) return;\n    // Si \"arma\" quando vediamo l'alunno davvero al lavoro (stato NON 'consegnato'). Un login normale parte già armato;\n    // una sessione riammessa parte DISARMATA, così una 'consegnato' residua subito dopo la riammissione non ri-blocca.\n    STATE.consegnaArmed = !STATE.riammesso;\n    STATE.consegnaWatch = true;   // il giro al cloud lo fa il sorvegliante unico (startSessioneWatcher)\n  }\n  // La vecchia logica della consegna forzata, staccata dal suo timer: ora la chiama il sorvegliante unico.\n  function applicaConsegnaWatcher(s){\n      if(!STATE.studente || STATE.consegnata){ return; }\n      (function(){\n        if(!s) return;\n        var st = s.stato || 'non_iniziato';\n        // Consegna forzata del docente: il MIO dispositivo consegna il lavoro reale (come se premessi \"Consegna\"), poi blocca.\n        if(st === 'da_consegnare'){ if(!STATE.consegnata) consegnaForzataLocale(); return; }\n        // Consegna forzata conclusa ('consegnato'): blocca solo se eravamo \"armati\" (l'alunno stava lavorando).\n        // Così la forzata funziona SEMPRE, anche DOPO una riammissione e più volte; mentre una 'consegnato'\n        // residua subito dopo la riammissione (prima che parta il lavoro) NON ri-blocca per sbaglio.\n        if(st === 'consegnato'){ if(STATE.consegnaArmed && !STATE.consegnata) bloccaPerConsegnaDocente(); return; }\n        // Stato di lavoro (in_corso / non_iniziato / bloccato): l'alunno è attivo → arma il blocco.\n        STATE.consegnaArmed = true;\n      })();\n  }\n  // Ricostruisce le consegne LOCALI dell'alunno dal cloud (solo le REALI, non le \"forzate/non svolte\").\n  // ATTENZIONE: conta SOLO le consegne di VERIFICA. I compiti a casa sono un mondo a parte: una fattura fatta\n  // come compito NON deve risultare «già consegnata» quando il docente la assegna in verifica.\n  function rebuildConsegnateLocali(pin, cb){\n    if(!SB){ cb && cb(); return; }\n    try{\n      SB.rpc('cf_mie_consegne', { p_pin: pin }).then(function(res){\n        // Rete muta = NON SO NULLA: tengo i segni che ho. Prima un buco di rete li cancellava, e un cedolino\n        // gia' consegnato tornava «Compila» (19/09/2026).\n        if(!res || res.error || !Array.isArray(res.data)){ cb && cb(); return; }\n        // (24/09/2026) contano anche i compiti: un cedolino consegnato a casa, se il docente lo assegna in classe,\n        // l'alunno lo trova consegnato (vede il suo foglio, e per rifarlo c'e' «Allenati»).\n        if(res && res.data) res = { data: res.data.filter(function(t){ return t.completato; }) };\n        var ids = {};\n        ((res && res.data) || []).forEach(function(t){ if(t.fattura_id && t.modalita !== 'forzata') ids[t.fattura_id] = true; });\n        try{ localStorage.setItem('cf_consegnate_' + pin, JSON.stringify(Object.keys(ids))); }catch(e){}\n        cb && cb();\n      }, function(){ cb && cb(); });\n    }catch(e){ cb && cb(); }\n  }\n  // RECUPERO DEL LAVORO DAL CLOUD. Il lavoro dell'alunno non vive solo sul suo dispositivo (cf_lavoro): ogni\n  // consegna (anche quella \"riaperta\" dal Riammetti, completato=false) conserva in risposte.dashboardAlunno\n  // l'HTML della sua fattura compilata. Così l'alunno ritrova il suo lavoro anche da un ALTRO dispositivo,\n  // dopo giorni, o dopo un Backup/Ripristino. Ritorna l'HTML più recente, ignorando le righe «non svolta».\n  function cloudRecuperaLavoro(pin, fatturaId, cb){\n    if(!SB || !pin || !fatturaId){ cb && cb(null); return; }\n    try{\n      // (1) Prima la BOZZA IN CORSO: il lavoro NON ancora consegnato, salvato in continuo nel cloud mentre\n      //     l'alunno scrive (mappa { fatturaId: html }). È il più fresco e l'unico che sopravvive a\n      //     Backup/Ripristino di una verifica interrotta a metà. Alla consegna questa voce viene tolta,\n      //     quindi qui non fa mai ombra a una consegna successiva.\n      // 18/09/2026: passa dalla porta. Prima leggeva le tabelle, e coi permessi chiusi la risposta non e'\n      // un errore ma un ELENCO VUOTO: l'alunno che rientrava da un altro dispositivo dopo lo «Sblocca» si\n      // ritrovava il foglio bianco. La porta guarda prima la bozza in corso, poi l'ultima consegna.\n      SB.rpc('cf_mio_lavoro', {\n        p_pin: pin, p_sess: sessMia(), p_dispositivo: idDispositivo(), p_fattura_id: fatturaId\n      }).then(function(res){\n        // cb(lavoro, errore). «Il cloud non ha risposto» e «nel cloud non c'e' niente» sono due cose DIVERSE:\n        // scambiarle voleva dire aprire il foglio bianco a chi il lavoro ce l'aveva (19/09/2026).\n        if(!res || res.error){ cb && cb(null, true); return; }\n        var d = res.data;\n        // «negato»: la porta non riconosce ancora questo dispositivo (l'ingresso non e' arrivato al cloud).\n        // Non vuol dire che il lavoro non c'e': si riprova, intanto il battito si fa ridare il gettone.\n        if(d && d.negato){ cb && cb(null, true); return; }\n        if(d && d.html){ cb && cb({ html: d.html, ts: (d.ts || 0) }, false); return; }\n        cb && cb(null, false);\n      }, function(){ cb && cb(null, true); });\n    }catch(e){ cb && cb(null, true); }\n  }\n  function cloudSetAssegnazione(id, liv){\n    if(!SB) return;\n    try{ SB.from('ced_config').update({ assegnata_id:id||null, livello:(liv!=null?String(liv):null), updated_at:new Date().toISOString() }).eq('id', 1).then(function(){}, function(){}); }catch(e){}\n  }\n  /* ---------- PROPRIETÀ DELLA SESSIONE ----------\n     STATE.proprietario è true SOLO sul dispositivo che è stato davvero ammesso a lavorare con quella PIN\n     (lo mette avviaAlunnoConLista, dove arriva solo chi ha passato il controllo d'accesso).\n     Il dispositivo RESPINTO (il compagno \"furbo\" che prova col PIN di un altro) ha comunque STATE.studente\n     impostato: senza questa guardia, quando chiudeva la pagina o premeva «Esci», CANCELLAVA LA PRESENZA\n     del proprietario che stava lavorando. Il vero Mario spariva dalla dashboard come «Non collegato» e la\n     «Consegna classe» lo saltava: il suo lavoro non veniva catturato. Il tentativo del furbo danneggiava\n     la vittima — l'esatto contrario di quello che deve fare l'anti-doppio-accesso. */\n  /* CODICE DI QUESTO DISPOSITIVO. Sta nella memoria permanente del browser (localStorage), quindi sopravvive\n     alla chiusura della scheda e del telefono, e resta diverso da quello di ogni altro dispositivo. Serve a una\n     cosa sola: riconoscere l'alunno che RIENTRA DAL SUO STESSO TELEFONO dopo aver chiuso la pagina per sbaglio,\n     e non bloccarlo (vedi cloudCheckAccesso). In incognito, o se svuota i dati del browser, il codice cambia:\n     l'alunno risulta bloccato e lo sblocca il docente. */\n  function idDispositivo(){\n    var id = null;\n    try{ id = localStorage.getItem('cf_dispositivo'); }catch(e){}\n    if(!id){\n      id = String(Date.now()) + '-' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);\n      try{ localStorage.setItem('cf_dispositivo', id); }catch(e){ return null; }   // senza memoria: nessun riconoscimento\n    }\n    return id;\n  }\n  var RIENTRO_STESSO_DISPOSITIVO_MS = 30 * 60 * 1000;   // mezz'ora dall'ultima volta che ha lavorato (scelta di Mauro, 17/09/2026)\n  function cloudPresenza(){\n    if(!SB || !STATE.studente || !STATE.proprietario) return;   // se non sei il proprietario, non scrivi\n    /* (19/09/2026) SENZA GETTONE NON SI BATTE: PRIMA CE LO SI FA DARE. Succede a chi e' entrato mentre il cloud\n       taceva (vedi cloudCheckAccesso): senza gettone ogni scrittura verrebbe rifiutata. Ribusso alla porta\n       dell'accesso, che decide come sempre: se mi fa entrare ho il gettone e da qui in poi e' tutto normale; se\n       mi respinge vuol dire che questo PIN lo sta usando un altro dispositivo, e finisco su «Accesso bloccato»\n       come chiunque bussi per secondo. */\n    if(!sessMia() && !STATE.modalitaCompiti){\n      if(STATE.gettoneInVolo && (Date.now() - STATE.gettoneInVolo) \u003c 8000) return;\n      STATE.gettoneInVolo = Date.now();\n      var pinG = STATE.studente.pin;\n      try{\n        SB.rpc('cf_accesso', { p_pin: pinG, p_dispositivo: idDispositivo() }).then(function(rg){\n          STATE.gettoneInVolo = 0;\n          var dg = (rg && !rg.error) ? rg.data : null;\n          if(!dg || !STATE.studente || STATE.studente.pin !== pinG) return;\n          if(dg.sessione){\n            STATE.sessToken = dg.sessione; STATE.sessTokenConfirmed = true;\n            try{ sessionStorage.setItem('cf_sess', dg.sessione); }catch(e){}\n            cloudPresenza();\n            return;\n          }\n          if(dg.allow === false && !dg.consegnata && !STATE.consegnata){\n            try{ if(STATE.saveTimer){ clearTimeout(STATE.saveTimer); STATE.saveTimer = null; } salvaLavoro(); }catch(e){}\n            stopPresenza(); stopSessioneWatcher(); stopAssegnazioneWatcher(); stopConsegnaWatcher(); stopAttesaWatcher();\n            STATE.proprietario = false; STATE.avviatoPin = null;\n            try{ sessionStorage.removeItem('cf_studente_attivo'); }catch(e){}\n            var bn = byId('blocco-nome'); if(bn) bn.textContent = STATE.studente.cognome + ' ' + STATE.studente.nome;\n            mostraBloccoMsg('🔒', 'Accesso bloccato', 'Hai già effettuato l\\'accesso in precedenza. Per continuare, chiedi lo sblocco al docente.', '#b4472f');\n            startBloccoWatcher();\n          }\n        }, function(){ STATE.gettoneInVolo = 0; });\n      }catch(e){ STATE.gettoneInVolo = 0; }\n      return;\n    }\n    // (29/09/2026) Nei compiti nessun battito, da nessuna strada: chi fa i compiti per il docente non e' collegato.\n    if(STATE.modalitaCompiti) return;\n    // Rete lenta: se il battito di prima e' ancora per strada (da meno di 8 secondi) non gliene accodo un altro.\n    if(STATE.battitoInVolo && (Date.now() - STATE.battitoInVolo) \u003c 8000) return;\n    STATE.battitoInVolo = Date.now();\n    try{\n      SB.rpc('cf_battito', {\n        p_pin: STATE.studente.pin,\n        p_sess: sessMia(),\n        p_dispositivo: idDispositivo(),\n        p_fattura: (STATE.assegnataId || null),\n        p_livello: (typeof LIVELLO !== 'undefined' ? String(LIVELLO) : null),\n        p_consegnata: !!STATE.consegnata,\n        // App aperta ma in secondo piano (scheda abbassata, schermo del telefono spento): per il docente\n        // l'alunno e' ancora collegato. «Non collegato» solo quando la pagina viene chiusa davvero.\n        p_sfondo: (typeof document !== 'undefined' && document.visibilityState === 'hidden'),\n        p_fuori: fuoriAdesso(), p_seq: prossimoSeq()   // il pallino rosso del docente\n      }).then(function(res){\n        STATE.battitoInVolo = 0;\n        // Rete muta = NON SO NULLA: non deduco niente e riprovo al battito dopo. Mai buttare fuori nessuno\n        // per un silenzio della rete (18/09/2026).\n        if(!res || res.error || !res.data) return;\n        if(res.data.ok === false){\n          // Il cloud dice: «questo dispositivo non comanda piu' questo PIN». Succede quando un altro\n          // dispositivo (o un'altra scheda) e' entrato dopo. Due conferme di fila e mi chiudo, invece di\n          // lasciare l'alunno a scrivere in un foglio che non viene piu' salvato.\n          STATE.rifiutiBattito = (STATE.rifiutiBattito || 0) + 1;\n          if(STATE.rifiutiBattito >= 2 && !STATE.consegnata){ STATE.rifiutiBattito = 0; terminaSessionePerAltroDispositivo(); }\n          return;\n        }\n        STATE.rifiutiBattito = 0;\n        var riga = res.data;\n        if(!STATE.studente || STATE.modalitaCompiti) return;\n        // (23/09/2026) Il docente ha fatto Reset (o ha ricaricato la classe) mentre questo dispositivo era dentro:\n        // il contrassegno e' cambiato. Mi chiudo subito, SENZA rimettere su il lavoro, e si rientra col PIN.\n        if(typeof riga.azzeramento === 'string' && typeof STATE.azzVisto === 'string' && riga.azzeramento !== STATE.azzVisto){ terminaSessioneVerifica(true); return; }\n        if(STATE.consegnaWatch){ try{ applicaConsegnaWatcher(riga); }catch(e){} }\n        try{ applicaSessioneWatcher(riga); }catch(e){}\n        try{ controllaAssegnazioneDaRiga(riga); }catch(e){}\n      }, function(){ STATE.battitoInVolo = 0; });\n    }catch(e){ STATE.battitoInVolo = 0; }\n    // (19/09/2026) Se qualcuno aveva bussato mentre questo dispositivo non dava segnali ('bloccato'), e' il\n    // battito stesso, sul server (cf_battito), a rimettere 'in_corso': il proprietario e' di nuovo collegato,\n    // quindi non c'e' niente da sbloccare e chi bussava resta fuori.\n  }\n  // Battito ogni 5 secondi (19/09/2026: erano 10; con «collegato» = 20 secondi servono quattro battiti persi di\n  // fila, e non due, per far lampeggiare «Non collegato» un alunno che lavora). E' l'UNICO contatto col cloud di un alunno al lavoro (scrive la presenza e si\n  // riporta a casa tutto quello che c'e' da sapere). Dodici richieste al minuto invece delle quarantacinque del\n  // 18/09/2026 mattina: con poco campo e' la differenza fra funzionare e no.\n  function startPresenza(){ stopPresenza(); cloudPresenza(); STATE.presenzaTimer = setInterval(cloudPresenza, 5000); }\n  function stopPresenza(){ if(STATE.presenzaTimer){ clearInterval(STATE.presenzaTimer); STATE.presenzaTimer = null; } }\n  // Cancella la presenza SOLO se questo dispositivo possiede davvero la sessione. Chi è stato respinto\n  // non deve poter toccare la presenza di nessuno.\n  function cloudClearPresenzaSeMia(pin){\n    if(!STATE.proprietario) return;\n    cloudClearPresenza(pin);\n  }\n  function cloudClearPresenza(pin){\n    if(!SB || !pin) return;\n    try{ SB.rpc('cf_esci', { p_pin: pin, p_sess: sessMia(), p_dispositivo: idDispositivo() }).then(function(){}, function(){}); }catch(e){}\n  }\n  function cloudResetPresenze(){\n    if(!SB) return;\n    try{ SB.from('ced_studenti').update({ ultimo_accesso:null, fattura_corrente:null, livello_corrente:null, fattura_assegnata:null, livello_assegnato:null, consegnata:false, stato:'non_iniziato', riammesso:false, bozza_corrente:null }).gte('pin', '').then(function(){}, function(){}); }catch(e){}\n    try{ SB.from('ced_config').update({ assegnata_id:null, livello:null }).eq('id', 1).then(function(){}, function(){}); }catch(e){}\n    try{ SB.from('ced_tentativi').delete().neq('modalita', 'compiti').gte('created_at', '2000-01-01').then(function(){}, function(){}); }catch(e){} // il Reset NON tocca l'archivio compiti a casa\n  }\n  // AZZERA ESERCIZIO di UNA SOLA classe: toglie l'assegnazione, azzera lo stato dei suoi alunni e cancella\n  // le sue consegne di VERIFICA. NON tocca le altre classi, né l'archivio cedolini, né i compiti a casa.\n  // La CLASSE RESTA: alunni, PIN e posto nella tendina non si toccano (classi permanenti, 17/09/2026).\n  // NB: non tocca nemmeno valutazione/valutazione_snapshot, così il VOTO PUBBLICATO resta visibile all'alunno\n  // quando entra nei compiti (lo snapshot esiste apposta per sopravvivere alla cancellazione delle consegne).\n  // I voti si azzerano SOLO ricaricando la classe dal file (Carica classe = tutto da capo).\n  // (23/09/2026) PIAZZA PULITA ANCHE NEI DISPOSITIVI. Il Reset puliva il cloud, ma il telefono dell'alunno teneva\n  // la sua copia del foglio e al rientro la rimetteva su (il 1300 di Becattini che ricompariva). Ora il Reset lascia\n  // un CONTRASSEGNO nuovo (azzeramento): ogni dispositivo che lo trova cambiato butta il lavoro di prima, e la porta\n  // della bozza rifiuta chi scrive col contrassegno vecchio. Via anche dispositivo e ultima attivita': dopo il\n  // Reset si rientra solo col PIN (niente rientro automatico entro mezz'ora).\n  function nuovoAzzeramento(){ return new Date().toISOString() + '-' + Math.random().toString(36).slice(2, 8); }\n  // (24/09/2026, regole nuove) Il Reset chiude la PROVA e lascia nel quaderno di ogni alunno il lavoro degli ESERCIZI:\n  // chi ha consegnato lui trova «Svolto in classe · consegnato», gli altri «Svolto in classe · da consegnare» col\n  // loro lavoro dentro. Le VERIFICHE spariscono (sono nel backup), restano i voti. Tutti tornano presenti.\n  // Lo fa tutto la porta cf_reset_classe sul server, in un colpo solo. cb(ok, errore).\n  function cloudResetClasse(classe, cb){\n    if(!SB || !classe){ cb && cb(false, 'cloud non disponibile'); return; }\n    try{\n      SB.rpc('cf_reset_classe', { p_classe: classe, p_azz: nuovoAzzeramento() }).then(function(res){\n        if(!res || res.error || !res.data || !res.data.ok){ cb && cb(false, (res && res.error && res.error.message) || 'il cloud non ha confermato'); return; }\n        (CLASSE && CLASSE.alunni ? CLASSE.alunni : []).forEach(function(a){\n          if(CLOUD_STUD[a.pin]){ var s = CLOUD_STUD[a.pin]; s.stato='non_iniziato'; s.consegnata=false; s.riammesso=false; s.ultimo_accesso=null; s.fattura_assegnata=null; s.livello_assegnato=null; s.fattura_corrente=null; s.assente=false; s.motivo_assenza=null; }\n          CLOUD_CONS[a.pin] = {};\n        });\n        cb && cb(true, res.data);\n      }, function(){ cb && cb(false, 'il cloud non ha risposto'); });\n    }catch(e){ cb && cb(false, 'errore imprevisto'); }\n  }\n  // (17/09/2026) La vecchia «modalità compiti a casa» di classe (lista ced_config.compiti_classi) è ABOLITA:\n  // nascondeva la classe dalla dashboard, ed è il motivo per cui dopo un azzeramento la classe spariva.\n  // Adesso vale una regola sola, senza liste: chi non ha un esercizio assegnato fa i compiti (vedi\n  // cloudModalitaAlunno). Questa funzione resta solo per RIPULIRE la lista vecchia dai residui: toglie una\n  // classe, non ce la mette più. Il parametro `on` è ignorato apposta.\n  function cloudSetModalitaCompiti(classe, on){\n    if(!classe) return;\n    var arr = (STATE.compitiClassi || []).slice();\n    var i = arr.indexOf(classe);\n    if(i !== -1) arr.splice(i, 1);\n    STATE.compitiClassi = arr;\n    if(SB){ try{ SB.from('ced_config').update({ compiti_classi: arr }).eq('id', 1).then(function(){}, function(){}); }catch(e){} }\n  }\n  // SOSPENDI / RIPRENDI una CLASSE (lista in ced_config.sospese_classi).\n  // Sospesa = la verifica è chiusa a chiave: l'assegnazione, il lavoro e i voti restano intatti, ma gli alunni\n  // vedono i COMPITI finché il docente non preme «Riprendi». È l'opposto di compiti_classi sotto due aspetti\n  // che è facile confondere: (a) la classe sospesa RESTA nella tendina e in dashboard (il docente la sta\n  // usando); (b) l'assegnazione NON viene toccata (il Reset invece la cancella, e cancella le consegne).\n  // Sospendendo azzero anche la presenza della classe: nessun fantasma «Collegato» in dashboard, e soprattutto\n  // al rientro nessun blocco anti-doppio-accesso (l'alunno deve poter rientrare senza chiedere lo «Sblocca»).\n  // cb(ok, err): NIENTE annunci di successo senza la conferma del cloud — .select() mi ridà la riga scritta.\n  function cloudSospendiClasse(classe, on, cb){\n    if(!classe){ cb && cb(false, 'nessuna classe'); return; }\n    if(!SB){ cb && cb(false, 'nessun collegamento al cloud'); return; }\n    var arr = (STATE.sospeseClassi || []).slice();\n    var i = arr.indexOf(classe);\n    if(on && i === -1) arr.push(classe);\n    if(!on && i !== -1) arr.splice(i, 1);\n    try{\n      SB.from('ced_config').update({ sospese_classi: arr }).eq('id', 1).select('sospese_classi').then(function(res){\n        if(!res || res.error || !res.data || !res.data.length){ cb && cb(false, (res && res.error && res.error.message) || 'il cloud non ha confermato'); return; }\n        var scritte = res.data[0].sospese_classi;\n        var davvero = Array.isArray(scritte) ? (scritte.indexOf(classe) !== -1) : false;\n        if(davvero !== !!on){ cb && cb(false, 'il cloud ha risposto, ma la classe non risulta come previsto'); return; }\n        STATE.sospeseClassi = Array.isArray(scritte) ? scritte : arr;   // copia locale = quello che c'è DAVVERO nel cloud\n        if(!on){\n          // RIPRENDI. Qui c'è un dettaglio che sembra un cavillo e invece è tutta la lezione: chi stava\n          // lavorando è rimasto 'in_corso' e la sua presenza è scaduta durante la sospensione. Al rientro\n          // cloudCheckAccesso lo scambierebbe per un CAMBIO DI DISPOSITIVO (r.1387) e lo bloccherebbe:\n          // il docente si troverebbe a sbloccare venti alunni a mano, uno per uno, a lezione iniziata.\n          // Quindi cancello la SESSIONE di chi era dentro (non il suo lavoro!): stato e presenza tornano come\n          // per chi non è ancora entrato, così al rientro passa dalla porta normale (r.1393: \"nessuno collegato\n          // → entra e diventa il proprietario\") e l'anti-doppione riparte pulito da lì.\n          // Il LAVORO non è nello stato: sta in bozza_corrente e in ced_tentativi, e non lo tocco.\n          // È ESATTAMENTE quello che fa da sempre lo «Sblocca» del docente (r.1471: stato 'non_iniziato' +\n          // presenza azzerata), cioè il meccanismo che Mauro collauda in laboratorio da mesi. Qui vale per\n          // tutta la classe in un colpo solo, che è il senso del «Riprendi».\n          // Chi ha consegnato resta consegnato; chi non è mai entrato non ha sessione da cancellare.\n          try{\n            SB.from('ced_studenti').update({ stato:'non_iniziato', ultimo_accesso:null, riammesso:false }).eq('classe', classe).eq('consegnata', false).in('stato', ['in_corso','bloccato']).then(function(){ cb && cb(true, null); }, function(){ cb && cb(true, null); });\n          }catch(e){ cb && cb(true, null); }\n          return;\n        }\n        // Sospesa per davvero: ora spengo la presenza. Se questa seconda scrittura fallisce la sospensione\n        // vale lo stesso (è già nel cloud): resterebbe solo qualche «Collegato» fantasma, che il docente vede.\n        try{\n          SB.from('ced_studenti').update({ ultimo_accesso:null }).eq('classe', classe).then(function(){ cb && cb(true, null); }, function(){ cb && cb(true, null); });\n        }catch(e){ cb && cb(true, null); }\n      }, function(e){ cb && cb(false, 'il cloud non ha risposto'); });\n    }catch(e){ cb && cb(false, 'errore imprevisto'); }\n  }\n  function classeSospesa(classe){ return !!(classe && (STATE.sospeseClassi || []).indexOf(classe) !== -1); }\n  // Segna un alunno ASSENTE (o lo rimette presente). L'assente non apre la verifica: se entra col suo PIN vede\n  // i COMPITI, senza nessun messaggio — così da casa non scopre nemmeno che c'è una verifica in corso.\n  // Serve perché guardare chi è collegato non basta: uno entra, sbircia le fatture, fotografa e chiude.\n  // cb(ok, err): come per la sospensione, nessun annuncio senza la conferma del cloud.\n  function cloudSetAssente(pin, on, cb, motivo){\n    if(!SB){ cb && cb(false, 'nessun collegamento al cloud'); return; }\n    try{\n      SB.from('ced_studenti').update({ assente: !!on, motivo_assenza: (on && motivo) ? motivo : null }).eq('pin', pin).select('pin,assente').then(function(res){\n        if(!res || res.error || !res.data || !res.data.length){ cb && cb(false, (res && res.error && res.error.message) || 'il cloud non ha confermato'); return; }\n        if(!!res.data[0].assente !== !!on){ cb && cb(false, 'il cloud ha risposto, ma l\\'alunno non risulta come previsto'); return; }\n        if(CLOUD_STUD[pin]){ CLOUD_STUD[pin].assente = !!on; CLOUD_STUD[pin].motivo_assenza = (on && motivo) ? motivo : null; }\n        if(!on){ cb && cb(true, null); return; }\n        // Assente: spengo anche la sua presenza. Se stava dentro, il suo guardiano lo porta ai compiti da solo\n        // (out.chiusa) e senza presenza non resta un fantasma «Collegato» in dashboard.\n        try{\n          SB.from('ced_studenti').update({ ultimo_accesso:null }).eq('pin', pin).then(function(){ cb && cb(true, null); }, function(){ cb && cb(true, null); });\n        }catch(e){ cb && cb(true, null); }\n      }, function(){ cb && cb(false, 'il cloud non ha risposto'); });\n    }catch(e){ cb && cb(false, 'errore imprevisto'); }\n  }\n  // Accende/spegne la pubblicazione del voto di UN alunno (il badge sotto il voto fa da interruttore).\n  // Spegnendola il voto sparisce all'alunno: la vista alunno guarda `valutazione.pubblicata`.\n  // NON tocca il voto né lo snapshot del lavoro: si spegne solo la luce, la valutazione resta intatta e\n  // riaccendendola l'alunno rivede tutto com'era. Nessuna notifica all'alunno, né accendendo né spegnendo.\n  // cb(ok, err): come sempre, niente annunci senza la conferma del cloud (.select() ridà la riga scritta).\n  function cloudSetPubblicata(pin, on, cb){\n    var v = (CLOUD_STUD[pin] || {}).valutazione;\n    if(!v || !v.voto_finale){ cb && cb(false, 'questo alunno non ha un voto'); return; }\n    if(!SB){ cb && cb(false, 'nessun collegamento al cloud'); return; }\n    var vNew = {}; for(var k in v) vNew[k] = v[k];\n    vNew.pubblicata = !!on;\n    try{\n      SB.from('ced_studenti').update({ valutazione:vNew }).eq('pin', pin).select('pin,valutazione').then(function(res){\n        if(!res || res.error || !res.data || !res.data.length){ cb && cb(false, (res && res.error && res.error.message) || 'il cloud non ha confermato'); return; }\n        var scritto = res.data[0].valutazione;\n        if(!scritto || !!scritto.pubblicata !== !!on){ cb && cb(false, 'il cloud ha risposto, ma il voto non risulta come previsto'); return; }\n        CLOUD_STUD[pin].valutazione = scritto;   // copia locale = quello che c'è DAVVERO nel cloud\n        cb && cb(true, null);\n      }, function(){ cb && cb(false, 'il cloud non ha risposto'); });\n    }catch(e){ cb && cb(false, 'errore imprevisto'); }\n  }\n  // Blocco anti-doppio-accesso: controlla se l'alunno può entrare e aggiorna lo stato.\n  // LE REGOLE (dettate da Mauro il 19/09/2026; decide tutto la porta cf_accesso, sul server):\n  //   - primo ingresso → «in corso»; ricaricare la pagina (F5) non e' un nuovo ingresso;\n  //   - COLLEGATO = l'app ha parlato col cloud negli ultimi 20 secondi (stessa misura in dashboard e nel cloud);\n  //   - alunno COLLEGATO + un altro dispositivo col suo PIN → «Accesso bloccato» a chi bussa, e basta: chi\n  //     lavora non se ne accorge e nella dashboard non compare niente (niente «Sblocca»: non c'e' niente da sbloccare);\n  //   - alunno NON collegato + un altro dispositivo → «Accesso bloccato» a chi bussa, e al docente compare\n  //     «Bloccato» con lo «Sblocca». Premuto, chi bussava entra subito col lavoro salvato, e da
