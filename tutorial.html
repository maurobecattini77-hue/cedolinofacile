<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutorial Cedolino Facile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pagina:#EEF0EA; --carta:#F8F8F3; --bordo:#D9DACF; --ink:#262420; --ink2:#4b473e; --att:#827F75; --scuro:#57534a;
    --verde:#3f6b52; --verde-c:#e6efe9; --verde-f:#cfdfd5;
    --blu:#2f6db5; --blu-c:#eaf1fa;
    --ambra:#9a5a09; --ambra-c:#fbf0de; --ambra-v:#c98a1c;
    --arancio:#E65900; --arancio-s:#b34400; --arancio-c:#fdf1e6;
    --senape:#BB963C; --senape-c:#faf4e2;
    --pesca:#C07F49; --pesca-c:#fbf1e7;
    --salvia:#5C8B73; --salvia-c:#eef5f0;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ background:var(--pagina); color:var(--ink); font-family:'Schibsted Grotesk',sans-serif; -webkit-font-smoothing:antialiased; letter-spacing:-.005em; }
  button{ font-family:inherit; }
  svg.ic{ width:18px; height:18px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  /* =============== ANTEPRIMA NEL MODULO =============== */
  #vista-modulo{ min-height:100vh; }
  .mk-nastro{ background:var(--scuro); color:#F4EFE6; font-size:12.5px; letter-spacing:.02em; text-align:center; padding:8px 16px; }
  .mk-nastro b{ font-weight:600; }
  .md-testa{ background:var(--carta); border-bottom:1px solid var(--bordo); }
  .md-testa-in{ max-width:1180px; margin:0 auto; padding:0 28px; display:flex; align-items:center; gap:10px; }
  .md-tabs{ display:flex; gap:2px; overflow-x:auto; flex:1; min-width:0; }
  .md-tabs span{ display:inline-flex; align-items:center; gap:8px; color:#5a5750; font-size:14px; font-weight:600; padding:19px 15px; border-bottom:3px solid transparent; white-space:nowrap; }
  .md-tabs span.on{ color:var(--arancio-s); border-bottom-color:var(--arancio); }
  .md-mod{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .md-mod .l{ font-family:'Fraunces',serif; font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--att); }
  .md-mod .n{ min-width:38px; height:38px; border-radius:11px; background:#F0B783; color:#7a4a1c; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:600; font-size:22px; }
  .md-main{ max-width:1180px; margin:0 auto; padding:34px 28px 90px; }
  .md-intro{ max-width:780px; margin:6px auto 34px; text-align:center; }
  .md-pill{ display:inline-flex; align-items:center; gap:8px; background:rgba(230,89,0,.12); color:var(--arancio-s); border-radius:999px; padding:7px 16px; font-size:12px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; }
  .md-intro h1{ font-family:'Fraunces',serif; font-weight:600; font-size:40px; line-height:1.06; letter-spacing:-1px; margin:18px 0 0; }
  .md-intro p{ font-size:16px; line-height:1.6; color:var(--att); margin:16px auto 0; max-width:580px; }
  .prova{ background:var(--carta); border:1px solid var(--bordo); border-radius:18px; padding:26px 30px; margin-bottom:34px; }
  .prova-su{ display:flex; gap:22px; align-items:center; flex-wrap:wrap; }
  .prova-su .tx{ flex:1; min-width:240px; }
  .prova-kick{ display:inline-flex; align-items:center; gap:8px; background:rgba(230,89,0,.12); color:var(--arancio-s); border-radius:999px; padding:6px 14px; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin-bottom:10px; }
  .prova h3{ font-family:'Fraunces',serif; font-weight:600; font-size:22px; letter-spacing:-.3px; color:var(--scuro); margin:0 0 6px; }
  .prova p{ font-size:15px; line-height:1.6; color:#5a5750; margin:0; }
  .btn-app{ display:inline-flex; align-items:center; justify-content:center; gap:9px; background:var(--arancio); color:#fff; text-decoration:none; border-radius:12px; padding:14px 24px; font-size:15px; font-weight:600; white-space:nowrap; min-width:236px; }
  .prova-giu{ margin-top:22px; padding-top:20px; border-top:1px solid var(--bordo); display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .prova-med{ width:44px; height:44px; border-radius:50%; background:var(--arancio-c); border:1.5px solid var(--arancio); color:var(--arancio-s); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .prova-med svg{ width:22px; height:22px; }
  .prova-giu .tx{ flex:1; min-width:240px; }
  .prova-giu .t{ font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--arancio-s); margin-bottom:4px; }
  .prova-giu p{ font-size:15px; line-height:1.55; color:#5a5750; }
  .btn-tut{ display:inline-flex; align-items:center; justify-content:center; gap:9px; background:#fff; color:var(--arancio-s); border:1.5px solid var(--arancio); border-radius:12px; padding:12.5px 22px; font-size:15px; font-weight:600; white-space:nowrap; cursor:pointer; min-width:236px; }
  .btn-tut:hover{ background:var(--arancio-c); }
  .mk-nota{ max-width:1180px; margin:0 auto; padding:0 28px 60px; color:var(--att); font-size:13.5px; line-height:1.6; }
  @media (max-width:700px){
    .md-testa-in{ padding:0 14px; } .md-tabs span{ padding:16px 10px; font-size:13px; }
    .md-main{ padding:24px 14px 60px; } .md-intro h1{ font-size:30px; }
    .prova{ padding:20px 18px; } .btn-app, .btn-tut{ width:100%; min-width:0; }
    .mk-nota{ padding:0 14px 40px; }
  }

  /* =============== IL TUTORIAL =============== */
  #vista-tut{ display:none; height:100vh; height:100dvh; flex-direction:column; overflow:hidden; }
  body.in-tut{ overflow:hidden; }
  body.in-tut #vista-modulo{ display:none; }
  body.in-tut #vista-tut{ display:flex; }

  .tt-top{ flex-shrink:0; height:62px; display:flex; align-items:center; gap:14px; padding:0 20px; background:var(--carta); border-bottom:1px solid var(--bordo); }
  .tt-badge{ position:relative; width:36px; height:42px; background:#fff; border:1px solid var(--verde-f); border-radius:8px; display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; }
  .tt-badge b{ font-weight:700; font-size:16px; letter-spacing:-1px; color:var(--verde); }
  .tt-badge i{ position:absolute; top:0; right:0; border-top:12px solid var(--verde); border-left:12px solid transparent; }
  .tt-nome{ line-height:1.1; }
  .tt-nome .a{ font-weight:700; font-size:16px; color:var(--verde); }
  .tt-nome .b{ font-size:12px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--att); margin-top:2px; }
  .tt-cap{ flex:1; min-width:0; text-align:center; font-family:'Fraunces',serif; font-weight:600; font-size:17px; color:var(--scuro); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tt-cap span{ font-family:'Schibsted Grotesk',sans-serif; font-size:12px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--att); margin-right:10px; }
  .tt-btn{ display:inline-flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--bordo); color:var(--scuro); border-radius:10px; padding:8px 14px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .tt-btn:hover{ background:#f1f2ec; }
  .tt-btn.solo{ padding:8px 10px; }

  .tt-prog{ flex-shrink:0; display:flex; gap:3px; padding:0 20px; height:16px; align-items:center; background:var(--carta); border-bottom:1px solid var(--bordo); }
  .tt-prog button{ flex:1; height:6px; border:0; padding:0; border-radius:3px; background:#e2e3da; position:relative; overflow:hidden; cursor:pointer; }
  .tt-prog button i{ position:absolute; left:0; top:0; bottom:0; width:0; background:var(--verde); border-radius:3px; transition:width .35s ease; }
  .tt-prog button:hover{ background:#d4d6cb; }

  .tt-main{ flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 430px; gap:18px; padding:16px 20px 18px; }
  .schermo{ min-height:0; display:flex; flex-direction:column; background:#fff; border:1px solid var(--bordo); border-radius:14px; overflow:hidden; box-shadow:0 10px 30px rgba(38,36,32,.10); position:relative; }
  .schermo-barra{ flex-shrink:0; height:38px; display:flex; align-items:center; gap:14px; padding:0 14px; background:#F1F2EC; border-bottom:1px solid var(--bordo); }
  .schermo-barra .pallini{ display:flex; gap:6px; }
  .schermo-barra .pallini i{ width:11px; height:11px; border-radius:50%; background:#D9DACF; display:block; }
  .schermo-barra .ind{ flex:1; max-width:440px; margin:0 auto; height:25px; border-radius:7px; background:#fff; border:1px solid var(--bordo); font-size:12.5px; color:var(--att); display:flex; align-items:center; gap:7px; padding:0 10px; white-space:nowrap; overflow:hidden; }
  .schermo-barra .ind svg{ width:13px; height:13px; }
  .schermo-barra .demo{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--verde); background:var(--verde-c); border:1px solid var(--verde-f); border-radius:999px; padding:3px 10px; white-space:nowrap; }
  #schermo-app{ flex:1; width:100%; min-height:0; border:0; display:block; background:#f6f8fa; }
  .schermo-carica{ position:absolute; inset:38px 0 0 0; display:flex; align-items:center; justify-content:center; background:#f6f8fa; color:var(--att); font-size:14px; }
  .schermo-avviso{ position:absolute; left:50%; bottom:70px; transform:translateX(-50%) translateY(10px); background:var(--scuro); color:#fff; font-size:13.5px; padding:9px 16px; border-radius:10px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; max-width:90%; text-align:center; }
  .schermo-avviso.su{ opacity:1; transform:translateX(-50%) translateY(0); }
  #schermo-app{ transition:opacity .18s ease; }
  .schermo.velo #schermo-app{ opacity:0; transition:none; }
  /* la barra di riproduzione, sotto lo schermo */
  .lettore{ flex-shrink:0; display:flex; align-items:center; gap:10px; padding:9px 14px; background:var(--carta); border-top:1px solid var(--bordo); }
  .lettore[hidden]{ display:none; }
  .guarda{ display:inline-flex; align-items:center; gap:8px; background:var(--verde); color:#fff; border:1.5px solid var(--verde); border-radius:999px; padding:8px 18px 8px 14px; font-size:14.5px; font-weight:600; cursor:pointer; white-space:nowrap; flex-shrink:0; }
  .guarda:hover{ background:#355b45; border-color:#355b45; }
  .guarda svg{ width:17px; height:17px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .guarda.in-corso{ background:#fff; color:var(--verde); }
  .guarda.in-corso:hover{ background:var(--verde-c); }
  .salta{ width:36px; height:36px; border-radius:50%; border:1px solid var(--bordo); background:#fff; color:var(--scuro); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; padding:0; }
  .salta:hover{ background:#f1f2ec; }
  .salta:disabled{ opacity:.4; cursor:default; background:#fff; }
  .salta svg{ width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .frasi{ flex:1; min-width:60px; display:flex; gap:3px; align-items:center; height:28px; }
  .frasi button{ height:28px; border:0; padding:0; background:none; cursor:pointer; position:relative; min-width:6px; }
  .frasi button::before{ content:''; position:absolute; left:0; right:0; top:11px; height:6px; border-radius:3px; background:#e2e3da; }
  .frasi button:hover::before{ background:#d4d6cb; }
  .frasi button i{ position:absolute; left:0; top:11px; height:6px; width:0; border-radius:3px; background:var(--verde); }
  .frasi button.ora::before{ background:#cfdfd5; }
  .lettore-conta{ font-size:13px; color:var(--att); font-variant-numeric:tabular-nums; white-space:nowrap; flex-shrink:0; min-width:78px; text-align:right; }

  .pannello{ min-height:0; display:flex; flex-direction:column; background:#fff; border:1px solid var(--bordo); border-radius:18px; overflow:hidden; }
  .p-corpo{ flex:1; min-height:0; overflow:auto; padding:26px 28px 24px; }
  .p-kick{ display:flex; align-items:center; gap:10px; font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--verde); }
  .p-kick .num{ background:var(--verde-c); border:1px solid var(--verde-f); border-radius:999px; padding:3px 10px; }
  .p-tit{ font-family:'Fraunces',serif; font-weight:600; font-size:27px; line-height:1.12; letter-spacing:-.5px; margin:12px 0 14px; color:var(--ink); }
  .p-testo p{ font-size:16px; line-height:1.62; margin:0 0 12px; color:#33312c; }
  .p-testo b{ font-weight:600; color:var(--ink); }
  .p-box{ border-radius:12px; padding:12px 15px 13px; margin:16px 0 0; font-size:15px; line-height:1.55; }
  .p-box .l{ display:flex; align-items:center; gap:7px; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin-bottom:5px; }
  .p-box .l svg{ width:15px; height:15px; }
  .p-dal{ background:var(--salvia-c); border:1px solid #cfe0d6; border-left:4px solid var(--salvia); }
  .p-dal .l{ color:#3f6b52; }
  .p-dal .q{ font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:15.5px; color:#2b2823; }
  .p-conto{ background:var(--pesca-c); border:1px solid #f0d8bf; border-left:4px solid var(--pesca); }
  .p-conto .l{ color:#8a5320; }
  .p-conto .c{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; font-variant-numeric:lining-nums tabular-nums; color:#2b2823; }
  .p-att{ background:var(--senape-c); border:1px solid #ecdcae; border-left:4px solid var(--senape); }
  .p-att .l{ color:#7a611f; }
  .p-caso p{ margin:0 0 8px; } .p-caso p:last-child{ margin:0; }
  .p-caso .sc3{ margin:0 0 8px; padding-left:20px; } .p-caso .sc3 li{ margin:0 0 5px; }
  .p-caso b{ font-weight:600; }
  .p-nota{ background:#f4f5f0; border:1px solid var(--bordo); color:var(--ink2); }
  .p-nota .l{ color:var(--att); }

  .punti{ list-style:none; padding:0; margin:18px 0 0; display:grid; gap:8px; }
  .punti-hint{ display:none; margin:16px 0 -8px; font-size:13px; color:var(--att); }
  .punti li{ display:flex; gap:12px; align-items:flex-start; padding:10px 12px; border:1px solid var(--bordo); border-radius:12px; background:#fff; cursor:pointer; transition:background .15s, border-color .15s; }
  .punti li:hover, .punti li.on{ background:#fafaf6; border-color:#c9cabd; }
  .punti .n{ width:26px; height:26px; border-radius:50%; color:#fff; font-weight:700; font-size:13.5px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
  .punti .t{ font-weight:600; font-size:15px; line-height:1.35; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .punti .d{ font-size:14px; line-height:1.5; color:#5a5750; margin-top:3px; }
  .tag{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; border-radius:999px; padding:2px 9px; border:1px solid; white-space:nowrap; }
  .tag svg{ width:13px; height:13px; }
  .k-scrivi .n{ background:var(--blu); } .tag.scrivi{ color:var(--blu); background:var(--blu-c); border-color:#c6d8ef; }
  .k-scegli .n{ background:var(--ambra-v); } .tag.scegli{ color:var(--ambra); background:var(--ambra-c); border-color:#efd6a8; }
  .k-app .n{ background:var(--verde); } .tag.app{ color:var(--verde); background:var(--verde-c); border-color:var(--verde-f); }
  .k-info .n{ background:var(--scuro); }

  .legenda{ display:grid; gap:10px; margin:16px 0 0; }
  .legenda div{ display:flex; gap:12px; align-items:flex-start; font-size:14.5px; line-height:1.5; color:#33312c; }
  .legenda .tag{ flex-shrink:0; margin-top:1px; min-width:118px; justify-content:center; }

  .checklist{ list-style:none; padding:0; margin:14px 0 0; display:grid; gap:7px; }
  .checklist li{ display:flex; gap:11px; align-items:flex-start; font-size:15px; line-height:1.5; color:#33312c; }
  .checklist li i{ width:22px; height:22px; border-radius:6px; background:var(--verde-c); border:1px solid var(--verde-f); color:var(--verde); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
  .checklist li i svg{ width:14px; height:14px; stroke-width:2.6; }

  .p-piede{ flex-shrink:0; display:flex; align-items:center; gap:8px; padding:12px 14px; border-top:1px solid var(--bordo); background:var(--carta); }
  .p-piede .sp{ flex:1; text-align:center; font-size:13px; color:var(--att); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .nb{ display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:10px; padding:10px 15px; font-size:14.5px; font-weight:600; cursor:pointer; white-space:nowrap; border:1px solid var(--bordo); background:#fff; color:var(--scuro); }
  .nb:hover{ background:#f1f2ec; }
  .nb:disabled{ opacity:.45; cursor:default; }
  .nb.av{ background:var(--verde); border-color:var(--verde); color:#fff; padding:10px 18px; }
  .nb.av:hover{ background:#355b45; }
  .nb.rivedi.gira svg{ animation:gira 1.2s linear infinite; }
  @keyframes gira{ to{ transform:rotate(-360deg); } }

  /* indice */
  .indice{ position:fixed; inset:0; z-index:100; background:rgba(38,36,32,.45); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; }
  .indice.su{ display:flex; }
  .indice-card{ background:var(--carta); border:1px solid var(--bordo); border-radius:18px; width:100%; max-width:880px; padding:24px 26px 26px; }
  .indice-h{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .indice-h h2{ font-family:'Fraunces',serif; font-weight:600; font-size:26px; margin:0; flex:1; }
  .indice-g{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  .ix{ background:#fff; border:1px solid var(--bordo); border-radius:14px; padding:12px 14px 10px; }
  .ix-t{ display:flex; gap:10px; align-items:center; font-weight:600; font-size:15px; margin-bottom:6px; }
  .ix-t span{ font-family:'Fraunces',serif; font-weight:600; font-size:20px; color:var(--att); min-width:24px; }
  .ix button{ display:block; width:100%; text-align:left; background:none; border:0; border-radius:8px; padding:5px 8px; font-size:13.5px; line-height:1.4; color:#5a5750; cursor:pointer; }
  .ix button:hover{ background:#f4f5f0; color:var(--ink); }
  .ix button.on{ background:var(--verde-c); color:var(--verde); font-weight:600; }

  @media (max-width:1180px){ .tt-main{ grid-template-columns:minmax(0,1fr) 380px; } .p-tit{ font-size:24px; } }
  @media (max-width:900px){
    .tt-top{ height:52px; padding:0 10px; gap:8px; }
    .tt-nome .b{ display:none; }
    .tt-cap{ font-size:14px; text-align:left; } .tt-cap span{ display:none; }
    .tt-btn .x{ display:none; } .tt-btn{ padding:7px 9px; }
    .tt-prog{ padding:0 8px; height:12px; }
    .tt-main{ display:flex; flex-direction:column; gap:8px; padding:8px 6px 0; }
    .schermo{ flex:0 0 auto; height:47vh; height:47dvh; border-radius:12px; box-shadow:0 6px 18px rgba(38,36,32,.10); }
    .schermo-barra{ height:30px; } .schermo-barra .pallini, .schermo-barra .ind{ display:none; } .schermo-barra{ justify-content:center; }
    .schermo-carica{ inset:30px 0 0 0; }
    .lettore{ gap:7px; padding:6px 8px; }
    .guarda{ padding:7px 13px 7px 11px; font-size:14px; } .guarda .l{ display:none; }
    .salta{ width:32px; height:32px; }
    .lettore-conta{ display:none; }
    .schermo-avviso{ bottom:58px; }
    .pannello{ flex:1; border-radius:14px 14px 0 0; border-bottom:0; }
    .p-corpo{ padding:18px 16px 18px; }
    .p-tit{ font-size:22px; margin:8px 0 10px; }
    .punti-hint{ display:block; }
    .p-testo p{ font-size:15.5px; }
    .p-piede{ padding:9px 10px calc(9px + env(safe-area-inset-bottom)); }
    .nb{ padding:10px 12px; } .nb .x{ display:none; }
    .indice{ padding:12px 8px; } .indice-card{ padding:18px 14px; }
  }
</style>
</head>

lor:var(--danger);}\n  #dettaglio-iva td.ad{color:var(--accent);}\n  #dettaglio-iva tr.tot td{font-weight:700; border-top:1px solid var(--line2);}\n  .artbox{border:1px solid var(--line); border-radius:10px; padding:14px;}\n  .trash{border:none; background:transparent; color:var(--danger); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px;}\n  .btn{background:var(--accent); color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:7px; cursor:pointer;}\n  .amt-dsc{color:var(--danger); font-weight:500;}\n  .amt-net{border:1px solid var(--line2); background:var(--surface); font-weight:700;}\n  .del-sconto{border:none; background:transparent; color:var(--muted); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; padding:0; flex:none;}\n  .del-sconto:hover{color:var(--ink);}\n  .motivo-altro{max-width:180px;}\n  .chooser{margin-top:12px; display:flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:var(--ro);}\n  .chooser .lbl{margin:0; min-height:0;}\n  .chooser-annulla{border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:13px; text-decoration:underline; padding:4px 6px;}\n  .chooser-annulla:hover{color:var(--ink);}\n  .btn-green{background:#5c8b73; color:#fff; border:none; border-radius:8px; padding:11px 18px; font-size:14px; font-weight:700; cursor:pointer;}\n  .btn-green:hover{background:#3f6b52;}\n  .btn-ghost{background:#fff; border:1px solid var(--line2); border-radius:8px; padding:10px 16px; font-size:14px; cursor:pointer; color:var(--ink);}\n  .btn-ghost:hover{background:var(--page);}\n  .cx-actions{display:flex; gap:12px; margin-bottom:18px; align-items:center;}\n  .cx-page{max-width:820px; margin:0 auto; background:#fff; border:1px solid var(--line); border-radius:6px; box-shadow: una regola dell'editor del cantiere qui sopra. */\n  .ff-sub{margin-left:auto; font-size:13px; color:var(--muted); display:flex; align-items:center; gap:14px;}\n  .link{color:var(--accent); cursor:pointer; text-decoration:underline; font-size:13px;}\n  /* Barra in alto dell'alunno: link SENZA sottolineato; \"Le mie fatture\" come pulsante-pillola ben visibile. */\n  #topbar-info .link{ text-decoration:none; }\n  /* (26/09/2026) pulsanti sottili come l'«Esci» del docente: icona e scritta su una riga, mai a capo */\n  #topbar-info .tb-nome{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }\n  #topbar-info .tb-azioni{ display:flex; align-items:center; gap:8px; }\n  #topbar-info .tb-azioni:empty{ display:none; }\n  #topbar-info .tb-btn{ display:inline-flex; align-items:center; gap:6px; flex:none; white-space:nowrap; background:#fff; border:1px solid #cfdfd5; color:#3f6b52; border-radius:8px; padding:6px 12px; font-family:inherit; font-size:13.5px; font-weight:500; line-height:1.2; cursor:pointer; transition:background .15s; }\n  #topbar-info .tb-btn:hover{ background:#f1f7f3; }\n  #topbar-info .tb-btn svg{ width:15px; height:15px; flex:none; }\n  @media (max-width: 600px){\n    /* sul telefono: in alto il logo (la calcolatrice sta a destra, nel posto vuoto), sotto nome ed «Esci»,\n       sotto ancora i pulsanti. Niente sfora: la pagina resta larga quanto lo schermo. */\n    .topbar-inner{ flex-wrap:wrap; row-gap:10px; }\n    html.calcx-on body header.topbar{ padding-right:0 !important; }   /* body: vince sulla regola della calcolatrice, messa dopo */\n    .ff-sub{ flex:1 1 100%; margin-left:0; flex-wrap:wrap; gap:8px 10px; min-width:0; }\n    .ff-sub:empty{ display:none; }\n    #topbar-info .tb-nome{ flex:1 1 0; font-size:12.5px; }\n    #topbar-info .tb-esci{ order:1; }\n    #topbar-info .tb-azioni{ order:2; flex:1 1 100%; flex-wrap:wrap; }\n    #topbar-info .tb-btn{ font-size:13px; padding:6px 10px; }\n  }\n\n  /* ---- LOGIN ---- */\n  #gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:30px;}\n  .gate-card{width:100%; max-width:440px; background:#e9f1ec; border:1px solid #cfdfd5; border-radius:16px; box-shadow:0 8px 30px rgba(16,24,40,.08); overflow:hidden;}\n  .gate-body{padding:24px 26px 28px;}\n  .gate-body .lbl{display:block; font-size:12px; color:var(--muted); font-weight:600; margin-bottom:6px;}\n  .gate-badge{position:relative; width:64px; height:64px; margin:6px auto 14px; background:#fff; border:1px solid #cfdfd5; border-radius:16px; display:flex; align-items:center; justify-content:center; overflow:hidden;}\n  .gate-badge span.ff{font-family:'Fraunces',serif; font-weight:600; font-size:24px; letter-spacing:-1px; color:#3f6b52;}\n  .gate-badge span.fold{position:absolute; top:0; right:0; width:0; height:0; border-top:16px solid #3f6b52; border-left:16px solid transparent;}\n  .gate-brand{text-align:center; font-weight:700; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:#3f6b52; margin-bottom:14px;}\n  .gate-title{font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:#3f6b52; text-align:center; margin:0 0 6px;}\n  .gate-sub{text-align:center; color:var(--muted); font-size:14px; margin:0 0 20px;}\n  .pin-box{border:1px solid var(--line2); border-radius:14px; padding:14px; margin-bottom:6px; background:#fff;}\n  .pin-input{border:none; box-shadow:none !important; text-align:center; font-size:26px; letter-spacing:.55em; font-weight:700; color:#3f6b52; height:40px; width:100%;}\n  .pin-input:focus{outline:none;}\n  .pass-input{height:48px; text-align:center; font-size:16px;}\n  .gate-err{color:var(--danger); font-size:13px; margin-top:10px; min-height:18px;}\n  .btn-entra{background:#3f6b52; color:#fff; border:none; border-radius:14px; padding:15px; font-size:16px; font-weight:700; cursor:pointer; width:100%; margin-top:14px;}\n  .btn-entra:hover{background:#1d3c6e;}\n  .gate-link{text-align:center; color:var(--muted); font-size:13px; margin-top:16px; cursor:pointer;}\n  .gate-link:hover{color:var(--accent); text-decoration:underline;}\n\n  /* ---- AREA DOCENTE ---- */\n  .doc-head{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px;}\n  .doc-head h1{font-family:'Fraunces',serif; font-size:26px; color:#3f6b52; margin:0;}\n  .pill{font-size:12px; font-weight:600; color:#3f6b52; background:#e9f1ec; border:1px solid #cfdfd5; border-radius:999px; padding:4px 12px;}\n  .toolbar-doc{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:center;}\n  table.roster{width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden;}\n  table.roster th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600; padding:12px 16px; background:var(--page); border-bottom:1px solid var(--line);}\n  table.roster td{padding:12px 16px; border-bottom:1px solid var(--line); font-size:14px;}\n  table.roster tr:last-child td{border-bottom:none;}\n  .pin-cell{font-variant-numeric:tabular-nums; letter-spacing:.15em; font-weight:700; color:#3f6b52;}\n  .assigned-yes{color:#5c8b73; font-weight:600;}\n  .assigned-no{color:var(--muted);}\n  .sel{height:40px; border:1px solid var(--line2); border-radius:10px; padding:0 12px; font-family:inherit; font-size:14px; background:#fff;}\n  .btn-red{background:#fff; border:1px solid #f0b4b4; color:var(--danger); border-radius:8px; padding:11px 18px; font-size:14px; font-weight:600; cursor:pointer;}\n  .btn-red:hover{background:#fdecec;}\n  /* \"Chiudi e consegna\": rosso PIENO (azione irreversibile, deve allarmare) — dedicato, non tocca \"Reset classe\" */\n  .btn-red-solid{background:#c0392b; color:#fff; border:none; border-radius:8px; padding:11px 18px; font-size:14px; font-weight:500; cursor:pointer;}\n  .btn-red-solid:hover{background:#a5301f;}\n  .btn-green:disabled, .btn:disabled{opacity:.45; cursor:default;}\n\n  /* ---- BARRA \"TESTO DELL'ESERCITAZIONE\" ---- */\n  .verifica{border:1px solid #cfdfd5; border-radius:14px; background:#fbfdff; margin-bottom:20px; overflow:hidden;}\n  .verifica-head{display:flex; align-items:center; gap:12px; padding:12px 18px; background:#e9f1ec; border-bottom:1px solid #cfdfd5;}\n  .verifica-head .tit{font-family:'Fraunces',serif; font-size:18px; font-weight:600; color:#3f6b52;}\n  .verifica-head .toggle{margin-left:auto; width:34px; height:34px; border:1px solid var(--line2); border-radius:8px; background:#fff; color:#3f6b52; font-size:20px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;}\n  .verifica-head .toggle:hover{background:#e9f1ec;}\n  .verifica-body{padding:18px 22px; font-size:14px; line-height:1.6;}\n  .verifica-body.collapsed{display:none;}\n  .vb-op{margin:0 0 12px;}\n  .vb-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}\n  .vb-card{border:1px solid var(--line); border-radius:10px; padding:12px 14px; background:#fff;}\n  .vb-card h4{margin:0 0 8px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);}\n  .vb-card div{margin-bottom:2px;}\n  .vb-doc{display:flex; gap:24px; flex-wrap:wrap; margin-bottom:12px; font-size:13px;}\n  .vb-doc b{color:#3f6b52;}\n  table.vb-items{width:100%; border-collapse:collapse; font-size:13px; margin-bottom:12px;}\n  table.vb-items th{text-align:left; border-bottom:2px solid #3f6b52; color:#3f6b52; text-transform:uppercase; font-size:10px; letter-spacing:.04em; padding:6px 8px;}\n  table.vb-items td{border-bottom:1px solid var(--line); padding:6px 8px; vertical-align:top;}\n  table.vb-items td.tc{text-align:center;} table.vb-items td.tr{text-align:right;}\n  ol.vb-cond{margin:0; padding-left:22px;} ol.vb-cond li{margin-bottom:6px;}\n\n  /* ---- BANNER (cortesia / soluzione) ---- */\n  .banner{max-width:1360px; margin:0 auto 16px; padding:12px 18px; border-radius:10px; font-size:14px;}\n  .banner-warn{background:#fff7ed; border:1px solid #fdba74; color:#9a3412;}\n  .banner-cortesia{background:#eef3fb; border:1px solid #cddcf0; color:#3f6b52;}\n  /* Cartello «non svolta» in valutazione: l'alunno non e' mai entrato, non c'e' niente da mostrare. */\n  .cx-nonsvolta{max-width:820px; margin:0 auto 14px; padding:12px 18px; text-align:center; color:#b4472f; font-weight:600; font-size:15px; background:#fdecec; border:1px solid #f3c2c2; border-radius:10px;}\n\n  /* ---- Riquadri importo dell'editor resi MODIFICABILI (stesso look dei .ro del cantiere) ---- */\n  .imp-cell{width:100%; height:38px; box-sizing:border-box; border:1px solid var(--line); border-radius:8px; padding:0 12px; background:#fff; font-family:inherit; font-size:14px; font-weight:500; text-align:right; color:var(--ink); font-variant-numeric:tabular-nums;}\n  .imp-cell:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(63,107,82,.12);}\n  .imp-cell.dsc{color:var(--danger);}\n  .imp-cell.net{border-color:var(--line2); font-weight:700;}\n  /* ---- Celle numeriche del castelletto IVA rese MODIFICABILI ---- */\n  .cast-in{width:96px; height:32px; box-sizing:border-box; border:1px solid var(--line); border-radius:6px; padding:0 8px; text-align:right; font-family:inherit; font-size:13px; font-variant-numeric:tabular-nums; color:var(--ink); background:#fff;}\n  .cast-in:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(63,107,82,.12);}\n  .cast-in.cast-neg{color:var(--danger);}\n  .cast-in.cast-pos{color:var(--accent);}\n\n  /* ---- SOLUZIONE nel compilatore (sol-mode) + interruttore vista soluzione ---- */\n  #sol-banner{ display:none; align-items:center; gap:14px; max-width:1360px; margin:0 auto 16px; padding:12px 18px; border-radius:10px; background:#ecfdf5; border:1px solid #6ee7b7; color:#065f46; font-size:14px; font-weight:500; }\n  #editor.sol-mode #sol-banner{ display:flex; }\n  #sol-banner .sb-tag{ font-weight:700; letter-spacing:.02em; }\n  #sol-banner .sb-btn{ margin-left:auto; background:#065f46; color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; flex:none; }\n  #sol-banner .sb-btn:hover{ background:#054b38; }\n/* La traccia delle scorciatoie (solo nella Valuta del docente) */\n.traccia-scorciatoie{ margin:16px 0 0; padding:12px 18px; border-radius:10px; background:#fdf6d3; border:1px solid #e6cf6e; color:#5b4a0e; font-size:14px; line-height:1.55; }\n.traccia-scorciatoie .ts-tit{ font-weight:700; margin-bottom:4px; }\n.traccia-scorciatoie ul{ margin:0; padding-left:18px; }\n  /* ---- Visualizzatore compiti a schede (come l'export): Fattura / Fattura corretta / Dashboard / Dashboard corretta ---- */\n  .vc-bar{ width:100%; max-width:1360px; margin:0 auto; }\n  /* (25/09/2026, richiesta di Mauro) La barra delle schede resta ferma in alto mentre si scorre: si salta fra «mio» e\n     «corretto» senza risalire la pagina. Sfondo pieno, cosi' il foglio che scorre sotto non si vede attraverso. */\n  .vc-fissa{ position:sticky; top:0; z-index:60; background:var(--page); max-width:1360px; margin:0 auto 16px; padding:10px 0; }\n  .vc-chips{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }\n  .vc-chip{ border:1px solid #cdd8e6; background:#f4f7fb; border-radius:9px; padding:6px 14px; cursor:pointer; font-size:13px; color:#3a475c; font-family:inherit; }\n  .vc-chip:hover{ background:#e9f0fa; }\n  .vc-chip.active{ background:#5c8b73; color:#fff; border-color:#5c8b73; }\n  .vc-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }\n  .vc-tabs{ display:flex; gap:8px; flex-wrap:wrap; }\n  .vc-tab{ border:1px solid #cfd8e6; background:#fff; border-radius:10px; padding:8px 15px; cursor:pointer; font-size:14px; color:#3a475c; font-family:inherit; }\n  .vc-tab:hover{ background:#f4f7fb; }\n  .vc-tab.active{ background:#3f6b52; color:#fff; border-color:#3f6b52; }\n  .vc-spacer{ margin-left:auto; display:flex; gap:10px; }\n  .vc-pdf{ border:1px solid #6ee7b7; background:#ecfdf5; color:#065f46; border-radius:10px; padding:8px 15px; cursor:pointer; font-size:14px; font-family:inherit; }\n  .vc-esci{ border:1px solid #cfd8e6; background:#fff; border-radius:10px; padding:8px 15px; cursor:pointer; font-size:14px; color:#3f6b52; font-family:inherit; }\n  .vc-esci:hover{ background:#f4f7fb; }\n  /* ---- Scheda VALUTAZIONE (verifiche): righe larghe, riepilogo centrato ---- */\n  .lnk-valuta{ color:#3f6b52; font-size:13px; cursor:pointer; }\n  .lnk-valuta:hover{ text-decoration:underline; }\n  .btn-pubblica{ display:inline-flex; align-items:center; border:none; background:#5c8b73; color:#fff; border-radius:8px; padding:10px 16px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; }\n  .btn-pubblica:hover{ background:#3f6b52; }\n  /* Banner \"valutazione pubblicata\" nella pagina compiti dell'alunno */\n  .val-card{ display:flex; align-items:center; gap:14px; background:#eef3fb; border:1px solid #cddcf0; border-radius:12px; padding:14px 18px; margin:0 0 16px; cursor:pointer; }\n  .val-card:hover{ background:#e4edf9; }\n  .val-card .vc-voto{ font-size:30px; font-weight:600; color:#3f6b52; line-height:1; }\n  .val-card .vc-txt-t{ font-weight:500; color:#3f6b52; }\n  .val-card .vc-txt-s{ font-size:13px; color:#5b6b82; }\n  .val-card .vc-giud{ font-size:15px; color:#262420; white-space:pre-wrap; margin:4px 0 4px; }\n  .vv-sum{ display:flex; background:#eef3fb; border:1px solid #cddcf0; border-radius:12px; padding:16px 18px; margin-bottom:14px; }\n  .vv-col{ flex:1; text-align:center; }\n  .vv-lab{ font-size:12px; color:#5b6b82; margin-bottom:5px; }\n  .vv-val{ font-size:20px; color:#3f6b52; font-weight:500; }\n  .vv-voto{ font-size:34px; line-height:1; }\n  .vv-rows{ display:flex; flex-direction:column; gap:12px; }\n  .vv-row{ display:flex; gap:18px; background:#fff; border:1px solid #e3e7ee; border-radius:12px; padding:16px; }\n  .vv-left{ flex:0 0 150px; }\n  .vv-fh{ font-weight:600; color:#3f6b52; margin-bottom:10px; }\n  .vv-score{ display:flex; align-items:center; gap:7px; }\n  .vv-sl{ color:#8a94a6; font-size:18px; }\n  .vv-slabel{ font-size:11px; color:#8a94a6; margin-top:5px; }\n  .vv-in{ font-family:inherit; font-size:16px; border:1px solid #cfd8e6; border-radius:8px; padding:7px 8px; width:56px; text-align:center; color:#2b3346; }\n  .vv-in.vv-err{ border-color:#e24b4a; background:#fdecec; color:#b4472f; }\n  .vv-ta{ font-family:inherit; font-size:14px; line-height:1.5; border:1px solid #cfd8e6; border-radius:8px; padding:10px 12px; flex:1; resize:vertical; color:#2b3346; min-height:96px; box-sizing:border-box; }\n  @media(max-width:640px){ .vv-row{ flex-direction:column; } .vv-left{ flex:auto; } }\n  #editor.sol-mode #toolbar,\n  #editor.sol-mode #btnFinalizza,\n  #editor.sol-mode .trash,\n  #editor.sol-mode .del-sconto,\n  #editor.sol-mode .ana-change,\n  #editor.sol-mode #chooser,\n  #editor.sol-mode #chooser-spesa{ display:none !important; }\n  #editor.sol-mode input,\n  #editor.sol-mode textarea,\n  #editor.sol-mode select,\n  #editor.sol-mode .cast-in{ cursor:default; }\n  #editor.sol-mode input:focus,\n  #editor.sol-mode textarea:focus,\n  #editor.sol-mode select:focus,\n  #editor.sol-mode .cast-in:focus{ box-shadow:none; border-color:var(--line); }\n  .seg-btn.seg-active{ background:#3f6b52; color:#fff; border-color:#3f6b52; }\n\n  /* ---- Cortesia: riepilogo piu' largo cosi' le descrizioni di spese/sconti si leggono per intero ---- */\n  #cortesia-page .cx-sum, #soluzione-page .cx-sum{ width:480px; }\n  #cortesia-page .cx-row, #soluzione-page .cx-row{ gap:16px; align-items:flex-start; }\n  #cortesia-page .cx-row > span:first-child, #soluzione-page .cx-row > span:first-child{ white-space:normal; overflow-wrap:anywhere; max-width:300px; }\n  #cortesia-page .cx-row > span:last-child, #soluzione-page .cx-row > span:last-child{ white-space:nowrap; text-align:right; flex:none; }\n\n  /* ---- Ritocco 1: sconto articolo nella cortesia con stesso font della cella (rosso) ---- */\n  .cx-scfull{ font-size:13.5px; color:var(--danger); }\n  #cortesia-page .cx-items td.tc, #cortesia-page .cx-items td.tr, #soluzione-page .cx-items td.tc, #soluzione-page .cx-items td.tr{ white-space:nowrap; }\n  #cortesia-page .cx-items th, #soluzione-page .cx-items th{ white-space:nowrap; }\n  /* ---- Ritocco 3: riga IVA del riepilogo cortesia in grassetto ---- */\n  #cortesia-page .cx-row.cx-ivarow, #soluzione-page .cx-row.cx-ivarow{ font-weight:400; }\n  /* ---- Ritocco 2: tendina suggerimenti sulla descrizione spese (stile analogo alla rubrica) ---- */\n  .sp-desc-wrap{ position:relative; flex:1 1 auto; min-width:110px; }\n\n  /* ---- Stampa: mostra solo la vista attualmente stampata ---- */\n  @media print{\n    .topbar, #gate, #docente, #verifica-bar, #editor, .cx-actions, .verifica, .banner, .vc-bar, .vc-fissa, .cx-foot{display:none !important;}\n    #cortesia-view:not(.printing){display:none !important;}\n    #cortesia-view.printing{display:block !important;}\n    #soluzione-view:not(.printing){display:none !important;}\n    #soluzione-view.printing{display:block !important;}\n    /* (26/09/2026, richiesta di Mauro) Sfondi sempre stampati e niente intestazioni e piè di pagina del browser\n       (data, titolo, indirizzo, numero di pagina), senza toccare le caselle della finestra di stampa.\n       Le caselle una pagina non le puo' spuntare; pero' con print-color-adjust gli sfondi escono comunque, e\n       Chrome, Edge e Firefox (dalla 48) saltano intestazioni e piè di pagina se i margini della pagina non\n       bastano a contenerli: margini a zero, e i 12 mm di bianco li fa la vista stampata, su ogni foglio\n       (clone). Il fondo della pagina diventa bianco: se no, con gli sfondi accesi, coprirebbe tutto il foglio. */\n    html, body{background:#fff !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}\n    #cortesia-view.printing, #soluzione-view.printing{padding:12mm; -webkit-box-decoration-break:clone; box-decoration-break:clone;}\n    /* un foglio solo: il bianco lo fanno i 12 mm qui sopra, e il cedolino si rimpicciolisce se serve (zoomUnFoglio) */\n    #cortesia-view.printing .wrap, #soluzione-view.printing .wrap{padding:0 !important; max-width:none;}\n    #cortesia-view.printing .cx-page, #soluzione-view.printing .cx-page{zoom:var(--zoom-stampa, 1);}\n  }\n  /* la misura di zoomUnFoglio: per un istante la vista sta fuori schermo, larga come il foglio stampato */\n  .misura-vista{display:block !important; position:absolute !important; left:-10000px !important; top:0 !important; width:186mm !important; visibility:hidden !important;}\n  .misura-vista .wrap{padding:0 !important; margin:0 !important; max-width:none !important;}\n  .misura-vista .cx-page{border:none !important; box-shadow:none !important; margin:0 !important;}\n\n  /* ---- VISTA IN ATTESA (studente senza esercitazione assegnata) ---- */\n  #attesa{min-height:62vh; display:flex; align-items:center; justify-content:center;}\n  .attesa-card{width:100%; max-width:480px; background:#e9f1ec; border:1px solid #cfdfd5; border-radius:16px; box-shadow:0 8px 30px rgba(16,24,40,.08); padding:34px 32px 30px; text-align:center;}\n  .attesa-badge{position:relative; width:64px; height:64px; margin:0 auto 16px; background:#fff; border:1px solid #cfdfd5; border-radius:16px; display:flex; align-items:center; justify-content:center; overflow:hidden;}\n  .attesa-badge span.ff{font-family:'Fraunces',serif; font-weight:600; font-size:24px; letter-spacing:-1px; color:#3f6b52;}\n  .attesa-badge span.fold{position:absolute; top:0; right:0; width:0; height:0; border-top:16px solid #3f6b52; border-left:16px solid transparent;}\n  .attesa-title{font-family:'Fraunces',serif; font-size:24px; font-weight:600; color:#3f6b52; margin:0 0 10px;}\n  .attesa-msg{color:var(--muted); font-size:15px; line-height:1.55; margin:0 0 8px;}\n  .attesa-nome{font-size:14px; font-weight:600; color:#3f6b52; margin:6px 0 20px;}\n\n  /* ---- MODALI ELEGANTI (sostituiscono alert/confirm nativi) ---- */\n  .modal-overlay{position:fixed; inset:0; background:rgba(16,24,40,.45); display:flex; align-items:center; justify-content:center; z-index:1000; padding:24px;}\n  .modal-card{width:100%; max-width:440px; background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 18px 50px rgba(16,24,40,.22); overflow:hidden;}\n  .modal-body{padding:24px 26px 10px; font-size:15px; line-height:1.55; color:var(--ink); white-space:pre-wrap; overflow-wrap:anywhere;}\n  .modal-actions{display:flex; justify-content:flex-end; gap:10px; padding:16px 26px 20px;}\n  .modal-btn{border:none; border-radius:8px; padding:10px 20px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;}\n  .modal-btn-ok{background:#3f6b52; color:#fff;}\n  .modal-btn-ok:hover{background:#1d3c6e;}\n  .modal-btn-cancel{background:#fff; border:1px solid var(--line2); color:var(--ink);}\n  .modal-btn-cancel:hover{background:var(--page);}\n\n  /* ---- Correzione 1: sconto articolo cortesia su riga separata (etichetta e valore allineati) ---- */\n  #cortesia-page .cx-items td.cx-nb, #soluzione-page .cx-items td.cx-nb{ border-bottom:none; }\n  #cortesia-page .cx-items td.cx-scrow, #soluzione-page .cx-items td.cx-scrow{ color:var(--danger); font-size:13.5px; padding-top:2px; }\n  #cortesia-page .cx-items td.cx-scrow.tr, #soluzione-page .cx-items td.cx-scrow.tr{ white-space:nowrap; }\n\n  /* ---- Correzione 3: casella Totale fattura piu' larga per numeri grandi ---- */\n  #editor #v-totfatt{ width:190px; }\n\n  /* ---- Neretto (grassetto) sull'importo quando è già il netto (articolo senza sconto) ---- */\n  .imp-cell.is-net{ font-weight:700; }\n\n  /* ---- Selettore livello di compilazione (Manuale / Guidata / Automatica) ---- */\n  /* La barra livelli NON è più nel compilatore dello studente: il livello lo sceglie\n     il docente in fase di assegnazione. Resta nel DOM (nascosta) per compatibilità. */\n  #livello-bar{ display:none !important; }\n  #livello-bar .lv-lbl{ font-size:13px; font-weight:600; color:#3f6b52; }\n  #livello-bar .lv-seg{ display:inline-flex; border:1px solid var(--line2); border-radius:10px; overflow:hidden; background:#fff; }\n  #livello-bar .lv-btn{ border:none; background:#fff; color:var(--ink); font-family:inherit; font-size:13px; font-weight:600; padding:9px 18px; cursor:pointer; border-right:1px solid var(--line2); }\n  #livello-bar .lv-btn:last-child{ border-right:none; }\n  #livello-bar .lv-btn:hover{ background:#eef2f7; }\n  #livello-bar .lv-btn.active{ background:#3f6b52; color:#fff; }\n  #livello-bar .lv-hint{ font-size:12px; color:var(--muted); }\n  /* ---- Cruscotto area docente (passo 1a/2) ---- */\n  .doc-tiles{ display:flex; gap:12px; margin:16px 0 6px; flex-wrap:wrap; }\n  .doc-tiles .tile{ flex:1; min-width:120px; background:var(--ice,#e9f1ec); border:1px solid var(--line2,#dbe4f2); border-radius:14px; padding:14px 16px; text-align:center; }\n  .doc-tiles .tile-num{ font-size:26px; font-weight:800; color:#3f6b52; line-height:1.1; }\n  .doc-tiles .tile-lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin-top:2px; }\n  .st-badge{ display:inline-block; padding:3px 11px; border-radius:999px; font-size:12px; font-weight:700; white-space:nowrap; }\n  .st-off{ background:#eef0f2; color:#7a7f87; }\n  .st-on{ background:rgba(63,107,82,.14); color:#3f6b52; }\n  .st-done{ background:rgba(235,200,113,.32); color:#7a5c14; }\n  .st-block{ background:rgba(180,71,47,.12); color:#b4472f; }\n  /* Segnato assente dal docente: rosso, e la riga si smorza. Deve saltare all'occhio senza leggere. */\n  .st-assente{ background:rgba(180,71,47,.12); color:#b4472f; }\n  tr.riga-assente{ opacity:.5; }\n  /* Il cognome è cliccabile (segna assente/presente): al passaggio del mouse GRASSETTO, mai sottolineato. */\n  td.nome-cell{ cursor:pointer; }\n  /* PALLINO ROSSO (21/09/2026) accanto al nome di chi ha abbassato o lasciato la pagina del cedolino mentre\n     lavora. 22/09/2026, dopo la lezione in 5H: PICCOLO e ROSSO FISSO, niente lampeggio (Mauro: «dà fastidio»). */\n  .dot-fuori{ display:inline-block; width:8px; height:8px; border-radius:50%; background:#e0261f; margin-left:8px; vertical-align:middle; }\n  td.nome-cell:hover{ font-weight:700; }\n  tr:hover > td.nome-cell{ background:#f7f8fa; }\n  .btn-mini{ border:1px solid var(--line2,#dbe4f2); background:#fff; color:#3f6b52; border-radius:8px; padding:6px 12px; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; }\n  .btn-mini:hover{ background:#eef2f7; }\n  .btn-sblocca{ border:none; background:#93c0a8; color:#1e402d; border-radius:8px; padding:4px 10px; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; }\n  .btn-sblocca:hover{ background:#7fb096; }\n  .btn-riammetti{ border:none; background:#b9a6d9; color:#2f2740; border-radius:8px; padding:4px 10px; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; }\n  .btn-riammetti:hover{ filter:brightness(.95); }\n  .btn-consegna{ border:none; background:#e6b657; color:#4a3712; border-radius:10px; padding:8px 15px; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; }\n  .btn-riammetti-classe{ background:#efeaf9; border:1px solid #9187db; color:#3C3489; border-radius:8px; padding:9px 15px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; }\n  .btn-riammetti-classe:hover{ filter:brightness(.97); }\n  .btn-archivio{ background:#f6d99a; border:1px solid #e0b45f; color:#6b4e12; border-radius:8px; padding:10px 16px; font-size:14px; line-height:16px; cursor:pointer; display:inline-flex; align-items:center; }\n  .btn-archivio:hover{ background:#f1cd7f; }\n  /* Consegna classe + Riammetti classe: colore lavanda (ex Archivio compiti), NON in grassetto */\n  .btn-lavanda{ background:#C0B9EF; border:1px solid #9187db; color:var(--ink); border-radius:8px; padding:10px 16px; font-family:inherit; font-size:14px; font-weight:400; cursor:pointer; display:inline-flex; align-items:center; }\n  .btn-lavanda:hover{ background:#b3abea; }\n  /* Sospendi / Riprendi verifica: colore suo (azzurro-ardesia), diverso da tutti gli altri. È l'interruttore\n     della lezione, non deve somigliare né alle consegne (lavanda) né al Reset (rosso). Da sospesa diventa\n     verde: un colpo d'occhio deve bastare a sapere se la verifica è aperta o chiusa. */\n  .btn-sospendi{ background:#cfe0f5; border:1px solid #7ea9dd; color:#173d63; border-radius:8px; padding:10px 16px; font-family:inherit; font-size:14px; font-weight:400; cursor:pointer; display:inline-flex; align-items:center; }\n  .btn-sospendi:hover{ background:#bfd5f0; }\n  .btn-sospendi.ripr{ background:#bfe3c6; border-color:#77b586; color:#14401f; }\n  .btn-sospendi.ripr:hover{ background:#aedab8; }\n  .btn-eserc{ background:#f1ede4; border:1px solid #c9bfa9; color:#57534a; border-radius:8px; padding:10px 16px; font-family:inherit; font-size:14px; font-weight:400; cursor:pointer; display:inline-flex; align-items:center; }\n  .btn-eserc:hover{ background:#e8e2d5; }\n  .btn-eserc.on{ background:#5c8b73; border-color:#4a7560; color:#fff; }\n  .btn-eserc.on:hover{ background:#527f68; }\n  .badge-eserc{ display:inline-block; margin-left:10px; background:#e6f0ea; border:1px solid #5c8b73; color:#2f5a44; border-radius:999px; padding:3px 12px; font-size:13px; vertical-align:middle; }\n  .badge-sospesa{ display:inline-block; margin-left:10px; background:#e9f1ec; border:1px solid #7ea9dd; color:#173d63; border-radius:999px; padding:3px 12px; font-size:13px; vertical-align:middle; }\n  /* Archivio compiti — stile \"ipotesi 5\" (accento viola). Attivo solo quando #menu-fatture ha la classe .arch5 */\n  #menu-fatture{ display:flex; justify-content:center; }\n  #menu-fatture.arch5 .attesa-card{ background:#f6f5fc; }\n  #menu-fatture.arch5 .attesa-title{ color:#3c3489; }\n  .arch-row{ display:flex; align-items:center; gap:12px; background:#fff; border:1px solid #ece9fb; border-left:4px solid #7f77dd; border-radius:11px; padding:10px 14px; margin-bottom:9px; text-align:left; }\n  .arch-av{ width:36px; height:36px; border-radius:50%; background:#e7e5fb; color:#534ab7; display:flex; align-items:center; justify-content:center; flex:none; font-weight:700; font-size:15px; }\n  .arch-info{ flex:1; min-width:0; }\n  .arch-nm{ font-weight:700; font-size:14px; color:#2c2c2a; }\n  .arch-mt{ font-size:12px; color:#6b6b82; margin-top:1px; }\n  .arch-apri{ border:none; background:#534ab7; color:#fff; border-radius:8px; padding:8px 18px; font-size:13px; font-weight:600; cursor:pointer; }\n  .arch-apri:hover{ background:#463da0; }\n  .sel-classe{ height:34px; border:1px solid var(--line2); border-radius:8px; padding:0 10px; font-family:inherit; font-size:14px; background:#fff; color:var(--ink); cursor:pointer; }\n  .btn-consegna:hover{ filter:brightness(.96); }\n  .btn-consegna-uno{ border:none; background:#f4e3a8; color:#6b5316; border-radius:8px; padding:4px 11px; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; }\n  .btn-consegna-uno:hover{ filter:brightness(.96); }\n  .sel-ass-alunno{ width:100%; max-width:210px; }\n  /* ---- Assegnazione multipla: riepilogo + pulsanti + modale di scelta ---- */\n  .ass-summary{ font-size:13px; color:#3f6b52; font-weight:600; }\n  .ass-summary.vuota{ color:var(--muted); font-weight:400; font-style:italic; }\n  .btn-scegli-ass{ border:1px solid var(--line2,#dbe4f2); background:#fff; color:#3f6b52; border-radius:8px; padding:5px 12px; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; }\n  .btn-scegli-ass:hover{ background:#eef2f7; }\n  .btn-scegli-ass.mini{ padding:3px 10px; font-size:12px; max-width:210px; overflow:hidden; text-overflow:ellipsis; }\n  .ass-pill{ display:inline-block; border:1px solid var(--line2,#dbe4f2); background:#fff; color:#3f6b52; border-radius:8px; padding:3px 10px; font-size:12px; font-weight:700; max-width:210px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:middle; }\n  /* consegna parziale nella tabella docente: distinta dal 'Consegnato' pieno */\n  .st-badge.st-part{ background:rgba(63,107,82,.12); color:#3f6b52; white-space:nowrap; }\n  /* righe del menù fatture (studente) */\n  #menu-list{ display:flex; flex-direction:column; gap:10px; margin-top:8px; text-align:left; }\n  .menu-row{ display:flex; align-items:center; gap:12px; border:1px solid var(--line2,#dbe4f2); border-radius:12px; padding:12px 14px; background:#fff; }\n  .menu-row.fatta{ background:#f3faf6; border-color:#bfe0cd; }\n  .menu-num{ flex:0 0 auto; width:40px; height:40px; border-radius:10px; background:#e9f1ec; color:#3f6b52; font-weight:800; font-size:18px; display:flex; align-items:center; justify-content:center; }\n  .menu-row.fatta .menu-num{ background:#d8efe1; color:#2f7d54; }\n  .menu-info{ flex:1 1 auto; min-width:0; }\n  .menu-info .t{ font-weight:700; color:#1f2d3d; font-size:15px; }\n  .menu-info .s{ font-size:13px; color:var(--muted); margin-top:2px; }\n  .menu-cta{ flex:0 0 auto; }\n  .menu-cta .btn-compila{ border:none; background:#3f6b52; color:#fff; border-radius:9px; padding:9px 18px; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; }\n  .menu-cta .btn-compila:hover{ background:#1d3c6e; }\n  .menu-done{ color:#2f7d54; font-weight:700; font-size:14px; white-space:nowrap; }\n  /* (27/09/2026) esercizio valutato: scritta e pulsanti scendono sotto il titolo, cosi' il titolo non va a capo */\n  .menu-row.valutata{ flex-wrap:wrap; }\n  .menu-row.valutata .menu-cta{ flex:1 1 100%; display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:8px; }\n  .menu-row.valutata .menu-cta .btn-ghost{ margin-left:0 !important; }\n  .selfx-head{ padding:18px 26px 6px; }\n  .selfx-title{ font-weight:800; font-size:17px; color:#3f6b52; }\n  .selfx-sub{ font-size:13px; color:var(--muted); margin-top:2px; }\n  .selfx-sub b{ color:#3f6b52; }\n  .selfx-sub.over{ color:#b4472f; }\n  .selfx-body{ max-height:58vh; overflow:auto; padding:6px 20px 4px; }\n  .selfx-grp{ font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin:12px 6px 4px; }\n  .selfx-row{ display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:10px; }\n  .selfx-row:hover{ background:#f3f7fc; }\n  .selfx-row.on{ background:#e9f1ec; }\n  .selfx-check{ display:flex; align-items:center; }\n  .selfx-check input{ width:18px; height:18px; cursor:pointer; accent-color:#3f6b52; }\n  .selfx-name{ flex:1 1 auto; font-size:14px; color:#1f2d3d; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }\n  .selfx-liv{ flex:0 0 auto; width:132px; }\n  .selfx-eye{ flex:0 0 auto; border:1px solid var(--line2,#dbe4f2); background:#fff; border-radius:8px; padding:4px 9px; font-size:14px; cursor:pointer; line-height:1; }\n  .selfx-eye:hover{ background:#eef2f7; }\n\n  /* ============================================================\n     RESPONSIVE — cellulare e tablet (aggiunto in fondo, non tocca il resto)\n     ============================================================ */\n  .roster-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }\n\n  @media (max-width: 900px){\n    .topbar-inner{ padding:12px 16px; }\n    .wrap{ padding:20px 16px 40px; }\n    .card .body{ padding:16px; }\n    /* Anagrafica: Azienda|Cliente e Dati|Pagamento in colonna singola */\n    #editor [style*=\"grid-template-columns:1fr 1fr\"]{ grid-template-columns:1fr !important; }\n    /* Riepilogo e castelletto IVA sotto, a piena larghezza */\n    #fondo{ flex-direction:column !important; align-items:stretch !important; gap:16px !important; }\n    #riepilogo{ width:auto !important; flex:1 1 auto !important; }\n    #dettaglio-iva{ overflow-x:auto; -webkit-overflow-scrolling:touch; }\n    /* Articoli: 3 colonne su tablet */\n    #editor .artbox .grid{ grid-template-columns:repeat(3, minmax(0,1fr)); }\n    /* Documento di cortesia / soluzione */\n    .cx-head{ flex-direction:column; gap:12px; padding:20px; }\n    .cx-doc{ text-align:left; }\n    .cx-dest{ width:auto; margin:16px 20px 0; }\n    .cx-body{ padding:18px 20px 8px; overflow-x:auto; }\n    .cx-sumwrap{ padding:6px 20px 0; display:block; }\n    .cx-pay, .cx-note, .cx-foot{ margin-left:20px; margin-right:20px; }\n    #cortesia-page .cx-sum, #soluzione-page .cx-sum, .cx-sum{ width:auto !important; }\n  }\n\n  @media (max-width: 600px){\n    .topbar-inner{ padding:10px 14px; gap:10px; }\n    .ff-badge{ width:38px; height:44px; }\n    .ff-badge span.ff{ font-size:16px; }\n    .ff-word{ font-size:17px; }\n    .wrap{ padding:16px 12px 36px; }\n    input, select{ height:42px; }\n    .doc-head h1{ font-size:21px; }\n    /* Editor: TUTTE le griglie interne in colonna singola, IMPILATE (display:block).\n       NB: non basta grid-template-columns:1fr, perché un campo con grid-column:1/3 (es. IBAN del\n       bonifico) fa creare alla griglia una colonna \"implicita\" che schiaccia gli altri campi — così\n       \"Bonifico bancario\" veniva tagliato a \"Bonific\". Con display:block i campi si impilano a piena larghezza. */\n    #editor [style*=\"grid-template-columns\"]{ display:block !important; }\n    #editor [style*=\"grid-template-columns\"] > *{ margin-bottom:12px; }\n    #editor [style*=\"grid-template-columns\"] > *:last-child{ margin-bottom:0; }\n    #editor .artbox .grid{ grid-template-columns:1fr !important; }\n    .artbox{ padding:12px; }\n    .sumline{ flex-wrap:wrap; }\n    .cast-in{ width:80px; }\n    /* Dashboard docente: tabella scrollabile in orizzontale */\n    .roster-scroll{ margin:0 -12px; padding:0 12px; }\n    table.roster{ min-width:760px; }\n    .doc-tiles .tile{ min-width:0; flex:1 1 30%; padding:12px 8px; }\n    .doc-tiles .tile-num{ font-size:22px; }\n    /* Barra strumenti: pulsanti comodi da toccare */\n    .toolbar-doc{ gap:8px; }\n    .toolbar-doc > button{ flex:1 1 auto; justify-content:center; }\n    #btn-reset{ margin-left:0 !important; }\n    #sel-classe, .sel-classe{ width:100%; }\n    /* Documento cortesia compatto */\n    .cx-head{ padding:16px; }\n    .cx-body{ padding:14px 16px 8px; }\n    .cx-dest{ margin:14px 16px 0; padding:12px 14px; }\n    .cx-pay, .cx-note, .cx-foot{ margin-left:16px; margin-right:16px; }\n    .cx-items{ font-size:12px; }\n    .cx-items thead th, .cx-items tbody td{ padding:6px 4px; }\n    #cortesia-page .cx-row > span:first-child, #soluzione-page .cx-row > span:first-child{ max-width:none; }\n    .cx-doc-title{ font-size:22px; } .cx-seller{ font-size:19px; }\n    /* Azioni cortesia (Torna / Chiudi e consegna) a piena larghezza */\n    .cx-actions{ flex-wrap:wrap; }\n    .cx-actions > button{ flex:1 1 auto; justify-content:center; }\n    /* Visualizzatore a schede + valutazione */\n    .vc-spacer{ margin-left:0; width:100%; }\n    /* (25/09/2026) Barra ferma compatta sul telefono: le schede su UNA riga; la riga «Scarica PDF / Ho finito» sta\n       sopra e, quando la barra si ferma in alto, scorre via (il top negativo lo calcola vcAggiustaFissa). */\n    .vc-row{ flex-direction:column-reverse; align-items:stretch; gap:8px; }\n    .vc-tabs{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:6px; }\n    .vc-tab{ padding:7px 4px; font-size:12.5px; line-height:1.2; text-align:center; }\n    .vv-row{ flex-direction:column; }\n    .vv-left{ flex:auto; }\n    .vv-sum{ padding:12px; }\n    .vv-voto{ font-size:28px; }\n    /* Testo esercitazione */\n    .vb-grid{ grid-template-columns:1fr; }\n    /* Menù fatture (studente) e righe archivio */\n    .menu-row{ flex-wrap:wrap; }\n    .menu-info{ flex:1 1 100%; }\n    .menu-cta{ flex:1 1 100%; }\n    .menu-cta .btn-compila, .menu-cta .btn-ghost{ width:100%; }\n    .arch-row{ flex-wrap:wrap; }\n    .arch-info{ flex:1 1 60%; }\n    /* Card valutazione alunno */\n    .val-card{ gap:12px; padding:12px 14px; }\n    .val-card .vc-voto{ font-size:26px; }\n    /* Modali */\n    .modal-overlay{ padding:14px; }\n    /* Login */\n    #gate{ padding:16px; }\n  }\n\u003c/style>\n\u003cstyle>\n/* =========================================================\n   CEDOLINO FACILE — il compilatore dell'alunno\n   Trapiantato dal mockup approvato da Mauro (20/07/2026).\n   Tutte le regole stanno sotto lo scudo .cedolino per non\n   toccare il resto dell'app; solo il cedolino finale (.ced-*)\n   resta libero, perche' viaggia dentro cortesia ed export.\n   ========================================================= */\n:root{\n  --bp:#3f6b52; --bp-bg:#e9f1ec; --bp-line:#c6dbcf;\n  --plus:#3f6b52; --plus-bg:#e9f1ec;\n  --fascia:#3f6b8f; --fascia-bg:#eaf0f7; --fascia-line:#cad9e8;\n  --minus:#b4472f; --minus-bg:#fbeee9;\n  --warn-ink:#8a5320; --warn-bg:#fdf6e9; --warn-line:#e6d3b3;\n  --sans:'Schibsted Grotesk', system-ui, sans-serif;\n  --serif:'Fraunces', Georgia, serif;\n}\n.cedolino{font-family:var(--sans); font-size:15px; line-height:1.5; color:var(--ink);}\n.cedolino button{font-family:inherit; font-size:inherit; cursor:pointer;}\n\n.cedolino .foglio{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden;}\n.cedolino .foglio-h{padding:12px 18px; border-bottom:1px solid var(--line); font-weight:600; display:flex; align-items:center; gap:10px;}\n.cedolino .foglio-h .r{margin-left:auto; font-size:13px; font-weight:400; color:var(--muted);}\n.cedolino .foglio-b{padding:16px 18px; display:flex; flex-direction:column; gap:14px;}\n\n.cedolino .vuoto{border:1px solid var(--line); border-radius:12px; padding:26px 18px; text-align:center; color:var(--muted); display:flex; flex-direction:column; gap:5px;}\n.cedolino .vuoto b{color:var(--ink);}\n\n.cedolino .blocco{border:1px solid var(--line); border-radius:12px; overflow:hidden;}\n.cedolino .blocco-h{display:flex; align-items:center; gap:10px; padding:11px 14px; background:var(--ro); border-bottom:1px solid var(--line);}\n.cedolino .blocco-h .t{font-weight:700;}\n.cedolino .blocco-h .s{font-size:12.5px; color:var(--muted);}\n.cedolino .blocco-h .tot{margin-left:auto; font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap;}\n.cedolino .blocco-b{padding:12px 14px; display:flex; flex-direction:column; gap:12px;}\n\n.cedolino .sotto{border:1px solid var(--line); border-radius:10px; overflow:hidden;}\n.cedolino .sotto-h{padding:8px 10px 8px 12px; background:var(--surface); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px;}\n.cedolino .sotto-h .t{font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:700; color:var(--muted);}\n.cedolino .sotto-h .tot{margin-left:auto; font-size:13.5px; font-variant-numeric:tabular-nums; white-space:nowrap;}\n.cedolino .sotto-b{padding:10px 12px; display:flex; flex-direction:column; gap:8px;}\n\n.cedolino .riga{display:grid; grid-template-columns:auto 1fr auto auto; gap:9px; align-items:center;}\n\n.cedolino .segno{position:relative; flex:none;}\n.cedolino .segno>.cur{width:42px; height:38px; border:1px solid var(--line2); border-radius:9px; background:var(--surface); color:var(--muted); font-size:19px; font-weight:700; line-height:1; display:flex; align-items:center; justify-content:center;}\n.cedolino .segno>.cur.p{color:var(--plus); background:var(--plus-bg); border-color:var(--plus);}\n.cedolino .segno>.cur.m{color:var(--minus); background:var(--minus-bg); border-color:var(--minus);}\n.cedolino .segno>.cur.manca{color:var(--minus); border-color:var(--minus); animation:manca-segno 1.4s ease-in-out infinite;}\n@keyframes manca-segno{50%{box-shadow:0 0 0 4px var(--minus-bg);}}\n.cedolino .segno>.cur.richiamo{animation:richiamo-segno .45s ease 3;}\n@keyframes richiamo-segno{50%{color:var(--minus); border-color:var(--minus); box-shadow:0 0 0 4px var(--minus-bg); transform:scale(1.1);}}\n.cedolino .imp input.attende-segno{opacity:.5; cursor:not-allowed;}\n.cedolino .avviso-segni{color:var(--minus); font-weight:600; font-size:14px;}\n.cedolino .scelte{position:fixed; z-index:400; top:0; left:0; background:var(--surface); border:1px solid var(--line2); border-radius:11px; box-shadow:0 14px 34px -14px rgba(0,0,0,.5); padding:5px; display:flex; flex-direction:column; gap:4px; min-width:210px;}\n.cedolino .scelte[hidden]{display:none;}\n.cedolino .scelte button{display:flex; align-items:center; gap:9px; border:none; background:transparent; border-radius:8px; padding:7px 9px; text-align:left; color:var(--ink); font-size:13.5px;}\n.cedolino .scelte button:hover{background:var(--ro);}\n.cedolino .scelte .sg{width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; flex:none;}\n.cedolino .scelte .sg.p{color:#fff; background:var(--plus);}\n.cedolino .scelte .sg.m{color:#fff; background:var(--minus);}\n\n.cedolino .voce{position:relative; min-width:0;}\n.cedolino .voce>.cur{width:100%; min-height:38px; border:1px solid var(--line2); border-radius:9px; background:var(--surface); color:var(--ink); text-align:left; padding:6px 12px; display:flex; flex-direction:column; justify-content:center;}\n.cedolino .voce>.cur.vuota{color:var(--muted);}\n.cedolino .voce>.cur .n{font-size:14.5px;}\n.cedolino .voce>.cur .d{font-size:12px; color:var(--muted);}\n\n.cedolino .imp{position:relative; flex:none;}\n.cedolino .imp input{width:132px; height:38px; text-align:right; padding:0 12px; border:1px solid var(--line2); border-radius:9px; background:var(--surface); color:var(--ink); font-family:inherit; font-size:14.5px; font-variant-numeric:tabular-nums;}\n.cedolino .imp input::placeholder{color:var(--line2);}\n.cedolino .imp .eur{position:absolute; right:9px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13.5px; pointer-events:none;}\n\n.cedolino .ic{display:flex; gap:2px; flex:none;}\n.cedolino .ic button{width:32px; height:32px; border:1px solid transparent; background:transparent; border-radius:8px; color:var(--muted); display:flex; align-items:center; justify-content:center; padding:0;}\n.cedolino .ic button:hover{border-color:var(--line2); background:var(--surface);}\n.cedolino .ic button.del:hover{color:var(--minus);}\n.cedolino .ic .mwrap{position:relative;}\n\n.cedolino .riga-contributi{grid-template-columns:auto minmax(160px,1fr) auto auto auto auto auto auto; align-items:end;}\n.cedolino .nome-fisso{min-width:0; height:38px; display:flex; align-items:center;}\n.cedolino .nome-fisso .n{font-size:14.5px; font-weight:600;}\n.cedolino .campo{display:flex; flex-direction:column; gap:4px; flex:none;}\n.cedolino .campo label{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700;}\n.cedolino .campo .aiuto{font-size:11.5px; color:var(--muted);}\n.cedolino .campo .imp input{width:186px;}\n.cedolino .campo-ali .imp input{width:104px; padding-right:30px;}\n.cedolino .campo-tot .imp input{width:170px;}\n.cedolino .campo-testo .imp input{width:220px; text-align:left; font-variant-numeric:normal;}\n.cedolino .campo-testo-larga .imp input{width:320px;}\n.cedolino .campo-testo-corta .imp input{width:110px;}\n.cedolino .operatore{font-size:19px; color:var(--muted); font-weight:600; height:38px; display:flex; align-items:center;}\n.cedolino .riga-contributi .ic{height:38px; align-items:center;}\n.cedolino .risultato{display:flex; flex-wrap:wrap; align-items:baseline; gap:10px; border:1px solid var(--bp-line); background:var(--bp-bg); border-radius:10px; padding:11px 14px;}\n.cedolino .risultato .l{font-size:12px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--bp);}\n.cedolino .risultato .c{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums;}\n.cedolino .risultato .v{margin-left:auto; font-family:var(--serif); font-size:20px; font-weight:600; color:var(--bp); font-variant-numeric:tabular-nums;}\n\n.cedolino .scrollx{overflow-x:auto;}\n.cedolino .scaglioni{width:100%; border-collapse:collapse; font-size:14px; min-width:640px; border:1px solid var(--line); border-radius:0 0 10px 10px;}\n.cedolino .scaglioni caption{caption-side:top; text-align:center; font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--fascia); background:var(--fascia-bg); border:1px solid var(--fascia-line); border-bottom:none; border-radius:9px 9px 0 0; padding:6px 12px;}\n.cedolino .scaglioni th{text-align:left; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700; padding:16px 10px 9px; border-bottom:1px solid var(--line); white-space:nowrap;}\n.cedolino .scaglioni td{padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}\n.cedolino .scaglioni th.n, .cedolino .scaglioni td.n{text-align:right;}\n.cedolino .scaglioni td.mens{color:var(--muted);}\n.cedolino .scaglioni td.ali{font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}\n.cedolino .scaglioni .imp{display:inline-block;}\n.cedolino .scaglioni .imp input{width:160px; height:36px; text-align:right;}\n.cedolino .scaglioni tr.tot-riga td{background:var(--ro); font-weight:700; border-bottom:none;}\n.cedolino .scaglioni td.valore{font-variant-numeric:tabular-nums; font-weight:700;}\n.cedolino .barra-conferma{display:flex; flex-wrap:wrap; align-items:center; gap:12px;}\n.cedolino .esito-conferma{font-size:12.5px; color:var(--muted);}\n.cedolino .esito-conferma.fatto{color:var(--bp); font-weight:600;}\n\n.cedolino .blocco-h .segno .cur{width:38px; height:34px; font-size:17px;}\n\n.cedolino .elenco-detrazioni{display:flex; flex-direction:column; gap:12px;}\n.cedolino .riga-detrazione{border:1px solid var(--line); border-radius:10px; overflow:hidden;}\n.cedolino .detr-testa{display:flex; align-items:center; gap:9px; padding:9px 10px 9px 12px; background:var(--surface);}\n.cedolino .detr-testa .voce{flex:1 1 auto;}\n.cedolino .detr-corpo:not(:empty){padding:12px; border-top:1px solid var(--line); background:var(--ro); display:flex; flex-direction:column; gap:12px;}\n.cedolino .detr-alto{display:flex; flex-wrap:wrap; gap:18px; align-items:flex-end;}\n.cedolino .detr-spiega{margin:0; font-size:13.5px; color:var(--muted); flex:1 1 340px; max-width:60ch;}\n/* Quando la frase sta SOPRA le caselle (IRPEF netta, netto in busta) non deve allungarsi:\n   in una colonna flessibile quei 340px diventavano altezza vuota (collaudo del 14/09). */\n.cedolino .blocco-b > .detr-spiega{flex:0 0 auto;}\n.cedolino .detr-riga{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end;}\n.cedolino .campo-fascia{flex:1 1 100%; min-width:0;}\n.cedolino .campo-fascia .voce .cur{min-height:38px;}\n.cedolino .campo-reddito .imp input{width:180px;}\n/* (25/09/2026) caselle che riempie l'app: si leggono ma non si scrivono */\n.cedolino .imp input.calcolato{background:var(--ro); font-weight:600; cursor:default;}\n.cedolino .imp input.calcolato:focus{outline:none; box-shadow:none; border-color:var(--line2);}\n.cedolino .imp input.calcolato::placeholder{color:var(--muted); font-weight:400; font-size:13px;}\n.cedolino .scaglioni td.mens .ampiezza{display:block; margin-top:2px; font-size:11.5px; font-style:italic; color:var(--muted); opacity:.85; white-space:nowrap;}\n/* il reddito annuo presunto: reddito fiscale × mensilita' = risultato dell'app */\n.cedolino .presunto{display:flex; flex-direction:column; gap:10px; margin-bottom:12px;}\n.cedolino .presunto .detr-spiega{flex:0 0 auto;}\n.cedolino .presunto-conto{display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px;}\n.cedolino .presunto .campo-fisc .imp input{width:170px;}\n.cedolino .presunto .campo-mens .imp input{width:96px; text-align:center;}\n.cedolino .presunto-ris{display:flex; align-items:flex-end; gap:10px; flex:1 1 220px;}\n.cedolino .presunto .campo-ris{flex:1 1 auto;}\n.cedolino .presunto-val{height:38px; display:flex; align-items:center; justify-content:flex-end; padding:0 14px;\n  border:1px solid var(--fascia-line); background:var(--fascia-bg); border-radius:9px;\n  font-family:var(--serif); font-size:19px; font-weight:600; color:var(--fascia); font-variant-numeric:tabular-nums;}\n\n.cedolino .detr-conto{border:1px solid var(--fascia-line); background:var(--surface); border-radius:9px; overflow:hidden;}\n.cedolino .detr-conto .cr{display:flex; flex-wrap:wrap; align-items:baseline; gap:12px; padding:9px 13px; border-bottom:1px solid var(--line); font-size:14px;}\n.cedolino .detr-conto .cr:last-child{border-bottom:none;}\n.cedolino .detr-conto .l{font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--muted); min-width:150px;}\n.cedolino .detr-conto .f{color:var(--fascia); font-variant-numeric:tabular-nums;}\n.cedolino .detr-conto .c{font-size:12.5px; color:var(--muted);}\n.cedolino .detr-conto .v{margin-left:auto; font-variant-numeric:tabular-nums; font-weight:700;}\n.cedolino .detr-conto .riga-magg[hidden]{display:none;}\n.cedolino .detr-conto .riga-magg .v{color:var(--fascia);}\n.cedolino .detr-conto .ultima{background:var(--fascia-bg);}\n.cedolino .detr-conto .ultima .l, .cedolino .detr-conto .ultima .v{color:var(--fascia);}\n.cedolino .detr-conto .ultima .v{font-family:var(--serif); font-size:19px;}\n\n.cedolino .calcolo-netta{display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px;}\n/* (25/09/2026) sopra le due caselle, «IRPEF lorda» e «Detrazioni» a conto giusto: il posto c'e' sempre,\n   cosi' quando la scritta compare non si sposta niente */\n.cedolino .netta-campo{display:flex; flex-direction:column; gap:4px;}\n.cedolino .netta-campo .etich{height:14px; line-height:14px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700;}\n.cedolino .imp-larga input{width:210px;}\n.cedolino .imp-larga input::placeholder{font-size:13.5px; letter-spacing:0;}\n.cedolino .risultato-netta{flex:1 1 180px; min-width:150px; display:flex; justify-content:flex-end; align-items:center;\n  border:1px solid var(--fascia-line); background:var(--fascia-bg); border-radius:9px; padding:0 14px; height:38px;\n  font-family:var(--serif); font-size:19px; font-weight:600; color:var(--fascia); font-variant-numeric:tabular-nums;}\n.cedolino .calcolo-netta .operatore{height:38px;}\n\n.cedolino .salta{display:flex; flex-wrap:wrap; align-items:center; gap:12px;}\n.cedolino .link-salta{border:none; background:transparent; color:var(--fascia); font-size:13px; text-decoration:underline; padding:0; text-align:left;}\n.cedolino .link-salta:hover{color:var(--bp);}\n.cedolino .link-salta.piccolo{font-size:12px; flex:none;}\n.cedolino .salta-campo[hidden]{display:none;}\n.cedolino .salta-campo input{width:180px;}\n.cedolino .detr-conto .imp-rata{margin-left:auto;}\n.cedolino .detr-conto .imp-rata[hidden]{display:none;}\n.cedolino .detr-conto .imp-rata input{width:150px; height:32px;}\n.cedolino .detr-conto .cr .v[hidden]{display:none;}\n.cedolino .detr-conto .cr .link-salta{flex:none;}\n\n.cedolino .menu{position:fixed; z-index:400; top:0; left:0; width:360px; max-width:calc(100vw - 24px); overflow-y:auto; overscroll-behavior:contain; background:var(--surface); border:1px solid var(--line2); border-radius:12px; box-shadow:0 14px 38px -14px rgba(0,0,0,.5); padding:6px;}\n.cedolino .menu[hidden]{display:none;}\n.cedolino .menu::-webkit-scrollbar{width:11px;}\n.cedolino .menu::-webkit-scrollbar-thumb{background:var(--line2); border-radius:99px; border:3px solid var(--surface);}\n.cedolino .menu .mh{padding:8px 10px 6px; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700;}\n.cedolino .menu button{display:block; width:100%; text-align:left; border:none; background:transparent; color:var(--ink); padding:9px 10px; border-radius:8px; font-size:14.5px;}\n.cedolino .menu button:hover{background:var(--ro);}\n.cedolino .menu button .d{display:block; font-size:12px; color:var(--muted);}\n.cedolino .menu button[disabled]{opacity:.45; cursor:default;}\n.cedolino .menu button[disabled]:hover{background:transparent;}\n\n.cedolino .piu{align-self:flex-start; display:inline-flex; align-items:center; gap:7px; border:1px solid var(--bp-line); background:var(--bp-bg); color:var(--bp); border-radius:9px; padding:6px 13px; font-weight:600; font-size:13.5px;}\n.cedolino .piu:hover{background:var(--surface);}\n.cedolino .ins{align-self:flex-start; display:inline-flex; align-items:center; gap:7px; border:1px solid var(--bp-line); background:var(--bp-bg); color:var(--bp); border-radius:10px; padding:11px 18px; font-weight:600; font-size:15px;}\n.cedolino .ins:hover{background:var(--surface);}\n.cedolino .mwrap{position:relative;}\n\n.cedolino .btn{border:1px solid var(--line2); background:var(--surface); color:var(--ink); border-radius:9px; padding:9px 16px; font-size:14.5px;}\n.cedolino .btn.p{background:var(--bp); border-color:var(--bp); color:#fff; font-weight:600;}\n.cedolino .btn[disabled]{opacity:.45; cursor:not-allowed;}\n\n.cedolino .chiusura{display:flex; flex-wrap:wrap; gap:14px; align-items:center; border-top:1px solid var(--line); padding-top:14px;}\n.cedolino .somma{font-family:var(--serif); font-size:22px; font-weight:600;}\n.cedolino .somma .v{color:var(--bp); font-variant-numeric:tabular-nums;}\n.cedolino .somma .l{display:block; font-family:var(--sans); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700;}\n.cedolino .chiusura .sp{margin-left:auto; display:flex; gap:9px;}\n.cedolino .chiusura .somma{display:none;} /* via il «Totale del foglio» (collaudo 14/09): nascosto anche nelle fotografie salvate prima */\n.cedolino .mini{font-size:12.5px; color:var(--muted);}\n.cedolino .pillw{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; border-radius:99px; padding:3px 10px; border:1px solid var(--warn-line); background:var(--warn-bg); color:var(--warn-ink);}\n\n@media (max-width:1000px){\n  .cedolino .riga-contributi{grid-template-columns:auto 1fr; row-gap:10px;}\n  .cedolino .riga-contributi .campo{grid-column:2/3;}\n  .cedolino .campo .imp input, .cedolino .campo-ali .imp input, .cedolino .campo-tot .imp input{width:100%;}\n  .cedolino .riga-contributi .operatore{display:none;}\n  .cedolino .riga-contributi .ic{grid-column:2/3; justify-self:end;}\n  .cedolino .campo-reddito, .cedolino .campo-reddito .imp input{width:100%;}\n  .cedolino .presunto .campo-fisc{flex:1 1 130px; min-width:0;}\n  .cedolino .presunto .campo-mens{flex:0 0 88px;}\n  .cedolino .presunto .campo-fisc .imp input, .cedolino .presunto .campo-mens .imp input{width:100%;}\n  .cedolino .presunto-ris{flex:1 1 100%;}\n  .cedolino .calcolo-netta{flex-direction:column; align-items:stretch;}\n  /* in colonna i 180px di base diventavano ALTEZZA: il risultato era un quadrato enorme (25/09/2026) */\n  .cedolino .risultato-netta{flex:0 0 auto;}\n  .cedolino .imp-larga input{width:100%;}\n  .cedolino .calcolo-netta .operatore{display:none;}\n  .cedolino .detr-alto{gap:12px;}\n  .cedolino .detr-conto .l{min-width:0;}\n}\n@media (max-width:660px){\n  .cedolino .riga{grid-template-columns:auto 1fr auto; row-gap:7px;}\n  .cedolino .riga .imp{grid-column:2/3;}\n  .cedolino .riga .ic{grid-column:3/4; grid-row:2;}\n  .cedolino .imp input{width:100%;}\n  .cedolino .menu{min-width:min(86vw,320px);}\n}\n\n/* Modalita' soluzione / sola lettura: via i comandi, restano i numeri. */\n#editor.sol-mode .cedolino .ic,\n#editor.sol-mode .cedolino .piu,\n#editor.sol-mode .cedolino .mwrap-root,\n#editor.sol-mode .cedolino .barra-conferma,\n#editor.sol-mode .cedolino .link-salta,\n#editor.sol-mode .cedolino .chiusura .sp,\n#editor.sol-mode .cedolino .mini,\n#editor.sol-mode .cedolino .avviso-segni,\n#editor.sol-mode .cedolino .vuoto{display:none !important;}\n#editor.sol-mode .cedolino .segno .cur,\n#editor.sol-mode .cedolino .voce .cur{pointer-events:none;}\n#editor.sol-mode .cedolino .segno .cur.manca{a
