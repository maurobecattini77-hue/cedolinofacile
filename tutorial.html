ettato così com'è. */\n  function titoloDaArchivio(fx){\n    var num = numeroDaArchivio(fx), tit = (fx && fx.titolo) ? String(fx.titolo) : '';\n    if(!tit || /^\\s*Esercizio\\s+n\\.?\\s*\\d+\\s*$/i.test(tit)) return 'Esercizio n. ' + num;\n    return tit;\n  }\n  function adattaArchivio(j){ return (j.fatture||[]).map(adattaFattura); }\n  function buildRubrica(){\n    var seen = {}; RUBRICA = [];\n    var seenP = {}; LISTINO = [];\n    FATTURE.forEach(function(f){\n      ['venditore','cliente'].forEach(function(k){\n        var a = f.testo && f.testo[k]; if(!a || !a.rs) return;\n        var key = (a.piva||a.rs).toLowerCase(); if(seen[key]) return; seen[key] = 1;\n        RUBRICA.push({ nome:a.rs, indirizzo:a.ind, cap:a.cap, comune:a.com, prov:a.prov, piva:a.piva, cf:a.cf, pec:a.pec||'' });\n      });\n      ((f.testo && f.testo.articoli) || []).forEach(function(a){\n        var pk = (a.cod || a.desc || '').toLowerCase(); if(!pk || seenP[pk]) return; seenP[pk] = 1;\n        LISTINO.push({ cod:a.cod||'', desc:a.desc||'', iva:a.iva||'' });\n      });\n    });\n  }\n  function leggiFile(inputEl, onJson){\n    var f = inputEl.files && inputEl.files[0]; if(!f) return;\n    var rd = new FileReader();\n    rd.onload = function(){ try{ onJson(JSON.parse(rd.result)); }catch(e){ showAlert('File JSON non valido: ' + e.message); } };\n    rd.readAsText(f); inputEl.value = '';\n  }\n\n  /* ---------- Router viste ---------- */\n  /* VELO SOPRA IL FOGLIO mentre si recupera il lavoro dal cloud (19/09/2026). Ferma i tocchi da subito, ma si\n     FA VEDERE solo dopo mezzo secondo: con la rete buona l'alunno non se ne accorge nemmeno. Niente pulsanti e\n     niente semafori: una frase sola, che cambia se il collegamento e' debole. velaRecupero(false) lo toglie. */\n  function velaRecupero(stato){\n    var v = byId('vela-recupero');\n    if(!stato){ if(v && v.parentNode) v.parentNode.removeChild(v); return; }\n    if(!v){\n      v = document.createElement('div'); v.id = 'vela-recupero';\n      v.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:9000;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;background:rgba(246,248,246,0);transition:background .3s ease .5s;';\n      var t = document.createElement('div'); t.id = 'vela-recupero-testo';\n      t.style.cssText = 'max-width:440px;font-weight:600;font-size:17px;line-height:1.45;color:#2f4f3f;opacity:0;transition:opacity .3s ease .5s;';\n      v.appendChild(t);\n      document.body.appendChild(v);\n      setTimeout(function(){ v.style.background = 'rgba(246,248,246,.93)'; t.style.opacity = '1'; }, 30);\n    }\n    var testo = byId('vela-recupero-testo');\n    if(testo) testo.textContent = (stato === 'muto')\n      ? 'Non riesco a recuperare il tuo lavoro: il collegamento non risponde. Il tuo lavoro è al sicuro. Dillo al prof: io intanto continuo a provare.'\n      : (stato === 'debole' ? 'Il collegamento è debole: sto recuperando il tuo lavoro…' : 'Apro il tuo lavoro…');\n  }\n  function show(id){\n    ['gate','docente','attesa','blocco','menu-fatture','editor','cortesia-view','soluzione-view','valuta-view'].forEach(function(x){ byId(x).style.display = (x===id) ? '' : 'none'; });\n    if(id !== 'editor') velaRecupero(false);   // il velo «Apro il tuo lavoro…» vive solo sopra il foglio\n    var vb = byId('verifica-bar'); if(vb) vb.style.display = (id==='editor') ? '' : 'none';\n    var tb = document.querySelector('.topbar'); if(tb) tb.style.display = (id==='gate') ? 'none' : '';\n    var et = byId('btn-esci-top'); if(et) et.style.display = (id==='docente') ? '' : 'none'; // «Esci» in alto solo nella dashboard docente\n    if(id==='editor'){ document.querySelectorAll('#editor textarea').forEach(function(t){ autogrow(t); }); }\n    window.scrollTo(0, 0);\n  }\n  function goGate(){\n    STATE.pinIngresso = null;   // chi esce non lascia il suo PIN in giro per la prossima richiesta degli esercizi\n    // «Esci» mette al sicuro l'ULTIMO tasto prima di chiudere la sessione: senza questo, l'ultima modifica\n    // ancora nel debounce andava persa (le altre uscite — «Torna ai compiti», «Le mie fatture» — già salvavano).\n    // (19/09/2026) e la manda SUBITO anche al cloud: l'invio ritardato non partiva piu', perche' un attimo dopo\n    // qui sotto l'alunno non c'e' piu'. Conta per chi esce da un dispositivo e rientra da un altro.\n    mettiAlSicuroLavoro();\n    STATE.recuperoGiro = (STATE.recuperoGiro || 0) + 1; STATE.caricamentoFoglio = false;   // nessun recupero in sospeso sopravvive all'uscita\n    STATE.avviatoPin = null; STATE.avvioInCorsoDa = 0; STATE.avvioGiro = (STATE.avvioGiro || 0) + 1;\n    stopAttesaWatcher(); stopPresenza(); stopCollegatiTimer(); stopBloccoWatcher(); stopConsegnaWatcher(); stopAssegnazioneWatcher(); stopSessioneWatcher(); stopCompitiWatcher(); STATE.riammesso = false; STATE.modalitaCompiti = false; STATE.esercitazione = false; STATE.solExitFn = null; STATE.ritornoFn = null; STATE.compitiGiro = (STATE.compitiGiro || 0) + 1;\n    // «Esci»: cancello la presenza SOLO se ero il proprietario. Un dispositivo respinto che preme «Esci»\n    // non deve far sparire dalla dashboard l'alunno vero, che sta lavorando.\n    if(STATE.studente){ cloudClearPresenzaSeMia(STATE.studente.pin); STATE.studente = null; }\n    STATE.proprietario = false;\n    var eraDocente = false;\n    try{ eraDocente = (sessionStorage.getItem('cf_docente_attivo') === '1'); }catch(e){}\n    try{ sessionStorage.removeItem('cf_studente_attivo'); sessionStorage.removeItem('cf_docente_attivo'); sessionStorage.removeItem('cf_sess'); }catch(e){}\n    // Esce dal riconoscimento SOLO se chi sta uscendo e' il docente: un alunno che apre la pagina o preme\n    // «Esci» sullo stesso computer non deve scollegare la dashboard.\n    if(eraDocente){ try{ if(SB && SB.auth) SB.auth.signOut(); }catch(e){} }\n    byId('gate-doc').style.display = 'none'; byId('gate-pin').style.display = '';\n    byId('in-pin').value = ''; byId('in-pass').value = '';\n    byId('err-alunno').textContent = ''; byId('err-docente').textContent = '';\n    byId('topbar-info').innerHTML = '';\n    ingressoLibera();   // di nuovo sulla schermata del PIN: il pulsante «Entra» torna a funzionare\n    show('gate');\n  }\n\n  /* ---------- Area docente ---------- */\n  function nomeFattura(f){ return f.titolo + ((f.difficolta != null && f.difficolta !== '') ? (' · difficoltà ' + f.difficolta) : ''); }\n  function livelloLabel(d){ var m={'1':'Elementare','2':'Facile','3':'Medio','4':'Difficile','5':'Molto difficile'}; return m[String(d)] || ('Liv. '+d); }\n  function fattureRaggruppate(){\n    var byLiv = {};\n    // (24/09/2026) le VERIFICHE stanno in cima, in un gruppo a parte («Verifiche»): gli alunni non le vedono mai\n    // nei compiti, compaiono solo quando il docente le assegna.\n    var verifiche = FATTURE.filter(function(f){ return f.verifica; });\n    FATTURE.forEach(function(f){ if(f.verifica) return; var d = (f.difficolta!=null ? String(f.difficolta) : '?'); (byLiv[d] = byLiv[d] || []).push(f); });\n    var gruppi = Object.keys(byLiv).sort(function(a,b){ return (a==='?'?99:+a) - (b==='?'?99:+b); }).map(function(d){\n      var nome = (byLiv[d][0] && byLiv[d][0].difficoltaNome) ? byLiv[d][0].difficoltaNome : livelloLabel(d);\n      return { label:(d==='?' ? 'Senza livello' : (d + ' · ' + nome)), items:byLiv[d] };\n    });\n    if(verifiche.length) gruppi.unshift({ label:'Verifiche', items:verifiche });\n    return gruppi;\n  }\n  function fillFattureSelect(sel, selectedId, emptyLabel){\n    sel.innerHTML = '';\n    if(emptyLabel){ var oc = document.createElement('option'); oc.value = ''; oc.textContent = emptyLabel; sel.appendChild(oc); }\n    else if(!FATTURE.length){ var o0 = document.createElement('option'); o0.value = ''; o0.textContent = '— nessuna esercitazione —'; sel.appendChild(o0); }\n    fattureRaggruppate().forEach(function(g){\n      var og = document.createElement('optgroup'); og.label = g.label;\n      g.items.forEach(function(f){ var o = document.createElement('option'); o.value = f.id; o.textContent = f.titolo; og.appendChild(o); });\n      sel.appendChild(og);\n    });\n    sel.value = selectedId || '';\n  }\n  function statoAlunno(pin){\n    var s = CLOUD_STUD[pin];\n    if(!s) return { cls:'st-off', txt:'Non collegato', done:false, on:false, corso:false, block:false };\n    var stato = s.stato || 'non_iniziato';\n    if(stato === 'da_consegnare') return { cls:'st-on', txt:'In consegna…', done:false, on:true, corso:true, block:false };\n    var assigned = effectiveAssignedList(pin);\n    var multiplo = assigned.length > 1;\n    var deliv = deliveredList(pin, assigned);\n    // \"Consegnato\" pieno: se multiplo → tutte le assegnate consegnate OPPURE lo stato autorevole del cloud\n    // dice \"consegnato/consegnata\" (l'alunno lo mette solo dopo aver consegnato TUTTE): così non resta\n    // \"Consegnato 2\" per un semplice ritardo di rilettura del terzo tentativo. Se singolo → come prima.\n    // Rete di sicurezza (ORA anche per la fattura singola): se il lavoro risulta comunque arrivato in ced_tentativi\n    // (deliv), è \"Consegnato\" anche se il 2° salvataggio (stato su ced_studenti) è fallito per un intoppo di rete.\n    var allDone = (stato === 'consegnato' || s.consegnata || (assigned.length > 0 && deliv.length >= assigned.length));\n    // Ha consegnato MA risulta 'bloccato' (sta \"bussando\" dopo la consegna): resta \"Consegnato\",\n    // ma offro lo SBLOCCO (toglie il blocco SENZA riaprire il lavoro). Dopo lo sblocco torna \"Consegnato\" + Riammetti.\n    if(allDone && stato === 'bloccato') return { cls:'st-done', txt:'Consegnato', done:true, on:false, corso:false, block:true };\n    if(allDone) return { cls:'st-done', txt:'Consegnato', done:true, on:false, corso:false, block:false };\n    var recent = attaccatoAllApp(s);\n    // «Bloccato» (con lo «Sblocca») SOLO se l'alunno NON e' collegato e un altro dispositivo ha bussato col suo\n    // PIN. Se e' collegato non c'e' niente da sbloccare: resta «In corso» con la sola «Consegna», e chi ha\n    // bussato resta fuori senza che il docente debba saperne niente (regola di Mauro, 19/09/2026).\n    if(stato === 'bloccato' && !recent){\n      return { cls:'st-block', txt:'Bloccato', done:false, on:false, corso:false, block:true };\n    }\n    // Segnato ASSENTE dal docente: lo dico al posto di «Non collegato», che qui sarebbe un'informazione inutile\n    // (certo che non è collegato: non c'è). Sta DOPO «Consegnato»: chi ha consegnato resta consegnato, anche se\n    // poi lo segni assente per sbaglio. Non conta fra i «Collegati» (on:false).\n    if(s.assente) return { cls:'st-assente', txt:(s.motivo_assenza === 'no_verifica' ? 'No verifica' : 'Assente'), done:false, on:false, corso:false, block:false, assente:true };\n    // Consegna PARZIALE (più fatture, alcune consegnate ma non tutte): mostra quali, in ordine numerico.\n    if(multiplo && deliv.length > 0){\n      return { cls:'st-part', txt:'Consegnato ' + descriviAssegnazioneBreve(deliv), done:false, on:recent, corso:recent, block:false, part:true };\n    }\n    // «In corso» appena e' dentro con un esercizio suo: non aspetto che il battito abbia scritto QUALE.\n    // (18/09: alunni che lavoravano col cedolino davanti e in dashboard risultavano solo «Collegato».)\n    // (29/09/2026, regola di Mauro) Senza un cedolino assegnato l'alunno e' nei COMPITI, e chi fa i compiti per il\n    // docente non e' collegato: niente piu' «Collegato» (e quindi niente «Consegna» su chi non ha niente da consegnare).\n    if(recent && assigned.length){ return { cls:'st-on', txt:'In corso', done:false, on:true, corso:true, block:false }; }\n    return { cls:'st-off', txt:'Non collegato', done:false, on:false, corso:false, block:false };\n  }\n  /* UN OROLOGIO SOLO (Mauro, 19/09/2026): «collegato» = l'app ha parlato col cloud negli ultimi 20 secondi\n     (erano 30: li ha voluti abbassare lui lo stesso giorno, dopo averlo provato).\n     E' la STESSA misura che usa il cloud (cf_e_attivo) per decidere se chi bussa con quel PIN va respinto in\n     silenzio o fa comparire lo «Sblocca»: quello che la dashboard mostra e quello che il cloud decide non\n     possono piu' divergere. Tenerle SEMPRE uguali. L'app batte ogni 5 secondi; se viene chiusa lo dice subito\n     (cf_esci) e la riga si spegne al primo aggiornamento; se non fa in tempo a dirlo, si spegne entro 20 secondi.\n     L'eta' del segnale si misura sull'ora del CLOUD (cf_ora), non sull'orologio di questo computer. */\n  var COLLEGATO_MS = 20000;\n  var SCARTO_ORA_CLOUD = 0;   // ora del cloud meno ora di questo computer, in millisecondi\n  function allineaOraCloud(){\n    if(!SB) return;\n    var t0 = Date.now();\n    try{ SB.rpc('cf_ora').then(function(r){\n      if(!r || r.error || !r.data) return;\n      var t1 = Date.now(), srv = new Date(r.data).getTime();\n      if(isFinite(srv) && (t1 - t0) \u003c 4000) SCARTO_ORA_CLOUD = srv - (t0 + t1) / 2;\n    }, function(){}); }catch(e){}\n  }\n  function attaccatoAllApp(s){\n    if(!s || !s.ultimo_accesso) return false;\n    return (Date.now() + SCARTO_ORA_CLOUD - new Date(s.ultimo_accesso).getTime()) \u003c COLLEGATO_MS;\n  }\n  // Quale azione mostrare nella colonna \"Azioni\" per un alunno:\n  //   collegato → solo «Consegna»; non collegato e qualcuno ha bussato col suo PIN → «Sblocca»;\n  //   consegnato → «Riammetti»; altrimenti niente.\n  function wantAz(st){ return st.block ? 'sblocca' : (st.done ? 'riammetti' : ((st.on || st.part) ? 'consegna' : 'none')); }\n  function buildAzButton(want, a){ return buildAzButtonUno(want, a); }\n  function buildAzButtonUno(want, a){\n    if(want === 'none') return null;\n    var b = document.createElement('button');\n    if(want === 'sblocca'){\n      b.className = 'btn-sblocca'; b.textContent = '🔓 Sblocca';\n      b.addEventListener('click', function(){\n        var giaCons = !!(CLOUD_STUD[a.pin] && CLOUD_STUD[a.pin].consegnata);\n        cloudRiammetti(a.pin, false);\n        showAlert(a.cognome + ' ' + a.nome + (giaCons\n          ? ' è stato sbloccato: vedrà \"Verifica consegnata\" e la consegna resta. Usa \"Riammetti\" se vuoi farle rifare la verifica.'\n          : ' è stato sbloccato: può rientrare e riprendere da dove aveva lasciato.'));\n        refreshCloudStud(function(){ refreshConsegne(renderDocente); });\n      });\n    } else if(want === 'riammetti'){\n      b.className = 'btn-riammetti'; b.textContent = 'Riammetti';\n      b.addEventListener('click', function(){ cloudRiammetti(a.pin, true); showAlert(a.cognome + ' ' + a.nome + ' è stato riammesso: i suoi cedolini tornano da consegnare (ritrova il suo lavoro) e potrà riconsegnarli.'); refreshCloudStud(function(){ refreshConsegne(renderDocente); }); });\n    } else if(want === 'consegna'){\n      b.className = 'btn-consegna-uno'; b.innerHTML = '\u003csvg viewBox=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-right:5px;\">\u003cpath d=\"M22 2 11 13\"/>\u003cpath d=\"m22 2-7 20-4-9-9-4z\"/>\u003c/svg>Consegna';\n      b.addEventListener('click', function(){ showConfirm('Consegnare ORA la verifica di ' + a.cognome + ' ' + a.nome + '? Viene salvato il lavoro fatto finora (come se consegnasse lui). Solo un cedolino mai aperto risulterà «non svolto».', function(){ forzaConsegna(a.pin); refreshCloudStud(function(){ refreshConsegne(renderDocente); }); showAlert('Consegna in corso per ' + a.cognome + ' ' + a.nome + ': attendi qualche secondo che il dispositivo salvi il lavoro.'); }); });\n    }\n    return b;\n  }\n  // Colonna VOTO: pastiglia colorata centrata (verde se sufficiente, ambra se no), '—' se non valutato.\n  function buildVotoCell(a){\n    var td = document.createElement('td'); td.className = 'voto-cell'; td.style.textAlign = 'center';\n    var val = (CLOUD_STUD[a.pin] || {}).valutazione;\n    if(val && val.voto_finale){\n      var suff = (val.perc != null && val.perc >= 59.1); // sufficiente = voto >= 6\n      var wrap = document.createElement('div'); wrap.style.cssText = 'display:inline-flex; flex-direction:column; align-items:center; gap:3px;';\n      var sp = document.createElement('span'); sp.textContent = val.voto_finale;\n      sp.style.cssText = 'display:inline-block; border-radius:20px; padding:3px 13px; font-size:14px; font-weight:600; ' + (suff ? 'background:#eaf3de; color:#3b6d11;' : 'background:#faeeda; color:#854f0b;');\n      wrap.appendChild(sp);\n      // Indicatore a colpo d'occhio: voto pubblicato (visibile all'alunno) o ancora da pubblicare.\n      // È anche un INTERRUTTORE (Mauro, 17/07): un clic accende o spegne la pubblicazione di QUESTO alunno.\n      // Serve quando hai pubblicato ma vuoi rivedere la valutazione con calma: lo spegni, il voto sparisce\n      // all'alunno, e lo riaccendi quando sei convinto. Senza, per rimetterne su uno solo dovresti\n      // ripubblicare tutta la classe.\n      var badge = document.createElement('span');\n      badge.style.cursor = 'pointer';\n      if(val.pubblicata){ badge.textContent = '✓ pubblicato'; badge.style.cssText += 'font-size:10px; font-weight:700; color:#3b6d11; white-space:nowrap; text-decoration:none;'; badge.title = 'L\\'alunno lo vede entrando col PIN. Clicca per NASCONDERGLIELO.'; }\n      else { badge.textContent = '• da pubblicare'; badge.style.cssText += 'font-size:10px; font-weight:600; color:#a9772b; white-space:nowrap;'; badge.title = 'L\\'alunno NON lo vede. Clicca per pubblicarlo solo a lui.'; }\n      badge.addEventListener('click', function(){ chiediPubblicazione(a, !!val.pubblicata); });\n      wrap.appendChild(badge);\n      td.appendChild(wrap);\n    } else { var d = document.createElement('span'); d.textContent = '—'; d.style.color = '#b4b2a9'; td.appendChild(d); }\n    return td;\n  }\n  // Colonna VALUTA: piccolo link centrato che apre la scheda di valutazione (anche per rivedere/cambiare).\n  // SI VALUTA SOLO A VERIFICA CONSEGNATA (regola di Mauro, 17/07). Prima il link c'era sempre: si poteva\n  // mettere un voto a uno che stava ancora scrivendo, o che aveva consegnato 1 fattura su 3 — un voto dato\n  // su un lavoro a metà, senza accorgersene. Vale la consegna PIENA, sua o forzata dal docente (st.done);\n  // la consegna parziale («Consegnato 2 di 3») NON basta.\n  // ECCEZIONE: se un voto c'è già, il link resta sempre. Quello non è valutare un compito in corso, è\n  // correggere il proprio lavoro — e Mauro deve poterlo fare quando vuole, anche dopo un «Riammetti».\n  function buildValutaCell(a){\n    var td = document.createElement('td'); td.className = 'valuta-cell'; td.style.textAlign = 'center';\n    var st = statoAlunno(a.pin);\n    // (27/09/2026, regola di Mauro) si valuta SOLO un lavoro consegnato: chi e' stato riammesso torna valutabile\n    // quando riconsegna (il voto gia' dato resta nella colonna Voto, col suo interruttore della pubblicazione)\n    if(!st.done){\n      var d = document.createElement('span'); d.textContent = '—'; d.style.color = '#b4b2a9';\n      d.title = st.assente ? 'Assente: niente da valutare.' : 'Si valuta solo a verifica consegnata (tutti i cedolini assegnati).';\n      td.appendChild(d); return td;\n    }\n    var lnk = document.createElement('span'); lnk.className = 'lnk-valuta'; lnk.textContent = 'Valuta';\n    lnk.addEventListener('click', function(){ apriValutazione(a); });\n    td.appendChild(lnk); return td;\n  }\n  /* ---------- MULTI-CLASSE: elenco classi dal cloud + classe attiva ---------- */\n  var CLASSES = [];\n  // CLASSI PERMANENTI (17/09/2026, deciso da Mauro). Nella tendina ci sono SEMPRE tutte le classi che\n  // stanno nel cloud: si caricano a settembre e restano lì tutto l'anno. Prima le classi «in compiti a casa»\n  // venivano nascoste, e il Reset ce le mandava: risultato, la classe spariva dalla dashboard e non c'era\n  // più modo di ritrovarla né di cancellarla. Una classe se ne va solo quando la si elimina davvero.\n  function buildClassiDaCloud(){\n    var m = {};\n    Object.keys(CLOUD_STUD || {}).forEach(function(pin){\n      var s = CLOUD_STUD[pin]; var c = (s && s.classe) ? s.classe : '';\n      if(!c) return;\n      if(!m[c]) m[c] = { classe:c, alunni:[] };\n      m[c].alunni.push({ pin:s.pin, nome:s.nome||'', cognome:s.cognome||'' });\n    });\n    CLASSES = Object.keys(m).sort(function(a, b){ return a.localeCompare(b, 'it'); }).map(function(c){\n      m[c].alunni.sort(function(a, b){ return profInCima(a,b) || ((a.cognome||'') + ' ' + (a.nome||'')).localeCompare((b.cognome||'') + ' ' + (b.nome||''), 'it'); });\n      return m[c];\n    });\n    return CLASSES;\n  }\n  function setClasseAttiva(nome){\n    var c = CLASSES.find(function(x){ return x.classe === nome; });\n    if(c){ CLASSE = c; STATE.classeAttiva = nome; try{ localStorage.setItem('cf_classe', JSON.stringify(c)); }catch(e){} renderDocente(); }\n  }\n  // Conferma dell'interruttore di pubblicazione. NOMINA l'alunno e dice cosa vedrà lui: è l'unico modo di\n  // accorgersi di un clic finito sulla riga sbagliata prima che l'alunno se ne accorga da casa.\n  function chiediPubblicazione(a, eraPubblicata){\n    var nome = ((a.cognome || '') + ' ' + (a.nome || '')).trim();\n    var v = (CLOUD_STUD[a.pin] || {}).valutazione || {};\n    var voto = v.voto_finale || '';\n    var msg = eraPubblicata\n      ? ('Nascondere il voto di ' + nome + '?\\n\\nIl voto ' + voto + ' resta salvato qui e tu puoi modificarlo, ma entrando col PIN non lo vedrà più.\\n\\nPuoi ripubblicarlo quando vuoi.')\n      : ('Pubblicare il voto di ' + nome + '?\\n\\nSolo questo alunno: entrando col PIN vedrà il voto ' + voto + ' e il suo lavoro corretto. Gli altri della classe non sono toccati.');\n    showConfirm(msg, function(){\n      cloudSetPubblicata(a.pin, !eraPubblicata, function(ok, err){\n        if(!ok){\n          showAlert('Non sono riuscito a ' + (eraPubblicata ? 'nascondere' : 'pubblicare') + ' il voto di ' + nome + ': ' + (err || 'il cloud non ha risposto') + '.\\n\\nNon è cambiato niente: per l\\'alunno è come prima. Controlla il collegamento e riprova.');\n          return;\n        }\n        renderDocente();\n        showAlert(eraPubblicata\n          ? ('Voto di ' + nome + ' nascosto. Se entra col PIN non lo vede più. Il voto è ancora qui: puoi cambiarlo e ripubblicarlo quando vuoi.')\n          : ('Voto di ' + nome + ' pubblicato: entrando col PIN vede il voto ' + voto + ' e il suo lavoro corretto.'));\n      });\n    });\n  }\n  // Conferma dell'appello. Il messaggio NOMINA l'alunno: un clic distratto sulla riga sbagliata deve essere\n  // fermato qui, non scoperto a verifica finita. Se sta lavorando adesso glielo dico, e decide lui.\n  // (24/09/2026) APPELLO a tre voci, voluto da Mauro: «Assente» o «No verifica» (presente, ma oggi la verifica non la\n  // fa). Per l'alunno e' la stessa cosa: se entra vede i compiti. La differenza e' solo un promemoria per il docente.\n  function chiediAssente(a, eraAssente){\n    var nome = ((a.cognome || '') + ' ' + (a.nome || '')).trim();\n    var st = statoAlunno(a.pin);\n    var motivoOra = ((CLOUD_STUD[a.pin] || {}).motivo_assenza) || null;\n    var testo = eraAssente\n      ? (nome + ' ora risulta «' + (motivoOra === 'no_verifica' ? 'No verifica' : 'Assente') + '». Se lo rimetti presente, torna a vedere il cedolino assegnato come tutti gli altri.')\n      : ('Come segno ' + nome + '? Assente o No verifica: se entra col suo PIN vede i compiti, non il cedolino assegnato. «No verifica» vuol dire presente ma oggi non la fa: è solo un promemoria per te.');\n    if(!eraAssente && (st.corso || st.on)) testo = 'Attenzione: ' + nome + ' sta lavorando ADESSO. Il lavoro fatto finora resta salvo e lo ritrova quando lo rimetti presente.\\n\\n' + testo;\n    var ov = document.createElement('div'); ov.className = 'modal-overlay';\n    ov.innerHTML = '\u003cdiv class=\"modal-card\" style=\"max-width:520px;\">'\n      + '\u003cdiv class=\"prev-title\" style=\"padding:18px 26px 4px; font-weight:800; font-size:16px; color:#3f6b52;\">Appello\u003c/div>'\n      + '\u003cdiv class=\"modal-body\" style=\"padding:6px 26px 4px; font-size:15px; line-height:1.5; white-space:pre-line;\">\u003c/div>'\n      + '\u003cdiv class=\"modal-actions\">\u003c/div>\u003c/div>';\n    ov.querySelector('.modal-body').textContent = testo;\n    var act = ov.querySelector('.modal-actions');\n    var bottone = function(label, cls, fn){ var b = document.createElement('button'); b.type = 'button'; b.className = 'modal-btn ' + cls; b.textContent = label; b.addEventListener('click', function(){ closeModal(ov); if(fn) fn(); }); act.appendChild(b); };\n    var segna = function(on, motivo){\n      cloudSetAssente(a.pin, on, function(ok, err){\n        if(!ok){\n          showAlert('Non sono riuscito a segnare ' + nome + ': ' + (err || 'il cloud non ha risposto') + '.\\n\\nNon è cambiato niente. Controlla il collegamento e riprova.');\n          return;\n        }\n        refreshCloudStud(function(){ refreshConsegne(renderDocente); });\n      }, motivo);\n    };\n    bottone('Annulla', 'modal-btn-cancel', null);\n    if(eraAssente){\n      bottone(motivoOra === 'no_verifica' ? 'Assente' : 'No verifica', 'modal-btn-cancel', function(){ segna(true, motivoOra === 'no_verifica' ? null : 'no_verifica'); });\n      bottone('Presente', 'modal-btn-ok', function(){ segna(false, null); });\n    } else {\n      bottone('No verifica', 'modal-btn-ok', function(){ segna(true, 'no_verifica'); });\n      bottone('Assente', 'modal-btn-ok', function(){ segna(true, null); });\n    }\n    document.body.appendChild(ov);\n  }\n  // Il pulsante dice sempre cosa succede al prossimo clic: «Sospendi» se la verifica è aperta, «Riprendi» se\n  // è chiusa. Senza classe caricata non ha niente da sospendere e sparisce.\n  function renderSospendi(){\n    var b = byId('btn-sospendi'), t = byId('btn-sospendi-txt'); if(!b || !t) return;\n    var cl = (CLASSE && CLASSE.classe) ? CLASSE.classe : null;\n    if(!cl){ b.style.display = 'none'; return; }\n    b.style.display = '';\n    var sosp = classeSospesa(cl);\n    t.textContent = sosp ? 'Riprendi' : 'Sospendi';\n    b.classList.toggle('ripr', sosp);\n    b.title = sosp\n      ? ('Riapri la verifica di ' + cl + ': gli alunni potranno rientrare dove l\\'avevano lasciata.')\n      : ('Chiudi la verifica di ' + cl + ': gli alunni passano ai compiti, il lavoro resta salvo.');\n  }\n  // Interruttore VERIFICA / ESERCITAZIONE della classe (come nella dashboard verifiche): la scritta dice la\n  // modalità in cui la classe si trova ADESSO; il lucchetto chiuso è la verifica, aperto l'esercitazione.\n  function renderEsercitazione(){\n    var b = byId('btn-eserc'), t = byId('btn-eserc-txt'), arco = byId('btn-eserc-arco'); if(!b || !t) return;\n    var cl = (CLASSE && CLASSE.classe) ? CLASSE.classe : null;\n    if(!cl){ b.style.display = 'none'; return; }\n    b.style.display = '';\n    var on = classeInEsercitazione(cl);\n    t.textContent = on ? 'Esercitazione' : 'Verifica';\n    b.classList.toggle('on', on);\n    if(arco) arco.setAttribute('d', on ? 'M8 11V7a4 4 0 0 1 7.5-2' : 'M8 11V7a4 4 0 0 1 8 0v4');\n    b.title = on\n      ? ('La classe ' + cl + ' è in ESERCITAZIONE: nessun blocco sul PIN, si entra e si rientra da qualunque dispositivo. Clic per tornare in verifica.')\n      : ('La classe ' + cl + ' è in VERIFICA: chi rientra col PIN viene bloccato finché non lo sblocchi. Clic per passare in esercitazione.');\n  }\n  function renderSelClasse(){\n    var sel = byId('sel-classe'); if(!sel) return;\n    if(CLASSES.length \u003c 2){ sel.style.display = 'none'; sel.innerHTML = ''; return; }\n    sel.style.display = '';\n    sel.innerHTML = CLASSES.map(function(c){ return '\u003coption value=\"' + esc(c.classe) + '\">Classe ' + esc(c.classe) + ' · ' + c.alunni.length + ' alunni\u003c/option>'; }).join('');\n    sel.value = (CLASSE && CLASSE.classe) || CLASSES[0].classe;\n    sel.onchange = function(){ setClasseAttiva(sel.value); };\n  }\n  function renderDocente(){\n    // Aggiorna l'elenco classi dal cloud e assicura una \"classe attiva\" coerente.\n    buildClassiDaCloud();\n    if(CLASSES.length){\n      var cur = CLASSE && CLASSES.find(function(x){ return x.classe === CLASSE.classe; });\n      if(cur){ CLASSE = cur; STATE.classeAttiva = cur.classe; }\n      else {\n        var pref = STATE.classeAttiva || (CLASSE && CLASSE.classe);\n        var chosen = CLASSES.find(function(x){ return x.classe === pref; }) || CLASSES[0];\n        CLASSE = chosen; STATE.classeAttiva = chosen.classe;\n      }\n    } else if(STATE.cloudStudCaricato){\n      // Nessuna classe attiva (tutte in compiti o nessuna caricata): dashboard pulita.\n      // SOLO se il cloud ha DAVVERO risposto: prima questo ramo scattava anche al primo disegno della\n      // dashboard (quando i dati non erano ancora arrivati) o con la rete giu', e cancellava dal browser\n      // la classe caricata - «Nessuna classe caricata» e da ricaricare il file, magari a lezione iniziata.\n      CLASSE = null; STATE.classeAttiva = null;\n      try{ localStorage.removeItem('cf_classe'); }catch(e){}\n    }\n    renderSelClasse();\n    // Assegnazione corrente della classe attiva (dai suoi alunni): serve a pre-selezionare \"Scegli fatture\".\n    if(CLASSE && CLASSE.alunni){\n      var anyAss = null;\n      CLASSE.alunni.forEach(function(a){ var cs = CLOUD_STUD[a.pin]; if(!anyAss && cs && cs.fattura_assegnata) anyAss = cs.fattura_assegnata; });\n      STATE.assegnate = parseAssegnazione(anyAss); STATE.assegnataId = assegnPrimoId(anyAss);\n    }\n    var hasClasse = !!(CLASSE && CLASSE.alunni && CLASSE.alunni.length);\n    byId('doc-classe').innerHTML = hasClasse\n      ? (esc('Classe ' + CLASSE.classe + ' · ' + CLASSE.alunni.length + ' alunni') + (classeSospesa(CLASSE.classe) ? '\u003cspan class=\"badge-sospesa\">Verifica sospesa\u003c/span>' : '') + (classeInEsercitazione(CLASSE.classe) ? '\u003cspan class=\"badge-eserc\">In esercitazione\u003c/span>' : ''))\n      : 'Nessuna classe caricata';\n    renderSospendi();\n    renderEsercitazione();\n    // (riepilogo di classe e livello predefinito rimossi: l'assegnazione si vede nelle righe alunno)\n    // (il pulsante \"Assegna\" è stato rimosso: si assegna scegliendo dalla tendina)\n    var nColl = 0, nCorso = 0, nDone = 0;\n    (hasClasse ? CLASSE.alunni : []).forEach(function(a){ var st = statoAlunno(a.pin); if(st.on) nColl++; if(st.corso) nCorso++; if(st.done){ nDone++; if(attaccatoAllApp(CLOUD_STUD[a.pin])) nColl++; } });\n    var t1 = byId('tile-collegati'), t2 = byId('tile-incorso'), t3 = byId('tile-consegnati');\n    if(t1) t1.textContent = nColl; if(t2) t2.textContent = nCorso; if(t3) t3.textContent = nDone;\n    var tb = byId('roster-body'); tb.innerHTML = '';\n    if(!hasClasse){ tb.innerHTML = '\u003ctr>\u003ctd colspan=\"7\" style=\"text-align:center; color:var(--muted); padding:22px;\">Nessuna classe caricata. Premi \u003cb>Carica classe\u003c/b> per iniziare.\u003c/td>\u003c/tr>'; return; }\n    // Ordine FISSO per cognome (poi nome): la riga di un alunno non si sposta quando consegna.\n    var alunniOrd = CLASSE.alunni.slice().sort(function(a, b){ return profInCima(a,b) || ((a.cognome||'') + ' ' + (a.nome||'')).localeCompare(((b.cognome||'') + ' ' + (b.nome||'')), 'it'); });\n    alunniOrd.forEach(function(a, i){\n      var st = statoAlunno(a.pin), cs = CLOUD_STUD[a.pin] || {};\n      var tr = document.createElement('tr'); tr.setAttribute('data-pin', a.pin);\n      if(st.assente) tr.classList.add('riga-assente');\n      var tdN = document.createElement('td'); tdN.textContent = (i+1);\n      var tdNome = document.createElement('td'); tdNome.textContent = a.cognome + ' ' + a.nome;\n      // APPELLO: il cognome è l'interruttore assente/presente. Sta qui e non in una colonna nuova perché il\n      // registro ha già otto colonne, e all'appello serve un bersaglio grande da centrare in fretta.\n      tdNome.className = 'nome-cell';\n      tdNome.title = st.assente ? 'Clicca per rimetterlo presente' : 'Clicca per segnarlo assente';\n      tdNome.addEventListener('click', function(){ chiediAssente(a, st.assente); });\n      var tdPin = document.createElement('td'); tdPin.className = 'pin-cell'; tdPin.textContent = a.pin;\n      var tdSt = document.createElement('td'); tdSt.className = 'st-cell'; tdSt.innerHTML = '\u003cspan class=\"st-badge ' + st.cls + '\">' + esc(st.txt) + '\u003c/span>';\n      var tdAss = document.createElement('td'); tdAss.className = 'ass-cell';\n      if(!FATTURE.length){ tdAss.textContent = '—'; }\n      else {\n        // L'assegnazione è SEMPRE modificabile dal docente (anche se l'alunno ha iniziato o consegnato).\n        var effList = parseAssegnazione(cs.fattura_assegnata); // SOLO la sua (niente ripiego sull'assegnazione di un compagno)\n        var btnA = document.createElement('button'); btnA.className = 'btn-scegli-ass mini';\n        btnA.textContent = descriviAssegnazioneBreve(effList);\n        btnA.title = effList.length ? ('Clicca per modificare i cedolini di ' + a.nome + ':  ' + descriviAssegnazione(effList)) : 'Clicca per assegnare cedolini a questo alunno';\n        btnA.addEventListener('click', function(){\n          openSelezioneFatture(effList, 'Cedolini per ' + a.cognome + ' ' + a.nome, function(list){\n            cloudAssegnaStudente(a.pin, list.length ? serializeAssegnazione(list) : null, list.length ? (list[0].liv || null) : null);\n            renderDocente();\n          });\n        });\n        tdAss.appendChild(btnA);\n      }\n      var tdAz = document.createElement('td'); tdAz.className = 'az-cell';\n      var wantR = wantAz(st); tdAz.setAttribute('data-az', wantR);\n      var azbR = buildAzButton(wantR, a); if(azbR) tdAz.appendChild(azbR);\n      tr.appendChild(tdN); tr.appendChild(tdNome); tr.appendChild(tdPin); tr.appendChild(tdAss); tr.appendChild(tdSt); tr.appendChild(tdAz); tr.appendChild(buildVotoCell(a)); tr.appendChild(buildValutaCell(a));\n      tb.appendChild(tr);\n    });\n    disegnaPallini();   // la tabella ridisegnata riparte senza pallini: li rimetto subito\n  }\n\n  /* ---------- Alunno ---------- */\n  function resetEditor(){\n    // Ripristina l'editor allo stato \"pristine\" salvato al boot: contenuto pienamente\n    // editabile, senza sol-mode, con i listener ri-inizializzati (toolbar, Finalizza,\n    // articoli, importi, rubrica). Ogni nuovo alunno riparte da qui.\n    var ed = byId('editor');\n    ed.classList.remove('sol-mode');\n    ed.innerHTML = PRISTINE_EDITOR;\n    wireEditor();\n    var ibw = byId('pag-iban-wrap'); if(ibw) ibw.style.display = 'none';   // esiste solo nell'editor-fattura\n    recomputeAll();\n  }\n  function prefillAzienda(t){\n    ['v_indirizzo','v_cap','v_comune','v_prov','v_piva','v_cf'].forEach(function(k){ var el = document.querySelector('#editor [data-k=\"'+k+'\"]'); if(el){ el.value = (t&&t[k])||''; el.readOnly = true; el.classList.add('locked'); } });\n    var inp = document.querySelector('.ana-search[data-scope=\"v\"]');\n    if(inp){ inp.value = (t&&t.v_nome)||''; inp.readOnly = true; inp.classList.add('locked'); var dd = inp.closest('.ana-search-wrap').querySelector('.ana-dd'); if(dd){ dd.classList.remove('open'); dd.innerHTML = ''; } }\n  }\n  /* ---------- Watcher: attesa dell'assegnazione dell'esercitazione ---------- */\n  function inAttesa(){ return byId('attesa').style.display !== 'none'; }\n  function stopAttesaWatcher(){ if(STATE.attesaTimer){ clearInterval(STATE.attesaTimer); STATE.attesaTimer = null; } }\n  function startAttesaWatcher(){ stopAttesaWatcher(); STATE.attesaTimer = setInterval(checkAssegnazione, 4000); }\n  function checkAssegnazione(){\n    // 18/09/2026: questo sorvegliante serve SOLO mentre l'alunno aspetta l'assegnazione sulla schermata «In\n    // attesa». Prima continuava a interrogare il cloud anche DOPO che era entrato a lavorare (scartava la\n    // risposta a cose fatte): due richieste ogni due secondi buttate, per ogni alunno, per tutta l'ora.\n    if(!inAttesa()){ stopAttesaWatcher(); return; }\n    try{ var c = localStorage.getItem('cf_classe'); if(c) CLASSE = JSON.parse(c); }catch(e){}\n    try{ var a = localStorage.getItem('cf_archivio'); if(a) FATTURE = JSON.parse(a); }catch(e){}\n    buildRubrica();\n    if(!STATE.studente) return;\n    // 1) CLOUD (funziona anche su dispositivi diversi): l'assegnazione arriva dal docente → entra da solo.\n    if(SB){\n      cloudLeggiContestoAlunno(STATE.studente.pin, function(ctx){\n        if(!inAttesa()) return; // nel frattempo è già entrato\n        if(archivioDaRichiedere((ctx && ctx.lista) || [])) return;   // si riprova al giro dopo, con l'archivio nuovo\n        var lista = ((ctx && ctx.lista) || []).filter(function(x){ return FATTURE.some(function(f){ return f.id === x.id; }); });\n        if(lista.length || (ctx && ctx.stato === 'consegnato')){\n          stopAttesaWatcher();\n          avviaAlunnoConLista(ctx);\n        }\n      });\n      return;\n    }\n    // 2) Fallback LOCALE (senza cloud, stesso browser).\n    var g = null, lv = null; try{ g = localStorage.getItem('cf_assegnata'); lv = localStorage.getItem('cf_livello'); }catch(e){}\n    STATE.assegnate = parseAssegnazione(g); STATE.assegnataId = assegnPrimoId(g);\n    var listaL = parseAssegnazione(g).filter(function(x){ return FATTURE.some(function(f){ return f.id === x.id; }); });\n    if(listaL.length){ stopAttesaWatcher(); avviaAlunnoConLista({ lista: listaL, livello: lv, stato: null }); }\n  }\n  // Fonde la bozza letta dal cloud con quella già in memoria: per ogni fattura tiene la versione con ts più recente.\n  // Così una lettura in ritardo non calpesta il lavoro appena scritto (vedi bug bozza cross-device).\n  function mergeBozzaCloud(cur, cloud){\n    cur = cur || {};\n    Object.keys(cloud || {}).forEach(function(k){\n      var inc = cloud[k], have = cur[k];\n      var it = (inc && inc.ts) || 0, ht = (have && have.ts) || 0;\n      var inClasse = !!((inc && inc.classe) || (have && have.classe));   // il segno «lavorato in classe» non si perde\n      if(!have || it > ht) cur[k] = inc;\n      if(inClasse && cur[k] && typeof cur[k] === 'object') cur[k].classe = true;\n    });\n    return cur;\n  }\n  /* ---------- Menù dell'alunno con PIÙ fatture assegnate ---------- */\n  // Avvia l'alunno a partire dal contesto letto dal cloud: se ha 1 sola fattura entra diretto,\n  // se ne ha più di una mostra il menù di scelta, se non ne ha nessuna va in attesa.\n  function avviaAlunnoConLista(ctx){\n    // Già consegnato (o consegnato dal docente): schermata di blocco, in attesa di eventuale riammissione.\n    if(ctx && ctx.stato === 'consegnato'){\n      stopAttesaWatcher(); stopCompitiWatcher();\n      STATE.consegnata = true;\n      mostraConsegnatoAlunno(null, 'Hai già consegnato. Se il docente ti riammette, potrai rientrare.');\n      startBloccoWatcher();\n      return;\n    }\n    stopCompitiWatcher();\n    var pin = STATE.studente ? STATE.studente.pin : null;\n    /* UN AVVIO SOLO (19/09/2026). Con la rete lenta questa funzione poteva partire DUE volte per lo stesso\n       alunno: «Entra» che si riabilita dopo 25 secondi mentre la prima catena e' ancora per strada, due risposte\n       di fila del sorvegliante di «In attesa», il ribusso di «Accesso bloccato». La seconda partenza azzerava\n       la mappa delle bozze e RIDISEGNAVA il foglio mentre l'alunno ci stava scrivendo. Se questo alunno e' gia'\n       dentro e sta lavorando sul foglio o sul menu', la seconda chiamata non fa niente. */\n    if(pin && STATE.proprietario && STATE.avviatoPin === pin && !STATE.sessioneChiusa &&\n       (byId('editor').style.display !== 'none' || byId('menu-fatture').style.display !== 'none')){\n      return;\n    }\n    // …e nemmeno se un avvio per lo stesso alunno e' partito da meno di 20 secondi e non ha ancora finito.\n    if(pin && STATE.avviatoPin === pin && STATE.avvioInCorsoDa && (Date.now() - STATE.avvioInCorsoDa) \u003c 20000) return;\n    STATE.avvioInCorsoDa = Date.now();\n    STATE.avviatoPin = pin;\n    var giroAvvio = STATE.avvioGiro = (STATE.avvioGiro || 0) + 1;\n    // QUI arriva SOLO chi è stato davvero ammesso a lavorare (chi viene respinto si ferma prima, sulla\n    // schermata di blocco). Da questo momento questo dispositivo è il PROPRIETARIO della sessione: è l'unico\n    // autorizzato a scrivere e cancellare la presenza di questo PIN.\n    STATE.proprietario = true;\n    if(ctx && ctx.classe) STATE.classeAlunno = ctx.classe;   // serve a sapere se la sua classe è in esercitazione\n    // Il contrassegno del Reset valido per questa sessione (vedi allineaAzzeramento e cf_bozza_salva).\n    if(ctx && typeof ctx.azzeramento === 'string') STATE.azzVisto = ctx.azzeramento;\n    else { STATE.azzVisto = null; try{ if(pin) STATE.azzVisto = localStorage.getItem('cf_azz_' + pin); }catch(e){} }\n    STATE.modalitaCompiti = false; STATE.esercitazione = false;   // entrata in VERIFICA: la chiave del lavoro locale dev'essere quella verifica, non compiti\n    // GETTONE DI SESSIONE: questo dispositivo genera un codice unico e lo \"pianta\" nel cloud (colonna sessione).\n    // L'ULTIMO che entra vince. Se dopo uno «Sblocca» un altro dispositivo entra e pianta il SUO gettone, il\n    // watcher di sessione qui sotto se ne accorge (il gettone nel cloud non è più il mio) e questo dispositivo si\n    // chiude da solo, invece di continuare a lavorare in parallelo e sovrascrivere il lavoro dell'altro.\n    // Il gettone lo genera il SERVER dentro cf_accesso (18/09/2026). Se per qualche motivo non ce l'ho\n    // (rientro dopo un F5 in una scheda nuova), me lo faccio ridare: la porta lo consegna solo se questo\n    // e' davvero il dispositivo che sta lavorando con quel PIN.\n    if(sessMia()){ STATE.sessToken = sessMia(); STATE.sessTokenConfirmed = true; }\n    else {\n      STATE.sessTokenConfirmed = false;\n      try{ if(pin) SB.rpc('cf_sessione', { p_pin: pin, p_sess: null, p_dispositivo: idDispositivo() }).then(function(res){\n        if(res && !res.error && res.data){\n          STATE.sessToken = res.data; STATE.sessTokenConfirmed = true;\n          try{ sessionStorage.setItem('cf_sess', res.data); }catch(e){}\n        }\n      }, function(){}); }catch(e){}\n    }\n    // Carico la bozza in corso già nel cloud PRIMA che l'alunno ricominci a scrivere: così, se ha più fatture\n    // abbozzate, salvandone una non cancella le altre (la mappa parte piena, non da zero).\n    STATE.bozzaMappa = {};\n    // bozzaLetta = \"so cosa c'e' nel cloud\". Finche' e' false NON scrivo la mappa (vedi pushBozzaCloud):\n    // se la lettura fallisce per un buco di rete, la mappa resta vuota, e il primo salvataggio la\n    // riscriverebbe da zero CANCELLANDO dal cloud le bozze delle ALTRE fatture dell'alunno. Meglio\n    // riprovare a leggere (fino a 5 volte) e salvare nel cloud solo quando so cosa sto sovrascrivendo.\n    // Il salvataggio LOCALE intanto continua regolarmente: il lavoro non si ferma mai.\n    STATE.bozzaLetta = false;\n    // (19/09/2026) NON SI ARRENDE PIU'. Prima dopo sei tentativi smetteva, `bozzaLetta` restava falsa e per tutta\n    // l'ora il lavoro non saliva nel cloud, in silenzio: viveva solo nel telefono. Ora insiste finche' il cloud\n    // risponde (ogni 3 secondi all'inizio, poi ogni 10), e si ferma solo se l'alunno e' uscito o se e' partito\n    // un avvio piu' recente.\n    var leggiBozzaCloud = function(tentativo){\n      if(!pin || !SB){ STATE.bozzaLetta = true; return; }\n      if(STATE.avvioGiro !== giroAvvio || !STATE.studente || STATE.studente.pin !== pin || !STATE.proprietario) return;\n      var riprova = function(){ setTimeout(function(){ leggiBozzaCloud(tentativo + 1); }, tentativo \u003c 5 ? 3000 : 10000); };\n      try{\n        SB.rpc('cf_bozza_leggi', { p_pin: pin, p_sess: sessMia(), p_dispositivo: idDispositivo() }).then(function(rb){\n          if(STATE.avvioGiro !== giroAvvio) return;\n          if(!rb || rb.error){ riprova(); return; }\n          var b = rb.data || null;\n          // FONDERE, non sostituire: se la lettura arriva in ritardo (rete lenta) DOPO che l'alunno ha già scritto,\n          // sostituire in blocco la mappa perderebbe la bozza appena salvata. Per ogni fattura tengo la versione\n          // PIÙ RECENTE (ts) tra quella del cloud e quella già in memoria; così non calpesto quello appena scritto.\n          if(b && typeof b === 'object'){ STATE.bozzaMappa = mergeBozzaCloud(STATE.bozzaMappa || {}, b); }\n          STATE.bozzaLetta = true;\n          pushBozzaCloud();   // se intanto l'alunno ha scritto, ora quel lavoro sale nel cloud\n        }, function(){ riprova(); });\n      }catch(e){}\n    };\n    leggiBozzaCloud(0);\n    // Allinea le consegne LOCALI a quelle VERE del cloud, così il menù non mostra \"consegnata\" fantasma\n    // rimaste da prove/verifiche precedenti (la verità è il cloud).\n    rebuildConsegnateLocali(pin, function(){\n      STATE.avvioInCorsoDa = 0;\n      if(STATE.avvioGiro !== giroAvvio || !STATE.studente || STATE.studente.pin !== pin) return;   // uscito nel frattempo, o avvio superato\n      var lista = ((ctx && ctx.lista) || []).filter(function(x){ return (typeof FATTURE!=='undefined') && FATTURE.some(function(f){ return f.id === x.id; }); });\n      STATE.mieAssegnate = lista;\n      STATE.multiMode = lista.length > 1;\n      STATE.consegnata = false; // rientro per lavorare: azzera il flag PRIMA del ping presenza (evita ri-blocco dopo Riammetti)\n      try{ if(pin) sessionStorage.setItem('cf_studente_attivo', pin); }catch(e){} // dopo un refresh resta dov'era (menù o fattura), niente PIN di nuovo\n      try{ if(pin) localStorage.setItem('cf_ultimo_pin', pin); }catch(e){}         // per il rientro automatico entro mezz'ora\n      // L'assegnazione va saputa PRIMA del primo battito: cosi' la dashboard scrive «In corso» al primo colpo.\n      // Prima startPresenza() partiva qui e il primo to per questa esercitazione.\n    // Recupero del lavoro in corso: tengo SEMPRE la versione PIÙ RECENTE, confrontando la copia LOCALE (su questo\n    // dispositivo) con quella nel CLOUD, ognuna con il suo orario (ts). Così, cambiando dispositivo o rientrando,\n    // non ricompare più una versione vecchia al posto dell'ultima scritta (il caso \"Pinco Pallino / merda\").\n    var local = null;\n    try{\n      sessionStorage.setItem('cf_studente_attivo', STATE.studente.pin);\n      var raw = localStorage.getItem(chiaveLavoro(STATE.studente.pin, STATE.assegnataId));\n      // copia dei compiti fatta con la versione di prima (chiave 'C'): la raccolgo una volta\n      if(!raw && STATE.modalitaCompiti && !STATE.esercitazione){ raw = localStorage.getItem('cf_lavoroC_' + STATE.studente.pin + '_' + STATE.assegnataId); }\n      if(raw){\n        var saved = JSON.parse(raw);\n        if(saved && saved.esercizioId === STATE.assegnataId && saved.html){ local = { html: saved.html, ts: (saved.ts || 0) }; }\n      }\n    }catch(e){}\n    var ripristinato = false;\n    try{ STATE.tsFoglio = STATE.tsFoglio || {}; STATE.tsFoglio[chiaveLavoro(STATE.studente.pin, STATE.assegnataId)] = local ? (local.ts || 0) : 0; }catch(e){}\n    if(local){ byId('editor').innerHTML = local.html; wireEditor(); reidrataDinamici(); sbloccaEditorRipristinato(); ripristinato = true; }\n    // Livello scelto dal DOCENTE in fase di assegnazione (predefinito Guidata).\n    try{ var lvAss = localStorage.getItem('cf_livello'); if(lvAss) LIVELLO = Number(lvAss) || 1; }catch(e){}\n    // Applica il livello: compone il testo e imposta le anagrafiche.\n    // Se ho ripristinato un lavoro salvato, NON azzero le anagrafiche già compilate.\n    applicaLivello(LIVELLO, !ripristinato);\n    aggiornaNeretto(); // importi merce in grassetto fin dall'inizio, a ogni livello\n    // Chiedo SEMPRE al cloud: se lì c'è una versione PIÙ RECENTE del locale (o se qui non c'era niente), la uso.\n    // Così dopo Backup/Ripristino, cambiando PC/cellulare o entrando giorni dopo, ritrova sempre l'ultima verità.\n    /* 19/09/2026 — IL FOGLIO NON SI APRE FINCHE' NON SO COSA C'E' NEL CLOUD. Prima la domanda al cloud si faceva\n       UNA volta sola, e un errore di rete valeva come «non c'e' niente»: su un dispositivo nuovo (dopo uno\n       «Sblocca», dopo un «Riprendi», dal computer al posto del telefono) l'alunno si ritrovava il foglio bianco\n       pur avendo il lavoro salvo nel cloud. Adesso: un velo copre il foglio («Apro il tuo lavoro…»), la domanda\n       si ripete finche' il cloud RISPONDE davvero, e come scorta vale la bozza gia' letta all'ingresso. Con la\n       rete buona il velo non fa nemmeno in tempo a comparire. Chi ha la SUA copia su questo dispositivo dopo tre\n       tentativi a vuoto lavora comunque con quella (e' quasi sempre l'ultima), e io continuo a chiedere. */\n    if(!STATE.esercitazione && STATE.studente){   // (24/09/2026) anche i compiti: il foglio e' lo stesso della classe\n      var attesaId = STATE.assegnataId;\n      var pinRec = STATE.studente.pin;\n      var localTs = local ? local.ts : -1;\n      var giroRec = STATE.recuperoGiro = (STATE.recuperoGiro || 0) + 1;\n      var tentativiRec = 0, foglioLibero = false;\n      STATE.userTypedSinceLoad = false;   // azzero: se l'alunno mette DAVVERO mano al foglio prima che il cloud risponda, non lo calpesto\n      var ancoraQui = function(){\n        return STATE.recuperoGiro === giroRec && STATE.studente && STATE.studente.pin === pinRec &&\n               STATE.assegnataId === attesaId && !STATE.consegnata && !STATE.esercitazione &&\n               byId('editor').style.display !== 'none';\n      };\n      var liberaFoglio = function(){\n        if(foglioLibero) return;\n        foglioLibero = true;\n        if(STATE.recuperoGiro === giroRec){ STATE.caricamentoFoglio = false; velaRecupero(false); }\n      };\n      // UN FOGLIO VUOTO NON BATTE MAI UN FOGLIO COMPILATO, qualunque orario abbia. Serve ai telefoni su cui il\n      // difetto di prima ha già lasciato in memoria un foglio bianco «più recente» del lavoro vero.\n      var foglioVuoto = function(html){\n        try{\n          var d = document.createElement('div'); d.innerHTML = html;\n          var st = d.querySelector('#ced-stato'); if(!st) return false;\n          var j = JSON.parse(st.getAttribute('data-stato') || '{}');\n          return !j.ordine || !j.ordine.length;\n        }catch(e){ return false; }\n      };\n      var localeVuoto = local ? foglioVuoto(local.html) : true;\n      var applica = function(res){\n        if(!res || !res.html) return;\n        if(res.ts \u003c= localTs && !(localeVuoto && !foglioVuoto(res.html))) return;   // il locale è uguale o più fresco → tengo il locale (ma non se è un foglio vuoto contro uno compilato)\n        if(STATE.userTypedSinceLoad) return;                    // l'alunno ha già messo mano al foglio → non calpesto\n        var era = STATE.caricamentoFoglio; STATE.caricamentoFoglio = true;\n        try{\n          byId('editor').innerHTML = res.html;\n          wireEditor();\n          reidrataDinamici();\n          sbloccaEditorRipristinato();                          // il lavoro salvato alla consegna arriva bloccato: lo riapro\n          applicaLivello(LIVELLO, false);                       // NON azzerare le anagrafiche recuperate\n          aggiornaNeretto();\n        }catch(e){}\n        STATE.caricamentoFoglio = false;\n        STATE.tsDaUsare = res.ts || 0;                          // tiene l'orario della versione arrivata dal cloud\n        try{ salvaLavoro(); }catch(e){}                         // allineo il locale alla versione più fresca (questo È il suo lavoro)\n        STATE.tsDaUsare = null;\n        STATE.caricamentoFoglio = era;\n      };\n      var chiediAlCloud = function(){\n        cloudRecuperaLavoro(pinRec, attesaId, function(res, errore){\n          if(!ancoraQui()){ liberaFoglio(); return; }\n          if(!errore){\n            applica(res);                                        // il cloud ha risposto: o il lavoro, o «non c'è niente»\n            // Se la copia di QUESTO dispositivo è più fresca di quella del cloud (o nel cloud non c'è proprio),\n            // la mando su subito, col SUO orario: non aspetto che l'alunno tocchi qualcosa.\n            if(local && !localeVuoto && (!res || !res.html || res.ts \u003c localTs) && !STATE.userTypedSinceLoad && STATE.proprietario){\n              STATE.bozzaMappa = STATE.bozzaMappa || {};\n              var gia = STATE.bozzaMappa[attesaId];\n              if(!gia || (gia.ts || 0) \u003c localTs){ STATE.bozzaMappa[attesaId] = { html: local.html, ts: localTs }; pushBozzaCloud(); }\n            }\n            liberaFoglio(); return;\n          }\n          tentativiRec++;\n          // SCORTA: la bozza che l'ingresso ha già letto (cf_bozza_leggi). Vale solo a foglio ancora velato,\n          // quando in quella mappa c'è per forza la versione del cloud e non qualcosa scritto qui nel frattempo.\n          var scorta = (!foglioLibero && STATE.bozzaLetta && STATE.bozzaMappa) ? STATE.bozzaMappa[attesaId] : null;\n          if(scorta && scorta.html){ applica({ html: scorta.html, ts: (scorta.ts || 0) }); liberaFoglio(); return; }\n          if(local && !localeVuoto && tentativiRec >= 3) liberaFoglio();\n          if(!foglioLibero) velaRecupero(tentativiRec >= 25 ? 'muto' : (tentativiRec >= 2 ? 'debole' : 'apro'));\n          setTimeout(function(){ if(ancoraQui()) chiediAlCloud(); else liberaFoglio(); }, 2500);\n        });\n      };\n      velaRecupero('apro');\n      chiediAlCloud();\n    } else {\n      setTimeout(function(){ STATE.caricamentoFoglio = false; }, 0);   // allenamento: niente cloud da aspettare\n    }\n    /* (26/09/2026, richiesta di Mauro) Barra in alto dell'alunno: pulsanti sottili come l'«Esci» del docente, con\n       l'icona e la scritta su una riga sola (prima erano pillole che sul telefono andavano a capo parola per parola\n       e allargavano la pagina: la calcolatrice finiva fuori a destra). Sul telefono: nome ed «Esci» su una riga,\n       i pulsanti sotto (vedi .tb-azioni nel @media). */\n    var top = byId('topbar-info'); top.innerHTML = '';\n    function pulsanteBarra(icona, testo, fn){\n      var b = document.createElement('button'); b.type = 'button'; b.className = 'tb-btn';\n      b.innerHTML = '\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">' + icona + '\u003c/svg>';\n      var t = document.createElement('span'); t.textContent = testo; b.appendChild(t);\n      b.addEventListener('click', fn);\n      return b;\n    }\n    var ICO_INDIETRO = '\u003cpath d=\"m12 19-7-7 7-7\"/>\u003cpath d=\"M19 12H5\"/>';\n    var span = document.createElement('span'); span.className = 'tb-nome'; span.textContent = STATE.studente.cognome + ' ' + STATE.studente.nome + ' · classe ' + CLASSE.classe;\n    var azioni = document.createElement('div'); azioni.className = 'tb-azioni';\n    var out = pulsanteBarra('\u003cpath d=\"M14 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-2\"/>\u003cpath d=\"M9 12h12l-3-3m0 6 3-3\"/>', 'Esci', goGate);\n    out.classList.add('tb-esci');\n    top.appendChild(span);\n    // Alunno con più fatture: link per tornare al menù SENZA consegnare, per provare/finire le altre.\n    // Il lavoro di questa fattura resta salvato (chiave cf_lavoro per fattura) e si ritrova riaprendola.\n    if(STATE.modalitaCompiti && STATE.studente){\n      if(STATE.esercitazione){\n        azioni.appendChild(pulsanteBarra('\u003cpath d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\"/>\u003cpath d=\"M3 3v5h5\"/>', 'Ricomincia da capo', function(){ ricominciaEsercitazione(); }));\n      }\n      azioni.appendChild(pulsanteBarra(ICO_INDIETRO, STATE.ritornoFn ? 'Indietro' : 'Torna ai compiti', function(){ salvaLavoro(); if(STATE.ritornoFn){ var rit = STATE.ritornoFn; STATE.ritornoFn = null; rit(); return; } mostraCompiti(); }));\n    } else if(STATE.multiMode && STATE.studente){\n      azioni.appendChild(pulsanteBarra(ICO_INDIETRO, 'I miei cedolini', function(){ salvaLavoro(); mostraMenuFatture(); }));\n    }\n    top.appendChild(azioni);\n    top.appendChild(out);\n    var svgDoc = '\u003csvg viewBox=\"0 0 24 24\" width=\"17\" height=\"17\" fill=\"none\" stroke=\"#3f6b52\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"vertical-align:-3px;margin-right:7px;\">\u003cpath d=\"M14 3v4a1 1 0 0 0 1 1h4\"/>\u003cpath d=\"M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z\"/>\u003cpath d=\"M9 13l6 0\"/>\u003cpath d=\"M9 17l6 0\"/>\u003c/svg>';\n    byId('cortesia-banner').innerHTML = svgDoc + (STATE.esercitazione\n      ? 'Sei in \u003cb>allenamento\u003c/b> su un cedolino già consegnato: esercitati quanto vuoi, \u003cb>non verrà inviato al prof\u003c/b>. A fine compilazione vedrai la soluzione a confronto.'\n      : 'Questo è il tuo \u003cb>cedolino\u003c/b>, con i valori che hai inserito. Controllalo bene prima di consegnare.');\n    byId('btnChiudi').style.display = ''; byId('btnIndietro').style.display = '';\n    byId('btnChiudi').textContent = STATE.esercitazione ? TESTO_FINE_ALLENAMENTO : 'Chiudi e consegna';\n    if(!STATE.modalitaCompiti) cloudPresenza();\n    show('editor');\n  }\n\n  /* ---------- Soluzione nel COMPILATORE (editor in sola lettura) ---------- */\n  function ivaCodeFromLabel(lbl){ for(var k in IVA_LABELS){ if(IVA_LABELS[k] === lbl) return k; } return ''; }\n  function dataIso(s){ s = String(s || ''); var m = s.match(/^(\\d{2})\\/(\\d{2})\\/(\\d{4})$/); return m ? (m[3] + '-' + m[2] + '-' + m[1]) : s; }\n  function fillCastelletto(cast){\n    var cells = document.querySelectorAll('#dettaglio-iva .cast-in');\n    if(!cells.length || !cast) return;\n    var vals = [];\n    function money(n){ vals.push(eur(n)); }\n    function neg(n){ vals.push('− ' + eur(n)); }\n    function pos(n){ vals.push('+ ' + eur(n)); }\n    (cast.righe || []).forEach(function(g){\n      if(cast.hasGen || cast.hasAcc){ money(g.merce); }\n      if(cast.hasGen){ neg(g.sconto); }\n      if(cast.hasAcc){ pos(g.spesa); }\n      money(g.imponibile);\n      if(g.rate > 0){ money(g.imposta); }\n    });\n    if(cast.hasGen || cast.hasAcc){ money(cast.tot.merce); }\n    if(cast.hasGen){ neg(cast.tot.sconto); }\n    if(cast.hasAcc){ pos(cast.tot.spesa); }\n    money(cast.tot.imponibile); money(cast.tot.imposta);\n    cells.forEach(function(c, i){ c.value = (vals[i] != null) ? vals[i] : ''; });\n  }\n  function lockEditor(){\n    document.querySelectorAll('#editor input, #editor textarea').forEach(function(el){ if(!el.readOnly){ el.readOnly = true; el.classList.add('sol-lock'); } });\n    document.querySelectorAll('#editor select').forEach(function(el){ if(!el.disabled){ el.disabled = true; el.classList.add('sol-lock'); } });\n  }\n  // L'OPPOSTO ESATTO di lockEditor: toglie il lucchetto SOLO agli elementi che lockEditor aveva chiuso\n  // (li riconosce dalla classe 'sol-lock'), quindi non tocca i campi nati readonly (es. «Tipo documento»).\n  // Serve quando si RIPRISTINA un lavoro salvato al momento della consegna: quell'HTML si porta dietro i\n  // readonly/disabled, e senza questo l'alunno riammesso ritrovava la fattura ma non poteva piu' scriverci.\n  // Vale anche per i lavori gia' salvati bloccati in passato: si sbloccano al recupero.\n  function sbloccaEditorRipristinato(){\n    var ed = byId('editor'); if(!ed) return;\n    ed.classList.remove('sol-mode');\n    ed.querySelectorAll('.sol-lock').forEach(function(el){\n      if(el.tagName === 'SELECT') el.disabled = false; else el.readOnly = false;\n      el.classList.remove('sol-lock');\n    });\n  }\n  // silenzioso=true: RIEMPIE l'editor con la soluzione ma NON la mette a schermo. Serve a chi deve solo\n  // FOTOGRAFARLA per salvarla (catturaConsegnaCorrente, catturaEsercitazione).\n  // Storia: senza questo, consegnando una VERIFICA l'alunno vedeva la soluzione completa. La sequenza era:\n  // «Invio in corso...» (show blocco) → cattura → show('editor') con dentro la fattura CORRETTA → e solo\n  // quando il cloud rispondeva tornava «Verifica consegnata». Misurato dal vivo: 136 ms in rete locale,\n  // ma sul wifi di scuola sono SECONDI: il tempo di leggerla o fotografarla. E se la consegna falliva,\n  // l'alunno tornava a compilare avendo appena visto le risposte giuste.\n  /* 18/09/2026. La soluzione non scende piu' insieme all'esercizio: il telefono dell'alunno non ce l'ha.\n     Si chiede al server al momento giusto, e il server la consegna SOLO a chi ha gia' consegnato quel\n     cedolino ed e' nei compiti a casa o in una classe in esercitazione. Il docente, che ha l'archivio\n     completo, non passa di qui. */\n  function conSoluzione(fatturaId, cb){\n    var f = (typeof FATTURE !== 'undefined' && FATTURE) ? FATTURE.find(function(x){ return x.id === fatturaId; }) : null;\n    if(f && f.soluzione){ cb && cb(f.soluzione); return; }\n    if(!SB || !STATE.studente || !fatturaId){ cb && cb(null); return; }\n    try{\n      SB.rpc('cf_soluzione', { p_pin: STATE.studente.pin, p_fattura_id: fatturaId }).then(function(res){\n        var sol = (res && !res.error) ? res.data : null;\n        if(sol && f) f.soluzione = sol;   // per questa sessione la tengo, cosi' non la richiedo a ogni vista\n        cb && cb(sol);\n      }, function(){ cb && cb(null); });\n    }catch(e){ cb && cb(null); }\n  }\n  function mostraSoluzioneCompilatore(silenzioso){\n    var S = STATE.soluzioneCorrente;\n    if(!S){ showAlert('Nessuna soluzione disponibile.'); return; }\n    // CEDOLINO: per ora la soluzione e' il riepilogo dei passaggi attesi (quella\n    // completa nel compilatore si costruira' con Mauro insieme alla valutazione).\n    if(S.passaggi || CED.attivo()){ CED.mostraSoluzione(S, silenzioso); return; }\n    var sol = S, t = sol.t || {};\n    resetEditor();\n    // Anagrafica / documento / pagamento\n    Object.keys(t).forEach(function(k){ var el = document.querySelector('#editor [data-k=\"' + k + '\"]'); if(el) el.value = t[k] || ''; });\n    var dEl = document.querySelector('#editor [data-k=\"d_data\"]'); if(dEl) dEl.value = dataIso(t.d_data);\n    var vs = document.querySelector('.ana-search[data-scope=\"v\"]'); if(vs) vs.value = t.v_nome || '';\n    var cs = document.querySelector('.ana-search[data-scope=\"c\"]'); if(cs) cs.value = t.c_nome || '';\n    byId('pag-iban-wrap').style.display = /bonifico|riba/i.test(t.p_metodo || '') ? '' : 'none'; // IBAN visibile anche con RiBa\n    // Articoli\n    (sol.articoli || []).forEach(function(a, i){\n      var boxes = document.querySelectorAll('#editor .artbox'), box;\n      if(i \u003c boxes.length){ box = boxes[i]; }\n      else { aggiungiArticolo(); var bb = document.querySelectorAll('#editor .artbox'); box = bb[bb.length - 1]; }\n      box.querySelector('.cod').value = a.cod || '';\n      var ta = box.querySelector('.desc-ta'); ta.value = a.desc || ''; autogrow(ta);\n      box.querySelector('.q').value = a.qta || '';\n      box.querySelector('.p').value = a.prezzo ? fmt(num(a.prezzo)) : '';\n      box.querySelector('.iva').value = ivaCodeFromLabel(a.iva);\n      box.querySelector('.imp').value = a.importo || '';\n      var running = round2(num(a.prezzo) * num(a.qta));\n      (a.sconti || []).forEach(function(s){\n        addScontoTo(box);\n        var rows = box.querySelectorAll('.sconto-row'), row = rows[rows.length - 1];\n        row.querySelector('.motivo').value = s.motivo || '';\n        row.querySelector('.perc').value = s.perc || '';\n        row.querySelector('.dsc').value = s.imp || '';\n        running = round2(running - num(s.imp));\n        row.querySelector('.net').value = eur(running);\n      });\n      // Se l'articolo non ha sconti, l'importo È già il netto: in grassetto (neretto).\n      if(!(a.sconti && a.sconti.length)){ var ic = box.querySelector('.imp'); if(ic) ic.classList.add('is-net'); }\n    });\n    // Sconti generali\n    (sol.scontiGen || []).forEach(function(s){\n      addScontoGenerale();\n      var rows = document.querySelectorAll('#sconti-generali .sconto-gen-row'), row = rows[rows.length - 1];\n      row.querySelector('.motivo').value = s.motivo || '';\n      row.querySelector('.perc').value = s.perc || '';\n      row.querySelector('.dsc').value = s.imp || '';\n    });\n    // Spese\n    ['accessoria','anticipata','cauzione','interessi'].forEach(function(cat){\n      ((sol.spese && sol.spese[cat]) || []).forEach(function(s){\n        addSpesa(cat);\n        var rows = document.querySelectorAll('.spesa-row[data-cat=\"' + cat + '\"]'), row = rows[rows.length - 1];\n        row.querySelector('.sp-desc').value = s.desc || '';\n        autogrow(row.querySelector('.sp-desc'));\n        row.querySelector('.sp-imp').value = s.imp || '';\n      });\n    });\n    // Castelletto: ricostruisce lo scheletro poi riempie le celle\n    recomputeAll();\n    fillCastelletto(sol.castelletto);\n    // Riepilogo: imponibile / IVA / Totale presi DALLA tabella per aliquota (unica\n    // fonte dei conti), così coincidono sempre col castelletto al centesimo.\n    var r = sol.r || {}, cast = sol.castelletto;\n    byId('totale-merce').value = r.totaleMerce || '';\n    if(cast && cast.tot){\n      var sumSp = function(catName){ var s = 0; ((sol.spese && sol.spese[catName]) || []).forEach(function(x){ s = round2(s + num(x.imp)); }); return s; };\n      byId('v-imponibile').value = eur(cast.tot.imponibile);\n      byId('v-iva').value = eur(cast.tot.imposta);\n      byId('v-totfatt').value = eur(round2(cast.tot.imponibile + cast.tot.imposta + sumSp('anticipata') + sumSp('cauzione') + sumSp('interessi')));\n    } else {\n      byId('v-imponibile').value = r.imponibile || '';\n      byId('v-iva').value = r.iva || '';\n      byId('v-totfatt').value = r.totFatt || '';\n    }\n    // Sola lettura + modalita' soluzione\n    lockEditor();\n    byId('editor').classList.add('sol-mode');\n    if(!silenzioso) show('editor');   // in cattura NON si mostra: vedi il commento sopra\n  }\n\n  /* ---------- Stampa (solo la vista attiva) ---------- */\n  /* (26/09/2026, richiesta di Mauro) Il cedolino stampato sta su UN foglio. Prima di stampare lo si misura come\n     verra' sulla carta (largo 186 mm: A4 meno 12 mm per lato; le regole del telefono spente per quell'istante,\n     perche' in stampa la pagina e' larga come un A4) e, se non ci sta nei 273 mm di altezza, lo si rimpicciolisce\n     quel tanto che basta (zoom, 3 mm di scorta). Se ci sta, resta com'e'. */\n  var FOGLIO_ALTO_PX = 270 * 96 / 25.4;\n  function zoomUnFoglio(view){\n    var pag = view && view.querySelector('.cx-page'); if(!pag) return;\n    view.style.removeProperty('--zoom-stampa');\n    document.documentElement.classList.add('misura-stampa');\n    view.classList.add('misura-vista');\n    var h = pag.getBoundingClientRect().height;\n    view.classList.remove('misura-vista');\n    document.documentElement.classList.remove('misura-stampa');\n    if(h > FOGLIO_ALTO_PX) view.style.setProperty('--zoom-stampa', String(Math.floor(FOGLIO_ALTO_PX / h * 1000) / 1000));\n  }\n  function stampa(viewId){ var el = byId(viewId); try{ zoomUnFoglio(el); }catch(e){} el.classList.add('printing'); window.print(); setTimeout(function(){ el.classList.remove('printing'); }, 600); }\n\n  /* =========================================================\n     FIX C — Confronto rapido \"la mia\" ⇄ \"corretta\"\n     (copia di cortesia e dashboard) con snapshot dell'alunno\n     ========================================================= */\n\n  // Riporta i valori digitati (input/textarea/select) negli attributi HTML,\n  // così uno snapshot via innerHTML conserva davvero ciò che l'alunno ha scritto.\n  function commitValues(root){\n    root.querySelectorAll('input').forEach(function(el){\n      if(el.type === 'checkbox' || el.type === 'radio'){ if(el.checked) el.setAttribute('checked',''); else el.removeAttribute('checked'); }\n      else { el.setAttribute('value', el.value); }\n    });\n    root.querySelectorAll('textarea').forEach(function(el){ el.textContent = el.value; });\n    root.querySelectorAll('select').forEach(function(sel){\n      Array.prototype.forEach.call(sel.options, function(o){ if(o.selected) o.setAttribute('selected',''); else o.removeAttribute('selected'); });\n    });\n  }\n\n  // Salvataggio automatico LOCALE della compilazione dell'alunno (solo localStorage).\n  // Procede solo se l'alunno sta effettivamente compilando: studente presente,\n  // esercitazione non ancora consegnata ed editor non in modalità soluzione.\n  // Spinge la bozza in corso (mappa { fatturaId: html }) nel cloud, sulla riga dell'alunno. Solo il\n  // PROPRIETARIO della sessione scrive, e solo per le VERIFICHE (i compiti a casa sono un'altra cosa e non\n  // devono finire qui, altrimenti precompilerebbero la verifica). È questo che rende il backup un backup VERO:\n  // il lavoro non consegnato smette di vivere solo nel dispositivo dell'alunno e diventa recuperabile.\n  // Chiave del salvataggio LOCALE del lavoro: DIVERSA per compiti e verifiche, così un compito fatto a casa\n  // NON precompila la verifica sulla stessa fattura sullo stesso dispositivo. Compiti: cf_lavoroC_ ; verifiche: cf_lavoro_.\n  // Allenamento (esercitazione libera dopo la consegna): binario locale a sé ('E'), così NON tocca né la verifica\n  // ('') né il compito già consegnato ('C'). Resta sullo stesso dispositivo, non finisce mai nel cloud.\n  // (24/09/2026, regola di Mauro) UN FOGLIO SOLO per cedolino: quello che l'alunno fa in classe se lo ritrova nei\n  // compiti e viceversa, su qualsiasi dispositivo. Resta a parte solo l'allenamento ('E'), che non conta per nessuno.\n  function chiaveLavoro(pin, id){ return 'cf_lavoro' + (STATE.esercitazione ? 'E' : '') + '_' + pin + '_' + id; }\n  // (23/09/2026) Butta da QUESTO dispositivo il lavoro azzerato dal docente (Reset o Carica classe): le copie del\n  // foglio di verifica/esercitazione e dell'allenamento, gli elenchi delle consegnate e delle iniziate e, se e'\n  // l'alunno di questa pagina, la bozza in memoria coi salvataggi in partenza.\n  // (25/09/2026) Via anche le copie dei compiti col formato di prima del 24/09 (cf_lavoroC_) e la bozza in memoria\n  // anche se la pagina e' nei compiti: dal 24/09 il foglio e' uno solo e dopo il Reset fa testo solo il cloud.\n  // Prima quelle copie sopravvivevano e tornavano su (il 1.000 di Becattini in PROVA, 25/09).\n  function buttaLavoroAzzerato(pin){\n    if(!pin) return;\n    try{\n      localStorage.removeItem('cf_consegnate_' + pin); localStorage.removeItem('cf_iniziate_' + pin);\n      var rm = [];\n      for(var i = 0; i \u003c localStorage.length; i++){\n        var k = localStorage.key(i);\n        if(k && (k.indexOf('cf_lavoro_' + pin + '_') === 0 || k.indexOf('cf_lavoroE_' + pin + '_') === 0 || k.indexOf('cf_lavoroC_' + pin + '_') === 0)) rm.push(k);\n      }\n      rm.forEach(function(k){ localStorage.removeItem(k); });\n    }catch(e){}\n    if(STATE.studente && STATE.studente.pin === pin){\n      if(STATE.saveTimer){ clearTimeout(STATE.saveTimer); STATE.saveTimer = null; }\n      if(STATE.bozzaCloudTimer){ clearTimeout(STATE.bozzaCloudTimer); STATE.bozzaCloudTimer = null; }\n      if(STATE.bozzaRiprovaTimer){ clearTimeout(STATE.bozzaRiprovaTimer); STATE.bozzaRiprovaTimer = null; }\n      STATE.bozzaMappa = {}; STATE.bozzaDaRimandare = false;\n    }\n  }\n  // Confronta il contrassegno del cloud con l'ultimo che QUESTO dispositivo ha visto per quel PIN. Se e' cambiato\n  // (c'e' stato un Reset da allora, magari a telefono spento) butta il lavoro vecchio prima che il foglio si apra.\n  // true = era cambiato. tok non stringa = il cloud non l'ha detto (pagina o porta vecchia): non faccio niente.\n  function allineaAzzeramento(pin, tok){\n    if(!pin || typeof tok !== 'string') return false;\n    var visto = null; try{ visto = localStorage.getItem('cf_azz_' + pin); }catch(e){}\n    if(visto === tok) return false;\n    var cambiato = (visto !== null || tok !== '');\n    if(cambiato) buttaLavoroAzzerato(pin);\n    try{ localStorage.setItem('cf_azz_' + pin, tok); }catch(e){}\n    return cambiato;\n  }\n  // Il contrassegno che questo alunno conosceva entrando: viaggia con la bozza, e la porta la rifiuta se e' superato.\n  function azzMio(){ return (typeof STATE.azzVisto === 'string') ? STATE.azzVisto : null; }\n  function pushBozzaCloud(){\n    if(!SB || !STATE.studente || !STATE.proprietario || STATE.esercitazione) return;   // anche i compiti salgono nel cloud (24/09/2026)\n    if(!STATE.bozzaLetta) return;   // non so ancora cosa c'e' nel cloud: scrivere ora cancellerebbe le altre bozze\n    // UN INVIO ALLA VOLTA (19/09/2026). La bozza e' la richiesta piu' pesante dell'app (tutta la fotografia del\n    // foglio: 20-30 KB). Con la rete lenta ne partivano diverse insieme, e una VECCHIA poteva arrivare dopo una\n    // nuova e rimettere nel cloud la versione di prima. Ora se un invio e' per strada mi segno che c'e' altro da\n    // mandare, e appena quello torna riparto con la versione piu' recente.\n    if(STATE.bozzaInVolo && (Date.now() - STATE.bozzaInVolo) \u003c 30000){ STATE.bozzaDaRimandare = true; return; }\n    STATE.bozzaInVolo = Date.now(); STATE.bozzaDaRimandare = false;\n    var pin = STATE.studente.pin;\n    var riprova = function(){\n      // Con poco campo la scrittura ogni tanto non parte. Riprovo da solo, in silenzio, sempre con la versione\n      // PIÙ RECENTE del lavoro (rileggo STATE.bozzaMappa al momento del tentativo). L'alunno non vede niente:\n      // il suo lavoro e' gia' al sicuro nel telefono. (18/09/2026)\n      if(STATE.bozzaRiprovaTimer) return;\n      STATE.bozzaRiprovaTimer = setTimeout(function(){ STATE.bozzaRiprovaTimer = null; pushBozzaCloud(); }, 4000);\n    };\n    try{\n      SB.rpc('cf_bozza_salva', { p_pin: pin, p_sess: sessMia(), p_dispositivo: idDispositivo(), p_bozza: (STATE.bozzaMappa || {}), p_azz: azzMio() })\n        .then(function(res){\n          STATE.bozzaInVolo = 0;\n          if(!res || res.error || res.data !== true){ riprova(); return; }\n          if(STATE.bozzaRiprovaTimer){ clearTimeout(STATE.bozzaRiprovaTimer); STATE.bozzaRiprovaTimer = null; }\n          if(STATE.bozzaDaRimandare){ STATE.bozzaDaRimandare = false; pushBozzaCloud(); }\n        }, function(){ STATE.bozzaInVolo = 0; riprova(); });\n    }catch(e){ STATE.bozzaInVolo = 0; riprova(); }\n  }\n  // Alla CHIUSURA della pagina l'invio normale verrebbe troncato a meta' (e se ce n'e' gia' uno per strada non\n  // partirebbe nemmeno): la bozza parte con `keepalive`, che il browser spedisce anche a pagina morta. Vale fino\n  // a 60 KB (limite del browser); oltre si ripiega sull'invio normale, che e' meglio di niente.\n  function pushBozzaSubito(){\n    try{\n      if(!SB || !STATE.studente || !STATE.proprietario || STATE.esercitazione || !STATE.bozzaLetta) return;\n      var corpo = { p_pin: STATE.studente.pin, p_sess: sessMia(), p_dispositivo: idDispositivo(), p_bozza: (STATE.bozzaMappa || {}), p_azz: azzMio() };\n      if(JSON.stringify(corpo).length \u003c 55000) rpcSubito('cf_bozza_salva', corpo);\n      else { STATE.bozzaInVolo = 0; pushBozzaCloud(); }\n    }catch(e){}\n  }\n  /* METTE AL SICURO GLI ULTIMI TASTI prima che la sessione si chiuda (Esci, Sospendi, chiusura della pagina,\n     consegna forzata dal docente): il salvataggio automatico aspetta 600 ms dopo l'ultimo tasto e l'invio al\n     cloud altri 1.500, e chi chiudeva in quella finestra lasciava fuori l'ultima cosa scritta. Va chiamata\n     PRIMA di toccare lo stato (STATE.studente, assegnataId…), altrimenti non sa piu' di chi e' il lavoro. */\n  function mettiAlSicuroLavoro(){\n    try{\n      if(STATE.saveTimer){ clearTimeout(STATE.saveTimer); STATE.saveTimer = null; }\n      if(STATE.caricamentoFoglio) return;                       // foglio ancora in caricamento: non e' lavoro suo\n      if(!STATE.studente || !STATE.assegnataId) return;\n      if(byId('editor').style.display === 'none') return;       // non e' sul foglio: non c'e' niente di nuovo da salvare\n      salvaLavoro();\n      if(STATE.bozzaCloudTimer){ clearTimeout(STATE.bozzaCloudTimer); STATE.bozzaCloudTimer = null; }\n      pushBozzaCloud();\n    }catch(e){}\n  }\n  function salvaLavoro(){\n    try{\n      if(!STATE.studente || STATE.consegnata) return;\n      if(STATE.caricamentoFoglio) return;                       // foglio ancora in caricamento: quello che si vede non e' (ancora) il suo lavoro\n      if(!STATE.assegnataId) return;                            // nessun cedolino aperto: non si scrive sotto la chiave «null»\n      var ed = byId('editor');\n      if(!ed || ed.classList.contains('sol-mode')) return;\n      /* (28/09/2026, trovato da Mauro in PROVA con Alunno Cinque) Il foglio aperto in ALLENAMENTO resta\n         dell'allenamento, e quello vero resta vero. Uscendo dall'allenamento con «Torna ai compiti» il salvataggio\n         automatico scattava 200 ms dopo, quando l'app era gia' tornata normale: il foglio vuoto dell'allenamento\n         veniva scritto come foglio vero del cedolino (telefono e cloud). Il cloud lo rifiutava finche' la consegna\n         era chiusa; dopo il Riammetti l'ha preso, e al rientro ha coperto il lavoro consegnato. */\n      var fAll = ed.getAttribute('data-allenamento');\n      if(fAll !== null && (fAll === '1') !== !!STATE.esercitazione) return;\n      commitValues(ed);\n      var ora = Date.now();\n      var htmlOra = ed.innerHTML;\n      /* L'ORARIO DEL FOGLIO E' QUELLO DELL'ULTIMA MODIFICA, NON DELL'ULTIMO SALVATAGGIO (25/09/2026). Fra due copie\n         vince la piu' recente, quindi un foglio rimasto indietro su un dispositivo (una scheda vecchia, un telefono\n         ripreso dopo ore) non deve prendersi l'ora di adesso solo perche' viene salvato uscendo, sospendendo o\n         cambiando schermata: passerebbe davanti al lavoro vero fatto altrove. Se il foglio e' identico all'ultima\n         copia, tiene l'orario di quella; se arriva dal cloud, tiene l'orario del cloud (STATE.tsDaUsare). */\n      var chiaveOra = chiaveLavoro(STATE.studente.pin, STATE.assegnataId);\n      if(typeof STATE.tsDaUsare === 'number' && STATE.tsDaUsare > 0){ ora = STATE.tsDaUsare; }\n      else {\n        try{\n          var prevB0 = STATE.bozzaMappa ? STATE.bozzaMappa[STATE.assegnataId] : null;\n          var prevL0 = null; try{ var rawL0 = localStorage.getItem(chiaveOra); if(rawL0) prevL0 = JSON.parse(rawL0); }catch(eL0){}\n          if(prevB0 && prevB0.html === htmlOra && prevB0.ts) ora = prevB0.ts;\n          else if(prevL0 && prevL0.esercizioId === STATE.assegnataId && prevL0.html === htmlOra && prevL0.ts) ora = prevL0.ts;\n          /* DUE SCHEDE SULLO STESSO TELEFONO (25/09/2026, visto in 5I con Kabbori): una scheda rimasta indietro,\n             quando la classe viene sospesa, risalvava il SUO foglio vecchio e lo rimetteva nel cloud dopo la\n             consegna fatta dall'altra scheda. Se la copia di questo dispositivo e' piu' nuova di quella che ha\n             questa scheda, ed e' diversa, e qui l'alunno non ha toccato niente da allora, questa scheda e' rimasta\n             indietro: non salva. (Stesso dispositivo, stesso orologio: il confronto degli orari e' sicuro.) */\n          var tsMio = (STATE.tsFoglio || {})[chiaveOra];\n          if(prevL0 && prevL0.esercizioId === STATE.assegnataId && prevL0.html !== htmlOra && typeof tsMio === 'number'\n             && (prevL0.ts || 0) > tsMio && !((STATE.ultimoTocco || 0) > tsMio)) return;\n        }catch(eT){}\n      }\n      STATE.tsFoglio = STATE.tsFoglio || {}; STATE.tsFoglio[chiaveOra] = ora;\n      // Il telefono puo' rifiutare la scrittura (memoria piena, navigazione privata): la copia nel cloud deve\n      // partire LO STESSO. Prima stavano nello stesso «try» e saltavano insieme, in silenzio.\n      try{\n      localStorage.setItem(chiaveOra, JSON.s
