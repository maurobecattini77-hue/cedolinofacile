tringify({ esercizioId: STATE.assegnataId, html: htmlOra, ts: ora }));\n      }catch(eLocale){}\n      // Congelamento del tempo: il lavoro in corso di VERIFICA va anche nel cloud, con un piccolo ritardo\n      // (accorpa le raffiche di battitura). Ogni versione porta un ORARIO (ts): al rientro vince la PIÙ RECENTE\n      // fra locale e cloud, così cambiando dispositivo non ricompare più il vecchio al posto dell'ultima scritta.\n      if(!STATE.esercitazione && STATE.proprietario && STATE.assegnataId){\n        STATE.bozzaMappa = STATE.bozzaMappa || {};\n        // «classe»: questo foglio e' stato lavorato in classe (poi nei compiti diventa «Svolto in classe»)\n        var prevB = STATE.bozzaMappa[STATE.assegnataId];\n        STATE.bozzaMappa[STATE.assegnataId] = { html: htmlOra, ts: ora, classe: !!((prevB && prevB.classe) || !STATE.modalitaCompiti || STATE.compitoInClasse) };\n        if(STATE.bozzaCloudTimer) clearTimeout(STATE.bozzaCloudTimer);\n        STATE.bozzaCloudTimer = setTimeout(pushBozzaCloud, 1500);\n      }\n    }catch(e){}\n  }\n\n  /* =========================================================\n     CEDOLINO — il compilatore dell'alunno (dal mockup approvato)\n     Tutto vive dentro CED. Lo stato del foglio viene scritto,\n     a ogni ritocco, come JSON nell'attributo data-stato di\n     #ced-stato: la fotografia HTML che l'app salva (locale e\n     cloud) se lo porta dietro, e al ripristino il foglio viene\n     RICOSTRUITO da quel JSON, non rianimato dalla fotografia.\n     ========================================================= */\n  var CED = (function(){\n    var BR2 = String.fromCharCode(10) + String.fromCharCode(10);   // due a capo, per i messaggi di conferma\n    var CESTINO = '\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4 7h16M10 11v6M14 11v6M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3\"/>\u003c/svg>';\n\n    /* Voci del menu principale, in ordine ALFABETICO di proposito: l'ordine giusto\n       del cedolino deve conoscerlo l'alunno, non suggerirglielo l'app. */\n    var VOCI = [\n      {id:'az',      n:'Anagrafica azienda', tipo:'anagrafica'},\n      {id:'dip',     n:'Anagrafica dipendente', tipo:'anagrafica'},\n      {id:'contr',   n:'Contributi previdenziali', tipo:'contributi'},\n      {id:'detr',    n:'Detrazioni', tipo:'detrazioni'},\n      {id:'irpef-l', n:'IRPEF lorda', tipo:'irpef'},\n      {id:'irpef-n', n:'IRPEF netta', tipo:'irpef-netta'},\n      {id:'netto',   n:'Netto in busta', tipo:'netto'},\n      {id:'retr',    n:'Retribuzione', pieno:true},\n      {id:'somma',   n:'Somma integrativa (taglio del cuneo fiscale)', tipo:'somma'}\n    ];\n\n    /* Sotto-voci della retribuzione, anche queste in ordine alfabetico. */\n    var SEZIONI = [\n      {id:'fisse', t:'Voci fisse', s:'uguali ogni mese', voci:[\n        {n:'Contingenza',          d:'Indennità nata per adeguare le paghe al costo della vita, congelata dal 1992'},\n        {n:'E.D.R.',               d:'Elemento distinto della retribuzione: 10,33 euro uguali per quasi tutti dal 1993'},\n        {n:'Minimo tabellare',     d:'La paga base del livello, decisa dal contratto collettivo'},\n        {n:'Scatti di anzianità',  d:'Aumenti che maturano ogni due anni di servizio nella stessa azienda'},\n        {n:'Superminimo',          d:'Somma in più concordata col datore, oltre a quanto prevede il contratto'},\n        {n:'Terzo elemento',       d:'Importo aggiuntivo previsto dai contratti di alcune province'}\n      ]},\n      {id:'variabili', t:'Voci variabili', s:'cambiano di mese in mese', voci:[\n        {n:'Indennità di turno',     d:'Spetta a chi lavora su turni che cambiano'},\n        {n:'Lavoro festivo',         d:'Maggiorazione per le domeniche e i giorni festivi'},\n        {n:'Lavoro notturno',        d:'Maggiorazione per le ore lavorate di notte'},\n        {n:'Premio di produzione',   d:'Somma legata ai risultati dell’azienda o del lavoratore'},\n        {n:'Straordinario diurno',   d:'Ore oltre l’orario normale, pagate con una maggiorazione'},\n        {n:'Straordinario notturno', d:'Ore oltre l’orario normale svolte di notte, con maggiorazione più alta'}\n      ]}\n    ];\n\n    /* perc: l'aliquota con cui l'app calcola l'imposta della riga (25/09/2026). ampiezza: quanto vale lo\n       scaglione nel mese (4.166,67 − 2.333,33), scritta sotto in piccolo: chi lo supera sa che va messo tutto. */\n    var SCAGLIONI = [\n      {annuo:'da 0 a 28.000',        mensile:'da 0 a 2.333,33',        ali:'23 %', perc:'23'},\n      {annuo:'da 28.001 a 50.000',   mensile:'da 2.333,34 a 4.166,67', ali:'33 %', perc:'33', ampiezza:'1.833,34'},\n      {annuo:'oltre 50.000',         mensile:'oltre 4.166,67',         ali:'43 %', perc:'43'}\n    ];\n\n    var VOCI_DETRAZIONI = [\n      {n:'Detrazione per altri familiari a carico',         d:'Ascendenti conviventi', scheda:'altri'},\n      {n:'Detrazione per coniuge a carico',                 d:'Coniuge con reddito fino a 2.840,51 euro', scheda:'coniuge'},\n      {n:'Detrazione per figli a carico',                   d:'Solo dai 21 ai 29 anni', scheda:'figli'},\n      {n:'Detrazione per lavoro dipendente',                d:'Spetta a chi ha un lavoro dipendente', scheda:'lavoro'},\n      {n:'Ulteriore detrazione (taglio del cuneo fiscale)', d:'Solo per certe fasce di reddito', scheda:'cuneo'}\n    ];\n\n    /* Le fasce: la formula la applica l'app, all'alunno tocca capire QUALE fascia\n       e ricavare il reddito annuo presunto. */\n    var FASCE_LAVORO = [\n      {n:'Reddito fino a 15.000',      f:'importo fisso di 1.955',\n       mostra:function(){ return '1.955,00'; }, calcola:function(){ return 1955; }},\n      {n:'Reddito da 15.001 a 28.000', f:'1.910 + 1.190 × (28.000 − reddito) ÷ 13.000',\n       mostra:function(R){ return '1.910 + 1.190 × (28.000 − ' + euro(R) + ') ÷ 13.000'; },\n       calcola:function(R){ return 1910 + 1190 * (28000 - R) / 13000; }},\n      {n:'Reddito da 28.001 a 50.000', f:'1.910 × (50.000 − reddito) ÷ 22.000',\n       mostra:function(R){ return '1.910 × (50.000 − ' + euro(R) + ') ÷ 22.000'; },\n       calcola:function(R){ return 1910 * (50000 - R) / 22000; }},\n      {n:'Reddito oltre 50.000',       f:'non spetta alcuna detrazione',\n       mostra:function(){ return 'non spetta'; }, calcola:function(){ return 0; }}\n    ];\n    var FASCE_CONIUGE = [\n      {n:'Reddito fino a 15.000',      f:'800 − 110 × (reddito ÷ 15.000)',\n       mostra:function(R){ return '800 − 110 × (' + euro(R) + ' ÷ 15.000)'; },\n       calcola:function(R){ return 800 - 110 * (R / 15000); }},\n      {n:'Reddito da 15.001 a 40.000', f:'importo fisso di 690',\n       mostra:function(){ return '690,00'; }, calcola:function(){ return 690; }},\n      {n:'Reddito da 40.001 a 80.000', f:'690 × (80.000 − reddito) ÷ 40.000',\n       mostra:function(R){ return '690 × (80.000 − ' + euro(R) + ') ÷ 40.000'; },\n       calcola:function(R){ return 690 * (80000 - R) / 40000; }},\n      {n:'Reddito oltre 80.000',       f:'non spetta alcuna detrazione',\n       mostra:function(){ return 'non spetta'; }, calcola:function(){ return 0; }}\n    ];\n    var FASCE_FIGLI = [\n      {n:'Reddito fino a 95.000', f:'950 × (95.000 − reddito) ÷ 95.000',\n       mostra:function(R){ return '950 × (95.000 − ' + euro(R) + ') ÷ 95.000'; },\n       calcola:function(R){ return 950 * (95000 - R) / 95000; }},\n      {n:'Reddito oltre 95.000',  f:'non spetta alcuna detrazione',\n       mostra:function(){ return 'non spetta'; }, calcola:function(){ return 0; }}\n    ];\n    var FASCE_ALTRI = [\n      {n:'Reddito fino a 80.000', f:'750 × (80.000 − reddito) ÷ 80.000',\n       mostra:function(R){ return '750 × (80.000 − ' + euro(R) + ') ÷ 80.000'; },\n       calcola:function(R){ return 750 * (80000 - R) / 80000; }},\n      {n:'Reddito oltre 80.000',  f:'non spetta alcuna detrazione',\n       mostra:function(){ return 'non spetta'; }, calcola:function(){ return 0; }}\n    ];\n    var FASCE_CUNEO = [\n      {n:'Reddito da 20.001 a 32.000', f:'importo fisso di 1.000',\n       mostra:function(){ return '1.000,00'; }, calcola:function(){ return 1000; }},\n      {n:'Reddito da 32.001 a 40.000', f:'1.000 × (40.000 − reddito) ÷ 8.000',\n       mostra:function(R){ return '1.000 × (40.000 − ' + euro(R) + ') ÷ 8.000'; },\n       calcola:function(R){ return 1000 * (40000 - R) / 8000; }},\n      {n:'Reddito oltre 40.000',       f:'non spetta alcuna detrazione',\n       mostra:function(){ return 'non spetta'; }, calcola:function(){ return 0; }}\n    ];\n    var FASCE_SOMMA = [\n      {n:'Reddito fino a 8.500',       f:'7,1 % del reddito',\n       mostra:function(R){ return '7,1 % × ' + euro(R); }, calcola:function(R){ return R * 0.071; }},\n      {n:'Reddito da 8.501 a 15.000',  f:'5,3 % del reddito',\n       mostra:function(R){ return '5,3 % × ' + euro(R); }, calcola:function(R){ return R * 0.053; }},\n      {n:'Reddito da 15.001 a 20.000', f:'4,8 % del reddito',\n       mostra:function(R){ return '4,8 % × ' + euro(R); }, calcola:function(R){ return R * 0.048; }},\n      {n:'Reddito oltre 20.000',       f:'non spetta alcuna somma',\n       mostra:function(){ return 'non spetta'; }, calcola:function(){ return 0; }}\n    ];\n    var SCHEDE = {\n      lavoro: { fasce: FASCE_LAVORO,\n        /* Art. 13 TUIR: sopra i 25.000 e fino a 35.000 la detrazione cresce di 65 euro.\n           In busta ci pensa il sistema, quindi la aggiunge l'app. */\n        maggiorazione: function(R){ return (R > 25000 && R \u003c= 35000) ? {importo:65, testo:'redditi da 25.000 a 35.000'} : null; },\n        spiega: 'La detrazione dipende da quanto guadagni in \u003cb>un anno intero\u003c/b>. ' +\n                'Ricava il \u003cb>reddito annuo presunto\u003c/b> dall’imponibile fiscale del mese.' },\n      coniuge: { fasce: FASCE_CONIUGE,\n        maggiorazione: function(R){\n          var t = [[29000,29200,10,'da 29.000 a 29.200'],[29200,34700,20,'da 29.200 a 34.700'],\n                   [34700,35000,30,'da 34.700 a 35.000'],[35000,35100,20,'da 35.000 a 35.100'],\n                   [35100,35200,10,'da 35.100 a 35.200']];\n          for(var i=0;i\u003ct.length;i++){ if(R > t[i][0] && R \u003c= t[i][1]) return {importo:t[i][2], testo:'redditi ' + t[i][3]}; }\n          return null; },\n        spiega: 'Spetta se il coniuge guadagna al massimo \u003cb>2.840,51 euro l’anno\u003c/b>; l’importo però dipende dal \u003cb>tuo\u003c/b> reddito annuo, non da quello del coniuge: ' +\n                'più guadagni, meno detrazione ti spetta.' },\n      figli: { fasce: FASCE_FIGLI,\n        spiega: 'Spetta solo per i figli \u003cb>dai 21 ai 29 anni\u003c/b> che guadagnano al massimo 2.840,51 euro l’anno (4.000 fino a 24 anni): per i più piccoli c’è l’assegno unico, ' +\n                'che l’INPS versa sul conto e non passa dalla busta paga. La formula vale \u003cb>per un figlio\u003c/b>; ' +\n                'con più figli il limite di 95.000 sale di 15.000 per ciascuno dopo il primo.' },\n      altri: { fasce: FASCE_ALTRI,\n        spiega: 'Dal 2025 spetta soltanto per gli \u003cb>ascendenti\u003c/b> — genitori e nonni — che vivono con te.' },\n      cuneo: { fasce: FASCE_CUNEO,\n        spiega: 'Spetta soltanto a chi ha un reddito annuo tra 20.000 e 40.000 euro.' },\n      somma: { fasce: FASCE_SOMMA, lblAnnua:'Somma annua', lblMese:'Somma del mese',\n        spiega: 'Spetta soltanto a chi ha un reddito annuo fino a 20.000 euro.' }\n    };\n\n    var VOCI_NETTO = [\n      {n:'Addizionale comunale'},\n      {n:'Addizionale regionale'},\n      {n:'IRPEF netta'},\n      {n:'Somma integrativa (taglio del cuneo fiscale)'}\n    ];\n    var ANAGRAFICHE = {\n      az:  {titolo:'Anagrafica azienda', campi:[{l:'Ragione sociale', larga:true},{l:'Comune'}]},\n      dip: {titolo:'Anagrafica dipendente', campi:[\n        {l:'Cognome e nome', larga:true},{l:'Qualifica'},{l:'Livello', corto:true},\n        {l:'CCNL applicato', larga:true},{l:'Mese del cedolino'},{l:'Anno del cedolino', corto:true}]}\n    };\n    /* I passaggi attesi della soluzione (archivio): etichette in ordine di cedolino. */\n    var PASSI_SOLUZIONE = [\n      ['retribuzione','Retribuzione'],\n      ['contributi','Contributi previdenziali'],\n      ['imponibileFiscale','Imponibile fiscale'],\n      ['irpefLorda','IRPEF lorda'],\n      ['detrazioni','Detrazioni'],\n      ['irpefNetta','IRPEF netta'],\n      ['addizionaleRegionaleRata','Addizionale regionale'],\n      ['addizionaleComunaleRata','Addizionale comunale']\n    ];\n\n    var creati = {};\n    var aperto = null;\n    var SCORCIATOIE = [];\n    var MUTO = false;   /* ricostruzione in sola lettura (Valuta, soluzione): niente avviso al salvataggio */\n    var REDDITO = '';   /* reddito annuo presunto: vale per Detrazioni e Voci integrative */\n    /* (25/09/2026, richiesta di Mauro) Il reddito presunto non si scrive piu': l'alunno mette il reddito fiscale\n       del mese e il numero delle mensilita', il × c'e' gia', il risultato lo calcola l'app (REDDITO). Si scrive\n       in uno dei due blocchi a fasce e compare uguale nell'altro. */\n    var RED_FISC = '', RED_MENS = '';\n    var pulsantiVoce = {};\n\n    function byIdC(id){ return document.getElementById(id); }\n    function redditoPresunto(){ var n = leggiNumero(REDDITO); return n === null ? 0 : n; }\n    function presuntoDaParti(){ var v = prodottoAlCentesimo(RED_FISC, RED_MENS, 1); return v === null ? '' : euro(v); }\n    /* I due numeri presi dal blocco dove l'alunno li scrive: gli altri blocchi li mostrano uguali e tutte le fasce\n       si rifanno (dal 26/09 non ci sono piu' conferme da ridare: i totali seguono da soli). */\n    function cambiaPresunto(da){\n      REDDITO = presuntoDaParti();\n      var bh = blocchiEl(); if(!bh) return;\n      bh.querySelectorAll('input[data-red-fisc]').forEach(function(i){ if(i !== da) i.value = RED_FISC; });\n      bh.querySelectorAll('input[data-red-mens]').forEach(function(i){ if(i !== da) i.value = RED_MENS; });\n      bh.querySelectorAll('[data-red-ris]').forEach(function(s){ s.textContent = REDDITO || '0,00'; });\n      bh.querySelectorAll('.riga-detrazione').forEach(function(x){ if(x._ricalcola) x._ricalcola(); });\n    }\n    /* Legge dai dati salvati di un blocco a fasce i due numeri e il reddito. Fogli di prima del 25/09: c'e' solo\n       il reddito scritto a mano, e resta quello finche' l'alunno non scrive i due numeri. */\n    function prendiPresunto(init){\n      if(init && (init.redFisc != null || init.mens != null)){ RED_FISC = init.redFisc || ''; RED_MENS = init.mens || ''; }\n      if(init && init.reddito) REDDITO = init.reddito;\n      if(!MUTO && presuntoDaParti()) REDDITO = presuntoDaParti();\n    }\n    function creaPresunto(){\n      var w = document.createElement('div');\n      w.className = 'presunto';\n      w.innerHTML =\n        '\u003cp class=\"detr-spiega\">Detrazioni e somma integrativa si calcolano sul reddito di un \u003cb>anno intero\u003c/b>, che si stima così: ' +\n          'il \u003cb>reddito fiscale del mese\u003c/b> (l’imponibile fiscale che hai calcolato sopra) per il \u003cb>numero delle mensilità\u003c/b> ' +\n          'previste dal contratto. Il risultato è il \u003cb>reddito annuo presunto\u003c/b>: lo calcola l’app.\u003c/p>' +\n        '\u003cdiv class=\"presunto-conto\">' +\n          '\u003cdiv class=\"campo campo-fisc\">\u003clabel>Reddito fiscale del mese\u003c/label>' +\n            '\u003cdiv class=\"imp\">\u003cinput type=\"text\" inputmode=\"decimal\" placeholder=\"0,00\" aria-label=\"Reddito fiscale del mese\" data-red-fisc />\u003c/div>\u003c/div>' +\n          '\u003cdiv class=\"operatore\">×\u003c/div>' +\n          '\u003cdiv class=\"campo campo-mens\">\u003clabel>Numero di mensilità\u003c/label>' +\n            '\u003cdiv class=\"imp\">\u003cinput type=\"text\" inputmode=\"numeric\" placeholder=\"0\" aria-label=\"Numero di mensilità\" data-red-mens />\u003c/div>\u003c/div>' +\n          '\u003cdiv class=\"presunto-ris\">\u003cdiv class=\"operatore\">=\u003c/div>' +\n            '\u003cdiv class=\"campo campo-ris\">\u003clabel>Reddito annuo presunto\u003c/label>' +\n            '\u003cdiv class=\"presunto-val\" data-red-ris>0,00\u003c/div>\u003c/div>\u003c/div>' +\n        '\u003c/div>';\n      var inF = w.querySelector('[data-red-fisc]'), inM = w.querySelector('[data-red-mens]');\n      inF.value = RED_FISC; inM.value = RED_MENS;\n      w.querySelector('[data-red-ris]').textContent = REDDITO || '0,00';\n      inF.addEventListener('input', function(){ RED_FISC = inF.value; cambiaPresunto(inF); aggiorna(); });\n      inM.addEventListener('input', function(){ RED_MENS = inM.value; cambiaPresunto(inM); aggiorna(); });\n      return w;\n    }\n    function blocchiEl(){ return byIdC('blocchi'); }\n    function euro(n){ return n.toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:true}); }\n    /* (19/09/2026) IL PUNTO DEL TASTIERINO. Molti telefoni sul tastierino dei numeri hanno il punto e non la\n       virgola: chi scriveva «1850.50» si ritrovava «185.050,00», perche' ogni punto veniva preso per il punto\n       delle migliaia. Ora UN SOLO punto, senza virgole, seguito in fondo da una o due cifre vale come virgola\n       («1850.50», «9.19», «12.5»). Tre cifre dopo il punto restano migliaia («1.508» = millecinquecentootto). */\n    function leggiNumero(v){\n      var s = String(v).trim();\n      if(s.indexOf(',') === -1 && /^-?\\d+\\.\\d{1,2}$/.test(s)) s = s.replace('.', ',');\n      var n = parseFloat(s.replace(/\\./g,'').replace(',','.'));\n      return isNaN(n) ? null : n;\n    }\n    /* (25/09/2026) I CONTI CHE FA L'APP (contributi, imposta degli scaglioni, reddito presunto) si fanno sulle\n       cifre scritte, senza la virgola mobile del computer, e si arrotondano al centesimo come a mano: da 5 in\n       su per eccesso (212,3542 -> 212,35; 536,6659 -> 536,67; 0,525 -> 0,53). Il numero si legge come fa\n       leggiNumero (anche il punto del tastierino). null se una delle due caselle non e' un numero. */\n    function decimaleEsatto(v){\n      var s = String(v == null ? '' : v).trim();\n      if(s.indexOf(',') === -1 && /^-?\\d+\\.\\d{1,2}$/.test(s)) s = s.replace('.', ',');\n      s = s.replace(/\\./g, '').replace(',', '.');\n      if(!/^-?\\d+(\\.\\d+)?$/.test(s)) return null;\n      var neg = s.charAt(0) === '-'; if(neg) s = s.slice(1);\n      var p = s.split('.'), dec = p[1] || '';\n      return { n: BigInt((neg ? '-' : '') + p[0] + dec), scala: dec.length };\n    }\n    function prodottoAlCentesimo(a, b, diviso){   /* a × b ÷ diviso, arrotondato al centesimo */\n      var x = decimaleEsatto(a), y = decimaleEsatto(b);\n      if(!x || !y) return null;\n      var num = x.n * y.n * BigInt(100);\n      var den = BigInt(diviso) * BigInt('1' + '0'.repeat(x.scala + y.scala));\n      var q = num / den, r = num % den;\n      if(r \u003c BigInt(0)) r = -r;\n      if(r * BigInt(2) >= den) q += (num \u003c BigInt(0)) ? BigInt(-1) : BigInt(1);\n      return Number(q) / 100;\n    }\n    function escC(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }\n\n    /* Le tendine stanno appese a un contenitore sul \u003cbody> (fuori dall'editor:\n       cosi' NON finiscono nella fotografia salvata) e vengono piazzate a mano. */\n    function tendineHost(){\n      var h = byIdC('ced-tendine');\n      if(!h){ h = document.createElement('div'); h.id = 'ced-tendine'; h.className = 'cedolino'; document.body.appendChild(h); }\n      return h;\n    }\n    function chiudi(){\n      if(!aperto) return;\n      aperto.menu.hidden = true;\n      if(aperto.btn) aperto.btn.setAttribute('aria-expanded','false');\n      aperto = null;\n    }\n    function piazza(btn, menu){\n      var b = btn.getBoundingClientRect();\n      var margine = 12, stacco = 6;\n      var sotto = window.innerHeight - b.bottom - margine;\n      var sopra = b.top - margine;\n      var versoAlto = sotto \u003c 220 && sopra > sotto;\n      var spazio = (versoAlto ? sopra : sotto) - stacco;\n      menu.style.maxHeight = Math.max(140, Math.min(420, spazio)) + 'px';\n      var alt = menu.offsetHeight;\n      var y = versoAlto ? b.top - stacco - alt : b.bottom + stacco;\n      y = Math.min(y, window.innerHeight - margine - alt);\n      menu.style.top = Math.max(margine, y) + 'px';\n      var lar = menu.offsetWidth;\n      var x = b.left;\n      if(x + lar > window.innerWidth - margine) x = window.innerWidth - margine - lar;\n      menu.style.left = Math.max(margine, x) + 'px';\n    }\n    function apri(btn, menu){\n      if(aperto && aperto.menu === menu){ chiudi(); return; }\n      chiudi();\n      menu.hidden = false;\n      piazza(btn, menu);\n      if(btn) btn.setAttribute('aria-expanded','true');\n      aperto = {btn:btn, menu:menu};\n    }\n    window.addEventListener('scroll', function(e){\n      if(aperto && e.target && e.target.nodeType === 1 && aperto.menu.contains(e.target)) return;\n      chiudi();\n    }, true);\n    window.addEventListener('resize', chiudi);\n    document.addEventListener('click', function(e){\n      if(aperto && !aperto.menu.contains(e.target) && !(aperto.btn && aperto.btn.contains(e.target))) chiudi();\n    });\n    document.addEventListener('keydown', function(e){ if(e.key === 'Escape') chiudi(); });\n    /* Quando l'alunno esce da una casella-importo del cedolino, il numero si riscrive\n       col punto delle migliaia e i due decimali: colonne sempre incolonnate. */\n    document.addEventListener('blur', function(e){\n      var el = e.target;\n      if(!el || el.tagName !== 'INPUT' || el.getAttribute('inputmode') !== 'decimal') return;\n      if(!el.closest || !el.closest('#ced-editor')) return;\n      var grezzo = el.value.trim();\n      if(grezzo === '') return;\n      var n = leggiNumero(grezzo);\n      if(n === null) return;\n      var bello = euro(n);\n      if(bello !== grezzo){ el.value = bello; el.dispatchEvent(new Event('input', {bubbles:true})); }\n    }, true);\n\n    /* (19/09/2026) DUE PROTEZIONI SUI CESTINI.\n       - Doppio tocco: tolta una riga, quella sotto sale allo stesso posto col cestino nello stesso punto, e il\n         secondo tocco (sul telefono capita) cancellava anche lei. Mezzo secondo di guardia fra un cestino e l'altro.\n       - Blocco intero: il cestino del blocco portava via tutto subito, senza chiedere, e sta a un dito dal totale.\n         Ora, SE nel blocco c'e' qualcosa di compilato, chiede conferma (la stessa che c'e' gia' per le sezioni\n         «Voci fisse» / «Voci variabili»). Un blocco vuoto sparisce subito come prima. */\n    var ultimoCestino = 0;\n    function cestinoOk(){ var t = Date.now(); if(t - ultimoCestino \u003c 500) return false; ultimoCestino = t; return true; }\n    function bloccoCompilato(bl){\n      try{\n        if(Array.prototype.some.call(bl.querySelectorAll('input'), function(i){ return (i.value || '').trim() !== ''; })) return true;\n        if(Array.prototype.some.call(bl.querySelectorAll('[data-riga]'), function(r){ return !!r._segno; })) return true;\n        var st = bl._leggi ? bl._leggi() : null;\n        if(st && Array.isArray(st.righe) && st.righe.some(function(x){ return x && (x.scheda || x.n); })) return true;\n      }catch(e){}\n      return false;\n    }\n    function eliminaBlocco(bl, id, nome){\n      if(!cestinoOk()) return;\n      if(bl.closest && bl.closest('.sol-mode')) return;   // nella vista della soluzione il foglio e' di sola lettura\n      var vai = function(){ butta(bl); creati[id] = false; sbloccaVoce(id); aggiorna(); };\n      if(!bloccoCompilato(bl)){ vai(); return; }\n      showConfirm('Eliminare tutto il blocco «' + nome + '»?' + BR2 + 'Sparisce quello che hai già compilato lì dentro.' + BR2 + 'Il blocco lo puoi rimettere da «＋ Inserisci voce», ma dovrai riscriverlo.', vai);\n    }\n    function butta(nodo){\n      chiudi();\n      var righe = nodo.hasAttribute('data-riga') ? [nodo] : Array.prototype.slice.call(nodo.querySelectorAll('[data-riga]'));\n      righe.forEach(function(r){ (r._tendine || []).forEach(function(t){ if(t && t.parentNode) t.parentNode.removeChild(t); }); });\n      nodo.remove();\n    }\n\n    function creaMenu(voci, scegli){\n      var m = document.createElement('div');\n      m.className = 'menu';\n      m.hidden = true; m.setAttribute('role','menu');\n      voci.forEach(function(v){\n        if(v.titolo){ var h = document.createElement('div'); h.className='mh'; h.textContent=v.titolo; m.appendChild(h); return; }\n        var b = document.createElement('button');\n        b.type = 'button';\n        b.innerHTML = esc(v.n) + (v.d ? '\u003cspan class=\"d\">' + esc(v.d) + '\u003c/span>' : '');\n        b.addEventListener('click', function(){ chiudi(); scegli(v, b); });\n        m.appendChild(b);\n      });\n      tendineHost().appendChild(m);\n      return m;\n    }\n\n    /* ---------- il selettore del segno ---------- */\n    function creaSegno(r){\n      var seg = document.createElement('div');\n      seg.className = 'segno';\n      var cur = document.createElement('button');\n      cur.type='button'; cur.className='cur da-fare'; cur.textContent='±';\n      cur.setAttribute('aria-label','Scegli se questa voce si somma o si sottrae');\n      cur.setAttribute('aria-expanded','false');\n      var scelte = document.createElement('div');\n      scelte.className='scelte'; scelte.hidden = true;\n      function applica(sg){\n        r._segno = sg;\n        cur.textContent = (sg === 1) ? '+' : '−';\n        cur.className = 'cur ' + (sg === 1 ? 'p' : 'm');\n        if(r._dopoSegno) r._dopoSegno();\n      }\n      /* niente riga grigia sotto: il «totale» a cui si riferiva non c'e' piu' (15/09) */\n      [['+','p','Si somma'],['−','m','Si sottrae']].forEach(function(o){\n        var b = document.createElement('button');\n        b.type='button';\n        b.innerHTML = '\u003cspan class=\"sg ' + o[1] + '\">' + o[0] + '\u003c/span>\u003cspan>' + o[2] + '\u003c/span>';\n        b.addEventListener('click', function(){ chiudi(); applica(o[1] === 'p' ? 1 : -1); aggiorna(); });\n        scelte.appendChild(b);\n      });\n      cur.addEventListener('click', function(){ apri(cur, scelte); });\n      seg.appendChild(cur);\n      tendineHost().appendChild(scelte);\n      return {el:seg, tendina:scelte, set:applica, cur:cur};\n    }\n\n    /* Il segno prima di tutto (collaudo del 15/09: se l'e' scordato perfino il prof).\n       Finche' la riga non ha il segno, i suoi importi restano chiusi e, se ci si clicca\n       sopra, il ± lampeggia. Non suggerisce QUALE segno: obbliga solo a sceglierlo. */\n    function lampeggia(cur){\n      cur.classList.remove('richiamo');\n      void cur.offsetWidth;   /* riparte l'animazione anche se era gia' partita */\n      cur.classList.add('richiamo');\n      clearTimeout(cur._spegni);\n      cur._spegni = setTimeout(function(){ cur.classList.remove('richiamo'); }, 1400);\n    }\n    /* Prima di aggiungere qualsiasi cosa: se c'e' una voce senza segno si torna li', non si va avanti. */\n    function segnoMancante(){\n      var bh = blocchiEl(); if(!bh) return false;\n      var prima = null;\n      bh.querySelectorAll('[data-riga]').forEach(function(r){ if(!prima && r._senzaSegno && r._senzaSegno()) prima = r; });\n      if(!prima) return false;\n      var cur = prima._curSegno;\n      (cur || prima).scrollIntoView({block:'center', behavior:'smooth'});\n      if(cur) lampeggia(cur);\n      return true;\n    }\n    function primaIlSegno(r, sg, caselle){\n      r._curSegno = sg.cur;\n      function richiama(){ lampeggia(sg.cur); }\n      function stato(){\n        caselle.forEach(function(i){\n          i.readOnly = !r._segno;\n          i.classList.toggle('attende-segno', !r._segno);\n          if(r._segno) i.removeAttribute('title'); else i.title = 'Prima scegli il segno';\n        });\n      }\n      caselle.forEach(function(i){\n        i.addEventListener('mousedown', function(){ if(!r._segno) richiama(); });\n        i.addEventListener('focus', function(){ if(!r._segno) richiama(); });\n      });\n      r._dopoSegno = stato;\n      stato();\n    }\n\n    /* ---------- una riga della retribuzione ---------- */\n    function creaRiga(sezione, init){\n      var r = document.createElement('div');\n      r.className = 'riga';\n      r.setAttribute('data-riga','');\n      r._segno = null;\n      r._sezione = sezione;\n\n      var sg = creaSegno(r);\n      var seg = sg.el, scelte = sg.tendina;\n\n      var vc = document.createElement('div');\n      vc.className = 'voce';\n      var vcur = document.createElement('button');\n      vcur.type='button'; vcur.className='cur vuota';\n      vcur.innerHTML = '\u003cspan class=\"n\">Scegli la voce…\u003c/span>';\n      vcur.setAttribute('aria-expanded','false');\n      function setVoce(v){\n        r._nome = v.n;\n        vcur.className = 'cur';\n        vcur.innerHTML = '\u003cspan class=\"n\">' + esc(v.n) + '\u003c/span>' + (v.d ? '\u003cspan class=\"d\">' + esc(v.d) + '\u003c/span>' : '');\n      }\n      var vmenu = creaMenu(\n        [{titolo: sezione.t + ' — ' + sezione.s}].concat(sezione.voci),\n        function(v){ setVoce(v); aggiorna(); }\n      );\n      vcur.addEventListener('click', function(){ apri(vcur, vmenu); });\n      vc.appendChild(vcur);\n\n      var imp = document.createElement('div');\n      imp.className = 'imp';\n      var inp = document.createElement('input');\n      inp.type='text'; inp.inputMode='decimal'; inp.placeholder='0,00';\n      inp.setAttribute('aria-label','Importo della voce');\n      inp.addEventListener('input', aggiorna);\n      imp.appendChild(inp);   /* niente simbolo dell'euro: sui cedolini veri non c'è mai */\n\n      var ic = document.createElement('div');\n      ic.className = 'ic';\n      var mw = document.createElement('div'); mw.className='mwrap';\n      var bpiu = document.createElement('button');\n      bpiu.type='button'; bpiu.title='Inserisci una riga qui'; bpiu.setAttribute('aria-label','Inserisci una riga sopra o sotto questa');\n      bpiu.innerHTML = '\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 5v14M5 12h14\"/>\u003c/svg>';\n      var mpiu = creaMenu([\n        {titolo:'Inserisci una riga'},\n        {n:'Sopra questa', d:'La nuova riga va prima'},\n        {n:'Sotto questa', d:'La nuova riga va dopo'}\n      ], function(v){\n        var nuova = creaRiga(sezione);\n        if(v.n === 'Sopra questa') r.parentNode.insertBefore(nuova, r);\n        else r.parentNode.insertBefore(nuova, r.nextSibling);\n        aggiorna();\n      });\n      bpiu.addEventListener('click', function(){ if(segnoMancante()) return; apri(bpiu, mpiu); });\n      mw.appendChild(bpiu);\n\n      var bdel = document.createElement('button');\n      bdel.type='button'; bdel.className='del'; bdel.title='Elimina questa riga';\n      bdel.setAttribute('aria-label','Elimina questa riga');\n      bdel.innerHTML = CESTINO;\n      bdel.addEventListener('click', function(){ if(!cestinoOk()) return; butta(r); aggiorna(); });\n\n      ic.appendChild(mw); ic.appendChild(bdel);\n\n      r.appendChild(seg); r.appendChild(vc); r.appendChild(imp); r.appendChild(ic);\n      r._tendine = [scelte, vmenu, mpiu];\n      primaIlSegno(r, sg, [inp]);\n\n      r._valore = function(){\n        if(!r._segno) return 0;\n        var n = leggiNumero(inp.value);\n        return n === null ? 0 : n * r._segno;\n      };\n      r._senzaSegno = function(){ return !r._segno && !!r._nome; };\n      r._leggi = function(){ return { s:(r._segno || 0), n:(r._nome || null), v:inp.value }; };\n\n      if(init){\n        if(init.s === 1 || init.s === -1) sg.set(init.s);\n        if(init.n){ var vv = null; sezione.voci.forEach(function(x){ if(x.n === init.n) vv = x; }); if(vv) setVoce(vv); else setVoce({n:init.n}); }\n        if(init.v) inp.value = init.v;\n      }\n      return r;\n    }\n\n    /* ---------- blocco RETRIBUZIONE ---------- */\n    function creaSezione(cfg, initRighe, onCambio){\n      var s = document.createElement('div');\n      s.className = 'sotto';\n      s.setAttribute('data-sez', cfg.id);\n      s.innerHTML =\n        '\u003cdiv class=\"sotto-h\">\u003cspan class=\"t\">' + cfg.t + '\u003c/span>' +\n        '\u003cspan class=\"s\" style=\"font-size:12.5px;color:var(--muted);\">' + cfg.s + '\u003c/span>' +\n        '\u003cspan class=\"tot\" data-tot>0,00\u003c/span>\u003c/div>\u003cdiv class=\"sotto-b\">\u003c/div>';\n      var corpo = s.querySelector('.sotto-b');\n\n      var bdel = document.createElement('button');\n      bdel.type='button'; bdel.className='del';\n      bdel.style.cssText = 'width:30px;height:30px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;margin-left:8px;';\n      bdel.title='Elimina «' + cfg.t + '»';\n      bdel.setAttribute('aria-label','Elimina la sezione ' + cfg.t);\n      bdel.innerHTML = CESTINO;\n      /* 18/09/2026: un alunno di 5L si e' ritrovato senza «Voci variabili» e non poteva piu' rimetterle (il\n         menu «Inserisci voce» offre i blocchi, non le sezioni della retribuzione). Ora: se la sezione ha righe\n         gia' compilate chiedo conferma, e in ogni caso resta il pulsante per rimetterla (vedi creaRetribuzione). */\n      bdel.addEventListener('click', function(){\n        var compilate = 0;\n        s.querySelectorAll('[data-riga]').forEach(function(r){\n          if(!r._leggi) return;\n          var d = r._leggi();\n          if((d && d.n) || (d && String(d.v || '').trim())) compilate++;\n        });\n        var vai = function(){ butta(s); aggiorna(); if(typeof onCambio === 'function') onCambio(); };\n        if(compilate && typeof showConfirm === 'function'){\n          showConfirm('Eliminare «' + cfg.t + '»?' + BR2 + 'Spariscono ' + compilate + (compilate === 1 ? ' riga che hai già compilato' : ' righe che hai già compilato') + '.' + BR2 + 'La sezione la puoi rimettere col pulsante «＋ ' + cfg.t + '», ma le righe dovrai riscriverle.', vai);\n          return;\n        }\n        vai();\n      });\n      s.querySelector('.sotto-h').appendChild(bdel);\n\n      var piu = document.createElement('button');\n      piu.type='button'; piu.className='piu';\n      piu.innerHTML = '＋ Aggiungi una riga';\n      piu.addEventListener('click', function(){ if(segnoMancante()) return; corpo.insertBefore(creaRiga(cfg), piu); aggiorna(); });\n\n      if(initRighe){ initRighe.forEach(function(ir){ corpo.appendChild(creaRiga(cfg, ir)); }); }\n      else { corpo.appendChild(creaRiga(cfg)); }\n      corpo.appendChild(piu);\n      return s;\n    }\n    function creaRetribuzione(init){\n      var bl = document.createElement('div');\n      bl.className = 'blocco';\n      bl.innerHTML =\n        '\u003cdiv class=\"blocco-h\">\u003cspan class=\"t\">Retribuzione\u003c/span>' +\n        '\u003cspan class=\"s\">tutto ciò che spetta al lavoratore\u003c/span>' +\n        '\u003cspan class=\"tot\" data-tot>0,00\u003c/span>\u003c/div>\u003cdiv class=\"blocco-b\">\u003c/div>';\n      var corpo = bl.querySelector('.blocco-b');\n\n      var bdelBlocco = document.createElement('button');\n      bdelBlocco.type='button'; bdelBlocco.className='del';\n      bdelBlocco.style.cssText = 'width:32px;height:32px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;margin-left:10px;';\n      bdelBlocco.title='Elimina tutta la retribuzione';\n      bdelBlocco.setAttribute('aria-label','Elimina tutto il blocco Retribuzione');\n      bdelBlocco.innerHTML = CESTINO;\n      bdelBlocco.addEventListener('click', function(){ eliminaBlocco(bl, 'retr', 'Retribuzione'); });\n      bl.querySelector('.blocco-h').appendChild(bdelBlocco);\n\n      // Barra di ripristino: mostra un pulsante per ogni sezione della retribuzione che in questo momento manca.\n      // Sparisce da sola quando ci sono tutte.\n      var barraSez = document.createElement('div');\n      barraSez.className = 'mwrap';\n      barraSez.style.cssText = 'margin-top:10px;';\n      function sincSezioni(){\n        barraSez.innerHTML = '';\n        SEZIONI.forEach(function(cfg){\n          if(corpo.querySelector('.sotto[data-sez=\"' + cfg.id + '\"]')) return;\n          var b = document.createElement('button');\n          b.type = 'button'; b.className = 'piu';\n          b.textContent = '＋ ' + cfg.t;\n          b.title = 'Rimetti la sezione «' + cfg.t + '»';\n          b.addEventListener('click', function(){\n            var nuova = creaSezione(cfg, null, sincSezioni);\n            var dopo = null, passata = false;\n            SEZIONI.forEach(function(c){\n              if(c.id === cfg.id){ passata = true; return; }\n              if(passata && !dopo) dopo = corpo.querySelector('.sotto[data-sez=\"' + c.id + '\"]');\n            });\n            corpo.insertBefore(nuova, dopo || barraSez);\n            sincSezioni(); aggiorna();\n          });\n          barraSez.appendChild(b);\n        });\n        barraSez.style.display = barraSez.children.length ? '' : 'none';\n      }\n\n      if(init && init.sezioni){\n        init.sezioni.forEach(function(sz){\n          var cfg = null; SEZIONI.forEach(function(c){ if(c.id === sz.id) cfg = c; });\n          if(cfg) corpo.appendChild(creaSezione(cfg, sz.righe || [], sincSezioni));\n        });\n      } else {\n        SEZIONI.forEach(function(cfg){ corpo.appendChild(creaSezione(cfg, null, sincSezioni)); });\n      }\n      corpo.appendChild(barraSez);\n      sincSezioni();\n\n      /* (21/09/2026, chiesto da Mauro) Il totale della retribuzione si vedeva solo in alto, nella testata del\n         blocco: arrivati ai contributi i ragazzi non sapevano da quale numero partire. Ora sta anche in fondo,\n         col suo secondo nome, e due righe in grigio dicono a che cosa serve. Il conto dei contributi resta loro. */\n      var strLorda = document.createElement('div');\n      strLorda.className = 'risultato risultato-lorda';\n      strLorda.innerHTML = '\u003cspan class=\"l\">Retribuzione lorda = imponibile previdenziale\u003c/span>' +\n                           '\u003cspan class=\"v\" data-lorda>0,00\u003c/span>';\n      corpo.appendChild(strLorda);\n      var notaLorda = document.createElement('p');\n      notaLorda.className = 'detr-spiega';\n      notaLorda.textContent = 'L’imponibile previdenziale coincide con la retribuzione lorda, cioè con la somma di tutte le voci fisse e variabili. ' +\n                              'È su questo importo che si applica l’aliquota dei contributi previdenziali (di norma il 9,19 %).';\n      corpo.appendChild(notaLorda);\n\n      bl._id = 'retr';\n      bl._leggi = function(){\n        var sezioni = [];\n        corpo.querySelectorAll('.sotto').forEach(function(s){\n          var righe = [];\n          s.querySelectorAll('[data-riga]').forEach(function(r){ if(r._leggi) righe.push(r._leggi()); });\n          sezioni.push({ id:s.getAttribute('data-sez'), righe:righe });\n        });\n        return { sezioni:sezioni };\n      };\n      blocchiEl().appendChild(bl);\n    }\n\n    /* ---------- blocco CONTRIBUTI PREVIDENZIALI ----------\n       La scheda e' lunga e divisa in quattro parti: segno, imponibile, aliquota, importo.\n       L'app NON fa il conto: l'imponibile e la moltiplicazione li fa l'alunno.\n       In fondo mostra l'imponibile fiscale che RISULTA dai numeri suoi. */\n    function creaContributi(init){\n      var bl = document.createElement('div');\n      bl.className = 'blocco';\n      bl.innerHTML =\n        '\u003cdiv class=\"blocco-h\">\u003cspan class=\"t\">Contributi previdenziali\u003c/span>' +\n        '\u003cspan class=\"s\">a carico del lavoratore (INPS)\u003c/span>' +\n        '\u003cspan class=\"tot\" data-tot>0,00\u003c/span>\u003c/div>\u003cdiv class=\"blocco-b\">\u003c/div>';\n      var corpo = bl.querySelector('.blocco-b');\n\n      var bdel = document.createElement('button');\n      bdel.type='button';\n      bdel.style.cssText = 'width:32px;height:32px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;margin-left:10px;';\n      bdel.title='Elimina i contributi';\n      bdel.setAttribute('aria-label','Elimina il blocco Contributi previdenziali');\n      bdel.innerHTML = CESTINO;\n      bdel.addEventListener('click', function(){ eliminaBlocco(bl, 'contr', 'Contributi previdenziali'); });\n      bl.querySelector('.blocco-h').appendChild(bdel);\n\n      var r = document.createElement('div');\n      r.className = 'riga riga-contributi';\n      r.setAttribute('data-riga','');\n      r._segno = null;\n\n      var sg = creaSegno(r);\n      var nome = document.createElement('div');\n      nome.className = 'nome-fisso';\n      nome.innerHTML = '\u003cspan class=\"n\">Contributi previdenziali\u003c/span>';\n\n      function campo(etichetta, segnaposto, suffisso, classe){\n        var c = document.createElement('div');\n        c.className = 'campo' + (classe ? ' ' + classe : '');\n        c.innerHTML = '\u003clabel>' + etichetta + '\u003c/label>' +\n                      '\u003cdiv class=\"imp\">\u003cinput type=\"text\" inputmode=\"decimal\" placeholder=\"' + segnaposto + '\" aria-label=\"' + etichetta + '\" />' +\n                      '\u003cspan class=\"eur\">' + suffisso + '\u003c/span>\u003c/div>';\n        return c;\n      }\n      var cImp = campo('Imponibile previdenziale', 'imponibile previdenziale', '', 'campo-imp');\n      var cAli = campo('Aliquota', '0,00', '%', 'campo-ali');\n      var cTot = campo('Contributi da trattenere', '0,00', '', 'campo-tot');\n\n      var per = document.createElement('div'); per.className='operatore'; per.textContent='×';\n      var ug  = document.createElement('div'); ug.className='operatore'; ug.textContent='=';\n\n      var ic = document.createElement('div');\n      ic.className = 'ic';\n      // (19/09/2026) La riga dei contributi NON ha piu' il suo cestino: e' l'unica riga del blocco e, una volta\n      // buttata, non c'era modo di rimetterla (stesso guaio di «Voci variabili»); al rientro poi ricompariva\n      // vuota e senza segno, e l'avviso «Manca il segno» bloccava tutto il foglio. Per rifare i contributi da\n      // capo c'e' il cestino del blocco. La casella `ic` resta, vuota, per non spostare l'impaginazione.\n\n      r.appendChild(sg.el); r.appendChild(nome);\n      r.appendChild(cImp); r.appendChild(per); r.appendChild(cAli); r.appendChild(ug); r.appendChild(cTot);\n      r.appendChild(ic);\n      r._tendine = [sg.tendina];\n\n      var inImp = cImp.querySelector('input'), inAli = cAli.querySelector('input'), inTot = cTot.querySelector('input');\n      /* (25/09/2026, richiesta di Mauro) I contributi da trattenere li calcola l'app: imponibile × aliquota,\n         arrotondato al centesimo. L'alunno scrive l'imponibile e l'aliquota. */\n      inTot.readOnly = true; inTot.tabIndex = -1; inTot.classList.add('calcolato');\n      inTot.placeholder = 'lo calcola l’app';\n      function calcolaTot(){\n        var v = prodottoAlCentesimo(inImp.value, inAli.value, 100);\n        inTot.value = (v === null) ? '' : euro(v);\n      }\n      [inImp, inAli].forEach(function(i){ i.addEventListener('input', function(){ calcolaTot(); aggiorna(); }); });\n      primaIlSegno(r, sg, [inImp, inAli]);\n\n      r._valore = function(){\n        if(!r._segno) return 0;\n        var n = leggiNumero(inTot.value);\n        return n === null ? 0 : n * r._segno;\n      };\n      r._senzaSegno = function(){ return !r._segno; };\n\n      corpo.appendChild(r);\n\n      var str = document.createElement('div');\n      str.className = 'risultato';\n      str.innerHTML = '\u003cspan class=\"l\">Imponibile fiscale\u003c/span>' +\n                      '\u003cspan class=\"c\" data-conto>\u003c/span>' +\n                      '\u003cspan class=\"v\" data-fiscale>0,00\u003c/span>';\n      corpo.appendChild(str);\n\n      if(init){\n        if(init.s === 1 || init.s === -1) sg.set(init.s);\n        if(init.imp) inImp.value = init.imp;\n        if(init.ali) inAli.value = init.ali;\n        if(init.tot) inTot.value = init.tot;\n        /* foglio in lavorazione: il totale si rifà dai due numeri (anche nei fogli di prima, dove era scritto a\n           mano). In sola lettura (Valuta, soluzione) resta quello salvato, cioè quello che l'alunno ha visto. */\n        if(!MUTO && prodottoAlCentesimo(inImp.value, inAli.value, 100) !== null) calcolaTot();\n      }\n\n      bl._id = 'contr';\n      bl._leggi = function(){\n        if(!corpo.querySelector('.riga-contributi')) return { s:0, imp:'', ali:'', tot:'' };\n        return { s:(r._segno || 0), imp:inImp.value, ali:inAli.value, tot:inTot.value };\n      };\n      blocchiEl().appendChild(bl);\n    }\n\n    /* ---------- blocco IRPEF LORDA ---------- */\n    function creaIrpefLorda(init){\n      var bl = document.createElement('div');\n      bl.className = 'blocco';\n      bl.innerHTML =\n        '\u003cdiv class=\"blocco-h\">\u003cspan class=\"t\">IRPEF lorda\u003c/span>' +\n        '\u003cspan class=\"s\">imposta sul reddito delle persone fisiche\u003c/span>' +\n        '\u003cspan class=\"tot\" data-tot>0,00\u003c/span>\u003c/div>\u003cdiv class=\"blocco-b\">\u003c/div>';\n      var corpo = bl.querySelector('.blocco-b');\n      var testa = bl.querySelector('.blocco-h');\n\n      var r = document.createElement('div');\n      r.setAttribute('data-riga','');\n      r.style.display = 'none';\n      r._segno = null;\n      r._tendine = [];\n      r._nelFoglio = false;   /* passaggio intermedio: il segno arrivera' sull'IRPEF netta */\n\n      var bdel = document.createElement('button');\n      bdel.type='button';\n      bdel.style.cssText = 'width:32px;height:32px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;margin-left:10px;';\n      bdel.title='Elimina l’IRPEF lorda';\n      bdel.setAttribute('aria-label','Elimina il blocco IRPEF lorda');\n      bdel.innerHTML = CESTINO;\n      bdel.addEventListener('click', function(){ eliminaBlocco(bl, 'irpef-l', 'IRPEF lorda'); });\n      testa.appendChild(bdel);\n\n      var box = document.createElement('div');\n      box.className = 'scrollx';\n      var tb = document.createElement('table');\n      tb.className = 'scaglioni';\n      tb.innerHTML =\n        '\u003ccaption>Scaglioni IRPEF 2026\u003c/caption>' +\n        '\u003cthead>\u003ctr>\u003cth>Scaglione annuale\u003c/th>\u003cth>Scaglione mensile\u003c/th>' +\n        '\u003cth class=\"n\">Imponibile del mese\u003c/th>\u003cth class=\"n\">Aliquota\u003c/th>\u003cth class=\"n\">Imposta\u003c/th>\u003c/tr>\u003c/thead>' +\n        '\u003ctbody>\u003c/tbody>';\n      var tbody = tb.querySelector('tbody');\n      /* (25/09/2026, richiesta di Mauro) L'alunno scrive l'imponibile del mese che cade in ogni scaglione; l'imposta\n         della riga la calcola l'app (imponibile × aliquota, arrotondata al centesimo). */\n      SCAGLIONI.forEach(function(s, i){\n        var tr = document.createElement('tr');\n        tr.innerHTML =\n          '\u003ctd>' + s.annuo + '\u003c/td>\u003ctd class=\"mens\">' + s.mensile +\n            (s.ampiezza ? '\u003cspan class=\"ampiezza\">ampiezza dello scaglione: ' + s.ampiezza + '\u003c/span>' : '') + '\u003c/td>' +\n          '\u003ctd class=\"n\">\u003cdiv class=\"imp\">\u003cinput type=\"text\" inputmode=\"decimal\" placeholder=\"0,00\" aria-label=\"Imponibile nello scaglione ' + (i+1) + '\" />\u003c/div>\u003c/td>' +\n          '\u003ctd class=\"n ali\">' + s.ali + '\u003c/td>' +\n          '\u003ctd class=\"n\">\u003cdiv class=\"imp\">\u003cinput type=\"text\" inputmode=\"decimal\" placeholder=\"0,00\" aria-label=\"Imposta dello scaglione ' + (i+1) + '\" readonly tabindex=\"-1\" class=\"calcolato\" />\u003c/div>\u003c/td>';\n        tr._perc = s.perc;\n        tbody.appendChild(tr);\n      });\n      function calcolaImposta(tr){\n        var ins = tr.querySelectorAll('input');\n        var v = prodottoAlCentesimo(ins[0].value, tr._perc, 100);\n        ins[1].value = (v === null) ? '' : euro(v);\n      }\n      /* Il totale non lo digita nessuno: e' la somma delle imposte scritte dall'alunno. */\n      var trTot = document.createElement('tr');\n      trTot.className = 'tot-riga';\n      trTot.innerHTML =\n        '\u003ctd colspan=\"3\">Totale IRPEF lorda\u003c/td>\u003ctd class=\"n ali\">—\u003c/td>' +\n        '\u003ctd class=\"n valore\" data-tot-irpef>0,00\u003c/td>';\n      tbody.appendChild(trTot);\n      var celTot = trTot.querySelector('[data-tot-irpef]');\n      function sommaImposte(){\n        var t = 0;\n        tbody.querySelectorAll('tr:not(.tot-riga)').forEach(function(tr){\n          var v = tr.querySelectorAll('input')[1];\n          var n = leggiNumero(v.value);\n          if(n !== null) t += n;\n        });\n        return t;\n      }\n      box.appendChild(tb);\n      corpo.appendChild(box);\n\n      /* (25/09/2026, richiesta di Mauro) Via il pulsante «Conferma l'IRPEF lorda»: i ragazzi si dimenticavano di\n         premerlo. Il totale segue gli scaglioni mano a mano che si compilano; se un imponibile e' sbagliato, lo\n         correggono o lo cancellano e l'imposta e il totale si rifanno da soli. */\n      tbody.querySelectorAll('tr:not(.tot-riga)').forEach(function(tr){\n        tr.querySelectorAll('input')[0].addEventListener('input', function(){ calcolaImposta(tr); aggiorna(); });\n      });\n\n      r._valore = function(){\n        var t = sommaImposte();\n        celTot.textContent = euro(t);\n        return t;\n      };\n      r._senzaSegno = function(){ return false; };\n      corpo.appendChild(r);\n\n      if(init){\n        var trs = tbody.querySelectorAll('tr:not(.tot-riga)');\n        (init.sc || []).forEach(function(coppia, i){\n          if(!trs[i]) return;\n          var ins = trs[i].querySelectorAll('input');\n          ins[0].value = coppia[0] || '';\n          ins[1].value = coppia[1] || '';\n          /* foglio in lavorazione: l'imposta si rifà dall'imponibile (anche nei fogli di prima, dove era scritta a\n             mano); in sola lettura resta quella salvata */\n          if(!MUTO && decimaleEsatto(ins[0].value) !== null) calcolaImposta(trs[i]);\n        });\n      }\n\n      bl._id = 'irpef-l';\n      bl._totale = sommaImposte;   /* per le scritte dell'IRPEF netta */\n      bl._leggi = function(){\n        var sc = [];\n        tbody.querySelectorAll('tr:not(.tot-riga)').forEach(function(tr){\n          var ins = tr.querySelectorAll('input');\n          sc.push([ins[0].value, ins[1].value]);\n        });\n        return { sc:sc };\n      };\n      blocchiEl().appendChild(bl);\n    }\n\n    /* ---------- il pannello a fasce (detrazioni e somma integrativa) ---------- */\n    function pannelloFasce(corpo, d, scuoti, cfg, init){\n      var scelta = null;\n\n      var alto = document.createElement('div');\n      alto.className = 'detr-alto';\n      var spiega = document.createElement('p');\n      spiega.className = 'detr-spiega';\n      spiega.innerHTML = cfg.spiega;\n      alto.appendChild(spiega);\n\n      var riga = document.createElement('div');\n      riga.className = 'detr-riga';\n\n      var fc = document.createElement('div');\n      fc.className = 'campo campo-fascia';\n      fc.innerHTML = '\u003clabel>Fascia di reddito\u003c/label>';\n      var fwrap = document.createElement('div');\n      fwrap.className = 'voce';\n      var fcur = document.createElement('button');\n      fcur.type='button'; fcur.className='cur vuota';\n      fcur.innerHTML = '\u003cspan class=\"n\">Scegli la fascia…\u003c/span>';\n      function setFascia(f){\n        scelta = f;\n        fcur.className = 'cur';\n        fcur.innerHTML = '\u003cspan class=\"n\">' + esc(f.n) + '\u003c/span>';\n      }\n      var fmenu = creaMenu([{titolo:'In quale fascia ricade?'}].concat(\n        cfg.fasce.map(function(f){ return {n:f.n, d:f.f, rif:f}; })\n      ), function(v){\n        setFascia(v.rif);\n        ricalcola();\n        scuoti(); aggiorna();\n      });\n      fcur.addEventListener('click', function(){ apri(fcur, fmenu); });\n      d._tendine.push(fmenu);\n      fwrap.appendChild(fcur);\n      fc.appendChild(fwrap);\n\n      /* il reddito annuo presunto non sta piu' qui: si scrive una volta in cima al blocco (15/09/2026) */\n      corpo.appendChild(alto);\n      riga.appendChild(fc);\n      corpo.appendChild(riga);\n\n      /* il conto, fatto dall'app */\n      var conto = document.createElement('div');\n      conto.className = 'detr-conto';\n      conto.innerHTML =\n        '\u003cdiv class=\"cr\">\u003cspan class=\"l\">Formula\u003c/span>\u003cspan class=\"f\" data-formula>scegli la fascia\u003c/span>\u003c/div>' +\n        '\u003cdiv class=\"cr riga-magg\" data-riga-magg hidden>\u003cspan class=\"l\">Aggiunta di legge\u003c/span>' +\n        '\u003cspan class=\"c\" data-magg-testo>\u003c/span>\u003cspan class=\"v\" data-magg>0,00\u003c/span>\u003c/div>' +\n        '\u003cdiv class=\"cr\">\u003cspan class=\"l\">' + (cfg.lblAnnua || 'Detrazione annua') + '\u003c/span>\u003cspan class=\"v\" data-annua>0,00\u003c/span>\u003c/div>' +\n        '\u003cdiv class=\"cr ultima\">\u003cspan class=\"l\">' + (cfg.lblMese || 'Detrazione del mese') + '\u003c/span>\u003cspan class=\"c\">annua ÷ 12\u003c/span>\u003cspan class=\"v\" data-mese>0,00\u003c/span>\u003c/div>';\n      corpo.appendChild(conto);\n\n      var annua = 0, mese = 0;\n      function ricalcola(){\n        var R = redditoPresunto();\n        var rigaMagg = conto.querySelector('[data-riga-magg]');\n        if(!scelta){\n          conto.querySelector('[data-formula]').textContent = 'scegli la fascia';\n          rigaMagg.hidden = true;\n          annua = 0; mese = 0;\n        } else {\n          conto.querySelector('[data-formula]').textContent = scelta.mostra(R);\n          annua = (R > 0 || scelta.calcola.length === 0) ? scelta.calcola(R) : 0;\n          if(annua \u003c 0) annua = 0;\n          /* l'aggiunta di legge la mette l'app, come farebbe il sistema paghe */\n          var m = (annua > 0 && cfg.maggiorazione) ? cfg.maggiorazione(R) : null;\n          if(m){\n            annua += m.importo;\n            conto.querySelector('[data-magg]').textContent = '+ ' + euro(m.importo);\n            conto.querySelector('[data-magg-testo]').textContent = m.testo;\n            rigaMagg.hidden = false;\n          } else { rigaMagg.hidden = true; }\n          mese = annua / 12;\n        }\n        conto.querySelector('[data-annua]').textContent = euro(annua);\n        conto.querySelector('[data-mese]').textContent = euro(mese);\n      }\n      d._ricalcola = ricalcola;\n\n      if(init){\n        if(init.fascia != null && cfg.fasce[init.fascia]) setFascia(cfg.fasce[init.fascia]);\n      }\n      ricalcola();\n\n      d._mese = function(){ return mese; };\n      d._leggiPannello = function(){\n        return { fascia:(scelta ? cfg.fasce.indexOf(scelta) : null) };\n      };\n    }\n    /* ---------- una riga di Detrazioni / Voci integrative ---------- */\n    function creaRigaScelta(scuoti, vociMenu, titoloMenu, init){\n      var d = document.createElement('div');\n      d.className = 'riga-detrazione';\n      d._mese = function(){ return 0; };\n      d._tendine = [];\n      d._scheda = null;\n\n      var testa = document.createElement('div');\n      testa.className = 'detr-testa';\n\n      var vc = document.createElement('div');\n      vc.className = 'voce';\n      var cur = document.createElement('button');\n      cur.type='button'; cur.className='cur vuota';\n      cur.innerHTML = '\u003cspan class=\"n\">Scegli la voce…\u003c/span>';\n      cur.setAttribute('aria-expanded','false');\n\n      var corpo = document.createElement('div');\n      corpo.className = 'detr-corpo';\n\n      function applica(v, initPann){\n        d._scheda = v.scheda || null;\n        cur.className = 'cur';\n        cur.innerHTML = '\u003cspan class=\"n\">' + esc(v.n) + '\u003c/span>' + (v.d ? '\u003cspan class=\"d\">' + esc(v.d) + '\u003c/span>' : '');\n        corpo.innerHTML = '';\n        if(v.scheda) pannelloFasce(corpo, d, scuoti, SCHEDE[v.scheda], initPann);\n        else { d._mese = function(){ return 0; }; d._leggiPannello = function(){ return {}; }; }\n      }\n      var menu = creaMenu([{titolo:titoloMenu}].concat(vociMenu), function(v){\n        applica(v);\n        scuoti();\n        aggiorna();\n      });\n      cur.addEventListener('click', function(){ apri(cur, menu); });\n      d._tendine.push(menu);\n      vc.appendChild(cur);\n\n      var ic = document.createElement('div');\n      ic.className = 'ic';\n      var bd = document.createElement('button');\n      bd.type='button'; bd.className='del'; bd.title='Elimina questa voce';\n      bd.setAttribute('aria-label','Elimina questa voce');\n      bd.innerHTML = CESTINO;\n      bd.addEventListener('click', function(){\n        d._tendine.forEach(function(t){ if(t && t.parentNode) t.parentNode.removeChild(t); });\n        d.remove(); scuoti(); aggiorna();\n      });\n      ic.appendChild(bd);\n\n      testa.appendChild(vc); testa.appendChild(ic);\n      d.appendChild(testa); d.appendChild(corpo);\n\n      d._leggi = function(){\n        var out = { scheda:d._scheda };\n        if(d._leggiPannello){ var pp = d._leggiPannello(); for(var k in pp) out[k] = pp[k]; }\n        return out;\n      };\n      if(init && init.scheda){\n        var vv = null; vociMenu.forEach(function(x){ if(x.scheda === init.scheda) vv = x; });\n        if(vv) applica(vv, init);\n      }\n      return d;\n    }\n\n    /* ---------- blocco a elenco (Detrazioni) ----------\n       (26/09/2026, richiesta di Mauro) Via il pulsante «Conferma le detrazioni», come il 25/09 quello dell'IRPEF\n       lorda: chi si scordava di premerlo restava col totale a zero (successo a 3 consegne vere, in 5G e 5I). Il\n       totale segue le voci mano a mano che si compilano; una detrazione di troppo si cancella col cestino. */\n    function creaBloccoElenco(id, titolo, vociMenu, titoloMenu, lblPiu, init){\n      var bl = document.createElement('div');\n      bl.className = 'blocco';\n      bl.innerHTML =\n        '\u003cdiv class=\"blocco-h\">\u003cspan class=\"t\">' + titolo + '\u003c/span>' +\n        '\u003cspan class=\"tot\">\u003c/span>\u003c/div>\u003cdiv class=\"blocco-b\">\u003c/div>';   /* il totale sta in fondo (collaudo 15/09) */\n      var corpo = bl.querySelector('.blocco-b');\n\n      var r = document.createElement('div');\n      r.setAttribute('data-riga','');\n      r.style.display = 'none';\n      r._nelFoglio = false;\n      r._tendine = [];\n\n      var bdel = document.createElement('button');\n      bdel.type='button';\n      bdel.style.cssText = 'width:32px;height:32px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;margin-left:10px;';\n      bdel.title='Elimina: ' + titolo.toLowerCase();\n      bdel.setAttribute('aria-label','Elimina il blocco ' + titolo);\n      bdel.innerHTML = CESTINO;\n      bdel.addEventListener('click', function(){ eliminaBlocco(bl, id, (bl.querySelector('.blocco-h .t') || {}).textContent); });\n      bl.querySelector('.blocco-h').appendChild(bdel);\n\n      /* il reddito annuo presunto sta UNA volta, qui in cima (15/09/2026): vale per tutte le voci del blocco e\n         compare uguale nell'altro blocco a fasce. Dal 25/09 lo calcola l'app (creaPresunto). */\n      var redInit = (init && init.reddito) ? init.reddito : '';\n      /* fogli di prima del 15/09: il reddito stava in ogni voce, si prende il primo scritto */\n      if(!redInit && init && init.righe){ init.righe.forEach(function(ir){ if(!redInit && ir && ir.reddito) redInit = ir.reddito; }); }\n      prendiPresunto(init ? { redFisc:init.redFisc, mens:init.mens, reddito:redInit } : null);\n      corpo.appendChild(creaPresunto());\n\n      var elenco = document.createElement('div');\n      elenco.className = 'elenco-detrazioni';\n      corpo.appendChild(elenco);\n\n      function scuoti(){}   /* le righe avvisano quando cambiano: non c'e' piu' niente da riconfermare */\n\n      var mw = document.createElement('div');\n      mw.className = 'mwrap';\n      var piu = document.createElement('button');\n      piu.type='button'; piu.className='piu'; piu.innerHTML=lblPiu;\n      piu.addEventListener('click', function(){\n        if(segnoMancante()) return;\n        elenco.appendChild(creaRigaScelta(scuoti, vociMenu, titoloMenu));\n        aggiorna();\n      });\n      mw.appendChild(piu);\n\n      if(init && init.righe){ init.righe.forEach(function(ir){ elenco.appendChild(creaRigaScelta(scuoti, vociMenu, titoloMenu, ir)); }); }\n      else { elenco.appendChild(creaRigaScelta(scuoti, vociMenu, titoloMenu)); }\n      corpo.appendChild(mw);\n\n      /* in fondo, il totale scritto chiaro: e' il numero da riportare nell'IRPEF netta (collaudo 15/09) */\n      var contoTot = null;\n      if(id === 'detr'){\n        contoTot = document.createElement('div');\n        contoTot.className = 'detr-conto';\n        contoTot.innerHTML = '\u003cdiv class=\"cr ultima\">\u003cspan class=\"l\">Totale detrazioni\u003c/span>\u003cspan class=\"v\" data-totale-detr>0,00\u003c/span>\u003c/div>';\n        corpo.appendChild(contoTot);\n      }\n\n      r._valore = function(){\n        var t = 0;\n        elenco.querySelectorAll('.riga-detrazione').forEach(function(x){ t += x._mese(); });\n        if(contoTot) contoTot.querySelector('[data-totale-detr]').textContent = euro(t);\n        return t;\n      };\n      r._senzaSegno = function(){ return false; };\n      corpo.appendChild(r);\n\n      bl._id = id;\n      bl._sommaVoci = r._valore;   /* per le scritte dell'IRPEF netta */\n      bl._leggi = function(){\n        var righe = [];\n        elenco.querySelectorAll('.riga-detrazione').forEach(function(x){ if(x._leggi) righe.push(x._leggi()); });\n        /* conf resta scritto vero: le pagine vecchie ancora aperte sui telefoni, senza, darebbero il totale a zero */\n        return { reddito:REDDITO, redFisc:RED_FISC, mens:RED_MENS, righe:righe, conf:true };\n      };\n      blocchiEl().appendChild(bl);\n    }\n    function creaDetrazioni(init){\n      creaBloccoElenco('detr', 'Detrazioni', VOCI_DETRAZIONI, 'Quale detrazione?',\n        '＋ Aggiungi una detrazione', init);\n    }\n    /* ---------- blocco SOMMA INTEGRATIVA (taglio del cuneo fiscale) ----------\n       L'unica voce integrativa rimasta (15/09/2026: niente ANF, niente trattamento\n       integrativo). Il reddito presunto e' quello gia' scritto nelle Detrazioni,\n       l'alunno sceglie la fascia, il conto e la divisione per 12 li fa l'app. */\n    function creaSommaIntegrativa(init){\n      var bl = document.createElement('div');\n      bl.className = 'blocco';\n      bl.innerHTML =\n        '\u003cdiv class=\"blocco-h\">\u003cspan class=\"t\">Somma integrativa (taglio del cuneo fiscale)\u003c/span>' +\n        '\u003cspan class=\"tot\" data-tot>0,00\u003c/span>\u003c/div>\u003cdiv class=\"blocco-b\">\u003c/div>';\n      var corpo = bl.querySelector('.blocco-b');\n\n      var bdel = document.createElement('button');\n      bdel.type='button';\n      bdel.style.cssText = 'width:32px;height:32px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;margin-left:10px;';\n      bdel.title='Elimina la somma integrativa';\n      bdel.setAttribute('aria-label','Elimina il blocco Somma integrativa');\n      bdel.innerHTML = CESTINO;\n      bdel.addEventListener('click', function(){ eliminaBlocco(bl, 'somma', 'Somma integrativa'); });\n      bl.querySelector('.blocco-h').appendChild(bdel);\n\n      prendiPresunto(init);\n      corpo.appendChild(creaPresunto());\n\n      var d = document.createElement('div');\n      d.className = 'riga-detrazione';\n      d._tendine = [];\n      var dc = document.createElement('div');\n      dc.className = 'detr-corpo';\n      d.appendChild(dc);\n      corpo.appendChild(d);\n      pannelloFasce(dc, d, function(){}, SCHEDE.somma, init);\n\n      var r = document.createElement('div');\n      r.setAttribute('data-riga','');\n      r.style.display = 'none';\n      r._nelFoglio = false;\n      r._tendine = d._tendine;   /* cosi' il cestino porta via anche la tendina delle fasce */\n      r._valore = function(){ return d._mese(); };\n      r._senzaSegno = function(){ return false; };\n      corpo.appendChild(r);\n\n      bl._id = 'somma';\n      bl._leggi = function(){ return { reddito:REDDITO, redFisc:RED_FISC, mens:RED_MENS, fascia:d._leggiPannello().fascia }; };\n      blocchiEl().appendChild(bl);\n    }\n\n    /* ---------- blocco IRPEF NETTA ----------\n       Nessuna etichetta dice PRIMA quale importo va dove: e' proprio quello che\n       deve sapere l'alunno. Due caselle, il segno in mezzo, risultato dell'app.\n       Le etichette compaiono DOPO, a conto giusto (25/09/2026, vedi _etichette). */\n    function creaIrpefNetta(init){\n      var bl = document.createElement('div');\n      bl.className = 'blocco';\n      bl.innerHTML =\n        '\u003cdiv class=\"blocco-h\">\u003cspan class=\"t\">IRPEF netta\u003c/span>' +\n        '\u003cspan class=\"tot\" data-tot>0,00\u003c/span>\u003c/div>\u003cdiv class=\"blocco-b\">\u003c/div>';\n      var corpo = bl.querySelector('.blocco-b');\n\n      var r = document.createElement('div');\n      r.setAttribute('data-riga','');\n      r.style.display = 'none';\n      r._segno = null;\n      r._nelFoglio = false;\n      r._tendine = [];\n\n      var bdel = document.createElement('button');\n      bdel.type='button';\n      bdel.style.cssText = 'width:32px;height:32px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;margin-left:10px;';\n      bdel.title='Elimina l’IRPEF netta';\n      bdel.setAttribute('aria-label','Elimina il blocco IRPEF netta');\n      bdel.innerHTML = CESTINO;\n      bdel.addEventListener('click', function(){ eliminaBlocco(bl, 'irpef-n', 'IRPEF netta'); });\n      bl.querySelector('.blocco-h').appendChild(bdel);\n\n      var spiega = document.createElement('p');\n      spiega.className = 'detr-spiega';\n      spiega.textContent = 'Inserisci tu gli importi che servono, e scegli il segno.';\n      corpo.appendChild(spiega);\n\n      var calc = document.createElement('div');\n      calc.className = 'calcolo-netta';\n      function casella(){\n        var w = document.createElement('div');\n        w.className = 'netta-campo';\n        var c = document.createElement('div');\n        c.className = 'imp imp-larga';\n        c.innerHTML = '\u003cinput type=\"text\" inputmode=\"decimal\" placeholder=\"inserisci l’importo\" aria-label=\"Importo\" />';\n        w.innerHTML = '\u003cspan class=\"etich\">\u003c/span>';\n        w.appendChild(c);\n        return w;\n      }\n      var c1 = casella(), c2 = casella();\n      var sg = creaSegno(r);\n      r._tendine.push(sg.tendina);\n      var ug = document.createElement('div'); ug.className='operatore'; ug.textContent='=';\n      var res = document.createElement('div');\n      res.className = 'risultato-netta';\n      res.innerHTML = '\u003cspan data-netta>0,00\u003c/span>';\n      calc.appendChild(c1); calc.appendChild(sg.el); calc.appendChild(c2);\n      calc.appendChild(ug); calc.appendChild(res);\n      corpo.appendChild(calc);\n\n      var in1 = c1.querySelector('input'), in2 = c2.querySelector('input');\n      [in1, in2].forEach(function(i){ i.addEventListener('input', aggiorna); });\n      primaIlSegno(r, sg, [in1, in2]);\n\n      r._valore = function(){\n        var a = leggiNumero(in1.value), b = leggiNumero(in2.value);\n        var tot = (a === null) ? 0 : a;\n        if(r._segno && b !== null) tot += b * r._segno;\n        if(tot \u003c 0) tot = 0;   /* l'IRPEF non va mai sotto zero: le detrazioni in piu' si perdono (collaudo 14/09) */\n        res.querySelector('[data-netta]').textContent = euro(tot);\n        return tot;\n      };\n      r._senzaSegno = function(){ return !r._segno; };\n      corpo.appendChild(r);\n\n      /* (25/09/2026, richiesta di Mauro) A conto giusto compaiono le scritte: «IRPEF lorda» sopra la prima\n         casella se ci ha scritto il totale del SUO blocco IRPEF lorda; «Detrazioni» sopra la seconda se, col\n         meno, ci ha scritto le SUE detrazioni (zero se il blocco non c'e' o non ha voci). Si confronta col suo\n         foglio e non con la soluzione: e' la conferma del procedimento, IRPEF lorda meno detrazioni. Le chiama\n         aggiorna(); prima del conto giusto le scritte sono vuote anche nel codice della pagina. */\n      var et1 = c1.querySelector('.etich'), et2 = c2.querySelector('.etich');\n      function centesimi(n){ return Math.round(n * 100); }\n      bl._etichette = function(lorda, detr){\n        var a = leggiNumero(in1.value), b = leggiNumero(in2.value);\n        var ok1 = lorda !== null && lorda > 0 && a !== null && centesimi(a) === centesimi(lorda);\n        var ok2 = r._segno === -1 && b !== null && centesimi(b) === centesimi(detr);\n        et1.textContent = ok1 ? 'IRPEF lorda' : '';\n        et2.textContent = ok2 ? 'Detrazioni' : '';\n      };\n\n      if(init){\n        if(init.v1) in1.value = init.v1;\n        if(init.s === 1 || init.s === -1) sg.set(init.s);\n        if(init.v2) in2.value = init.v2;\n      }\n\n      bl._id = 'irpef-n';\n      bl._leggi = function(){ return { v1:in1.value, s:(r._segno || 0), v2:in2.value }; };\n      blocchiEl().appendChild(bl);\n    }\n\n    /* Le scorciatoie prese dall'alunno: non si vedono a schermo, servono al docente. */\n    function segna(blocco, passaggio, attiva){\n      SCORCIATOIE = SCORCIATOIE.filter(function(s){ return !(s.blocco === blocco && s.passaggio === passaggio); });\n      if(attiva) SCORCIATOIE.push({blocco:blocco, passaggio:passaggio});\n    }\n\n    /* ---------- blocco NETTO IN BUSTA ----------\n       L'arrivo: l'unico posto dove finalmente si mettono i segni. Si parte\n       dall'imponibile fiscale, che l'alunno DEVE scrivere lui: se non l'ha\n       calcolato, da qui non si va da nessuna parte, ed e' voluto. */\n    function creaRigaNetto(init){\n      var r = document.createElement('div');\n      r.className = 'riga';\n      r.setAttribute('data-riga','');\n      r._segno = null;\n      r._nelFoglio = false;\n\n      var sg = creaSegno(r);\n\n      var vc = document.createElement('div');\n      vc.className = 'voce';\n      var vcur = document.createElement('button');\n      vcur.type='button'; vcur.className='cur vuota';\n      vcur.innerHTML = '\u003cspan class=\"n\">Scegli la voce…\u003c/span>';\n      vcur.setAttribute('aria-expanded','false');\n      function setVoce(v){\n        r._nome = v.n;\n        vcur.className = 'cur';\n        vcur.innerHTML = '\u003cspan class=\"n\">' + esc(v.n) + '\u003c/span>';\n      }\n      var vmenu = creaMenu([{titolo:'Quale voce?'}].concat(VOCI_NETTO), function(v){ setVoce(v); aggiorna(); });\n      vcur.addEventListener('click', function(){ apri(vcur, vmenu); });\n      vc.appendChild(vcur);\n\n      var imp = document.createElement('div');\n      imp.className = 'imp';\n      var inp = document.createElement('input');\n      inp.type='text'; inp.inputMode='decimal'; inp.placeholder='0,00';\n      inp.setAttribute('aria-label','Importo della voce');\n      inp.addEventListener('input', aggiorna);\n      imp.appendChild(inp);\n\n      var ic = document.createElement('div');\n      ic.className = 'ic';\n      var bdel = document.createElement('button');\n      bdel.type='button'; bdel.className='del'; bdel.title='Elimina questa riga';\n      bdel.setAttribute('aria-label','Elimina questa riga');\n      bdel.innerHTML = CESTINO;\n      bdel.addEventListener('click', function(){ if(!cestinoOk()) return; butta(r); aggiorna(); });\n      ic.appendChild(bdel);\n\n      r.appendChild(sg.el); r.appendChild(vc); r.appendChild(imp); r.appendChild(ic);\n      r._tendine = [sg.tendina, vmenu];\n      primaIlSegno(r, sg, [inp]);\n\n      r._valore = function(){\n        if(!r._segno) return 0;\n        var n = leggiNumero(inp.value);\n        return n === null ? 0 : n * r._segno;\n      };\n      r._senzaSegno = function(){ return !r._segno && !!r._nome; };\n      r._leggi = function(){ return { s:(r._segno || 0), n:(r._nome || null), v:inp.value }; };\n\n      if(init){\n        if(init.s === 1 || init.s === -1) sg.set(init.s);\n        if(init.n){ var vv = null; VOCI_NETTO.forEach(function(x){ if(x.n === init.n) vv = x; }); setVoce(vv || {n:init.n}); }\n        if(init.v) inp.value = init.v;\n      }\n      return r;\n    }\n    function creaNetto(init){\n      var bl = document.createElement('div');\n      bl.className = 'blocco';\n      bl.innerHTML =\n        '\u003cdiv class=\"blocco-h\">\u003cspan class=\"t\">Netto in busta\u003c/span>' +\n        '\u003cspan class=\"tot\" data-tot>0,00\u003c/span>\u003c/div>\u003cdiv class=\"blocco-b\">\u003c/div>';\n      var corpo = bl.querySelector('.blocco-b');\n\n      var bdel = document.createElement('button');\n      bdel.type='button';\n      bdel.style.cssText = 'width:32px;height:32px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;margin-left:10px;';\n      bdel.title='Elimina il netto in busta';\n      bdel.setAttribute('aria-label','Elimina il blocco Netto in busta');\n      bdel.innerHTML = CESTINO;\n      bdel.addEventListener('click', function(){ eliminaBlocco(bl, 'netto', 'Netto in busta'); });\n      bl.querySelector('.blocco-h').appendChild(bdel);\n\n      /* unica facilitazione concessa da Mauro */\n      var spiega = document.createElement('p');\n      spiega.className = 'detr-spiega';\n      spiega.textContent = 'Il netto si costruisce a partire dall’imponibile fiscale.';\n      corpo.appendChild(spiega);\n\n      var cImp = document.createElement('div');\n      cImp.className = 'campo campo-reddito';\n      cImp.innerHTML = '\u003clabel>Imponibile fiscale\u003c/label>' +\n                       '\u003cdiv class=\"imp\">\u003cinput type=\"text\" inputmode=\"decimal\" placeholder=\"0,00\" aria-label=\"Imponibile fiscale\" data-imp-netto />\u003c/div>';\n      corpo.appendChild(cImp);\n      var inImp = cImp.querySelector('input');\n      inImp.addEventListener('input', aggiorna);\n\n      var rImp = document.createElement('div');\n      rImp.setAttribute('data-riga','');\n      rImp.style.display = 'none';\n      rImp._nelFoglio = false;\n      rImp._tendine = [];\n      rImp._valore = function(){ var n = leggiNumero(inImp.value); return n === null ? 0 : n; };\n      rImp._senzaSegno = function(){ return false; };\n      corpo.appendChild(rImp);\n\n      var elenco = document.createElement('div');\n      elenco.className = 'elenco-detrazioni';\n      elenco.style.marginTop = '12px';\n      corpo.appendChild(elenco);\n\n      var mw = document.createElement('div');\n      mw.className = 'mwrap';\n      var piu = document.createElement('button');\n      piu.type='button'; piu.className='piu'; piu.innerHTML='＋ Aggiungi una voce';\n      piu.addEventListener('click', function(){ if(segnoMancante()) return; elenco.appendChild(creaRigaNetto()); aggiorna(); });\n      mw.appendChild(piu);\n\n      if(init && init.righe){ init.righe.forEach(function(ir){ elenco.appendChild(creaRigaNetto(ir)); }); }\n      else { elenco.appendChild(creaRigaNetto()); }\n      corpo.appendChild(mw);\n\n      /* la striscia dell'uguale: il netto, in fondo a destra */\n      var conto = document.createElement('div');\n      conto.className = 'detr-conto';\n      conto.innerHTML = '\u003cdiv class=\"cr ultima\">\u003cspan class=\"l\">Netto in busta\u003c/span>\u003cspan class=\"v\" data-netto>0,00\u003c/span>\u003c/div>';\n      corpo.appendChild(conto);\n\n      /* riga nascosta che tiene aggiornata la striscia */\n      var rTot = document.createElement('div');\n      rTot.setAttribute('data-riga','');\n      rTot.style.display = 'none';\n      rTot._nelFoglio = false;\n      rTot._tendine = [];\n      rTot._valore = function(){\n        var t = 0;\n        bl.querySelectorAll('[data-riga]').forEach(function(x){ if(x !== rTot && x._valore) t += x._valore(); });\n        conto.querySelector('[data-netto]').textContent = euro(t);\n        return 0;\n      };\n      rTot._senzaSegno = function(){ return false; };\n      corpo.appendChild(rTot);\n\n      if(init && init.imp) inImp.value = init.imp;\n\n      bl._id = 'netto';\n      bl._leggi = function(){\n        var righe = [];\n        elenco.querySelectorAll('.riga[data-riga]').forEach(function(x){ if(x._leggi) righe.push(x._leggi()); });\n        return { imp:inImp.value, righe:righe };\n      };\n      blocchiEl().appendChild(bl);\n    }\n\n    /* ---------- le ANAGRAFICHE ----------\n       Caselle di testo libere, si copia dal testo dell'esercizio.\n       Niente totali: qui non girano soldi. */\n    function creaAnagrafica(id, init){\n      var cfg = ANAGRAFICHE[id];\n      var bl = document.createElement('div');\n      bl.className = 'blocco';\n      bl.innerHTML =\n        '\u003cdiv class=\"blocco-h\">\u003cspan class=\"t\">' + cfg.titolo + '\u003c/span>\u003c/div>' +\n        '\u003cdiv class=\"blocco-b\">\u003c/div>';\n      var corpo = bl.querySelector('.blocco-b');\n\n      var bdel = document.createElement('button');\n      bdel.type='button';\n      bdel.style.cssText = 'width:32px;height:32px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;margin-left:10px;';\n      bdel.title='Elimina «' + cfg.titolo + '»';\n      bdel.setAttribute('aria-label','Elimina il blocco ' + cfg.titolo);\n      bdel.innerHTML = CESTINO;\n      bdel.addEventListener('click', function(){ eliminaBlocco(bl, id, (bl.querySelector('.blocco-h .t') || {}).textContent); });\n      bl.querySelector('.blocco-h').appendChild(bdel);\n\n      var riga = document.createElement('div');\n      riga.className = 'detr-alto';\n      cfg.campi.forEach(function(c){\n        var el = document.createElement('div');\n        el.className = 'campo campo-testo' + (c.larga ? ' campo-testo-larga' : '') + (c.corto ? ' campo-testo-corta' : '');\n        el.innerHTML = '\u003clabel>' + c.l + '\u003c/label>' +\n                       '\u003cdiv class=\"imp\">\u003cinput type=\"text\" aria-label=\"' + c.l + '\" />\u003c/div>';\n        var inp = el.querySelector('input');\n        inp.addEventListener('input', aggiorna);\n        if(init && init.campi && init.campi[c.l]) inp.value = init.campi[c.l];\n        riga.appendChild(el);\n      });\n      corpo.appendChild(riga);\n\n      bl._id = id;\n      bl._leggi = function(){\n        var campi = {};\n        cfg.campi.forEach(function(c){\n          var inp = corpo.querySelector('input[aria-label=\"' + c.l + '\"]');\n          campi[c.l] = inp ? inp.value : '';\n        });\n        return { campi:campi };\n      };\n      blocchiEl().appendChild(bl);\n    }\n\n    /* ---------- creazione di un blocco per id (menu e ricostruzione) ---------- */\n    function creaBlocco(id, init){\n      var v = null; VOCI.forEach(function(x){ if(x.id === id) v = x; });\n      if(!v) return;\n      creati[id] = true;\n      var p = pulsantiVoce[id];\n      if(p){ p.b.disabled = true; p.b.i
