tato && !STATE.modalitaCompiti){\n      rpcSubito('cf_battito', {\n        p_pin: STATE.studente.pin, p_sess: sessMia(), p_dispositivo: idDispositivo(),\n        p_fattura: (STATE.assegnataId || null),\n        p_livello: (typeof LIVELLO !== 'undefined' ? String(LIVELLO) : null),\n        p_consegnata: !!STATE.consegnata, p_sfondo: true,\n        p_fuori: true, p_seq: prossimoSeq()\n      });\n    }\n  }); }catch(e){}\n  try{ document.addEventListener('resume', riprendiPresenza); }catch(e){}\n  try{ document.addEventListener('visibilitychange', function(){\n    if(document.visibilityState === 'visible'){ riprendiPresenza(); segnalaPagina(fuoriAdesso()); return; }\n    /* (19/09/2026) Prima di tutto il LAVORO: un telefono che va in secondo piano puo' essere congelato o ucciso\n       senza preavviso. Se c'e' qualcosa di scritto che non e' ancora al sicuro (salvataggio o invio in attesa, o\n       per strada), lo salvo adesso e lo spedisco con l'invio che parte anche a pagina congelata. */\n    try{\n      if(STATE.studente && !STATE.salutato && (STATE.saveTimer || STATE.bozzaCloudTimer || STATE.bozzaInVolo || STATE.bozzaRiprovaTimer)){\n        if(STATE.saveTimer){ clearTimeout(STATE.saveTimer); STATE.saveTimer = null; }\n        if(STATE.assegnataId && byId('editor').style.display !== 'none') salvaLavoro();\n        if(STATE.bozzaCloudTimer){ clearTimeout(STATE.bozzaCloudTimer); STATE.bozzaCloudTimer = null; }\n        pushBozzaSubito();\n      }\n    }catch(e){}\n    /* Va in secondo piano: lo dico SUBITO e con il messaggio che parte comunque (rpcSubito), perche' un attimo\n       dopo il telefono congela la pagina e il battito normale morirebbe per strada. E' questo messaggio che\n       tiene l'alunno «Collegato» nella dashboard mentre ha la scheda abbassata o lo schermo spento: senza,\n       dopo 40 secondi risultava «Non collegato» pur avendo l'app aperta (Mauro, 18/09/2026).\n       (19/09/2026) Ma NON dopo il saluto di chiusura: mentre la pagina muore il browser spara ancora questo\n       evento, e il battito partito dopo «ho chiuso» lo sorpassava e rimetteva l'alunno «collegato» per 20 secondi.\n       (29/09/2026) Nemmeno dai compiti: partiva anche li', e a ogni cambio di scheda chi faceva i compiti\n       risultava «Collegato» per 20 secondi (Galvagno in 5G, trovato da Mauro). */\n    if(STATE.studente && STATE.proprietario && !STATE.salutato && !STATE.modalitaCompiti){\n      rpcSubito('cf_battito', {\n        p_pin: STATE.studente.pin, p_sess: sessMia(), p_dispositivo: idDispositivo(),\n        p_fattura: (STATE.assegnataId || null),\n        p_livello: (typeof LIVELLO !== 'undefined' ? String(LIVELLO) : null),\n        p_consegnata: !!STATE.consegnata, p_sfondo: true,\n        p_fuori: true, p_seq: prossimoSeq()\n      });\n    }\n  }); }catch(e){}\n  /* PALLINO ROSSO: il clic fuori dalla finestra (un'altra finestra, un altro programma) non cambia la\n     visibilita' della pagina, quindi lo dicono 'blur' e 'focus'. */\n  try{ window.addEventListener('blur', function(){ if(campoDelTelefono() || (iPhoneSoloSchermo() && document.visibilityState !== 'hidden')) return; segnalaPagina(true); }); }catch(e){}\n  try{ window.addEventListener('focus', function(){ segnalaPagina(fuoriAdesso()); }); }catch(e){}\n  /* Finestra rimpicciolita o ingrandita, schermo diviso aperto o chiuso: lo dico subito (a trascinamento finito). */\n  var RIDIM_TIMER = null, ULTIMO_RISTRETTA = null;\n  try{ window.addEventListener('resize', function(){\n    if(RIDIM_TIMER) clearTimeout(RIDIM_TIMER);\n    RIDIM_TIMER = setTimeout(function(){\n      RIDIM_TIMER = null;\n      var r = finestraRistretta();\n      if(r === ULTIMO_RISTRETTA) return;\n      ULTIMO_RISTRETTA = r;\n      segnalaPagina(fuoriAdesso());\n    }, 400);\n  }); }catch(e){}\n  /* CHIUSURA VERA della pagina (la X, non lo schermo che si spegne): lo dico al cloud, cosi' nella\n     dashboard compare «Non collegato» subito. `persisted` distingue la chiusura dal semplice passaggio in\n     secondo piano: e' la regola che mi ha dato Mauro — se per rientrare serve il PIN, allora ero scollegato. */\n  try{ window.addEventListener('pagehide', function(ev){\n    if(ev && ev.persisted) return;                       // va solo in secondo piano: non e' una chiusura\n    if(STATE.studente && STATE.proprietario){\n      // Con la pagina che sta morendo la richiesta normale spesso non parte: qui serve il messaggio keepalive,\n      // se no la chiusura non arriva al cloud e la dashboard resta a guardare un fantasma.\n      STATE.salutato = true; stopPresenza();   // dopo il saluto la pagina tace: nessun battito deve sorpassarlo\n      rpcSubito('cf_esci', { p_pin: STATE.studente.pin, p_sess: sessMia(), p_dispositivo: idDispositivo() });\n    }\n  }); }catch(e){}\n  function cloudCollegati(cb){\n    if(!SB){ cb && cb([]); return; }\n    try{\n      SB.from('ced_studenti').select('pin,nome,cognome,classe,ultimo_accesso,fattura_corrente,livello_corrente').then(function(res){\n        cb && cb((res && res.data) ? res.data : []);\n      }, function(){ cb && cb([]); });\n    }catch(e){ cb && cb([]); }\n  }\n  var CLOUD_STUD = {};\n  /* Il riconoscimento del docente e' caduto? Lo dico, invece di lasciare la dashboard muta. */\n  var AVVISO_SESSIONE = false;\n  function controllaSessioneDocente(){\n    if(!SB || !SB.auth || AVVISO_SESSIONE) return;\n    try{\n      SB.auth.getSession().then(function(r){\n        if(r && r.data && r.data.session) return;   // il riconoscimento c'e': era un vuoto vero\n        AVVISO_SESSIONE = true;\n        stopCollegatiTimer();\n        showAlert('Il collegamento da docente è scaduto: la dashboard non riesce più a leggere i dati.' + String.fromCharCode(10,10) + 'Premi OK e rientra con la tua password: gli alunni intanto continuano a lavorare, non si perde niente.');\n        goGate();\n        AVVISO_SESSIONE = false;\n      }, function(){});\n    }catch(e){}\n  }\n  function refreshCloudStud(cb){\n    if(!SB){ cb && cb(); return; }\n    try{\n      SB.from('ced_studenti').select('pin,nome,cognome,classe,ultimo_accesso,fattura_corrente,livello_corrente,fattura_assegnata,livello_assegnato,consegnata,stato,riammesso,valutazione,assente,motivo_assenza,sfondo').then(function(res){\n        // UN BUCO DI RETE NON DEVE CANCELLARE LA DASHBOARD. Prima CLOUD_STUD veniva azzerato PRIMA di\n        // guardare l'esito: con la rete giu' restava vuoto, renderDocente non trovava piu' nessuna classe,\n        // scriveva «Nessuna classe caricata» e cancellava pure cf_classe dal browser. Ogni 4 secondi.\n        // Ora, se il cloud non risponde, tengo l'ultima fotografia buona e riprovo al giro dopo.\n        if(!res || res.error){ cb && cb(); return; }\n        var righe = (res.data) || [];\n        // Zero alunni mentre ne stavamo mostrando = quasi sempre riconoscimento scaduto, non classe vuota.\n        if(!righe.length && Object.keys(CLOUD_STUD || {}).length){ controllaSessioneDocente(); cb && cb(); return; }\n        CLOUD_STUD = {}; righe.forEach(function(s){ CLOUD_STUD[s.pin] = s; });\n        STATE.cloudStudCaricato = true;   // da ora \"nessuna classe\" e' una risposta vera, non un \"non lo so\"\n        cb && cb();\n      }, function(){ cb && cb(); });\n    }catch(e){ cb && cb(); }\n  }\n  /* PALLINO ROSSO nella dashboard (21/09/2026). Una lettura leggera al secondo, solo della classe aperta:\n     il giro grosso ogni 4 secondi sarebbe troppo lento, un'uscita lampo sfuggirebbe. Acceso finche' l'ULTIMO\n     segnale dell'alunno dice «fuori» e per 3 secondi dopo il rientro; vale per chi ha un esercizio in corso\n     (non per chi ha consegnato o e' segnato assente). Stesse misure della dashboard verifiche.\n     22/09/2026, LEZIONE IN 5H: il pallino «saltellava» da un alunno all'altro invece di stare acceso su tutti\n     quelli con la scheda dietro. Colpa della condizione «solo se collegato»: il telefono CONGELA la pagina\n     abbassata, i battiti si fermano, dopo 20 secondi l'alunno non e' piu' «collegato» e il pallino si spegneva\n     pur essendo lui ancora fuori; al primo battito che il telefono lasciava passare si riaccendeva per altri 20\n     secondi. Ora il pallino NON dipende dal collegamento: resta acceso finche' l'alunno non torna sulla pagina\n     (segnale «sono tornato») o non la chiude (cf_esci azzera «fuori»). Come nella dashboard verifiche. */\n  var PALLINI = {};\n  var PALLINO_CODA_MS = 3000;\n  var PALLINO_STATI = { in_corso:true, da_consegnare:true, bloccato:true };\n  function pallinoAcceso(pin){\n    var g = PALLINI[pin]; if(!g) return false;\n    var st = statoAlunno(pin);\n    if(st.done || st.assente || !PALLINO_STATI[g.stato || '']) return false;\n    if(!st.on) return false;   // (29/09/2026) pallino solo su chi la dashboard mostra al lavoro, mai su chi fa i compiti\n    /* 22/09/2026 sera, REGOLA DI MAURO (gia' data il 19/09 per la dashboard verifiche, e persa stamattina):\n       «se non e' collegato il pallino deve sparire subito, e' ovvio che puo' guardare il mondo». Niente pallino\n       su chi non e' collegato: guardo sia la lettura al secondo (PALLINI) sia quella che scrive «Non collegato»\n       nella riga (CLOUD_STUD), cosi' pallino e «Non collegato» non stanno mai insieme sulla stessa riga. */\n    if(!attaccatoAllApp(g) || !attaccatoAllApp(CLOUD_STUD[pin])) return false;\n    if(g.fuori) return true;\n    if(!g.rientrato_il) return false;\n    return (Date.now() + SCARTO_ORA_CLOUD - new Date(g.rientrato_il).getTime()) \u003c PALLINO_CODA_MS;\n  }\n  function disegnaPallini(){\n    var righe = document.querySelectorAll('#roster-body tr[data-pin]');\n    Array.prototype.forEach.call(righe, function(tr){\n      var cella = tr.querySelector('.nome-cell'); if(!cella) return;\n      var dot = cella.querySelector('.dot-fuori');\n      var acceso = pallinoAcceso(tr.getAttribute('data-pin'));\n      if(acceso && !dot){\n        dot = document.createElement('span'); dot.className = 'dot-fuori';\n        dot.title = 'Ha abbassato o lasciato la pagina del cedolino';\n        cella.appendChild(dot);\n      } else if(!acceso && dot){ cella.removeChild(dot); }\n    });\n  }\n  function refreshPallini(){\n    if(!SB || !(typeof CLASSE !== 'undefined' && CLASSE && CLASSE.classe)){ disegnaPallini(); return; }\n    if(STATE.pallinoInVolo && (Date.now() - STATE.pallinoInVolo) \u003c 4000){ disegnaPallini(); return; }\n    STATE.pallinoInVolo = Date.now();\n    try{\n      SB.from('ced_studenti').select('pin,ultimo_accesso,fuori,rientrato_il,stato').eq('classe', CLASSE.classe).then(function(res){\n        STATE.pallinoInVolo = 0;\n        if(res && !res.error && res.data){ PALLINI = {}; res.data.forEach(function(r){ PALLINI[r.pin] = r; }); }\n        disegnaPallini();\n      }, function(){ STATE.pallinoInVolo = 0; });\n    }catch(e){ STATE.pallinoInVolo = 0; }\n  }\n  function cloudAssegnaStudente(pin, fatturaId, liv){\n    // (24/09/2026) Se aveva consegnato e ora riceve un cedolino che non ha ancora consegnato, torna a lavorare\n    // (senza questo restava fermo su «consegnato» e il cedolino nuovo non lo vedeva).\n    var cs0 = CLOUD_STUD[pin] || {}, fatte0 = CLOUD_CONS[pin] || {};\n    var riapri = !!fatturaId && (cs0.stato === 'consegnato' || cs0.consegnata) && parseAssegnazione(fatturaId).some(function(x){ return !fatte0[x.id]; });\n    var upd = { fattura_assegnata:(fatturaId||null), livello_assegnato:(liv!=null?String(liv):null) };\n    if(riapri){ upd.stato = 'non_iniziato'; upd.consegnata = false; if(CLOUD_STUD[pin]){ CLOUD_STUD[pin].stato = 'non_iniziato'; CLOUD_STUD[pin].consegnata = false; } }\n    if(SB){ try{ SB.from('ced_studenti').update(upd).eq('pin', pin).then(function(){}, function(){}); }catch(e){} }\n    if(!CLOUD_STUD[pin]) CLOUD_STUD[pin] = { pin:pin };\n    CLOUD_STUD[pin].fattura_assegnata = fatturaId||null;\n    CLOUD_STUD[pin].livello_assegnato = (liv!=null?String(liv):null);\n  }\n  function cloudLeggiAssegnazione(pin, cb){\n    if(!SB){ cb && cb(null); return; }\n    try{\n      SB.from('ced_studenti').select('fattura_assegnata,livello_assegnato').eq('pin', pin).maybeSingle().then(function(res){\n        cb && cb((res && res.data) ? res.data : null);\n      }, function(){ cb && cb(null); });\n    }catch(e){ cb && cb(null); }\n  }\n  // Determina la fattura EFFETTIVA dell'alunno: ad personam se presente, altrimenti quella di classe (dal cloud).\n  function cloudLeggiContestoAlunno(pin, cb, saltaConfig){\n    if(!SB){\n      var loc = null, locL = null; try{ loc = localStorage.getItem('cf_assegnata') || null; locL = localStorage.getItem('cf_livello') || null; }catch(e){}\n      cb && cb({ fattura:assegnPrimoId(loc), livello:(assegnPrimoLiv(loc) || locL), lista:parseAssegnazione(loc) }); return;\n    }\n    // out.errore = \"NON LO SO\" (la rete non ha risposto). È diverso da \"nessuna assegnazione\": chi legge\n    // deve poter distinguere il silenzio del cloud da una risposta vera, altrimenti un buco di wifi viene\n    // scambiato per «il docente ha resettato la classe» e l'alunno viene buttato fuori dalla verifica.\n    // out.chiusa = il docente ha SOSPESO la verifica della sua classe, o ha segnato lui assente. Serve a chi\n    // sta già lavorando: la sua sessione va chiusa e l'alunno portato ai compiti, col lavoro salvo.\n    // Resta \"non lo so\" (false) se il cloud non risponde: una sospensione falsa butterebbe fuori tutta la\n    // classe in mezzo al compito, esattamente il danno che i paracadute qui sotto servono a evitare.\n    var out = { fattura:null, livello:null, lista:[], stato:null, consegnata:false, riammesso:false, chiusa:false, errore:false };\n    try{\n      SB.rpc('cf_stato', { p_pin: pin }).then(function(r1){\n        // out.errore = \"NON LO SO\" (la rete non ha risposto): resta diverso da \"nessuna assegnazione\".\n        if(!r1 || r1.error || !r1.data){ out.errore = true; cb && cb(out); return; }\n        var per = r1.data;\n        out.stato = per.stato || null;\n        out.consegnata = !!per.consegnata;\n        out.riammesso = !!per.riammesso;\n        out.classe = per.classe || null;\n        out.azzeramento = (typeof per.azzeramento === 'string') ? per.azzeramento : undefined;\n        out.azzCambiato = allineaAzzeramento(pin, out.azzeramento);   // Reset avvenuto da quando questo dispositivo ha guardato l'ultima volta\n        if(per.fattura_assegnata){\n          out.fattura = assegnPrimoId(per.fattura_assegnata);\n          out.livello = assegnPrimoLiv(per.fattura_assegnata) || per.livello_assegnato || null;\n          out.lista = parseAssegnazione(per.fattura_assegnata);\n        }\n        // chiusa = il docente ha sospeso la verifica della sua classe, o l'ha segnato assente\n        out.chiusa = !!(per.assente || per.sospesa);\n        if(Array.isArray(STATE.esercitazioneClassi)){\n          var k = STATE.esercitazioneClassi.indexOf(out.classe);\n          if(per.esercitazione && k === -1) STATE.esercitazioneClassi.push(out.classe);\n          if(!per.esercitazione && k !== -1) STATE.esercitazioneClassi.splice(k, 1);\n        } else {\n          STATE.esercitazioneClassi = per.esercitazione ? [out.classe] : [];\n        }\n        cb && cb(out);\n      }, function(){ out.errore = true; cb && cb(out); });\n    }catch(e){ out.errore = true; cb && cb(out); }\n  }\n  // Decide la MODALITÀ dell'alunno all'accesso. 'compiti' se: la classe è SOSPESA, oppure è in modalità\n  // compiti, oppure non ha assegnazione E il docente non è presente. Altrimenti null = flusso normale\n  // (assegnato → fa la verifica; nessuna assegnazione ma docente presente → schermata \"In attesa\").\n  //\n  // L'ORDINE DEI CONTROLLI È IL CUORE DI QUESTA FUNZIONE, non toccarlo alla leggera.\n  // Prima l'assegnazione personale usciva PER PRIMA, e questo apriva due buchi grossi (trovati da Mauro\n  // il 17/07 provando l'app, non leggendo il codice):\n  //   1. l'alunno con un'assegnazione non poteva MAI allenarsi: per l'app era \"in verifica\" per sempre;\n  //   2. l'ASSENTE faceva la verifica da casa — «Assegna a tutta la classe» assegna anche a chi non c'è,\n  //      quindi gli bastava il PIN, a qualsiasi ora, docente collegato o no.\n  // Ora la SOSPENSIONE decisa dal docente viene prima di tutto: è lui a dire quando la verifica è aperta.\n  function cloudModalitaAlunno(pin, cb){\n    if(!SB){ cb && cb(null); return; }\n    try{\n      SB.rpc('cf_stato', { p_pin: pin }).then(function(r1){\n        // Rete caduta: NON so nulla → flusso normale, MAI 'compiti' (con la rete giù l'alunno finiva nei\n        // compiti a casa NEL MEZZO DI UNA VERIFICA).\n        if(!r1 || r1.error || !r1.data){ cb && cb(null); return; }\n        var per = r1.data;\n        var cl = per.classe || null;\n        allineaAzzeramento(pin, per.azzeramento);                     // prima di aprire qualsiasi foglio: via il lavoro azzerato\n        if(per.sospesa){ cb && cb('compiti'); return; }              // SOSPESA dal docente → compiti\n        if(per.assente){ cb && cb('compiti'); return; }              // segnato ASSENTE → compiti, senza messaggi strani\n        if(per.fattura_assegnata){ cb && cb(null); return; }         // ha un cedolino suo → lo fa\n        // (24/09/2026, regola di Mauro) NIENTE CEDOLINO ASSEGNATO → COMPITI, SEMPRE, senza se e senza ma: niente\n        // piu' schermata «In attesa», nemmeno col docente collegato. Appena il docente assegna, il sorvegliante\n        // dei compiti porta l'alunno sul cedolino (startCompitiWatcher).\n        cb && cb('compiti');\n      }, function(){ cb && cb(null); });\n    }catch(e){ cb && cb(null); }\n  }\n  function refreshStati(){\n    if(!(typeof CLASSE!=='undefined' && CLASSE && CLASSE.alunni)) return;\n    var nColl=0,nCorso=0,nDone=0;\n    CLASSE.alunni.forEach(function(a){\n      var st = statoAlunno(a.pin);\n      if(st.on) nColl++; if(st.corso) nCorso++;\n      // «Collegati» = chi e' collegato ADESSO: chi ha consegnato conta solo se ha ancora l'app aperta.\n      if(st.done){ nDone++; if(attaccatoAllApp(CLOUD_STUD[a.pin])) nColl++; }\n      var cell = document.querySelector('#roster-body tr[data-pin=\"'+a.pin+'\"] .st-cell');\n      if(cell) cell.innerHTML = '\u003cspan class=\"st-badge '+st.cls+'\">'+esc(st.txt)+'\u003c/span>';\n      // se l'alunno si è appena collegato, blocca la tendina di assegnazione (diventa testo)\n      var acell = document.querySelector('#roster-body tr[data-pin=\"'+a.pin+'\"] .ass-cell');\n      var abtn = acell ? acell.querySelector('button.btn-scegli-ass') : null;\n      if(abtn){\n        // Tiene aggiornato il TESTO del pulsante (l'assegnazione resta sempre modificabile).\n        var cs2 = CLOUD_STUD[a.pin] || {};\n        var effList2 = parseAssegnazione(cs2.fattura_assegnata); // SOLO la sua (niente ripiego sull'assegnazione di un compagno)\n        abtn.textContent = descriviAssegnazioneBreve(effList2);\n        abtn.title = descriviAssegnazione(effList2);\n      }\n      var azcell = document.querySelector('#roster-body tr[data-pin=\"'+a.pin+'\"] .az-cell');\n      if(azcell){\n        var want = wantAz(st);\n        if((azcell.getAttribute('data-az')||'none') !== want){\n          azcell.innerHTML=''; azcell.setAttribute('data-az', want);\n          var wb = buildAzButton(want, a); if(wb) azcell.appendChild(wb);\n        }\n      }\n      // VOTO e VALUTA vanno rinfrescati qui come lo stato, altrimenti restano quelli del primo disegno.\n      // Da quando «Valuta» compare SOLO a verifica consegnata, questo non è un dettaglio: senza, l'alunno\n      // consegna, il docente vede «Consegnato»... e il link «Valuta» non appare. Sembra rotto e non lo è.\n      // (Il difetto l'ho creato io col controllo nuovo, e l'ho visto solo provandolo dal vivo.)\n      var riga = document.querySelector('#roster-body tr[data-pin=\"'+a.pin+'\"]');\n      if(riga){\n        var vs = (CLOUD_STUD[a.pin] || {}).valutazione || {};\n        var firma = (st.done ? '1' : '0') + '|' + (vs.voto_finale || '') + '|' + (vs.pubblicata ? '1' : '0') + '|' + (st.assente ? '1' : '0');\n        if(riga.getAttribute('data-firma-voto') !== firma){\n          riga.setAttribute('data-firma-voto', firma);\n          var vecchioVoto = riga.querySelector('.voto-cell'); if(vecchioVoto) riga.replaceChild(buildVotoCell(a), vecchioVoto);\n          var vecchiaVal = riga.querySelector('.valuta-cell'); if(vecchiaVal) riga.replaceChild(buildValutaCell(a), vecchiaVal);\n        }\n      }\n    });\n    var t1=byId('tile-collegati'),t2=byId('tile-incorso'),t3=byId('tile-consegnati');\n    if(t1)t1.textContent=nColl; if(t2)t2.textContent=nCorso; if(t3)t3.textContent=nDone;\n  }\n  // \"Battito\" di presenza del docente: scritto SOLO se ha una classe caricata. Serve all'alunno per capire\n  // se è in classe (docente presente sulla SUA classe → \"In attesa\") o no (→ sceglie i compiti da solo).\n  // Insieme all'orario scrivo QUALE classe ho aperto: senza quello l'attesa colpirebbe tutte le classi\n  // insieme (vedi cloudModalitaAlunno).\n  function cloudDocenteHeartbeat(){\n    if(!SB) return;\n    if(!(typeof CLASSE!=='undefined' && CLASSE && CLASSE.alunni && CLASSE.alunni.length)) return;\n    try{ SB.from('ced_config').update({ docente_heartbeat:new Date().toISOString(), classe_attiva:(CLASSE.classe || null) }).eq('id', 1).then(function(){}, function(){}); }catch(e){}\n  }\n  function startCollegatiTimer(){\n    stopCollegatiTimer();\n    cloudDocenteHeartbeat();\n    var doRender = function(){ refreshCloudStud(function(){ refreshConsegne(function(){ if(typeof renderDocente==='function') renderDocente(); }); }); };\n    // sincronizza l'assegnazione di classe dal cloud (la dashboard riflette ciò che hanno davvero gli alunni)\n    if(SB){\n      try{\n        SB.from('ced_config').select('assegnata_id,livello,compiti_classi,sospese_classi,esercitazione_classi').eq('id', 1).maybeSingle().then(function(res){\n          var cfg = (res && res.data) ? res.data : null;\n          STATE.compitiClassi = (cfg && Array.isArray(cfg.compiti_classi)) ? cfg.compiti_classi : (STATE.compitiClassi || []);\n          STATE.sospeseClassi = (cfg && Array.isArray(cfg.sospese_classi)) ? cfg.sospese_classi : (STATE.sospeseClassi || []);\n          STATE.esercitazioneClassi = (cfg && Array.isArray(cfg.esercitazione_classi)) ? cfg.esercitazione_classi : (STATE.esercitazioneClassi || []);\n          if(cfg){ STATE.assegnate = parseAssegnazione(cfg.assegnata_id); STATE.assegnataId = assegnPrimoId(cfg.assegnata_id); var l0 = assegnPrimoLiv(cfg.assegnata_id) || cfg.livello; if(l0){ try{ localStorage.setItem('cf_livello', l0); }catch(e){} } }\n          doRender();\n        }, doRender);\n      }catch(e){ doRender(); }\n    } else { doRender(); }\n    // il refresh periodico aggiorna SOLO stato e conteggi: non ricostruisce le tendine\n    allineaOraCloud(); STATE.giriDashboard = 0;\n    STATE.collegatiTimer = setInterval(function(){ if((++STATE.giriDashboard % 75) === 0) allineaOraCloud(); cloudDocenteHeartbeat(); refreshCloudStud(function(){ refreshConsegne(refreshStati); }); }, 4000);\n    STATE.pallinoTimer = setInterval(refreshPallini, 1000);   // il pallino rosso: lettura leggera, una al secondo\n  }\n  /* 18/09/2026 — LA FIGURACCIA DELLA 5F. Mezza classe col PIN GIUSTO si sentiva dire «PIN non riconosciuto».\n     Colpa di qui: supabase-js NON rifiuta la promessa quando la rete cade, RISOLVE con { data:null, error:... }.\n     Questa funzione guardava solo res.data, quindi un buco di wifi diventava «il tuo PIN non esiste». Nei log del\n     cloud di quella mattina non c'e' UNA sola richiesta rifiutata: le richieste non arrivavano proprio.\n     Ora: due ritentativi silenziosi, e poi un esito che dice di CHI e' la colpa ('rete' o 'assente'). */\n  // Da qui in giu' la differenza e' netta: il DOCENTE (autenticato) legge le tabelle, l'ALUNNO passa solo\n  // dalle porte. 18/09/2026.\n  function sonoDocente(){\n    try{ return sessionStorage.getItem('cf_docente_attivo') === '1'; }catch(e){ return false; }\n  }\n  function cloudLoginPin(pin, cb, tentativo){\n    if(!SB){ cb && cb(null, 'rete'); return; }\n    var t = tentativo || 0;\n    var riprova = function(){\n      if(t >= 4) return false;   // cinque tentativi in tutto, spalmati su una quindicina di secondi\n      try{ var e = byId('err-alunno'); if(e) e.textContent = 'Il collegamento è debole: sto riprovando… (' + (t + 2) + ' di 5)'; }catch(x){}\n      setTimeout(function(){ cloudLoginPin(pin, cb, t + 1); }, 1200 + t * 1000);\n      return true;\n    };\n    try{\n      SB.rpc('cf_login', { p_pin: pin }).then(function(res){\n        if(!res || res.error){ if(!riprova()) cb && cb(null, 'rete'); return; }\n        var r = (res.data && res.data.length) ? res.data[0] : null;\n        if(!r){ cb && cb(null, 'assente'); return; }\n        r.pin = pin;\n        cb && cb(r, 'ok');\n      }, function(){ if(!riprova()) cb && cb(null, 'rete'); });\n    }catch(e){ if(!riprova()) cb && cb(null, 'rete'); }\n  }\n  /* Gli esercizi marcati \"verifica\" il server li manda SOLO a chi li ha assegnati: quindi vanno chiesti col PIN.\n     All'ingresso l'archivio si carica un attimo PRIMA che STATE.studente esista: per questo il PIN appena\n     digitato viene tenuto in STATE.pinIngresso (19/09/2026). */\n  function pinPerEsercizi(){\n    var p = (STATE.studente && STATE.studente.pin) || STATE.pinIngresso || null;\n    if(!p){ try{ p = sessionStorage.getItem('cf_studente_attivo') || null; }catch(e){} }   // F5 a verifica aperta\n    return p;\n  }\n  // Una risposta chiesta SENZA PIN (all'apertura della pagina) che arriva quando l'alunno ormai e' noto non vale:\n  // non conterrebbe la sua verifica e la cancellerebbe dall'elenco. Si butta e si richiede col PIN.\n  function rispostaEserciziSuperata(pinChiesto){ return !sonoDocente() && !pinChiesto && !!pinPerEsercizi(); }\n  function cloudCaricaContesto(cb){\n    if(!SB){ cb && cb(); return; }\n    try{\n      var pinChiesto = pinPerEsercizi();\n      var chiamata = sonoDocente()\n        ? SB.from('ced_config').select('archivio,assegnata_id,livello').eq('id', 1).maybeSingle()\n        : SB.rpc('cf_esercizi', { p_pin: pinChiesto });\n      chiamata.then(function(res){\n        if(rispostaEserciziSuperata(pinChiesto)){ cloudCaricaContesto(cb); return; }\n        var cfg = (res && res.data) ? (sonoDocente() ? res.data : { archivio: res.data }) : null;\n        if(cfg && cfg.archivio){ try{ FATTURE = adattaArchivio(cfg.archivio); buildRubrica(); }catch(e){} }\n        if(cfg && cfg.assegnata_id){ STATE.assegnate = parseAssegnazione(cfg.assegnata_id); STATE.assegnataId = assegnPrimoId(cfg.assegnata_id); }\n        var l0c = cfg ? (assegnPrimoLiv(cfg.assegnata_id) || cfg.livello) : null;\n        if(l0c){ try{ localStorage.setItem('cf_livello', l0c); }catch(e){} }\n        cb && cb();\n      }, function(){ cb && cb(); });\n    }catch(e){ cb && cb(); }\n  }\n  /* Rilegge dal cloud SOLO l'archivio delle fatture (niente assegnazioni: quelle hanno una loro logica).\n     Serve perché la copia in localStorage è solo una scorta per partire subito e per stare offline, ma la\n     verità è nel cloud. Senza questa rilettura un dispositivo che aveva già aperto l'app restava per\n     sempre sulle fatture vecchie: al boot FATTURE veniva riempito dalla cache, e ogni richiesta al cloud\n     era protetta da un «solo se FATTURE è vuoto» che quindi non scattava mai. Chi aggiungeva una fattura\n     la vedeva solo sui dispositivi mai usati prima.\n     Se il cloud non risponde si tiene la copia locale e si va avanti: meglio le fatture vecchie che niente. */\n  function cloudAggiornaArchivio(cb){\n    if(!SB){ cb && cb(false); return; }\n    try{\n      var pinChiesto2 = pinPerEsercizi();\n      var chiamata2 = sonoDocente()\n        ? SB.from('ced_config').select('archivio').eq('id', 1).maybeSingle()\n        : SB.rpc('cf_esercizi', { p_pin: pinChiesto2 });\n      chiamata2.then(function(res){\n        if(rispostaEserciziSuperata(pinChiesto2)){ cloudAggiornaArchivio(cb); return; }\n        var cfg = (res && res.data) ? (sonoDocente() ? res.data : { archivio: res.data }) : null;\n        if(cfg && cfg.archivio){\n          try{\n            FATTURE = adattaArchivio(cfg.archivio);\n            buildRubrica();\n            try{ localStorage.setItem('cf_archivio', JSON.stringify(FATTURE)); }catch(e){}\n            cb && cb(true); return;\n          }catch(e){}\n        }\n        cb && cb(false);\n      }, function(){ cb && cb(false); });\n    }catch(e){ cb && cb(false); }\n  }\n  /* (26/09/2026) Il DOCENTE deve avere l'archivio CON le soluzioni: servono per ricostruire cedolino e dashboard\n     corretti (Valuta, Archivio, esportazioni). All'apertura della pagina, prima dell'accesso, l'archivio arriva dalla\n     porta degli alunni, che le soluzioni non le da', e dopo l'accesso nessuno lo richiedeva: il 26/09 alle 8.36\n     «Esporta HTML» e' uscito con «Cedolino corretto» e «Dashboard corretta» vuoti (log del cloud: cf_esercizi\n     all'apertura, poi l'accesso, poi nessuna lettura dell'archivio). Se manca anche una sola soluzione, lo rileggo.\n     cb(true) = archivio completo. */\n  function archivioCompleto(){ return !!(FATTURE && FATTURE.length && FATTURE.every(function(f){ return f && f.soluzione; })); }\n  function archivioDocente(cb){\n    if(!sonoDocente() || archivioCompleto()){ cb && cb(archivioCompleto()); return; }\n    cloudAggiornaArchivio(function(){ cb && cb(archivioCompleto()); });\n  }\n  function previewTesto(f){\n    var d = f && f.testo && f.testo.discorsivo;\n    if(d && d.manuale && d.manuale.length) return d.manuale.join('\\n\\n');\n    if(d && d.assistito && d.assistito.length) return d.assistito.join('\\n\\n');\n    return (f && f.testo && f.testo.operazione) ? f.testo.operazione : '(nessun testo disponibile)';\n  }\n  function showPreview(titolo, testo, onOk){\n    var ov = document.createElement('div'); ov.className = 'modal-overlay';\n    ov.innerHTML = '\u003cdiv class=\"modal-card\" style=\"max-width:640px;\">' +\n      '\u003cdiv class=\"prev-title\" style=\"padding:18px 26px 4px; font-weight:800; font-size:16px; color:#3f6b52;\">\u003c/div>' +\n      '\u003cdiv class=\"modal-body\" style=\"max-height:60vh; overflow:auto;\">\u003c/div>' +\n      '\u003cdiv class=\"modal-actions\">' +\n        '\u003cbutton type=\"button\" class=\"modal-btn modal-btn-cancel\">✕ Annulla\u003c/button>' +\n        '\u003cbutton type=\"button\" class=\"modal-btn modal-btn-ok\">✓ Assegna\u003c/button>' +\n      '\u003c/div>\u003c/div>';\n    ov.querySelector('.prev-title').textContent = titolo;\n    ov.querySelector('.modal-body').textContent = testo;\n    ov.querySelector('.modal-btn-cancel').addEventListener('click', function(){ closeModal(ov); });\n    ov.querySelector('.modal-btn-ok').addEventListener('click', function(){ closeModal(ov); if(typeof onOk==='function') onOk(); });\n    document.body.appendChild(ov);\n    ov.querySelector('.modal-btn-ok').focus();\n  }\n  /* Anteprima SOLO lettura del testo di una fattura (pulsante 👁): niente \"Assegna\", solo \"Chiudi\". */\n  function showAnteprima(titolo, testo){\n    var ov = document.createElement('div'); ov.className = 'modal-overlay';\n    ov.innerHTML = '\u003cdiv class=\"modal-card\" style=\"max-width:640px;\">' +\n      '\u003cdiv class=\"prev-title\" style=\"padding:18px 26px 4px; font-weight:800; font-size:16px; color:#3f6b52;\">\u003c/div>' +\n      '\u003cdiv class=\"modal-body\" style=\"max-height:60vh; overflow:auto;\">\u003c/div>' +\n      '\u003cdiv class=\"modal-actions\">' +\n        '\u003cbutton type=\"button\" class=\"modal-btn modal-btn-ok\">Chiudi\u003c/button>' +\n      '\u003c/div>\u003c/div>';\n    ov.querySelector('.prev-title').textContent = titolo;\n    ov.querySelector('.modal-body').textContent = testo;\n    ov.querySelector('.modal-btn-ok').addEventListener('click', function(){ closeModal(ov); });\n    document.body.appendChild(ov);\n    ov.querySelector('.modal-btn-ok').focus();\n  }\n  /* Modale di SCELTA MULTIPLA: fino a MAX_FATTURE fatture, ognuna col suo livello + anteprima 👁.\n     currentList = [{id,liv}] già assegnate; onConfirm riceve la nuova lista [{id,liv}]. */\n  function openSelezioneFatture(currentList, titolo, onConfirm){\n    var selMap = {}; var order = []; (currentList || []).forEach(function(x){ selMap[x.id] = (x.liv != null ? x.liv : null); order.push(x.id); });\n    var defaultLiv = 1; // per ora tutto Manuale (deciso da Mauro il 20/07)\n    var ov = document.createElement('div'); ov.className = 'modal-overlay';\n    ov.innerHTML = '\u003cdiv class=\"modal-card selfx-card\" style=\"max-width:700px;\">' +\n      '\u003cdiv class=\"selfx-head\">\u003cdiv class=\"selfx-title\">\u003c/div>\u003cdiv class=\"selfx-sub\">\u003c/div>\u003c/div>' +\n      '\u003cdiv class=\"modal-body selfx-body\">\u003c/div>' +\n      '\u003cdiv class=\"modal-actions\">' +\n        '\u003cbutton type=\"button\" class=\"modal-btn modal-btn-cancel\">✕ Annulla\u003c/button>' +\n        '\u003cbutton type=\"button\" class=\"modal-btn modal-btn-ok\">✓ Conferma\u003c/button>' +\n      '\u003c/div>\u003c/div>';\n    ov.querySelector('.selfx-title').textContent = titolo || 'Scegli i cedolini';\n    var subEl = ov.querySelector('.selfx-sub');\n    var body = ov.querySelector('.selfx-body');\n    var livOpts = '\u003coption value=\"1\">Manuale\u003c/option>\u003coption value=\"2\">Guidata\u003c/option>\u003coption value=\"3\">Automatica\u003c/option>';\n    fattureRaggruppate().forEach(function(g){\n      var h = document.createElement('div'); h.className = 'selfx-grp'; h.textContent = g.label; body.appendChild(h);\n      g.items.forEach(function(f){\n        var sel = Object.prototype.hasOwnProperty.call(selMap, f.id);\n        var liv = sel && selMap[f.id] != null ? selMap[f.id] : defaultLiv;\n        var row = document.createElement('div'); row.className = 'selfx-row' + (sel ? ' on' : ''); row.setAttribute('data-id', f.id);\n        row.innerHTML =\n          '\u003clabel class=\"sel hecked){ list.push({ id:fid, liv:Number(row.querySelector('.selfx-liv').value) || 1 }); }\n      });\n      // Ordine sempre per NUMERO crescente (3 · 4 · 10), indipendente da spunta e difficoltà.\n      list.sort(function(a, b){ return (parseInt(numeroFattura(a.id), 10) || 0) - (parseInt(numeroFattura(b.id), 10) || 0); });\n      closeModal(ov);\n      if(typeof onConfirm === 'function') onConfirm(list);\n    });\n    document.body.appendChild(ov);\n  }\n  function stopCollegatiTimer(){ if(STATE.collegatiTimer){ clearInterval(STATE.collegatiTimer); STATE.collegatiTimer = null; } if(STATE.pallinoTimer){ clearInterval(STATE.pallinoTimer); STATE.pallinoTimer = null; } }\n  /* =============================================================== */\n  /* Quando true (livello Manuale) la tendina della rubrica NON compare: l'alunno digita a mano. */\n  var ANA_SEARCH_OFF = false;\n  /* Listino prodotti: raccolto dalle fatture dell'archivio (come la rubrica), per la ricerca ai livelli 2 e 3. */\n  var LISTINO = [];\n\n  /* ---------- Rubrica: ricerca + autocompletamento (come nel cantiere) ---------- */\n  function anaFill(scope, rec){\n    ANA_FIELDS[scope].forEach(function(f){\n      var el = document.querySelector('[data-k=\"' + scope + '_' + f + '\"]');\n      if(el){ el.value = rec[f] || ''; el.readOnly = true; el.classList.add('locked'); }\n    });\n    var inp = document.querySelector('.ana-search[data-scope=\"' + scope + '\"]');\n    inp.value = rec.nome; inp.readOnly = true; inp.classList.add('locked');\n    var dd = inp.closest('.ana-search-wrap').querySelector('.ana-dd'); dd.classList.remove('open'); dd.innerHTML = '';\n    var btn = document.querySelector('.ana-change[data-scope=\"' + scope + '\"]'); if(btn) btn.style.display = '';\n  }\n  function anaUnlock(scope){\n    ANA_FIELDS[scope].forEach(function(f){\n      var el = document.querySelector('[data-k=\"' + scope + '_' + f + '\"]');\n      if(el){ el.value = ''; el.readOnly = false; el.classList.remove('locked' d>';\n      if(hasGen || hasAcc){ h += '\u003ctd>' + cellInput('') + '\u003c/td>'; }\n      if(hasGen){ h += '\u003ctd class=\"sc\">' + cellInput('sc') + '\u003c/td>'; }\n      if(hasAcc){ h += '\u003ctd class=\"ad\">' + cellInput('ad') + '\u003c/td>'; }\n      h += '\u003ctd>' + cellInput('') + '\u003c/td>';\n      h += '\u003ctd>' + (g.rate > 0 ? cellInput('') : '—') + '\u003c/td>\u003c/tr>';\n    });\n    h += '\u003ctr class=\"tot\">\u003ctd class=\"al\">Totali\u003c/td>';\n    if(hasGen || hasAcc){ h += '\u003ctd>' + cellInput('') + '\u003c/td>'; }\n    if(hasGen){ h += '\u003ctd class=\"sc\">' + cellInput('sc') + '\u003c/td>'; }\n    if(hasAcc){ h += '\u003ctd class=\"ad\">' + cellInput('ad') + '\u003c/td>'; }\n    h += '\u003ctd>' + cellInput('') + '\u003c/td>\u003ctd>' + cellInput('') + '\u003c/td>\u003c/tr>';\n    h += '\u003c/tbody>\u003c/table>';\n    return h;\n  }\n\n  /* Aggancia il formato giusto alle celle del castelletto: − per lo sconto, + per le spese. */\n  function attachCastCells(){\n    document.querySelectorAll('#dettaglio-iva .cast-in').forEach(function(c){\n      if(c.classList.contains('cast-neg')) attachMoneyNeg(c);\n      else if(c.classList.contains('cast-pos')) attachMoneyPos(c);\n      else attachMoney(c);\n    });\n  }\n  /* Fotografa i valori che l'alunno ha scritto nel castelletto (per riga+colonna),\n     così quando la tabella si ricostruisce NON si perde nulla. */\n  function snapshotCastelletto(){\n    var map = {}, table = document.querySelector('#dettaglio-iva table'); if(!table) return map;\n    var headers = []; table.querySelectorAll('thead th').forEach(function(th){ headers.push(th.textContent.trim()); });\n    table.querySelectorAll('tbody tr').forEach(function(tr){\n      var cells = tr.children, rowLabel = cells[0] ? cells[0].textContent.trim() : '';\n      for(var i = 1; i \u003c cells.length; i++){ var inp = cells[i].querySelector('.cast-in'); if(inp && inp.value) map[rowLabel + '||' + (headers[i] || i)] = inp.value; }\n    });\n    return map;\n  }\n  function restoreCastelletto(map){\n    if(!map) return; var table = document.querySelector('#dettaglio-iva table'); if(!table) return;\n    var headers = []; table.querySelectorAll('thead th').forEach(function(th){ headers.push(th.textContent.trim()); });\n    table.querySelectorAll('tbody tr').forEach(function(tr){\n      var cells = tr.children, rowLabel = cells[0] ? cells[0].textContent.trim() : '';\n      for(var i = 1; i \u003c cells.length; i++){ var inp = cells[i].querySelector('.cast-in'); if(inp){ var k = rowLabel + '||' + (headers[i] || i); if(map[k] != null) inp.value = map[k]; } }\n    });\n  }\n\n  /* ---------- Ricalcolo STRUTTURA: nessun valore calcolato, solo visibilita' ---------- */\n  // NERETTO sull'importo NETTO di ogni riga merce, a TUTTI i livelli (Manuale/Guidata/Automatica):\n  // l'importo di riga è in grassetto quando la riga NON ha sconti (è già il netto da sommare);\n  // se la riga ha uno sconto, il grassetto sta sul campo \"netto\" della riga sconto (già gestito).\n  function aggiornaNeretto(){\n    document.querySelectorAll('#editor .artbox').forEach(function(box){\n      var impCell = box.querySelector('.imp');\n      if(impCell) impCell.classList.toggle('is-net', box.querySelectorAll('.sconto-row').length === 0);\n    });\n  }\n  function recomputeAll(){\n    if(CED.attivo()) return;   // col cedolino i conti li fa il compilatore, qui non c'e' niente da ricalcolare\n    var arts = document.querySelectorAll('.artbox');\n    var order = [];\n    arts.forEach(function(b){ var v = b.querySelector('.iva').value; if(order.indexOf(v) === -1) order.push(v); });\n\n    var multi = arts.length >= 2;\n    var scontiGen = byId('sconti-generali');\n    if(!multi){ scontiGen.innerHTML = ''; }\n    var genRows = scontiGen.querySelectorAll('.sconto-gen-row');\n    var hasGen = genRows.length > 0;\n    byId('btnScontoGenerale').style.display = multi ? '' : 'none';\n\n    var accCount = 0;\n    document.querySelectorAll('.spesa-row').forEach(function(r){ if(r.getAttribute('data-cat') === 'accessoria') accCount++; });\n    var hasAcc = accCount > 0;\n    byId('row-totale').style.display = (hasGen || hasAcc) ? '' : 'none';\n\n    document.querySelectorAll('.riep-line').forEach(function(el){ el.style.display = ''; });\n\n    var chosen = order.filter(function(v){ return v !== ''; });\n    var groups = chosen.map(function(v){ return { label: ivaLabel(v), rate: ivaRate(v) }; });\n    var showTable = chosen.length >= 2;\n    var snap = snapshotCastelletto();\n    byId('dettaglio-iva').innerHTML = showTable ? buildDettaglioEmpty(groups, hasGen, hasAcc) : '';\n    attachCastCells();\n    restoreCastelletto(snap);\n  }\n\n  /* ---------- Sconto singolo ---------- */\n  function addScontoTo(box){\n    var holder = document.createElement('div'); holder.innerHTML = SCONTO_TEMPLATE;\n    var row = holder.firstChild;\n    attachMoneyNeg(row.querySelector('.dsc')); attachMoney(row.querySelector('.net'));\n    row.querySelector('.del-sconto').addEventListener('click', function(){ row.remove(); });\n    box.querySelector('.sconti').appendChild(row);\n    row.querySelector('.motivo').focus();\n  }\n  /* ---------- Sconto generale ---------- */\n  function addScontoGenerale(){\n    var holder = document.createElement('div'); holder.innerHTML = SCONTO_GEN_TEMPLATE;\n    var row = holder.firstChild;\n    attachMoneyNeg(row.querySelector('.dsc'));\n    row.querySelector('.del-sconto').addEventListener('click', function(){ row.remove(); recomputeAll(); });\n    byId('sconti-generali').appendChild(row);\n    recomputeAll();\n    row.querySelector('.motivo').focus();\n  }\n\n  /* ---------- Spese ---------- */\n  var SPESA_CATS = { accessoria:'Accessorie art. 12', anticipata:'Spese anticipate art. 15', cauzione:'Cauzione art. 15', interessi:'Interessi esenti art. 10' };\n  function vociSpesa(cat){\n    var dl = byId('voci-' + cat);\n    if(!dl) return [];\n    return Array.prototype.map.call(dl.querySelectorAll('option'), function(o){ return o.value; }).filter(Boolean);\n  }\n  function setupSpesaSuggerimenti(row, cat){\n    var ta = row.querySelector('.sp-desc'), dd = row.querySelector('.sp-dd');\n    if(!ta || !dd) return;\n    var voci = vociSpesa(cat);\n    function render(){\n      if(ta.readOnly){ dd.classList.remove('open'); return; }\n      var q = (ta.value || '').trim().toLowerCase();\n      var list = voci.filter(function(v){ return q === '' || v.toLowerCase().indexOf(q) >= 0; });\n      dd.innerHTML = '';\n      if(list.length === 0){ dd.classList.remove('open'); return; }\n      list.forEach(function(v){\n        var it = document.createElement('div');\n        it.className = 'ana-dd-item';\n        it.textContent = v;\n        it.addEventListener('mousedown', function(e){ e.preventDefault(); ta.value = v; autogrow(ta); dd.classList.remove('open'); });\n        dd.appendChild(it);\n      });\n      dd.classList.add('open');\n    }\n    ta.addEventListener('focus', render);\n    ta.addEventListener('input', render);\n    ta.addEventListener('blur', function(){ setTimeout(function(){ dd.classList.remove('open'); }, 120); });\n  }\n  function buildSpesaRow(cat){\n    var defDesc = (cat === 'cauzione') ? 'Imballaggi a rendere' : '';\n    return '\u003cdiv class=\"spesa-row\" data-cat=\"' + cat + '\" style=\"margin-top:10px; display:flex; align-items:flex-start; gap:8px;\">' +\n      '\u003cbutton class=\"del-sconto sp-del\" title=\"Elimina spesa\" aria-label=\"Elimina spesa\" style=\"margin-top:5px;\">' + TRASH16 + '\u003c/button>' +\n      '\u003cspan style=\"font-size:12px; color:var(--muted); font-weight:600; margin-top:11px;\">' + SPESA_CATS[cat] + '\u003c/span>' +\n      '\u003cdiv class=\"sp-desc-wrap\">' +\n        '\u003ctextarea class=\"sp-desc desc-ta\" rows=\"1\" placeholder=\"Descrizione\" autocomplete=\"off\" style=\"width:100%;\">' + esc(defDesc) + '\u003c/textarea>' +\n        '\u003cdiv class=\"ana-dd sp-dd\">\u003c/div>' +\n      '\u003c/div>' +\n      '\u003cinput class=\"amt sp-imp\" placeholder=\"€ 0,00\" inputmode=\"decimal\" style=\"margin-left:auto;\" />' +\n    '\u003c/div>';\n  }\n  function addSpesa(cat){\n    var holder = document.createElement('div'); holder.innerHTML = buildSpesaRow(cat);\n    var row = holder.firstChild;\n    attachMoney(row.querySelector('.sp-imp'));\n    var spDesc = row.querySelector('.sp-desc');\n    autogrow(spDesc);\n    spDesc.addEventListener('input', function(){ autogrow(spDesc); });\n    setupSpesaSuggerimenti(row, cat);\n    row.querySelector('.sp-del').addEventListener('click', function(){ row.remove(); recomputeAll(); });\n    var target = (cat === 'accessoria') ? 'spese-acc' : (cat === 'interessi' ? 'spese-interessi' : 'spese-art15');\n    byId(target).appendChild(row);\n    recomputeAll();\n    row.querySelector('.sp-desc').focus();\n  }\n  function mostraSceltaSpesa(){\n    var old = byId('chooser-spesa'); if(old) old.remove();\n    var el = document.createElement('div'); el.id = 'chooser-spesa'; el.className = 'chooser';\n    el.innerHTML =\n      '\u003cspan class=\"lbl\">Tipo di spesa\u003c/span>' +\n      '\u003cselect class=\"chooser-sel\" style=\"max-width:300px;\">' +\n        '\u003coption value=\"\" selected disabled hidden>Scegli tipo\u003c/option>' +\n        '\u003coption value=\"accessoria\">Spese accessorie (art. 12)\u003c/option>' +\n        '\u003coption value=\"anticipata\">Spese anticipate (art. 15)\u003c/option>' +\n        '\u003coption value=\"cauzione\">Cauzione imballaggi a rendere (art. 15)\u003c/option>' +\n        '\u003coption value=\"interessi\">Interessi di dilazione (esenti art. 10)\u003c/option>' +\n      '\u003c/select>' +\n      '\u003cbutton class=\"chooser-annulla\" title=\"Annulla\" aria-label=\"Annulla\">Annulla\u003c/button>';\n    toolbar.parentNode.insertBefore(el, toolbar.nextSibling);\n    el.querySelector('.chooser-sel').addEventListener('change', function(){ var cat = this.value; el.remove(); if(cat) addSpesa(cat); });\n    el.querySelector('.chooser-annulla').addEventListener('click', function(){ el.remove(); });\n  }\n\n  /* ---------- Articoli ---------- */\n  function initArticle(box){\n    var ta = box.querySelector('.desc-ta');\n    if(ta){ autogrow(ta); ta.addEventListener('input', function(){ autogrow(ta); }); }\n    var imp = box.querySelector('.imp'); if(imp) attachMoney(imp);\n    var p = box.querySelector('.p'); if(p) attachNumber(p);\n    var tr = box.querySelector('.trash');\n    if(tr){ tr.addEventListener('click', function(){ box.remove(); recomputeAll(); if(LIVELLO === 3) autocalc(); }); }\n    var iva = box.querySelector('.iva');\n    if(iva){ iva.addEventListener('change', function(){ recomputeAll(); if(LIVELLO === 3) autocalc(); }); }\n    setupProdottoSuggerimenti(box);\n  }\n  /* Ri-attacca i listener a TUTTE le righe dinamiche dopo un ripristino via innerHTML\n     (sconti articolo, sconti generali, spese, celle castelletto), così l'alunno che\n     riprende dopo un F5 ha di nuovo pulsanti, formattazione e suggerimenti funzionanti. */\n  function reidrataDinamici(){\n    if(CED.attivo()) return;   // il cedolino si ricostruisce da solo dentro CED.wire()\n    document.querySelectorAll('#editor .artbox .sconto-row').forEach(function(row){\n      var dsc = row.querySelector('.dsc'); if(dsc) attachMoneyNeg(dsc);\n      var net = row.querySelector('.net'); if(net) attachMoney(net);\n      var del = row.querySelector('.del-sconto'); if(del) del.addEventListener('click', function(){ row.remove(); });\n    });\n    document.querySelectorAll('#sconti-generali .sconto-gen-row').forEach(function(row){\n      var dsc = row.querySelector('.dsc'); if(dsc) attachMoneyNeg(dsc);\n      var del = row.querySelector('.del-sconto'); if(del) del.addEventListener('click', function(){ row.remove(); recomputeAll(); });\n    });\n    document.querySelectorAll('.spesa-row').forEach(function(row){\n      var cat = row.getAttribute('data-cat');\n      var imp = row.querySelector('.sp-imp'); if(imp) attachMoney(imp);\n      var sd = row.querySelector('.sp-desc'); if(sd){ autogrow(sd); sd.addEventListener('input', function(){ autogrow(sd); }); }\n      setupSpesaSuggerimenti(row, cat);\n      var del = row.querySelector('.sp-del'); if(del) del.addEventListener('click', function(){ row.remove(); recomputeAll(); });\n    });\n    attachCastCells();\n  }\n  function aggiungiArticolo(){\n    var c = byId('chooser'); if(c) c.remove();\n    var holder = document.createElement('div'); holder.innerHTML = ART_TEMPLATE;\n    var box = holder.firstChild;\n    var fondo = byId('fondo');\n    fondo.parentNode.insertBefore(box, fondo);\n    initArticle(box);\n    recomputeAll();\n    box.querySelector('.cod').focus();\n  }\n  function scontoSingolo(){\n    var arts = Array.prototype.slice.call(document.querySelectorAll('.artbox'));\n    if(arts.length === 0) return;\n    if(arts.length === 1){ addScontoTo(arts[0]); return; }\n    mostraSceltaArticolo(arts);\n  }\n  function mostraSceltaArticolo(arts){\n    var old = byId('chooser'); if(old) old.remove();\n    var el = document.createElement('div'); el.id = 'chooser'; el.className = 'chooser';\n    var opts = arts.map(function(b, i){ var code = (b.querySelector('.cod').value || '').trim(); var label = code ? code : ('Articolo ' + (i + 1)); return '\u003coption value=\"' + i + '\">' + label + '\u003c/option>'; }).join('');\n    el.innerHTML =\n      '\u003cspan class=\"lbl\">Sconto su\u003c/span>' +\n      '\u003cselect class=\"chooser-sel\" style=\"max-width:220px;\">' +\n        '\u003coption value=\"\" selected disabled hidden>Scegli articolo\u003c/option>' + opts +\n      '\u003c/select>' +\n      '\u003cbutton class=\"chooser-annulla\" title=\"Annulla\" aria-label=\"Annulla\">Annulla\u003c/button>';\n    toolbar.parentNode.insertBefore(el, toolbar.nextSibling);\n    el.querySelector('.chooser-sel').addEventListener('change', function(){ var i = parseInt(this.value, 10); el.remove(); if(!isNaN(i) && arts[i]) addScontoTo(arts[i]); });\n    el.querySelector('.chooser-annulla').addEventListener('click', function(){ el.remove(); });\n  }\n\n  /* ---------- Raccolta valori digitati + copia di cortesia ---------- */\n  function testataData(){ var t = {}; document.querySelectorAll('#editor [data-k]').forEach(function(el){ t[el.getAttribute('data-k')] = (el.value || '').trim(); }); return t; }\n  function riepData(){\n    return { totaleMerce:(byId('totale-merce').value||'').trim(), imponibile:(byId('v-imponibile').value||'').trim(), iva:(byId('v-iva').value||'').trim(), totFatt:(byId('v-totfatt').value||'').trim() };\n  }\n  function cittaS(cap, com, prov){ var cc = [cap, com].filter(Boolean).join(' '), parts = []; if(cc) parts.push(cc); if(prov) parts.push('(' + prov + ')'); return parts.join(' '); }\n  function moneyOr(v){ v = (v||'').trim(); if(!v) return '€ 0,00'; return /€/.test(v) ? v : ('€ ' + fmt(num(v))); }\n  function raccogli(){\n    if(CED.attivo()) return CED.raccogli();   // cedolino: stato del foglio + scorciatoie\n    var t = testataData(), r = riepData(), articoli = [];\n    document.querySelectorAll('#editor .artbox').forEach(function(b){\n      var sc = [];\n      b.querySelectorAll('.sconto-row').forEach(function(row){\n        sc.push({ motivo:(row.querySelector('.motivo').value||'').trim(), perc:(row.querySelector('.perc').value||'').trim(), imp:(row.querySelector('.dsc').value||'').trim() });\n      });\n      articoli.push({ cod:(b.querySelector('.cod').value||'').trim(), desc:(b.querySelector('.desc-ta').value||'').trim(), qta:(b.querySelector('.q').value||'').trim(), prezzo:(b.querySelector('.p').value||'').trim(), iva:ivaLabel(b.querySelector('.iva').value), importo:(b.querySelector('.imp').value||'').trim(), sconti:sc });\n    });\n    var scontiGen = [];\n    document.querySelectorAll('#sconti-generali .sconto-gen-row').forEach(function(row){\n      scontiGen.push({ motivo:(row.querySelector('.motivo').value||'').trim(), perc:(row.querySelector('.perc').value||'').trim(), imp:(row.querySelector('.dsc').value||'').trim() });\n    });\n    var spese = { accessoria:[], anticipata:[], cauzione:[], interessi:[] };\n    document.querySelectorAll('.spesa-row').forEach(function(row){ var cat = row.getAttribute('data-cat'); if(spese[cat]) spese[cat].push({ desc:(row.querySelector('.sp-desc').value||'').trim(), imp:(row.querySelector('.sp-imp').value||'').trim() }); });\n    return { t:t, r:r, articoli:articoli, scontiGen:scontiGen, spese:spese };\n  }\n  function buildCortesia(D){\n    // CEDOLINO: la \"bella copia\" e' il cedolino finale. Arriva o il lavoro dell'alunno\n    // ({tipo:'cedolino'}) o la soluzione dell'archivio (che ha i passaggi attesi).\n    if(D && D.tipo === 'cedolino') return CED.cortesia(D.stato || null);\n    if(D && D.passaggi) return CED.cortesiaSoluzione(D);\n    var t = D.t, r = D.r;\n    var vCitta = cittaS(t.v_cap,t.v_comune,t.v_prov), vLine = [t.v_indirizzo,vCitta].filter(Boolean).join(' · ');\n    var vFisc = []; if(t.v_piva) vFisc.push('P. IVA ' + t.v_piva); if(t.v_cf) vFisc.push('C.F. ' + t.v_cf);\n    var h = '\u003cdiv class=\"cx-head\">\u003cdiv>\u003cdiv class=\"cx-seller\">' + (esc(t.v_nome)||'Azienda venditrice') + '\u003c/div>' + (vLine?'\u003cdiv class=\"cx-muted\">'+esc(vLine)+'\u003c/div>':'') + (vFisc.length?'\u003cdiv class=\"cx-muted\">'+esc(vFisc.join(' · '))+'\u003c/div>':'') + '\u003c/div>\u003cdiv class=\"cx-doc\">\u003cdiv class=\"cx-doc-title\">FATTURA\u003c/div>\u003cdiv class=\"cx-doc-sub\">' + (t.d_numero?'n. '+esc(t.d_numero):'n. —') + (t.d_data?' · del '+esc(dataIt(t.d_data)):'') + '\u003c/div>\u003c/div>\u003c/div>';\n    var cCitta = cittaS(t.c_cap,t.c_comune,t.c_prov), cLine = [t.c_indirizzo,cCitta].filter(Boolean).join(' · ');\n    var cFisc = []; if(t.c_piva) cFisc.push('P. IVA ' + t.c_piva); if(t.c_cf) cFisc.push('C.F. ' + t.c_cf); if(t.c_pec) cFisc.push('PEC ' + t.c_pec);\n    h += '\u003cdiv class=\"cx-dest\">\u003cdiv class=\"cx-dest-label\">Spettabile cliente\u003c/div>\u003cdiv class=\"cx-dest-name\">' + (esc(t.c_nome)||'—') + '\u003c/div>' + (cLine?'\u003cdiv class=\"cx-muted\">'+esc(cLine)+'\u003c/div>':'') + (cFisc.length?'\u003cdiv class=\"cx-muted\">'+esc(cFisc.join(' · '))+'\u003c/div>':'') + '\u003c/div>';\n    h += '\u003cdiv class=\"cx-body\">\u003ctable class=\"cx-items\">\u003cthead>\u003ctr>\u003cth class=\"tc\" style=\"width:48px;\">Q.tà\u003c/th>\u003cth class=\"tl\" style=\"padding-left:10px;\">Descrizione\u003c/th>\u003cth class=\"tc\" style=\"width:100px;\">Prezzo unit.\u003c/th>\u003cth class=\"tc\" style=\"width:54px;\">IVA\u003c/th>\u003cth class=\"tr\" style=\"width:160px;\">Importo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>';\n    D.articoli.forEach(function(a){\n      var scActive = a.sconti.filter(function(s){ return s.motivo||s.perc||s.imp; });\n      var nb = scActive.length ? ' cx-nb' : '';\n      h += '\u003ctr>\u003ctd class=\"tc' + nb + '\">' + esc(a.qta) + '\u003c/td>\u003ctd class=\"tl' + nb + '\" style=\"padding-left:10px;\">' + esc(a.desc) + '\u003c/td>\u003ctd class=\"tc' + nb + '\">' + moneyOr(a.prezzo) + '\u003c/td>\u003ctd class=\"tc' + nb + '\">' + esc(a.iva) + '\u003c/td>\u003ctd class=\"tr' + nb + '\">' + esc(a.importo||'—') + '\u003c/td>\u003c/tr>';\n      scActive.forEach(function(s, si){\n        var cls = (si === scActive.length - 1) ? '' : ' cx-nb';\n        h += '\u003ctr>\u003ctd class=\"' + (cls ? 'cx-nb' : '') + '\">\u003c/td>\u003ctd colspan=\"3\" class=\"tl cx-scrow' + cls + '\">− sconto ' + esc(s.motivo) + (s.perc?' '+esc(s.perc)+'%':'') + '\u003c/td>\u003ctd class=\"tr cx-scrow' + cls + '\">' + (s.imp ? esc(s.imp) : '') + '\u003c/td>\u003c/tr>';\n      });\n    });\n    h += '\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"cx-sumwrap\">\u003cdiv class=\"cx-sum\">';\n    // «Totale merce» compare SOLO se qualcosa la separa dall'imponibile: sconti generali o spese accessorie.\n    // Senza, merce == imponibile e la riga era un doppione inutile — o «€ 0,00» nella cortesia dell'alunno,\n    // che quel campo non lo digita nemmeno (in dashboard è nascosto). Stessa condizione della dashboard\n    // (row-totale mostrato solo se hasGen || hasAcc, vedi recomputeAll).\n    var merceHaGen = (D.scontiGen || []).some(function(s){ return s.motivo || s.perc || s.imp; });\n    var merceHaAcc = ((D.spese && D.spese.accessoria) || []).some(function(s){ return s.desc || s.imp; });\n    if(merceHaGen || merceHaAcc){ h += '\u003cdiv class=\"cx-row\">\u003cspan>Totale merce\u003c/span>\u003cspan>' + moneyOr(r.totaleMerce) + '\u003c/span>\u003c/div>'; }\n    D.scontiGen.forEach(function(s){ if(s.motivo||s.perc||s.imp) h += '\u003cdiv class=\"cx-row\" style=\"color:var(--danger);\">\u003cspan>Sconto ' + esc(s.motivo) + (s.perc?' '+esc(s.perc)+'%':'') + '\u003c/span>\u003cspan>' + esc(s.imp||'—') + '\u003c/span>\u003c/div>'; });\n    D.spese.accessoria.forEach(function(s){ if(s.desc||s.imp) h += '\u003cdiv class=\"cx-row\">\u003cspan>' + esc(s.desc||'Spese accessorie') + ' (art. 12)\u003c/span>\u003cspan>' + esc(s.imp||'—') + '\u003c/span>\u003c/div>'; });\n    h += '\u003cdiv class=\"cx-row\">\u003cspan>Imponibile\u003c/span>\u003cspan>' + moneyOr(r.imponibile) + '\u003c/span>\u003c/div>\u003cdiv class=\"cx-row cx-ivarow\">\u003cspan>IVA\u003c/span>\u003cspan>' + moneyOr(r.iva) + '\u003c/span>\u003c/div>';\n    D.spese.anticipata.forEach(function(s){ if(s.desc||s.imp) h += '\u003cdiv class=\"cx-row\">\u003cspan>' + esc(s.desc||'Spese anticipate') + ' (art. 15)\u003c/span>\u003cspan>' + esc(s.imp||'—') + '\u003c/span>\u003c/div>'; });\n    D.spese.cauzione.forEach(function(s){ if(s.desc||s.imp) h += '\u003cdiv class=\"cx-row\">\u003cspan>' + esc(s.desc||'Cauzione') + '\u003c/span>\u003cspan>' + esc(s.imp||'—') + '\u003c/span>\u003c/div>'; });\n    D.spese.interessi.forEach(function(s){ if(s.desc||s.imp) h += '\u003cdiv class=\"cx-row\">\u003cspan>' + esc(s.desc||'Interessi di dilazione') + '\u003c/span>\u003cspan>' + esc(s.i Content = '–';\n  }\n\n  /* ---------- Testo ALLEGGERITO (livelli Guidata/Automatica): niente anagrafiche complete né codici ---------- */\n  function renderVerificaSemplice(titolo, v){\n    byId('ver-tit').textContent = titolo || 'Testo dell\\'esercitazione';\n    // Livelli Guidata/Automatica: testo DISCORSIVO (prosa), solo nomi, senza codici né anagrafiche complete.\n    if(v.discorsivo && v.discorsivo.assistito && v.discorsivo.assistito.length){\n      var hp = ''; v.discorsivo.assistito.forEach(function(p){ hp += '\u003cp class=\"vb-op\">' + esc(p) + '\u003c/p>'; });\n      byId('ver-body').innerHTML = hp;\n      byId('ver-body').classList.remove('collapsed'); byId('ver-toggle').textContent = '–';\n      return;\n    }\n    var h = '';\n    h += '\u003cp class=\"vb-op\">' + esc(v.operazione) + '\u003c/p>';\n    h += '\u003cdiv class=\"vb-doc\">\u003cspan>\u003cb>Venditore:\u003c/b> ' + esc(v.venditore.rs) + '\u003c/span>\u003cspan>\u003cb>Cliente:\u003c/b> ' + esc(v.cliente.rs) + '\u003c/span>\u003c/div>';\n    h += '\u003cdiv class=\"vb-doc\">\u003cspan>\u003cb>Fattura n.\u003c/b> ' + esc(v.documento.numero) + ' del ' + esc(v.documento.data) + '\u003c/span>\u003cspan>\u003cb>Pagamento:\u003c/b> ' + esc(v.pagamento.metodo) + (v.pagamento.termini ? ' · ' + esc(v.pagamento.termini) : '') + '\u003c/span>' + (v.pagamento.iban?'\u003cspan>\u003cb>IBAN:\u003c/b> '+esc(v.pagamento.iban)+'\u003c/span>':'') + '\u003c/div>';\n    h += '\u003ctable class=\"vb-items\">\u003cthead>\u003ctr>\u003cth style=\"width:460px;\">Descrizione\u003c/th>\u003cth style=\"text-align:center; width:56px;\">Q.tà\u003c/th>\u003cth style=\"text-align:right; width:106px;\">Prezzo unit.\u003c/th>\u003cth style=\"text-align:center; width:60px;\">IVA\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>';\n    v.articoli.forEach(function(a){ h += '\u003ctr>\u003ctd>' + esc(a.desc) + '\u003c/td>\u003ctd class=\"tc\">' + esc(a.q) + '\u003c/td>\u003ctd class=\"tr\">' + esc(a.p) + '\u003c/td>\u003ctd class=\" in Automatica; negli altri livelli i campi calcolati tornano editabili\n    if(n === 3){ autocalc(); }\n    else { setComputedReadonly(false); sbloccaBolloAuto(); }\n  }\n\n  /* ---------- MATTONE 2 · Ricerca prodotti dal listino (livelli Guidata/Automatica) ---------- */\n  function rankProdotti(q){\n    q = (q||'').trim().toLowerCase(); if(!q) return [];\n    var res = [];\n    LISTINO.forEach(function(r){\n      var cod = (r.cod||'').toLowerCase(), desc = (r.desc||'').toLowerCase();\n      var score = 99;\n      if(cod.indexOf(q) === 0) score = 0;\n      else if(desc.indexOf(q) === 0) score = 1;\n      else if(desc.split(/[\\s.,«»\"()\\/\\-]+/).some(function(w){ return w && w.indexOf(q) === 0; })) score = 2;\n      else if(desc.indexOf(q) >= 0 || cod.indexOf(q) >= 0) score = 3;\n      if(score \u003c 99) res.push({ r:r, s:score });\n    });\n    res.sort(function(a,b){ return a.s - b.s || a.r.desc.localeCompare(b.r.desc); });\n    return res.map(function(x){ return x.r; });\n  }\n  function setupProdottoSuggerimenti(box){\n    var cod = box.querySelector('.cod'), ta = box.querySelector('.desc-ta');\n    if(!ta) return;\n    var cell = ta.parentNode;\n    if(cell && cell.style){ cell.style.position = 'relative'; }\n    var dd = cell.querySelector('.prod-dd');\n    if(!dd){ dd = document.createElement('div'); dd.className = 'ana-dd prod-dd'; cell.appendChild(dd); }\n    function fill(rec){\n      if(cod) cod.value = rec.cod || '';\n      ta.value = rec.desc || ''; autogrow(ta);\n      // L'IVA la mette il sistema SOLO in Automatica (livello 3). In Guidata e Manuale la deve scegliere\n      // l'alunno: e' parte del ragionamento (soprattutto le esportazioni, dove non c'e' IVA e va messo N3).\n      var iva = box.querySelector('.iva'); if(iva && LIVELLO === 3) iva.value = ivaCodeFromLabel(rec.iva) || '';\n      dd.classList.remove('open'); dd.innerHTML = '';\n      recomputeAll(); if(LIVELLO === 3) autocalc();\n    }\n    function render(q){\n      if(LIVELLO \u003c 2 || ta.readOnly){ dd.classList.remove('open'); return; }\n      var list = rankProdotti(q);\n      dd.innerHTML = '';\n      if(!q || !q.trim() || list.length === 0){ dd.classList.remove('open'); return; }\n      list.forEach(function(r){\n        var it = document.createElement('div'); it.className = 'ana-dd-item';\n        it.innerHTML = '\u003cb>' + esc(r.desc) + '\u003c/b>\u003cspan class=\"sub\">cod. ' + esc(r.cod) + (LIVELLO === 3 ? ' · IVA ' + esc(r.iva) : '') + '\u003c/span>';\n        it.addEventListener('mousedown', function(e){ e.preventDefault(); fill(r); });\n        dd.appendChild(it);\n      });\n      dd.classList.add('open');\n    }\n    ta.addEventListener('input', function(){ render(ta.value); });\n    ta.addEventListener('focus', function(){ if(ta.value.trim()) render(ta.value); });\n    ta.addEventListener('blur', function(){ setTimeout(function(){ dd.classList.remove('open'); }, 150); });\n    if(cod){ cod.addEventListener('input', function(){ render(cod.value); }); }\n  }\n\n  /* ---------- MATTONE 3 · Calcoli automatici (livello Automatica) ---------- */\n  function sumSpeseDom(cat){\n    var s = 0;\n    document.querySelectorAll('.spesa-row[data-cat=\"' + cat + '\"]').forEach(function(r){ s = round2(s + num(r.querySelector('.sp-imp').value)); });\n    return s;\n  }\n  /* ---------- Imposta di bollo (2,00 € se gli importi fuori-IVA superano 77,47 €) ---------- */\n  var BOLLO_SOGLIA = 77.47, BOLLO_IMPORTO = 2;\n  function findBolloRow(){\n    var out = null;\n    document.querySelectorAll('.spesa-row[data-cat=\"anticipata\"]').forEach(function(r){\n      var d = r.querySelector('.sp-desc');\n      if(!out && d && (d.value || '').trim().toLowerCase() === 'bollo') out = r;\n    });\n    return out;\n  }\n  function sumAntNoBollo(){\n    var s = 0;\n    document.querySelectorAll('.spesa-row[data-cat=\"anticipata\"]').forEach(function(r){\n      var d = r.querySelector('.sp-desc');\n      if(d && (d.value || '').trim().toLowerCase() === 'bollo' = ex.querySelector('.sp-imp'); if(imp) imp.readOnly = false;\n      var del = ex.querySelector('.sp-del'); if(del) del.style.display = '';\n    }\n  }\n  function readDomSol(){\n    var arts = [];\n    document.querySelectorAll('#editor .artbox').forEach(function(box){\n      var scontiRiga = [];\n      box.querySelectorAll('.sconto-row').forEach(function(r){ var pc = num(r.querySelector('.perc').value); if(pc) scontiRiga.push({ perc:pc }); });\n      arts.push({ quantita:num(box.querySelector('.q').value), prezzo:num(box.querySelector('.p').value), iva:box.querySelector('.iva').value, scontiRiga:scontiRiga });\n    });\n    var sg = [];\n    document.querySelectorAll('#sconti-generali .sconto-gen-row').forEach(function(r){ var pc = num(r.querySelector('.perc').value); if(pc) sg.push({ perc:pc }); });\n    var spese = { accessorie:[], anticipazioni:[], cauzioni:[], interessi:[] };\n    var map = { accessoria:'accessorie', anticipata:'anticipazioni', cauzione:'cauzioni', interessi:'interessi' };\n    document.querySelectorAll('.spesa-row').forEach(function(r){ var k = map[r.getAttribute('data-cat')]; var v = num(r.querySelector('.sp-imp').value); if(k && v) spese[k].push({ importo:v }); });\n    return { articoli:arts, scontiGenerali:sg, spese:spese };\n  }\n  function setComputedReadonly(on){\n    document.querySelectorAll('#editor .artbox .imp, #editor .artbox .sconto-row .dsc, #editor .artbox .sconto-row .net, #sconti-generali .sconto-gen-row .dsc, #totale-merce, #v-imponibile, #v-iva, #v-totfatt, #dettaglio-iva .cast-in').forEach(function(el){ el.readOnly = !!on; });\n  }\n  function autocalc(){\n    if(LIVELLO !== 3) return;\n    recomputeAll(); // normalizza struttura e visibilità\n    var sol = readDomSol();\n    sol.articoli = sol.articoli.filter(function(a){ return a.iva !== ''; });\n    var hasAny = sol.articoli.some(function(a){ return round2(a.quantita * a.prezzo) > 0; });\n    // riempi importi e netti di riga, e calcola il totale merce\n    var totMerce = 0;\n    document.querySelectorAll('#editor .artbox').forEach(function(box){\n      var q = num(box.querySelector('.q').value), p = num(box.querySelector('.p').value);\n      var lordo = round2(q * p);\n      var impCell = box.querySelector('.imp'); if(impCell) impCell.value = (lordo > 0) ? eur(lordo) : '';\n      var running = lordo;\n      box.querySelectorAll('.sconto-row').forEach(function(r){\n        var pc = num(r.querySelector('.perc').value); var sc = round2(running * pc / 100); running = round2(running - sc);\n        var dsc = r.querySelector('.dsc'); if(dsc) dsc.value = pc ? ('− ' + eur(sc)) : '';\n        var net = r.querySelector('.net'); if(net) net.value = pc ? eur(running) : '';\n      });\n      // Neretto: se l'articolo non ha sconti di riga, l'importo è già il netto → in grassetto.\n      if(impCell) impCell.classList.toggle('is-net', box.querySelectorAll('.sconto-row').length === 0);\n      if(box.querySelector('.iva').value !== '' && lordo > 0) totMerce = round2(totMerce + running);\n    });\n    // sconti generali: importo calcolato in sequenza sul totale merce\n    var runG = totMerce;\n    document.querySelectorAll('#sconti-generali .sconto-gen-row').forEach(function(r){\n      var pc = num(r.querySelector('.perc').value); var sc = round2(runG * pc / 100); runG = round2(runG - sc);\n      var dsc = r.querySelector('.dsc'); if(dsc) dsc.value = pc ? ('− ' + eur(sc)) : '';\n    });\n    if(!hasAny){\n      syncAutoBollo(false);\n      ['totale-merce','v-imponibile','v-iva','v-totfatt'].forEach(function(id){ var el = byId(id); if(el) el.value = ''; });\n      byId('dettaglio-iva').innerHTML = '';\n      setComputedReadonly(true); return;\n    }\n    var cast = calcCastelletto(sol, {});\n    var groups = cast.righe.map(function(g){ return { label:g.aliquota, rate:g.rate }; });\n    var det = byId('dettaglio-iva');\n    if(groups.length >= 2){ det.innerHTML = buildDettaglioEmpty(groups, cast.hasGen, cast.hasAcc); fillCastelletto(cast); }\n    else { det.innerHTML = ''; }\n    syncAutoBollo(nonIvaTotale(cast) > BOLLO_SOGLIA);\n    var antic = sumSpeseDom('anticipata'), cau = sumSpeseDom('cauzione'), inter = sumSpeseDom('interessi');\n    byId('totale-merce').value = (cast.hasGen || cast.hasAcc) ? eur(cast.tot.merce) : '';\n    byId('v-imponibile').value = eur(cast.tot.imponibile);\n    byId('v-iva').value = eur(cast.tot.imposta);\n    byId('v-totfatt').value = eur(round2(cast.tot.imponibile + cast.tot.imposta + antic + cau + inter));\n    setComputedReadonly(true);\n  }\n\n  /* ---------- Adattatore archivio (super JSON -> formato interno) ---------- */\n  function ivaLabelArch(v){ var m = {'22':'22%','10':'10%','5':'5%','4':'4%','N4':'Esente (N4)','N3':'Non imponibile (N3)','N2':'Fuori campo (N2)'}; return m[v] || v; }\n\n  /* ---------- Castelletto IVA della soluzione (calcolo standard) ---------- */\n  function calcCastelletto(sol, ta){\n    var solArts = sol.articoli || [];\n    var order = [], merce = {}, netta = {};\n    solArts.forEach(function(a){\n      var code = String(a.iva);\n      var lordo = round2(a.quantita * a.prezzo);\n      var running = lordo;\n      (a.scontiRiga || []).forEach(function(s){ running = round2(running - round2(running * s.perc / 100)); });\n      if(order.indexOf(code) === -1){ order.push(code); merce[code] = 0; netta[code] = 0; }\n      merce[code] = round2(merce[code] + lordo);\n      netta[code] = round2(netta[code] + running);\n    });\n    // totaleMerce = somma dei netti riga. LO CALCOLO SEMPRE DALLE RIGHE, non mi fido di totaliAttesi.\n    // Storia: in ES09 l'archivio aveva totaleMerce=1254 (il LORDO) invece di 1155,60 (il netto): un solo\n    // numero sbagliato a mano. Il codice si fidava, e siccome l'ultima aliquota si prende tutto il residuo\n    // (vedi sotto), il castelletto della SOLUZIONE mostrava 288,40 al 22% invece di 190,00. Risultato: l'app\n    // dava due risposte \"corrette\" diverse sulla stessa fattura, e quella sbagliata era il riferimento del\n    // docente in fase di valutazione. Il calcolo dalle righe è l'unica verità: un refuso nell'archivio (ora\n    // che se ne aggiungono di nuove) non può più produrre una soluzione sbagliata. Se i due valori divergono\n    // lo segnalo qui sotto, ma vince sempre il calcolo.\n    var totaleMerce = 0;\n    order.forEach(function(c){ totaleMerce = round2(totaleMerce + netta[c]); });\n    try{\n      if(ta.totaleMerce != null && Math.abs(round2(ta.totaleMerce) - totaleMerce) > 0.011 && window.console && console.warn){\n        console.warn('Archivio: totaleMerce dichiarato ' + ta.totaleMerce + ' ma la somma dei netti è ' + totaleMerce + '. Uso la somma dei netti.');\n      }\n    }catch(e){}\n    // sconto generale: applicato in sequenza sul totale merce\n    var running = totaleMerce;\n    (sol.scontiGenerali || []).forEach(function(s){ running = round2(running - round2(running * s.perc / 100)); });\n    var factor = totaleMerce > 0 ? running / totaleMerce : 1;\n    var nettaGen = {}, accNettaGen = 0;\n    order.forEach(function(code, i){\n      if(i === order.length - 1){ nettaGen[code] = round2(running - accNettaGen); }\n      else { nettaGen[code] = round2(netta[code] * factor); accNettaGen = round2(accNettaGen + nettaGen[code]); }\n    });\n    // spese accessorie ripartite in proporzione al netto generale\n    var accessorie = 0;\n    ((sol.spese && sol.spese.accessorie) || []).forEach(function(x){ accessorie = round2(accessorie + (x.importo || 0)); });\n    var spesa = {}, accSpesa = 0;\n    order.forEach(function(code, i){\n      if(i === order.length - 1){ spesa[code] = round2(accessorie - accSpesa); }\n      else { spesa[code] = running > 0 ? round2(accessorie * nettaGen[code] / running) : 0; accSpesa = round2(accSpesa + spesa[code]); }\n    });\n    var hasGen = (sol.scontiGenerali || []).length > 0;\n    var hasAcc = accessorie > 0;\n    var righe = [], tot = { merce:0, sconto:0, spesa:0, imponibile:0, imposta:0 };\n    order.forEach(function(code){\n      var rate = /^\\d/.test(code) ? num(code) : 0;\n      var imponibile = round2(nettaGen[code] + spesa[code]);\n      var imposta = round2(imponibile * rate / 100);\n      // Colonna MERCE = merce NETTA (dopo gli sconti di riga); colonna SCONTO GEN. = solo lo sconto generale.\n      var sconto = round2(netta[code] - nettaGen[code]);\n      righe.push({ aliquota:ivaLabelArch(code), rate:rate, merce:netta[code], sconto:sconto, spesa:spesa[code], imponibile:imponibile, imposta:imposta });\n      tot.merce = round2(tot.merce + netta[code]);\n      tot.sconto = round2(tot.sconto + sconto);\n      tot.spesa = round2(tot.spesa + spesa[code]);\n      tot.imponibile = round2(tot.imponibile + imponibile);\n      tot.imposta = round2(tot.imposta + imposta);\n    });\n    // verifica non bloccante contro il castelletto atteso (se presente)\n    try{\n      var att = ta.castelletto || [];\n      att.forEach(function(r){\n        var mine = righe.find(function(x){ return x.aliquota === ivaLabelArch(String(r.aliquota)); });\n        if(mine){\n          if(Math.abs(mine.imponibile - (r.imponibile || 0)) > 0.011 || Math.abs(mine.imposta - (r.imposta || 0)) > 0.011){\n            if(window.console && console.warn){ console.warn('Castelletto soluzione: scostamento su aliquota ' + r.aliquota); }\n          }\n        }\n      });\n    }catch(e){}\n    return { hasGen:hasGen, hasAcc:hasAcc, righe:righe, tot:tot };\n  }\n\n  function adattaFattura(fx){\n    /* Un esercizio-CEDOLINO non ha venditore/articoli: si adatta da solo, e il suo testo\n       entra nel canale 'discorsivo.manuale', lo stesso che usano anteprime ed esportazioni.\n       (La compilazione del cedolino lato alunno arriva col trapianto del compilatore.) */\n    if(fx.tipo === 'cedolino'){\n      return { id:fx.id, numero:numeroDaArchivio(fx), titolo:titoloDaArchivio(fx), difficolta:fx.difficolta,\n               tipo:'cedolino', consegna:(fx.consegna || ''), verifica:!!fx.verifica,\n               testo:{ operazione:(f
