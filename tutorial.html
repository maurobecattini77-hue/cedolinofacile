nnerHTML = esc(v.n) + '\u003cspan class=\"d\">Già inserita\u003c/span>'; }\n      if(v.pieno) creaRetribuzione(init);\n      else if(v.tipo === 'contributi') creaContributi(init);\n      else if(v.tipo === 'irpef') creaIrpefLorda(init);\n      else if(v.tipo === 'detrazioni') creaDetrazioni(init);\n      else if(v.tipo === 'irpef-netta') creaIrpefNetta(init);\n      else if(v.tipo === 'somma') creaSommaIntegrativa(init);\n      else if(v.tipo === 'netto') creaNetto(init);\n      else if(v.tipo === 'anagrafica') creaAnagrafica(id, init);\n    }\n    function sbloccaVoce(id){\n      var p = pulsantiVoce[id];\n      if(!p) return;\n      p.b.disabled = false;\n      p.b.textContent = p.v.n;\n    }\n\n    /* ---------- lo STATO del foglio: si legge dal vivo, si scrive nel DOM ---------- */\n    function leggiStato(){\n      var ordine = [];\n      var bh = blocchiEl();\n      if(bh){\n        Array.prototype.forEach.call(bh.children, function(bl){\n          if(bl._id && bl._leggi) ordine.push({ id:bl._id, dati:bl._leggi() });\n        });\n      }\n      return { ordine:ordine };\n    }\n    function scriviStato(){\n      var el = byIdC('ced-stato');\n      if(!el) return;\n      try{ el.setAttribute('data-stato', JSON.stringify(leggiStato())); }catch(e){}\n    }\n    function statoSalvato(){\n      var el = byIdC('ced-stato');\n      if(!el) return null;\n      var raw = el.getAttribute('data-stato');\n      if(!raw) return null;\n      try{ var s = JSON.parse(raw); return (s && s.ordine && s.ordine.length) ? s : null; }catch(e){ return null; }\n    }\n\n    /* L'imponibile fiscale che l'alunno ha costruito: retribuzione e contributi coi SUOI segni\n       (e' la striscia verde). null se il blocco dei contributi non c'e'. */\n    function imponibileCostruito(ed){\n      var rc = ed.querySelectorAll('.riga-contributi');\n      if(!rc.length) return null;\n      var t = 0;\n      ed.querySelectorAll('.blocco').forEach(function(b){\n        var tt = b.querySelector('.blocco-h .t');\n        if(tt && tt.textContent === 'Retribuzione') b.querySelectorAll('[data-riga]').forEach(function(x){ if(x._valore) t += x._valore(); });\n      });\n      rc.forEach(function(x){ if(x._valore) t += x._valore(); });\n      return t;\n    }\n\n    /* ---------- ricalcolo ---------- */\n    function aggiorna(){\n      var ed = byIdC('ced-editor');\n      if(!ed) return;\n\n      /* Il Netto parte dall'imponibile fiscale gia' costruito: lo riporta l'app, cosi' l'alunno\n         non deve risalire il foglio col dito (collaudo 15/09). Non e' un automatismo: se\n         retribuzione o contributi sono sbagliati, resta sbagliato. Senza il blocco dei\n         contributi la casella si scrive a mano. */\n      var inImpNetto = ed.querySelector('input[data-imp-netto]');\n      if(inImpNetto){\n        var fisc = imponibileCostruito(ed);\n        inImpNetto.readOnly = fisc !== null;\n        if(fisc !== null) inImpNetto.value = euro(fisc);\n      }\n      ed.querySelectorAll('.sotto').forEach(function(s){\n        var t = 0;\n        s.querySelectorAll('[data-riga]').forEach(function(r){ if(r._valore) t += r._valore(); });\n        var cel = s.querySelector('.sotto-h [data-tot]'); if(cel) cel.textContent = euro(t);\n      });\n      ed.querySelectorAll('.blocco').forEach(function(b){\n        var t = 0;\n        b.querySelectorAll('[data-riga]').forEach(function(r){ if(r._valore) t += r._valore(); });\n        var cel = b.querySelector('.blocco-h [data-tot]');\n        if(cel) cel.textContent = euro(t);   /* le anagrafiche non hanno totale: non girano soldi */\n        var lo = b.querySelector('[data-lorda]');\n        if(lo) lo.textContent = euro(t);     /* la retribuzione lorda ripetuta in fondo al suo blocco */\n      });\n\n      /* IRPEF netta: le scritte «IRPEF lorda» e «Detrazioni» a conto giusto (vedi creaIrpefNetta) */\n      var blNetta = null, lordaTot = null, detrTot = 0;\n      ed.querySelectorAll('.blocco').forEach(function(b){\n        if(b._id === 'irpef-n') blNetta = b;\n        else if(b._id === 'irpef-l' && b._totale) lordaTot = b._totale();\n        else if(b._id === 'detr' && b._sommaVoci) detrTot = b._sommaVoci();\n      });\n      if(blNetta && blNetta._etichette) blNetta._etichette(lordaTot, detrTot);\n\n      /* L'imponibile fiscale non lo inventa l'app: retribuzione scritta dall'alunno\n         meno i contributi scritti dall'alunno. Se sono sbagliati, resta sbagliato. */\n      var strisce = ed.querySelectorAll('.risultato:not(.risultato-lorda)');\n      if(strisce.length){\n        var retr = 0, blR = null;\n        ed.querySelectorAll('.blocco').forEach(function(b){\n          var t = b.querySelector('.blocco-h .t');\n          if(t && t.textContent === 'Retribuzione') blR = b;\n        });\n        if(blR) blR.querySelectorAll('[data-riga]').forEach(function(x){ if(x._valore) retr += x._valore(); });\n        var contr = 0;\n        var segnoC = 0;   /* il segno della striscia segue il bottone scelto, non il numero (collaudo 14/09) */\n        ed.querySelectorAll('.riga-contributi').forEach(function(x){ if(x._valore) contr += x._valore(); if(x._segno) segnoC = x._segno; });\n        strisce.forEach(function(s){\n          s.querySelector('[data-conto]').textContent = blR\n            ? euro(retr) + (segnoC ? ((segnoC \u003c 0 ? ' − ' : ' + ') + euro(Math.abs(contr))) : '')\n            : 'manca la retribuzione: inseriscila per vedere il conto';\n          s.querySelector('[data-fiscale]').textContent = euro(retr + contr);\n        });\n      }\n\n      var righe = Array.prototype.slice.call(ed.querySelectorAll('[data-riga]'));\n      var tot = 0, conImporto = 0, senzaSegno = 0;\n      righe.forEach(function(r){\n        if(!r._valore) return;\n        if(r._nelFoglio !== false) tot += r._valore();   /* i passaggi intermedi non sono trattenute */\n        var manca = !!(r._senzaSegno && r._senzaSegno());\n        if(manca) senzaSegno++;\n        if(r._curSegno) r._curSegno.classList.toggle('manca', manca);\n        if(r._valore() !== 0) conImporto++;\n      });\n      var elTot = byIdC('ced-totale'); if(elTot) elTot.textContent = euro(tot);\n      var vuoto = byIdC('ced-vuoto'); if(vuoto) vuoto.style.display = ed.querySelector('.blocco') ? 'none' : '';\n\n      /* I segni mancanti (collaudo 15/09): l'avviso in alto nessuno lo vedeva. Adesso il ± delle\n         voci senza segno pulsa in rosso, l'avviso sta accanto a «Finalizza», e finche' manca\n         un segno non si finalizza e non si aggiunge niente (segnoMancante). */\n      var st = byIdC('ced-stato-testo'); if(st) st.textContent = '';\n      var av = byIdC('ced-avviso-segni');\n      if(av){\n        av.hidden = senzaSegno === 0;\n        av.textContent = (senzaSegno === 1) ? 'Manca il segno in una voce: sceglilo per andare avanti.'\n                                            : 'Manca il segno in ' + senzaSegno + ' voci: sceglilo per andare avanti.';\n      }\n      var fin = byIdC('btn-fin'); if(fin) fin.disabled = conImporto === 0 || senzaSegno > 0;\n\n      scriviStato();\n      /* Avvisa l'app che c'e' del lavoro nuovo da salvare (il salvataggio vero e'\n         il solito, con la sua attesa): serve per le scelte fatte col mouse, che\n         non passano dalle caselle di testo. isTrusted=false, quindi non conta\n         come \"digitazione vera\" per la protezione del recupero dal cloud. */\n      if(!MUTO){ try{ document.getElementById('editor').dispatchEvent(new Event('input')); }catch(e){} }\n    }\n\n    /* ---------- costruzione / ricostruzione ---------- */\n    function pulisci(){\n      chiudi();\n      tendineHost().innerHTML = '';\n      creati = {};\n      SCORCIATOIE = [];\n      REDDITO = ''; RED_FISC = ''; RED_MENS = '';\n      pulsantiVoce = {};\n      var bh = blocchiEl(); if(bh) bh.innerHTML = '';\n    }\n    function costruisciMenuRoot(){\n      var btn = byIdC('btn-root');\n      if(!btn) return;\n      var m = document.createElement('div');\n      m.className = 'menu';\n      m.hidden = true; m.setAttribute('role','menu');\n      var h = document.createElement('div'); h.className='mh'; h.textContent='Scegli la voce da inserire'; m.appendChild(h);\n      VOCI.forEach(function(v){\n        var b = document.createElement('button');\n        b.type='button';\n        b.textContent = v.n;\n        b.addEventListener('click', function(){\n          chiudi();\n          if(creati[v.id]) return;\n          creaBlocco(v.id);\n          aggiorna();\n        });\n        pulsantiVoce[v.id] = {b:b, v:v};\n        m.appendChild(b);\n      });\n      tendineHost().appendChild(m);\n      var nuovo = btn.cloneNode(true);   /* via i vecchi ascoltatori, se il bottone viene ri-agganciato */\n      btn.parentNode.replaceChild(nuovo, btn);\n      nuovo.addEventListener('click', function(){ if(segnoMancante()) return; apri(nuovo, m); });\n    }\n    function costruisciDaStato(stato){\n      ((stato && stato.ordine) || []).forEach(function(voce){ creaBlocco(voce.id, voce.dati); });\n    }\n    function wire(){\n      if(!byIdC('ced-editor')) return;\n      var stato = statoSalvato();\n      pulisci();\n      costruisciMenuRoot();\n      var fin = byIdC('btn-fin');\n      if(fin){\n        var nuovo = fin.cloneNode(true);\n        fin.parentNode.replaceChild(nuovo, fin);\n        nuovo.addEventListener('click', function(){\n          try{\n            byId('cortesia-page').innerHTML = buildCortesia(raccogli());\n            show('cortesia-view');\n          }catch(e){}\n        });\n      }\n      if(stato) costruisciDaStato(stato);\n      aggiorna();\n    }\n\n    /* Il foglio in SOLA LETTURA (Valuta del docente, soluzione, «la mia dashboard»): si ricostruisce\n       dallo stato come fa wire(), ma senza avvisare il salvataggio. Chi lo chiama poi lo chiude con\n       lockEditor() e sol-mode (collaudo del 15/09). */\n    function mostraFoglio(stato){\n      if(!byIdC('ced-editor')) return false;\n      if(!stato) stato = statoSalvato();\n      MUTO = true;\n      try{ pulisci(); costruisciMenuRoot(); if(stato) costruisciDaStato(stato); aggiorna(); }\n      finally{ MUTO = false; }\n      return true;\n    }\n\n    /* I nomi delle voci NON si scrivono a mano: si scelgono da un elenco chiuso. Se in un foglio consegnato\n       ne compare uno che l'app non offre, quel foglio e' stato ritoccato da fuori (Ispeziona). 18/09/2026. */\n    function vociStraneCed(stato){\n      var ammessi = {};\n      SEZIONI.forEach(function(sz){ (sz.voci || []).forEach(function(v){ ammessi[v.n] = true; }); });\n      VOCI.forEach(function(v){ ammessi[v.n] = true; });\n      VOCI_NETTO.forEach(function(v){ ammessi[v.n] = true; });\n      VOCI_DETRAZIONI.forEach(function(v){ ammessi[v.n] = true; });\n      ammessi['Contributi previdenziali'] = true;\n      var fuori = [], visti = {};\n      ((stato && stato.ordine) || []).forEach(function(b){\n        var d = (b && b.dati) || {};\n        (d.sezioni || []).forEach(function(sz){\n          (sz.righe || []).forEach(function(r){ if(r && r.n && !ammessi[r.n] && !visti[r.n]){ visti[r.n] = true; fuori.push(r.n); } });\n        });\n        (d.righe || []).forEach(function(r){ if(r && r.n && !ammessi[r.n] && !visti[r.n]){ visti[r.n] = true; fuori.push(r.n); } });\n      });\n      return fuori;\n    }\n\n    /* ---------- raccolta per consegna e valutazione ---------- */\n    function raccogliCed(){\n      /* Se il foglio e' vivo (chiusure agganciate) lo stato si legge dal vivo;\n         altrimenti (HTML appena ripristinato) vale quello scritto nel DOM. */\n      var vivo = false;\n      var bh = blocchiEl();\n      if(bh){ Array.prototype.forEach.call(bh.children, function(bl){ if(bl._leggi) vivo = true; }); }\n      var stato = vivo ? leggiStato() : (statoSalvato() || { ordine:[] });\n      return { tipo:'cedolino', stato:stato, scorciatoie:SCORCIATOIE.slice() };\n    }\n\n    /* ---------- i conti rifatti dallo stato (per la bella copia) ---------- */\n    function num0(v){ var n = leggiNumero(v); return n === null ? 0 : n; }\n    function datiBlocco(stato, id){\n      var out = null;\n      ((stato && stato.ordine) || []).forEach(function(b){ if(b.id === id) out = b.dati; });\n      return out;\n    }\n    function meseRigaScelta(rr, reddito){\n      if(!rr || !rr.scheda) return 0;\n      var cfg = SCHEDE[rr.scheda];\n      if(!cfg || rr.fascia == null || !cfg.fasce[rr.fascia]) return 0;\n      var R = num0(reddito != null ? reddito : rr.reddito);   /* prima del 15/09 il reddito stava in ogni voce */\n      var f = cfg.fasce[rr.fascia];\n      var annua = (R > 0 || f.calcola.length === 0) ? f.calcola(R) : 0;\n      if(annua \u003c 0) annua = 0;\n      var m = (annua > 0 && cfg.maggiorazione) ? cfg.maggiorazione(R) : null;\n      if(m) annua += m.importo;\n      return annua / 12;\n    }\n    /* Tutto quello che serve al prospetto, letto dallo stato del foglio. Mostra SOLO quello che\n       l'alunno ha scritto, giusto o sbagliato che sia: l'app somma e basta. Il segno decide la\n       colonna (+ competenze, − trattenute). */\n    function contiDaStato(stato){\n      var d = { retr:[], fisse:[], lorda:null, contr:null, impFisc:null, fiscali:[], integr:[], netto:null,\n                irpefLorda:null, detr:null, detrVoci:{}, irpefNetta:null, addReg:null, addCom:null,\n                totC:0, totT:0, az:{}, dip:{} };\n      function conta(r){ if(r.s === 1) d.totC += r.v; else d.totT += r.v; }\n\n      var retr = datiBlocco(stato, 'retr');\n      if(retr){\n        var lorda = 0, quante = 0;\n        (retr.sezioni || []).forEach(function(sz){\n          (sz.righe || []).forEach(function(r){\n            var v = num0(r.v);\n            if(!r.n || !(r.s === 1 || r.s === -1) || v === 0) return;\n            var riga = { n:r.n, v:v, s:r.s };\n            d.retr.push(riga); conta(riga); lorda += v * r.s; quante++;\n            if(sz.id === 'fisse' && r.s === 1) d.fisse.push(riga);\n          });\n        });\n        if(quante) d.lorda = lorda;\n      }\n\n      var contr = datiBlocco(stato, 'contr');\n      if(contr){\n        var vc = num0(contr.tot);\n        d.contr = { imp:contr.imp || '', ali:contr.ali || '', tot:contr.tot || '', riga:null };\n        if((contr.s === 1 || contr.s === -1) && vc !== 0){ d.contr.riga = { v:vc, s:contr.s }; conta(d.contr.riga); }\n        /* l'imponibile fiscale e' quello della striscia verde: retribuzione e contributi coi segni\n           dell'alunno (collaudo del 14/09) */\n        d.impFisc = (d.lorda || 0) + ((contr.s === 1 || contr.s === -1) ? vc * contr.s : 0);\n      }\n\n      var NOMI = { 'Addizionale regionale':'Addizionale regionale IRPEF', 'Addizionale comunale':'Addizionale comunale IRPEF' };\n      var netto = datiBlocco(stato, 'netto');\n      if(netto){\n        var nettoTot = num0(netto.imp);\n        if(d.impFisc === null && netto.imp) d.impFisc = num0(netto.imp);   /* senza contributi vale la casella del netto */\n        (netto.righe || []).forEach(function(r){\n          var vv = num0(r.v);\n          if(!(r.s === 1 || r.s === -1)) return;\n          nettoTot += vv * r.s;\n          if(!r.n || vv === 0) return;\n          var riga = { n:(NOMI[r.n] || r.n), v:vv, s:r.s };\n          if(r.n.indexOf('Somma integrativa') === 0) d.integr.push(riga); else d.fiscali.push(riga);\n          conta(riga);\n          if(r.n === 'IRPEF netta' && d.irpefNetta === null) d.irpefNetta = vv;\n          if(r.n === 'Addizionale regionale') d.addReg = vv;\n          if(r.n === 'Addizionale comunale') d.addCom = vv;\n        });\n        d.netto = nettoTot;\n      }\n\n      var lordaIrpef = datiBlocco(stato, 'irpef-l');\n      if(lordaIrpef){\n        var t = 0;\n        (lordaIrpef.sc || []).forEach(function(coppia){ t += num0(coppia[1]); });\n        d.irpefLorda = t;\n      }\n      var detr = datiBlocco(stato, 'detr');\n      if(detr){\n        var td = 0;\n        (detr.righe || []).forEach(function(rr){\n          var m = meseRigaScelta(rr, detr.reddito);\n          td += m;\n          if(rr && rr.scheda) d.detrVoci[rr.scheda] = (d.detrVoci[rr.scheda] || 0) + m;\n        });\n        d.detr = td;   /* dal 26/09 niente conferma: contano le voci scritte, anche nei fogli di prima */\n      }\n      /* l'IRPEF netta dei dati fiscali e' quella del suo blocco; se manca, quella scritta nel netto */\n      var netta = datiBlocco(stato, 'irpef-n');\n      if(netta){\n        var tn = num0(netta.v1);\n        if(netta.s === 1 || netta.s === -1) tn += num0(netta.v2) * netta.s;\n        d.irpefNetta = tn \u003c 0 ? 0 : tn;\n      }\n\n      var az = datiBlocco(stato, 'az'); if(az && az.campi) d.az = az.campi;\n      var dip = datiBlocco(stato, 'dip'); if(dip && dip.campi) d.dip = dip.campi;\n      return d;\n    }\n\n    /* ---------- il CEDOLINO FINALE: il PROSPETTO PAGA (15/09/2026) ----------\n       Rifatto sul mockup approvato da Mauro: in alto la parte generale (voci a gruppi, la riga\n       della retribuzione lorda, l'imponibile fiscale spiegato a parole, il netto), sotto i dati\n       di dettaglio (previdenziali, fiscali, detrazioni) e il fondo col netto in grande.\n       Niente codici e niente conti a vista: in un cedolino vero non ci sono. */\n    function cortesiaCed(stato){\n      var d = contiDaStato(stato || { ordine:[] });\n      function E(x){ return (x === null || x === undefined) ? '' : euro(x); }\n      function M(x){ return escC(String(x || '').toUpperCase()); }\n      function cella(l, v, cl){ return '\u003cdiv' + (cl ? ' class=\"' + cl + '\"' : '') + '>\u003cspan class=\"ced-l\">' + l + '\u003c/span>\u003cspan class=\"ced-v n\">' + v + '\u003c/span>\u003c/div>'; }\n      function cellaT(l, v){ return '\u003cdiv>\u003cspan class=\"ced-l\">' + l + '\u003c/span>\u003cspan class=\"ced-v\">' + v + '\u003c/span>\u003c/div>'; }\n      function gruppo(t){ return '\u003ctr class=\"ced-gruppo\">\u003ctd colspan=\"5\">' + t + '\u003c/td>\u003c/tr>'; }\n      function riga(n, imp, ali, r){\n        return '\u003ctr>\u003ctd>' + escC(n) 'Ulteriore detrazione', E(dv.cuneo)) + cella('Totale', E(d.detr)) +\n        '\u003c/div>' +\n      '\u003c/div>';\n\n      return '' +\n        '\u003cdiv class=\"ced-sheet\">' +\n          '\u003cdiv class=\"ced-griglia ced-az\">' + cellaT('Azienda', M(d.az['Ragione sociale'])) + cellaT('Sede', M(d.az['Comune'])) + cellaT('Periodo di retribuzione', M(periodo)) + '\u003c/div>' +\n          '\u003cdiv class=\"ced-griglia ced-dip\">' + cellaT('Cognome e nome', M(d.dip['Cognome e nome'])) + cellaT('Qualifica', M(d.dip['Qualifica'])) +\n            cellaT('Livello', M(d.dip['Livello'])) + cellaT('CCNL applicato', M(d.dip['CCNL applicato'])) + '\u003c/div>' +\n          elem +\n          '\u003cdiv class=\"ced-scroll\">\u003ctable class=\"ced-corpo\">\u003cthead>\u003ctr>\u003cth>Descrizione\u003c/th>\u003cth class=\"n\">Imponibile\u003c/th>\u003cth class=\"n a\">Aliquota\u003c/th>' +\n            '\u003cth class=\"n\">Competenze\u003c/th>\u003cth class=\"n\">Trattenute\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>' + corpo + '\u003c/tbody>\u003c/table>\u003c/div>' +\n          dett +\n          '\u003cdiv class=\"ced-griglia ced-fondo\">' + cella('Totale competenze', euro(d.totC)) + cella('Totale trattenute', euro(d.totT)) + cella('Netto del mese', E(d.netto), 'ced-netto') + '\u003c/div>' +\n        '\u003c/div>';\n    }\n\n    /* ---------- la SOLUZIONE (per ora: i passaggi attesi dell'archivio) ----------\n       La soluzione completa nel compilatore si costruira' con Mauro insieme\n       alla valutazione. Intanto: un riepilogo pulito dei passaggi attesi. */\n    function tabellaPassaggi(sol){\n      var righe = '';\n      PASSI_SOLUZIONE.forEach(function(p){\n        var v = sol && sol.passaggi ? sol.passaggi[p[0]] : null;\n        if(v == null) return;\n        righe += '\u003ctr>\u003ctd>' + escC(p[1]) + '\u003c/td>\u003ctd class=\"n\">' + euro(Number(v)) + '\u003c/td>\u003c/tr>';\n      });\n      if(sol && sol.nettoInBusta != null){\n        righe += '\u003ctr class=\"netto\">\u003ctd>Netto in busta\u003c/td>\u003ctd class=\"n\">' + euro(Number(sol.nettoInBusta)) + '\u003c/td>\u003c/tr>';\n      }\n      return '\u003ctable class=\"ced-sol-tab\">\u003ctbody>' + righe + '\u003c/tbody>\u003c/table>';\n    }\n    function cortesiaSoluzioneCed(sol){\n      if(sol && sol.stato) return cortesiaCed(sol.stato);   /* stesso cedolino dell'alunno, coi dati giusti (15/09) */\n      return '' +\n        '\u003cdiv class=\"ced-sheet\">' +\n          '\u003cdiv style=\"margin-bottom:10px;\">\u003cspan class=\"ced-l\">Soluzione\u003c/span>' +\n          '\u003cspan class=\"ced-v\">I passaggi attesi del cedolino\u003c/span>\u003c/div>' +\n          tabellaPassaggi(sol) +\n        '\u003c/div>';\n    }\n    function mostraSoluzioneCed(sol, silenzioso){\n      resetEditor();\n      if(sol && sol.stato){   /* la dashboard corretta: lo stesso foglio, compilato senza errori (15/09) */\n        var stS = byIdC('ced-stato'); if(stS) stS.setAttribute('data-stato', JSON.stringify(sol.stato));\n        mostraFoglio(sol.stato);\n        lockEditor();\n        byId('editor').classList.add('sol-mode');\n        if(!silenzioso) show('editor');\n        return;\n      }\n      var bh = blocchiEl();\n      if(bh){\n        var bl = document.createElement('div');\n        bl.className = 'blocco';\n        bl.innerHTML =\n          '\u003cdiv class=\"blocco-h\">\u003cspan class=\"t\">Soluzione — i passaggi attesi\u003c/span>\u003c/div>' +\n          '\u003cdiv class=\"blocco-b\">' + tabellaPassaggi(sol) + '\u003c/div>';\n        bh.appendChild(bl);\n      }\n      var vuoto = byIdC('ced-vuoto'); if(vuoto) vuoto.style.display = 'none';\n      lockEditor();\n      byId('editor').classList.add('sol-mode');\n      if(!silenzioso) show('editor');\n    }\n\n    /* Le scorciatoie lette dallo stato salvato del foglio. Le vede SOLO il docente,\n       nella Valuta: mai l'alunno, mai il cedolino (collaudo del 14/09). */\n    function scorciatoieDaStato(stato){\n abel:esciLabel(), fn:solEsci }\n    ], true);\n    show('editor');\n  }\n\n  /* ---------- VISUALIZZATORE COMPITI A SCHEDE (come l'export) ----------\n     Stessa vista per il DOCENTE (archivio) e per l'ALUNNO (dopo la consegna):\n     schede Fattura / Fattura corretta / Dashboard / Dashboard corretta, con\n     l'eventuale selettore delle fatture. Piloto i contenitori già esistenti\n     (#soluzione-page per le cortesie, #editor.sol-mode per le dashboard). */\n  var VC = { fatture:[], cf:0, ct:0, mode:'alunno', cognome:'', exitFn:null };\n  function vcLabel(i){\n    if(i === 4) return 'Valutazione';\n    if(VC.mode === 'docente' || VC.mode === 'valuta'){ var c = VC.cognome ? (' ' + VC.cognome) : ''; return ['Cedolino' + c, 'Cedolino corretto', 'Dashboard' + c, 'Dashboard corretta'][i]; }\n    return ['Il mio cedolino', 'Cedolino corretto', 'La mia dashboard', 'Dashboard corretta'][i];\n  }\n  function mostraViewerCompiti(rec, mode, exitFn){\n    VC.fatture = (rec && rec.fatture) || [];\n    VC.cf = (rec && rec.cf) ? rec.cf : 0;\n    VC.ct = 0; VC.mode = mode || 'alunno'; VC.cognome = (rec && rec.cognome) || ''; VC.exitFn = exitFn || null;\n    VC.testoChiuso = false;   // il testo dell'esercizio si apre aperto, come quando si compila\n    VC.pin = (rec && rec.pin) || ''; VC.nome = (rec && rec.nome) || ''; VC.val = (rec && rec.valutazione) || null;\n    VC.esciTesto = (rec && rec.esciTesto) || null;   // scritta del pulsante d'uscita, se chi apre la vista ne vuole una sua\n    if(!VC.fatture.length){ showAlert('Nessun cedolino da mostrare.'); if(VC.exitFn) VC.exitFn(); return; }\n    if(VC.cf >= VC.fatture.length) VC.cf = 0;\n    vcGo();\n  }\n  function vcBarNode(){\n    var bar = document.createElement('div'); bar.className = 'vc-bar';\n    if(VC.fatture.length > 1){\n      var chips = document.createElement('div'); chips.className = 'vc-chips';\n      VC.fatture.forEach(function(f, i){\n        var b = document.createElement('button'); b.type = 'button'; b.classN  === 0) el.removeAttribute(a.name);\n          else if((nome === 'src' || nome === 'href' || nome === 'xlink:href' || nome === 'action' || nome === 'formaction' || nome === 'srcdoc' || nome === 'data') && (val.indexOf('javascript:') === 0 || val.indexOf('data:text/html') === 0)) el.removeAttribute(a.name);\n          else if(nome === 'style' && val.indexOf('url(') !== -1) el.removeAttribute(a.name);\n        });\n      });\n      return root.innerHTML;\n    }catch(e){ return ''; }\n  }\n  /* Riquadro rosso nella Valuta: dice al docente che in quel foglio c'e' una voce che l'app non offre.\n     Non e' un voto e non tocca i conti: e' un avviso che quel cedolino e' stato ritoccato da fuori. */\n  function avvisoVociAlterate(ed, stato){\n    if(!ed || !stato || !CED || typeof CED.vociStrane !== 'function') return;\n    var fuori = [];\n    try{ fuori = CED.vociStrane(stato) || []; }catch(e){ return; }\n    if(!fuori.length) return;\n    var box = document.createElement('div');\n    box.className = 'traccia-scorciatoie';\n    box.style.cssText = 'border-color:#b4472f; background:#fdf1ee;';\n    box.innerHTML = '\u003cdiv class=\"ts-tit\" style=\"color:#b4472f;\">Compilazione ritoccata da fuori · lo vedi solo tu\u003c/div>\u003cul>' +\n      fuori.map(function(n){ return '\u003cli>voce che l’app non offre: \u003cb>' + esc(n) + '\u003c/b>\u003c/li>'; }).join('') +\n      '\u003c/ul>\u003cdiv style=\"margin-top:6px; font-size:12.5px;\">I nomi delle voci si scelgono da un elenco chiuso: questi sono stati scritti modificando la pagina.\u003c/div>';\n    var ced = ed.querySelector('.cedolino');\n    (ced || ed).appendChild(box);\n  }\n  /* Lo stato del foglio (JSON) che sta dentro la fotografia della dashboard dell'alunno. */\n  function statoDaHtml(html){\n    if(!html) return null;\n    try{\n      var doc = new DOMParser().parseFromString(html, 'text/html');\n      var st = doc.getElementById('ced-stato');\n      var x = st ? JSON.parse(st.getAttribute('data-stato') || 'nu a dall'archivio di adesso, non dalla fotografia della consegna. */\n  function soluzioneDi(f){\n    var id = f && f.id;\n    if(!id || typeof FATTURE === 'undefined' || !FATTURE) return null;\n    var a = FATTURE.find(function(y){ return y.id === id; });\n    return a ? a.soluzione : null;\n  }\n  /* (25/09/2026, richiesta di Mauro) IL «TAC TAC»: passando da «Il mio cedolino» a «Cedolino corretto» (o da «La mia\n     dashboard» a «Dashboard corretta») si resta sullo stesso punto, cosi' quello che cambia salta all'occhio.\n     Prima del cambio segno le voci riconoscibili (righe, blocchi, caselle del prospetto) con la loro posizione sullo\n     schermo; dopo il cambio rimetto la stessa voce nello stesso punto. Se nel foglio dell'alunno una voce manca, mi\n     aggancio alla voce precedente che c'e' in tutti e due. Fra cedolino e dashboard (fatti diversi) si riparte da capo. */\n  function vcStessoGruppo(a, b){ return a !== b && ((a \u003c= 1 && b \u003c= 1) || ((a === 2 || a === 3) && (b === 2 || b === 3))); }\n  function vcTestoChiave(el){\n    var q = function(s){ var x = el.querySelector(s); return x ? x.textContent : ''; };\n    var t;\n    if(el.tagName === 'TR') t = (el.cells && el.cells[0]) ? el.cells[0].textContent : el.textContent;\n    else if(el.matches('.ced-griglia > div')) t = q('.ced-l');\n    else if(el.matches('.riga, .riga-contributi')) t = q('.voce .n') || q('.nome-fisso .n');\n    else if(el.matches('.riga-detrazione')) t = q('.detr-testa .n');\n    else if(el.matches('.risultato, .detr-conto .cr')) t = q('.l');\n    else t = el.textContent;\n    return String(t || '').replace(/\\s+/g, ' ').trim().slice(0, 80);\n  }\n  /* (25/09/2026, trovato da Mauro sul telefono) Anche lo spostamento DI LATO: le tabelle larghe (scaglioni IRPEF nella\n     dashboard, prospetto nel cedolino) sul telefono si scorrono col dito; cambiando scheda ripartivano da sinistra.\n     Ora si segna quanto erano spostate e si rimettono uguali, nello stesso ordine. */\n  function vcRadice(){ return (VC.ct === 2 || VC.ct === 3) ? byId('editor') : byId('soluzione-page'); }\n  function vcLaterali(){ var r = vcRadice(); return r ? Array.prototype.slice.call(r.querySelectorAll('.scrollx, .ced-scroll')) : []; }\n  function vcPunti(){\n    var inDash = (VC.ct === 2 || VC.ct === 3);\n    var root = vcRadice();\n    if(!root) return [];\n    var sel = inDash\n      ? '.blocco-h .t, .sotto-h .t, .riga, .riga-contributi, .riga-detrazione, .scaglioni tbody tr, .risultato, .detr-conto .cr, .presunto, .calcolo-netta'\n      : 'tr, .ced-fascia-t, .ced-titolo, .ced-griglia > div';\n    var conta = {}, out = [];\n    root.querySelectorAll(sel).forEach(function(el){\n      var r = el.getBoundingClientRect(); if(!r.height) return;   // nascosti: non servono\n      var tipo = el.tagName === 'TR' ? 'tr' : ((el.className && String(el.className).split(' ')[0]) || el.tagName);\n      var base = tipo + '|' + vcTestoChiave(el);\n      conta[base] = (conta[base] || 0) + 1;\n      out.push({ key: base + '|' + conta[base], el: el, top: r.top, bottom: r.bottom });\n    });\n    return out;\n  }\n  function vcLineaBarra(){\n    var b = (VC.ct === 2 || VC.ct === 3) ? byId('sol-banner') : byId('sol-view-banner');\n    return b ? Math.max(0, b.getBoundingClientRect().bottom) : 0;\n  }\n  function vcSegnaPunto(prima, dopo){\n    if(!vcStessoGruppo(prima, dopo)) return null;\n    var punti = vcPunti(), linea = vcLineaBarra(), ancora = -1;\n    for(var i = 0; i \u003c punti.length; i++){ if(punti[i].bottom > linea + 1){ ancora = i; break; } }\n    if(ancora === -1) ancora = punti.length - 1;\n    return { y: window.scrollY, punti: punti.map(function(p){ return { key:p.key, top:p.top }; }), ancora: ancora,\n             lati: vcLaterali().map(function(el){ return el.scrollLeft; }) };\n  }\n  function vcRimettiPunto(segno){\n    var lat = vcLaterali();\n    (segno.lati || []).forEach(function(x, i){ if(lat[i]) lat[i].scrollLeft = x; });   // di lato: come prima\n    window.scrollTo(0, segno.y);                      // prima: stessa altezza di prima\n    if(segno.ancora \u003c 0) return;\n    var mappa = {}; vcPunti().forEach(function(p){ mappa[p.key] = p; });\n    for(var i = segno.ancora; i >= 0; i--){          // poi: la stessa voce nello stesso punto dello schermo\n      var p = segno.punti[i], q = mappa[p.key];\n      if(q){ window.scrollBy(0, q.el.getBoundingClientRect().top - p.top); return; }\n    }\n  }\n  /* Sul telefono resta visibile, ferma in alto, solo la fila delle schede: quello che le sta sopra (Scarica PDF, Ho\n     finito, i cedolini se sono piu' d'uno) scorre via, cosi' la barra ferma non si mangia mezzo schermo. */\n  function vcAggiustaFissa(){\n    ['sol-view-banner', 'sol-banner'].forEach(function(id){\n      var c = byId(id); if(!c) return;\n      var t = c.querySelector('.vc-tabs');\n      var off = 0;\n      if(t && window.matchMedia && window.matchMedia('(max-width: 600px)').matches){\n        off = Math.round(t.getBoundingClientRect().top - c.getBoundingClientRect().top) - 6;\n        if(off \u003c 0) off = 0;\n      }\n      if(c.querySelector('.vc-bar')) c.style.top = (-off) + 'px';\n    });\n  }\n  window.addEventListener('resize', function(){ try{ if(VC && VC.fatture && VC.fatture.length) vcAggiustaFissa(); }catch(e){} });\n  function vcGo(segno){\n    var f = VC.fatture[VC.cf] || {};\n    if(VC.ct === 4){ vcRenderValutazione(); window.scrollTo(0, 0); return; }\n    // «Non svolta» = l'alunno non è MAI entrato (consegna forzata). Mauro vuole vedere COMUNQUE lo scheletro\n    // vuoto — la fattura e la dashboard come le vede l'alunno all'inizio, senza numeri — PIÙ un cartello che\n    // avverte che non è entrato. Così «entrato ma non ha compilato» (scheletro, niente cartello) e «non ci ha\n    // nemmeno provato» (scheletro identico + cartello) si distinguono a colpo d'occhio.\n    var bannerNS = '\u003cdiv class=\"cx-nonsvolta\">Cedolino non compilato\u003c/div>';\n    var skelCort = f.nonSvolta ? buildCor n:97.1,v:'10−'}, {min:99.1,v:'10'}\n  ];\n  function votoDaPerc(p){\n    if(p == null || isNaN(p)) return '—';\n    var b = VOTO_BANDS[0]; for(var i = 0; i \u003c VOTO_BANDS.length; i++){ if(p >= VOTO_BANDS[i].min) b = VOTO_BANDS[i]; } return b.v;\n  }\n  function vvParse(s){ s = String(s == null ? '' : s).replace(',', '.').trim(); if(s === '') return NaN; var n = Number(s); return isNaN(n) ? NaN : n; }\n  function vvFmt(n){ if(n == null || isNaN(n)) return '—'; var r = Math.round(n * 100) / 100; return String(r).replace('.', ','); }\n  function vvSummaryHtml(v){\n    var tot = (v && v.max_tot) ? (vvFmt(v.totale) + ' / ' + vvFmt(v.max_tot)) : '— / —';\n    var perc = (v && v.perc != null) ? (Math.round(v.perc) + '%') : '—';\n    var voto = (v && v.voto_finale) ? v.voto_finale : '—';\n    return '\u003cdiv class=\"vv-col\">\u003cdiv class=\"vv-lab\">Totale\u003c/div>\u003cdiv class=\"vv-val\">' + tot + '\u003c/div>\u003c/div>'\n      + '\u003cdiv class=\"vv-col\">\u003cdiv class=\"vv-lab\">Percentuale\u003c/div>\u003cdiv class=\"vv-val\">' + perc + '\u003c/div>\u003c/div>'\n      + '\u003cdiv class=\"vv-col\">\u003cdiv class=\"vv-lab\">Voto finale\u003c/div>\u003cdiv class=\"vv-val vv-voto\">' + esc(String(voto)) + '\u003c/div>\u003c/div>';\n  }\n  function vvCollect(){\n    var host = byId('valuta-body'); var items = [], totP = 0, totM = 0, anyM = false, hasError = false;\n    VC.fatture.forEach(function(f, i){\n      var pEl = host.querySelector('.vv-preso[data-i=\"' + i + '\"]');\n      var mEl = host.querySelector('.vv-max[data-i=\"' + i + '\"]');\n      var gEl = host.querySelector('.vv-giud[data-i=\"' + i + '\"]');\n      var p = pEl ? vvParse(pEl.value) : NaN, m = mEl ? vvParse(mEl.value) : NaN;\n      if(!isNaN(p) && !isNaN(m) && p > m) hasError = true;   // il voto preso non può superare il massimo\n      if(!isNaN(p)) totP += p; if(!isNaN(m)){ totM += m; anyM = true; }\n      // verifica: l'alunno vede il voto in cima ai compiti (verifica) o dentro la riga -size:15px;\">/ ' + esc(max) + '\u003c/span>\u003c/div>\u003c/div>'\n          + '\u003cdiv class=\"vv-ta\" style=\"min-height:auto; white-space:pre-wrap; background:#f9fafb;\">' + (giud ? esc(giud) : '\u003cspan style=\"color:#8a94a6;\">Nessun commento.\u003c/span>') + '\u003c/div>\u003c/div>';\n      }).join('');\n      host.innerHTML = '\u003cdiv class=\"vv-sum\">' + vvSummaryHtml(val) + '\u003c/div>\u003cdiv class=\"vv-rows\">' + roHtml + '\u003c/div>';\n      var bar0 = byId('valuta-bar'); if(bar0){ bar0.innerHTML = ''; bar0.appendChild(vcBarNode()); }\n      show('valuta-view'); return;\n    }\n    var saved = {};\n    (val.items || []).forEach(function(it){ saved[it.fattura_id != null ? it.fattura_id : it.num] = it; });\n    var rowsHtml = VC.fatture.map(function(f, i){\n      var s = saved[f.id != null ? f.id : f.num] || {};\n      var preso = (s.voto != null ? vvFmt(s.voto) : '');\n      var max = (s.max != null ? vvFmt(s.max) : '');\n      var giud = s.giudizio || '';\n      return '\u003cdiv class=\"vv-row\">'\n        + '\u003cdiv class=\"vv-left\">\u003cdiv class=\"vv-fh\">Cedolino ' + esc(f.num) + (f.nonSvolta ? ' · non svolto' : '') + '\u003c/div>'\n        + '\u003cdiv class=\"vv-score\">\u003cinput class=\"vv-in vv-preso\" data-i=\"' + i + '\" value=\"' + esc(preso) + '\" inputmode=\"decimal\" placeholder=\"voto\">\u003cspan class=\"vv-sl\">/\u003c/span>\u003cinput class=\"vv-in vv-max\" data-i=\"' + i + '\" value=\"' + esc(max) + '\" inputmode=\"decimal\" placeholder=\"max\">\u003c/div>'\n        + '\u003cdiv class=\"vv-rowerr\" data-i=\"' + i + '\" style=\"display:none; color:#b4472f; font-size:11px; margin-top:6px;\">Il voto non può superare il massimo\u003c/div>\u003c/div>'\n        + '\u003ctextarea class=\"vv-ta vv-giud\" data-i=\"' + i + '\" rows=\"4\" placeholder=\"Giudizio sul cedolino…\">' + esc(giud) + '\u003c/textarea>'\n        + '\u003c/div>';\n    }).join('');\n    host.innerHTML = '\u003cdiv class=\"vv-sum\" id=\"vv-sum\">\u003c/div>\u003cdiv class=\"vv-rows\">' + rowsHtml + '\u003c/div>'\n      + '\u003cdiv style=\"margin-top:16px; text-align:right;\">\u003cbutton class=\"btn-consegna\" id=\"vv-salva\">\u003csvg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-right:7px;\">\u003cpath d=\"M5 12l5 5l10 -10\"/>\u003c/svg>Salva valutazione\u003c/button>\u003c/div>';\n    host.querySelectorAll('.vv-in, .vv-giud').forEach(function(el){ el.addEventListener('input', vvRecalc); });\n    byId('vv-salva').addEventListener('click', salvaValutazione);\n    var bar = byId('valuta-bar'); if(bar){ bar.innerHTML = ''; bar.appendChild(vcBarNode()); }\n    show('valuta-view');\n    vvRecalc();\n  }\n  function salvaValutazione(){\n    var v = vvCollect();\n    if(v.hasError){ showAlert('Il voto preso non può superare il massimo. Correggi i cedolini evidenziati in rosso.'); return; }\n    v.pubblicata = (VC.val && VC.val.pubblicata) || false;\n    v.data = new Date().toISOString();\n    v.nome = VC.nome || '';\n    VC.val = v;\n    var upd = { valutazione:v };\n    // Istantanea dei lavori dell'alunno: serve alla vista alunno DOPO il Reset (che cancella le consegne verifica).\n    var hasHtml = (VC.fatture || []).some(function(f){ return f.cortesiaAlunno || f.dashboardAlunno || f.cortesiaCorretta || f.dashboardCorretta; });\n    if(hasHtml){ upd.valutazione_snapshot = { fatture: VC.fatture.map(function(f){ return { id:f.id, num:f.num, nonSvolta:!!f.nonSvolta, cortesiaAlunno:f.cortesiaAlunno || '', cortesiaCorretta:f.cortesiaCorretta || '', dashboardAlunno:f.dashboardAlunno || '', dashboardCorretta:f.dashboardCorretta || '' }; }) }; }\n    // IL VOTO SI DICHIARA SALVATO SOLO SE IL CLOUD L'HA DAVVERO PRESO. Prima l'esito era ignorato\n    // (.then(function(){},function(){})): con la rete giu' comparivano «Valutazione salvata» e il voto in\n    // dashboard, ma nel cloud non c'era niente. Al pr lla propria valutazione (sola lettura), aperta dalla card nella pagina compiti.\n  // idFuoco (27/09/2026): aperta dalla riga di un esercizio, la vista parte da quel cedolino\n  function apriValutazioneAlunno(val, snap, exitFn, idFuoco){\n    var fatture = (snap && Array.isArray(snap.fatture) && snap.fatture.length)\n      ? snap.fatture.map(function(f){ return { id:f.id, num:f.num, nonSvolta:!!f.nonSvolta, cortesiaAlunno:f.cortesiaAlunno || '', cortesiaCorretta:f.cortesiaCorretta || '', dashboardAlunno:f.dashboardAlunno || '', dashboardCorretta:f.dashboardCorretta || '' }; })\n      : (val.items || []).map(function(it){ return { id:it.fattura_id, num:it.num, nonSvolta:false, cortesiaAlunno:'', cortesiaCorretta:'', dashboardAlunno:'', dashboardCorretta:'' }; });\n    /* 22/09/2026: le versioni corrette nella fotografia sono vuote per tutte le consegne dal 18/09 (l'alunno non ha la\n       soluzione quando consegna). Prima di aprire il dettaglio chiedo al cloud la soluzione di ogni cedolino (cf_soluzione\n       la da' a chi l'ha consegnato, salvo verifica vera): finisce in FATTURE e la vista ridisegna da li' cedolino e\n       dashboard corretti. Se il cloud non risponde, si apre lo stesso con quello che c'e'. */\n    var apri = function(){\n      var cf0 = 0; fatture.forEach(function(f, i){ if(idFuoco && f.id === idFuoco) cf0 = i; });\n      mostraViewerCompiti({ pin:(STATE.studente ? STATE.studente.pin : ''), nome:(val.nome || ''), cognome:(STATE.studente ? (STATE.studente.cognome || '') : ''), valutazione:val, cf:cf0, fatture:fatture }, 'alunno-valuta', exitFn);\n      VC.ct = 4; vcGo();\n    };\n    var ids = fatture.map(function(f){ return f.id; }).filter(Boolean);\n    var i = 0;\n    var prossima = function(){\n      if(i >= ids.length){ apri(); return; }\n      var id = ids[i++];\n      conSoluzione(id, function(){ prossima(); });\n    };\n    prossima();\n  }\n  // Pubblica i voti della CLASSE ATTIVA: gli alunni li vedono entrando col PIN (in modalità compiti).\n  function pubblicaVoti(){\n    var cl = (CLASSE && CLASSE.classe) || STATE.classeAttiva || '';\n    if(!cl){ showAlert('Nessuna classe selezionata.'); return; }\n    var targets = (CLASSE && CLASSE.alunni ? CLASSE.alunni : []).filter(function(a){ var v = (CLOUD_STUD[a.pin] || {}).valutazione; return v && v.voto_finale; });\n    if(!targets.length){ showAlert('Nessuna valutazione da pubblicare nella classe ' + cl + '. Valuta prima gli alunni.'); return; }\n    var giaP = targets.filter(function(a){ return (CLOUD_STUD[a.pin] || {}).valutazione.pubblicata; }).length;\n    showConfirm('Pubblicare i voti della classe ' + cl + '? ' + targets.length + (targets.length === 1 ? ' alunno valutato' : ' alunni valutati') + ' li vedranno entrando col PIN.' + (giaP ? (' (' + giaP + ' già pubblicati)') : ''), function(){\n      // Come per il salvataggio: si annuncia \"pubblicati\" solo per quelli che il cloud ha davvero preso.\n      // Prima l'esito era ignorato: con la rete ballerina Mauro leggeva «Voti pubblicati», i badge\n      // diventavano verdi, ma gli alunni non vedevano niente e nessuno se ne accorgeva.\n      var fatti = 0, falliti = [], rimasti = targets.length;\n      var finito = function(){\n        if(rimasti > 0) return;\n        renderDocente();\n        if(!falliti.length){\n          showAlert('Voti pubblicati per la classe ' + cl + ': ' + fatti + (fatti === 1 ? ' alunno.' : ' alunni. Entrando col PIN, ora vedono la loro valutazione.'));\n        } else {\n          showAlert('Pubblicati ' + fatti + ' voti su ' + targets.length + '. NON pubblicati per: ' + falliti.join(', ')\n            + ' (il cloud non ha risposto). I loro voti sono al sicuro: ripremi «Pubblica voti» quando la connessione torna.');\n        }\n      };\n      targets.forEach(function(a){\n        var v = CLOUD_STUD[a.pin].valutazione;\n        var nome = (a.cognome + ' ' + a.nome).trim();\n        if(!SB){ v.pubblicata = true; fatti++; rimasti--; finito(); return; }\n        var vPub llineo.\n    // Senza questo, la sua consegna veniva timbrata con la classe sbagliata e spariva dai conti della sua.\n    var suaClasse = al.classe || '';\n    if(!CLASSE || (suaClasse && CLASSE.classe !== suaClasse)){\n      CLASSE = { classe:suaClasse || ((CLASSE && CLASSE.classe) || ''), alunni:[al] };\n    }\n    // Smistamento: se non c'è assegnazione e il docente non è presente → COMPITI A CASA (nessun blocco PIN).\n    // Altrimenti flusso normale (verifica/esercitazione in classe, con anti-doppio-accesso).\n    cloudModalitaAlunno(al.pin, function(mode){\n      if(mode === 'compiti'){ avviaCompitiACasa(); return; }\n      entraStudenteNormale(al);\n    });\n  }\n  function entraStudenteNormale(al){\n    cloudCheckAccesso(al.pin, function(acc){\n      if(acc && acc.allow === false){\n        var bn = byId('blocco-nome'); if(bn) bn.textContent = al.cognome + ' ' + al.nome;\n        if(acc.consegnata){\n          // Ha gia' consegnato: vede il suo consegnato (correzione e allenamento, se non e' una verifica).\n          STATE.consegnata = true;\n          mostraConsegnatoAlunno(null, 'Hai già consegnato. Se il docente ti riammette, potrai rientrare.');\n        } else {\n          mostraBloccoMsg('🔒', 'Accesso bloccato', 'Hai già effettuato l\\'accesso in precedenza. Per continuare, chiedi lo sblocco al docente.', '#b4472f');\n        }\n        startBloccoWatcher();\n        return;\n      }\n      cloudLeggiContestoAlunno(al.pin, avviaAlunnoConLista);\n    });\n  }\n  // Ripristino dopo F5: ridecide la modalità (compiti vs verifica) e rientra dove serve.\n  function ripristinaAlunno(pin){\n    cloudModalitaAlunno(pin, function(mode){\n      if(mode === 'compiti'){ avviaCompitiACasa(); return; }\n      // F5 lo fa solo il dispositivo che era già entrato (solo lui ha cf_studente_attivo): nessun controllo di\n      // blocco, anche se nel frattempo un altro ha provato col suo PIN e risulta «Bloccato».\n      cloudLeggiContestoAlunno(pin, avviaAlunnoConLista);\n    });\n  }\n  /* ===================== COMPITI A CASA (modalità libera, senza blocco PIN) ===================== */\n  // Verità cross-device dal cloud: quali fatture ha già consegnato come compiti, e la singola consegna (con gli HTML).\n  function cloudCompitiDone(pin, cb){\n    if(!SB){ cb && cb([]); return; }\n    try{\n      SB.rpc('cf_mie_consegne', { p_pin: pin }).then(function(res){\n        var ids = {};\n        ((res && res.data) || []).forEach(function(t){\n          if(t.fattura_id && t.completato && t.modalita === 'compiti') ids[t.fattura_id] = true;\n        });\n        cb && cb(Object.keys(ids));\n      }, function(){ cb && cb([]); });\n    }catch(e){ cb && cb([]); }\n  }\n  function cloudCompitiUno(pin, fatturaId, cb){\n    if(!SB){ cb && cb(null); return; }\n    try{\n      SB.rpc('cf_mia_consegna', { p_pin: pin, p_fattura_id: fatturaId }).then(function(res){\n        cb && cb((res && !res.error) ? (res.data || null) : null);\n      }, function(){ cb && cb(null); });\n    }catch(e){ cb && cb(null); }\n  }\n  // Ingresso in modalità compiti: carica l'archivio (se manca) e mostra la maschera di scelta.\n  function avviaCompitiACasa(){\n    STATE.modalitaCompiti = true; STATE.esercitazione = false;\n    STATE.multiMode = false;\n    STATE.solExitFn = null; STATE.ritornoFn = null; STATE.compitoInClasse = false;\n    STATE.avvioGiro = (STATE.avvioGiro || 0) + 1;   // un avvio in classe ancora per strada non deve piu' toccare niente\n    // ...e il prossimo avvio in classe deve partire davvero: la lista dei compiti usa lo stesso riquadro del menu'\n    // dei cedolini, e senza questo la guardia «un avvio solo» scambiava i compiti per una sessione gia' aperta (24/09/2026).\n    STATE.avviatoPin = null; STATE.avvioInCorsoDa = 0;\n    stopPresenza(); stopSessioneWatcher(); stopConsegnaWatcher(); stopAssegnazioneWatcher(); stopBloccoWatcher(); stopAttesaWatcher();\n    var pinC = STATE.studente ? STATE.studente.pin : '';\n    STATE.azzVisto = null; try{ if(pinC) STATE.azzVisto = localStorage.getItem('cf_azz_' + pinC); }catch(e){}\n    // (24/09/2026) Il foglio dei compiti e' lo stesso della classe e vive nel cloud: servono il gettone e la\n    // mappa dei fogli gia' salvati, come in classe. Il gettone lo chiedo SEMPRE (quello vecchio puo' essere scaduto).\n    STATE.bozzaMappa = {}; STATE.bozzaLetta = false; STATE.proprietario = false;\n    var giroC = STATE.compitiGiro = (STATE.compitiGiro || 0) + 1;\n    var dopoGettone = function(){\n      if(STATE.compitiGiro !== giroC || !STATE.modalitaCompiti) return;\n      STATE.proprietario = !!sessMia();\n      leggiBozzaCompiti(giroC, 0);\n    };\n    if(SB && pinC){\n      try{\n        SB.rpc('cf_compiti_aggancio', { p_pin: pinC, p_dispositivo: idDispositivo() }).then(function(r){\n          if(r && !r.error && r.data){\n            STATE.sessToken = r.data; STATE.sessTokenConfirmed = true;\n            try{ sessionStorage.setItem('cf_sess', r.data); }catch(e){}\n          }\n          dopoGettone();\n        }, function(){ dopoGettone(); });\n      }catch(e){ dopoGettone(); }\n    }\n    var go = function(){\n      caricaQuaderno(function(){\n        renderCompitiPicker();\n        show('menu-fatture');\n        startCompitiWatcher();\n      });\n    };\n    if((typeof FATTURE==='undefined' || !FATTURE || !FATTURE.length) && SB){ cloudCaricaContesto(function(){ go(); }); }\n    else cloudAggiornaArchivio(function(){ go(); });   // sempre: la maschera dei compiti deve mostrare l'archivio di ADESSO\n  }\n  // Legge la mappa dei fogli gia' salvati nel cloud (serve prima di scriverci, se no si cancellano gli altri).\n  function leggiBozzaCompiti(giro, tentativo){\n    var pin = STATE.studente ? STATE.studente.pin : '';\n    if(!SB || !pin){ STATE.bozzaLetta = true; return; }\n    if(STATE.compitiGiro !== giro || !STATE.modalitaCompiti) return;\n    var riprova = function(){ setTimeout(function(){ leggiBozzaCompiti(giro, tentativo + 1); }, tentativo \u003c 5 ? 3000 : 10000); };\n    try{\n      SB.rpc('cf_bozza_leggi', { p_pin: pin, p_sess: sessMia(), p_dispositivo: idDispositivo() }).then(function(rb){\n        if(STATE.compitiGiro !== giro || !STATE.modalitaCompiti) return;\n        if(!rb || rb.error){ riprova(); return; }\n        var b = rb.data || null;\n        if(b && typeof b === 'object'){ STATE.bozzaMappa = mergeBozzaCloud(STATE.bozzaMappa || {}, b); }\n        STATE.bozzaLetta = true;\n        pushBozzaCloud();\n      }, function(){ riprova(); });\n    }catch(e){ riprova(); }\n  }\n  // IL QUADERNO (24/09/2026): per ogni cedolino cosa ha fatto l'alunno, dal cloud (cf_mio_quaderno).\n  function caricaQuaderno(cb){\n    var pin = STATE.studente ? STATE.studente.pin : '';\n    if(!SB || !pin){ cb && cb(); return; }\n    try{\n      SB.rpc('cf_mio_quaderno', { p_pin: pin }).then(function(r){\n        if(r && !r.error && r.data){\n          STATE.quaderno = r.data;\n          var ids = {};\n          (r.data.consegne || []).forEach(function(c){ if(c && c.id && c.completato && c.modalita !== 'forzata') ids[c.id] = true; });\n          STATE.compitiDone = Object.keys(ids);\n        }\n        cb && cb();\n      }, function(){ cb && cb(); });\n    }catch(e){ cb && cb(); }\n  }\n  function statoQuaderno(){\n    var q = STATE.quaderno || {}, out = {};\n    var get = function(id){ return (out[id] = out[id] || {}); };\n    (q.consegne || []).forEach(function(c){\n      if(!c || !c.id) return;\n      var o = get(c.id);\n      if(c.completato && c.modalita !== 'forzata'){ o.consegnato = true; if(c.in_classe) o.inClasse = true; }\n      else if(c.completato && c.modalita === 'forzata' && c.lavoro && !c.non_svolta){ o.forzata = true; }   // raccolto dal docente\n      else if(!c.completato && c.lavoro){ o.riaperto = true; }                                                   // riaperto dal Riammetti\n    });\n    Object.keys(q.bozze || {}).forEach(function(id){ var o = get(id); o.iniziato = true; if(q.bozze[id] && q.bozze[id].classe) o.bozzaClasse = true; });\n    parseAssegnazione(q.assegnata).forEach(function(x){ get(x.id).assegnato = true; });\n    return out;\n  }\n  // Torna alla lista dei compiti rileggendo il quaderno (dopo una consegna lo stato e' cambiato).\n  function mostraCompiti(){\n    STATE.modalitaCompiti = true; STATE.esercitazione = false;\n    caricaQuaderno(function(){ renderCompitiPicker(); show('menu-fatture'); startCompitiWatcher(); });\n  }\n  // (24/09/2026, regola di Mauro) Chi sta nei compiti passa SUBITO al cedolino appena il docente glielo assegna.\n  function stopCompitiWatcher(){ if(STATE.compitiTimer){ clearInterval(STATE.compitiTimer); STATE.compitiTimer = null; } }\n  function startCompitiWatcher(){\n    stopCompitiWatcher();\n    if(!SB) return;\n    STATE.compitiTimer = setInterval(function(){\n      if(!STATE.studente || !STATE.modalitaCompiti){ stopCompitiWatcher(); return; }\n      if(STATE.compitiStatoInVolo && (Date.now() - STATE.compitiStatoInVolo) \u003c 8000) return;\n      STATE.compitiStatoInVolo = Date.now();\n      var pin = STATE.studente.pin;\n      SB.rpc('cf_stato', { p_pin: pin }).then(function(r){\n        STATE.compitiStatoInVolo = 0;\n        var d = (r && !r.error) ? r.data : null;\n        if(!d || !STATE.studente || STATE.studente.pin !== pin || !STATE.modalitaCompiti) return;\n        // Reset del docente mentre l'alunno e' nei compiti: come in classe e sul consegnato, via le copie di questo\n        // dispositivo e schermata del PIN (25/09/2026). Prima qui si segnava il contrassegno nuovo SENZA buttare\n        // niente: il dispositivo si credeva in regola, rientrava senza PIN e rimetteva nel cloud i fogli vecchi.\n        if(typeof d.azzeramento === 'string' && typeof STATE.azzVisto === 'string' && d.azzeramento !== STATE.azzVisto){\n          stopCompitiWatcher(); STATE.sessioneChiusa = false; terminaSessioneVerifica(true); return;\n        }\n        if(typeof d.azzeramento === 'string' && typeof STATE.azzVisto !== 'string'){\n          // contrassegno mai visto da questa pagina: lo allineo come all'ingresso (se e' cambiato, via le copie vecchie)\n          allineaAzzeramento(pin, d.azzeramento); STATE.azzVisto = d.azzeramento;\n        }\n        if(d.fattura_assegnata && !d.sospesa && !d.assente){ stopCompitiWatcher(); passaAlCedolinoAssegnato(); }\n      }, function(){ STATE.compitiStatoInVolo = 0; });\n    }, 5000);\n  }\n  function passaAlCedolinoAssegnato(){\n    var al = STATE.studente; if(!al) return;\n    mettiAlSicuroLavoro();   // il compito che stava scrivendo resta salvo (telefono e cloud)\n    STATE.compitiGiro = (STATE.compitiGiro || 0) + 1;\n    STATE.modalitaCompiti = false; STATE.esercitazione = false; STATE.ritornoFn = null; STATE.solExitFn = null;\n    STATE.compitoInClasse = false; STATE.consegnata = false;\n    document.querySelectorAll('.modal-overlay').forEach(function(m){ try{ m.parentNode.removeChild(m); }catch(e){} });\n    entraStudenteNormale(al);\n  }\n  // SCHERMATA DEL CONSEGNATO in classe (24/09/2026): chi ha consegnato lui un esercizio puo' rivedere la correzione\n  // e allenarsi sullo stesso cedolino. Verifiche e consegne fatte dal docente: solo il messaggio.\n  function mostraConsegnatoAlunno(titolo, msg){\n    STATE.modalitaCompiti = false; STATE.esercitazione = false; STATE.consegnata = true;\n    var pin = STATE.studente ? STATE.studente.pin : '';\n    mostraBloccoMsg('✅', titolo || 'Consegnato', msg, '#2f7d54');\n    azioniConsegnato([], null);\n    if(!pin || !SB) return;\n    cloudLeggiContestoAlunno(pin, function(ctx){\n      if(!ctx || ctx.errore) return;\n      if(typeof ctx.azzeramento === 'string') STATE.azzVisto = ctx.azzeramento;\n      rebuildConsegnateLocali(pin, function(){\n        var b = byId('blocco'); if(!b || b.style.display === 'none') return;\n        var fatte = consegnateLocali(pin);\n        var assegnati = (ctx.lista || []).map(function(x){ return FATTURE.find(function(f){ return f.id === x.id; }); }).filter(Boolean);\n        var verifica = assegnati.some(function(f){ return f.verifica; });\n        var tit = titolo || (verifica ? 'Verifica consegnata' : 'Esercitazione consegnata');\n        if(!titolo || (byId('blocco-title') && byId('blocco-title').textContent !== tit)) mostraBloccoMsg('✅', tit, msg, '#2f7d54');\n        var rivedibili = assegnati.filter(function(f){ return !f.verifica && fatte.indexOf(f.id) !== -1; });\n        azioniConsegnato(rivedibili, function(){ mostraConsegnatoAlunno(tit, msg); startBloccoWatcher(); });\n      });\n    });\n  }\n  function azioniConsegnato(lista, ritorno){\n    var host = byId('blocco-azioni');\n    if(!host){\n      var esci = byId('btn-esci-blocco'); if(!esci) return;\n      host = document.createElement('div'); host.id = 'blocco-azioni';\n      host.style.cssText = 'display:flex; flex-direction:column; gap:10px; align-items:center; margin:18px 0 14px;';\n      esci.parentNode.insertBefore(host, esci);\n    }\n    host.innerHTML = '';\n    (lista || []).forEach(function(f){\n      var riga = document.createElement('div'); riga.style.cssText = 'display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center;';\n      if(lista.length > 1){ var n = document.createElement('span'); n.textContent = 'Cedolino ' + numeroFattura(f.id); n.style.cssText = 'color:var(--muted); font-size:14px;'; riga.appendChild(n); }\n      // (25/09/2026) Il sorvegliante resta acceso anche qui: se il docente riammette, sospende o fa Reset mentre\n      // l'alunno rivede la correzione o si allena, l'app lo segue da sola (prima serviva uscire e rientrare col PIN).\n      var b1 = document.createElement('button'); b1.className = 'btn-ghost'; b1.style.fontFamily = 'inherit'; b1.textContent = 'Rivedi la correzione';\n      b1.addEventListener('click', function(){ STATE.ritornoFn = ritorno; apriSoluzioneCompito(f); });\n      var b2 = document.createElement('button'); b2.className = 'btn-green'; b2.style.fontFamily = 'inherit'; b2.textContent = 'Allenati';   // btn-compila ha lo stile solo dentro i menu'\n      b2.addEventListener('click', function(){ STATE.ritornoFn = ritorno; apriEsercitazione(f); });\n      riga.appendChild(b1); riga.appendChild(b2); host.appendChild(riga);\n    });\n  }\n  // Maschera: TUTTE le fatture dell'archivio. Fatte → \"✓ Consegnato\" + \"Vedi soluzione\"; da fare → \"Compila\".\n  function renderCompitiPicker(){\n    STATE.modalitaCompiti = true; STATE.esercitazione = false; STATE.menuBackFn = null; STATE.archivioMode = false;\n    byId('menu-fatture').classList.remove('arch5');\n    var eb = byId('btn-esci-menu'); if(eb) eb.textContent = 'Esci';\n    var nome = STATE.studente ? STATE.studente.nome : '';\n    byId('menu-title').textContent = 'Compiti a casa' + (nome ? (' — ' + nome) : '');\n    var done = STATE.compitiDone || [];\n    var Q = statoQuaderno();   // (24/09/2026) cosa ha fatto l'alunno, cedolino per cedolino\n    var list = byId('menu-list'); list.innerHTML = '';\n    var tot = 0, fatti = 0;\n    /* 19/09/2026, regola di Mauro: esercitazioni e compiti hanno TUTTE le loro soluzioni. Solo il cedolino che\n       nell'archivio porta \"verifica\": true non compare qui (e il server non ne da' mai la soluzione agli alunni). */\n    (FATTURE || []).filter(function(f){ return !f.verifica; }).sort(function(a, b){ return (parseInt(numeroFattura(a.id), 10) || 0) - (parseInt(numeroFattura(b.id), 10) || 0); }).forEach(function(f){\n      tot++;\n      var q = Q[f.id] || {};\n      var fatta = !!q.consegnato || done.indexOf(f.id) !== -1; if(fatta) fatti++;\n      var row = document.createElement('div'); row.className = 'menu-row' + (fatta ? ' fatta' : ''); row.setAttribute('data-id', f.id);\n      var num = document.createElement('div'); num.className = 'menu-num'; num.textContent = numeroFattura(f.id);\n      var info = document.createElement('div'); info.className = 'menu-info';\n      var t = document.createElement('div'); t.className = 't'; t.textContent = f.titolo || ('Esercizio ' + numeroFattura(f.id));\n      var s = document.createElement('div'); s.className = 's'; s.textContent = f.difficoltaNome ? ('Difficoltà ' + f.difficoltaNome) : 'Cedolino da compilare';\n      // (24/09/2026) i nomi approvati da Mauro: «In corso in classe», «Svolto in classe · da consegnare»,\n      // «Svolto in classe · consegnato», «Da fare», «Consegnato»\n      var daConsegnare = !fatta && (q.forzata || (!q.assegnato && (q.bozzaClasse || q.riaperto)));\n      var inCorsoClasse = !fatta && !daConsegnare && q.assegnato;\n      if(daConsegnare){ s.textContent = 'Svolto in classe · da consegnare'; s.style.fontWeight = '600'; s.style.color = '#8a5a12'; }\n      else if(inCorsoClasse){ s.textContent = 'In corso in classe'; s.style.fontWeight = '600'; s.style.color = '#3f6b52'; }\n      else if(!fatta){ s.textContent = 'Da fare' + (f.difficoltaNome ? (' · difficoltà ' + f.difficoltaNome) : ''); }\n      info.appendChild(t); info.appendChild(s);\n      var cta = document.createElement('div'); cta.className = 'menu-cta';\n      if(fatta){\n        s.textContent = f.difficoltaNome ? ('Difficoltà ' + f.difficoltaNome) : '';\n        var d = document.createElement('span'); d.className = 'menu-done'; d.textContent = '✓ ' + (q.inClasse ? 'Svolto in classe · consegnato' : 'Consegnato'); cta.appendChild(d);\n        var vs = document.createElement('button'); vs.className = 'btn-ghost vedi-sol'; vs.textContent = 'Vedi soluzione'; vs.style.marginLeft = '8px';\n        vs.addEventListener('click', function(){ apriSoluzioneCompito(f); }); cta.appendChild(vs);\n        // Già consegnato: ora può ALLENARSI liberamente sulla stessa fattura, quante volte vuole. Nessun invio al prof.\n        var al = document.createElement('button'); al.className = 'btn-ghost'; al.textContent = 'Allenati'; al.style.marginLeft = '8px';\n        al.addEventListener('click', function(){ apriEsercitazione(f); }); cta.appendChild(al);\n      } else {\n        var classeQ = !!(daConsegnare || inCorsoClasse || q.bozzaClasse);\n        var b = document.createElement('button'); b.className = 'btn-compila';\n        b.textContent = daConsegnare ? 'Completa e consegna' : ((inCorsoClasse || q.iniziato) ? 'Continua' : 'Compila');\n        b.addEventListener('click', function(){ apriCompito(f, classeQ); }); cta.appendChild(b);\n      }\n      row.appendChild(num); row.appendChild(info); row.appendChild(cta); list.appendChild(row);\n    });\n    byId('menu-sub').textContent = 'Scegli un cedolino, compilalo e consegnalo al prof. Il tuo lavoro si salva da solo e lo ritrovi su qualsiasi dispositivo, anche in classe. Dopo la consegna vedrai (e potrai stampare) la soluzione. Ogni cedolino si consegna una volta sola; poi puoi allenarti quante volte vuoi (senza inviarlo). (Fatti ' + fatti + ' su ' + tot + ')';\n    // I voti PUBBLICATI (27/09/2026, regola di Mauro): quelli delle verifiche in cima, uno sotto l'altro in ordine di\n    // data (restano anche dopo il Reset); quelli delle esercitazioni dentro la riga del loro esercizio.\n    var pin0 = STATE.studente ? STATE.studente.pin : '';\n    var giro = STATE.pickerGiro = (STATE.pickerGiro || 0) + 1;   // una lista ridisegnata nel frattempo non riceve i voti due volte\n    if(pin0){ cloudLeggiValutazione(pin0, function(val, snap, storico){\n      if(STATE.pickerGiro !== giro) return;\n      if(!byId('menu-fatture') || byId('menu-fatture').style.display === 'none') return;\n      var list = byId('menu-list'); if(!list) return;\n      var ritorno = function(){ renderCompitiPicker(); show('menu-fatture'); };\n      var voti = votiAlunno(val, snap, storico);\n      var primo = list.firstChild;\n      voti.filter(function(x){ return votoDiVerifica(x.val); }).forEach(function(x){ list.insertBefore(cartaValutazione(x.val, x.snap, ritorno), primo); });\n      var perEsercizio = {};   // se un esercizio e' stato valutato piu' volte vale l'ultimo voto\n      voti.forEach(function(x){ (x.val.items || []).forEach(function(it){ if(it && it.fattura_id && !voceDiVerifica(it)) perEsercizio[it.fattura_id] = x; }); });\n      Object.keys(perEsercizio).forEach(function(id){ segnaValutato(list, id, perEsercizio[id], ritorno); });\n    }); }\n  }\n  function apriCompito(f, inClasse){\n    STATE.assegnataId = f.id; STATE.consegnata = false; STATE.solExitFn = null;\n    STATE.modalitaCompiti = true; STATE.esercitazione = false;   // consegna vera, non allenamento\n    STATE.compitoInClasse = !!inClasse;                          // svolto (o in corso) in classe: la consegna lo ricorda\n    LIVELLO = 1; try{ localStorage.setItem('cf_livello', '1'); }catch(e){}\n    entraAlunnoView();\n  }\n  // Consegna di un compito: cattura i 4 HTML, salva nel cloud (modalita='compiti'), poi mostra la soluzione.\n  function consegnaCompito(){\n    if(STATE.consegnata) return;\n    showConfirm('Vuoi consegnare questo cedolino al prof? Dopo la consegna vedrai la soluzione e potrai stamparla, ma non potrai più modificarlo.', function(){\n      try{ salvaLavoro(); }catch(e){}\n      STATE.consegnata = true;\n      mostraBloccoMsg('⏳', 'Invio in corso…', 'Sto inviando il tuo compito. Un attimo, non chiudere la pagina…', '#3f6b52');\n      catturaConsegnaCorrente(function(ok){\n        if(!ok){\n          // Consegna compito NON arrivata al cloud: non dico \"consegnato\", riporto l'alunno a compilare (lavoro intatto).\n          STATE.consegnata = false;\n          var f = FATTURE.find(function(x){ return x.id === STATE.assegnataId; });\n          if(f){ apriCompito(f, STATE.compitoInClasse); } else { renderCompitiPicker(); show('menu-fatture'); }\n          showAlert('Consegna non riuscita: controlla la connessione e riprova. Tranquillo, il tuo lavoro è al sicuro.');\n          return;\n        }\n        if(STATE.compitiDone && STATE.compitiDone.indexOf(STATE.assegnataId) === -1) STATE.compitiDone.push(STATE.assegnataId);\n        conSoluzione(STATE.assegnataId, function(sol){\n          if(sol){\n            STATE.soluzioneCorrente = sol;\n            try{ STATE.correctCortesiaHTML = buildCortesia(sol); }catch(e){}\n            try{ mostraSoluzioneCompilatore(true); commitValues(byId('editor')); STATE.correctDashboardHTML = byId('editor').innerHTML; }catch(e){}\n          }\n          mostraSoluzioneCompiti();\n        });\n      });\n    });\n  }\n  // Rivedere la soluzione di un compito GIÀ consegnato (dalla maschera).\n  function apriSoluzioneCompito(f){\n    var pin = STATE.studente ? STATE.studente.pin : '';\n    cloudCompitiUno(pin, f.id, function(r){\n      if(!r){ showAlert('Soluzione non trovata per questo cedolino.'); return; }\n      STATE.assegnataId = f.id;\n      STATE.titoloCorrente = f.titolo;\n      STATE.myCortesiaHTML = r.cortesiaAlunno || '';\n      STATE.myDashboardHTML = r.dashboardAlunno || '';\n      conSoluzione(f.id, function(sol){\n        STATE.soluzioneCorrente = sol || null;\n        STATE.correctCortesiaHTML = r.cortesiaCorretta || '';\n        STATE.correctDashboardHTML = r.dashboardCorretta || '';\n        if(sol){\n          try{ STATE.correctCortesiaHTML = buildCortesia(sol); }catch(e){}\n          try{ mostraSoluzioneCompilatore(true); commitValues(byId('editor')); STATE.correctDashboardHTML = byId('editor').innerHTML; }catch(e){}\n        }\n        mostraSoluzioneCompiti();\n      });\n    });\n  }\n  // Vista SOLUZIONE a confronto (riusa le 4 viste come le vede il docente), con uscita verso la maschera compiti.\n  function mostraSoluzioneCompiti(){\n    var rec = { cognome:'', fatture:[{\n      testoId: STATE.assegnataId,   // (26/09/2026) solo per il testo dell'esercizio sopra le dashboard\n      num: numeroFattura(STATE.assegnataId),\n      cortesiaAlunno: STATE.myCortesiaHTML || '',\n      cortesiaCorretta: STATE.correctCortesiaHTML || '',\n      dashboardAlunno: STATE.myDashboardHTML || '',\n      dashboardCorretta: STATE.correctDashboardHTML || ''\n    }] };\n    // (24/09/2026) aperta dalla schermata del consegnato in classe: si torna li'\n    if(STATE.ritornoFn){ rec.esciTesto = '← Indietro'; var rit = STATE.ritornoFn; mostraViewerCompiti(rec, 'alunno', function(){ STATE.ritornoFn = null; rit(); }); return; }\n    mostraViewerCompiti(rec, 'alunno', function(){ mostraCompiti(); });\n  }\n\n  /* ===================== ALLENAMENTO (esercitazione libera, dopo la consegna) =====================\n     Riusa il compilatore dei compiti (bozza SOLO locale, mai nel cloud), ma:\n       • niente «Consegna al prof» → il tasto in fondo diventa «Fine» e mostra la soluzione a confronto;\n       • si può rifare quante volte si vuole (Ricomincia da capo);\n       • lasciandola a metà, si ritrova sullo STESSO dispositivo (chiave 'E'); su altri no. */\n  function apriEsercitazione(f){\n    if(!f) return;\n    STATE.assegnataId = f.id; STATE.consegnata = false; STATE.solExitFn = null;\n    STATE.modalitaCompiti = true; STATE.esercitazione = true;\n    LIVELLO = 1; try{ localStorage.setItem('cf_livello', '1'); }catch(e){}\n    entraAlunnoView();\n  }\n  // Come catturaConsegnaCorrente, ma SENZA salvare nulla nel cloud e senza marcare la fattura come consegnata.\n  function catturaEsercitazione(){\n    commitValues(byId('editor'));\n    lockEditor();\n    STATE.myDashboardHTML = ripulisciHtmlAlunno(byId('editor').innerHTML);\n    STATE.myCortesiaHTML = buildCortesia(raccogli());\n    STATE.correctCortesiaHTML = buildCortesia(STATE.soluzioneCorrente);\n    try{ mostraSoluzioneCompilatore(true); commitValues(byId('editor')); STATE.correctDashboardHTML = byId('editor').innerHTML; }catch(e){ STATE.correctDashboardHTML = ''; }\n  }\n  function fineEsercitazione(){\n    showConfirm('Hai finito l\\'allenamento? Vedrai la soluzione a confronto con la tua compilazione. Questo esercizio NON viene inviato al prof.', function(){\n      /* (27/09/2026, trovato da Mauro) Premendo OK non succedeva niente: dal 18/09 la soluzione non sta piu' nel\n         telefono dell'alunno, catturaEsercitazione trovava STATE.soluzioneCorrente vuota e si fermava in errore\n         (col foglio gia' bloccato). Ora la soluzione si chiede al cloud PRIMA di toccare il foglio, con pazienza\n         (tre tentativi), come fanno «Rivedi la correzione» e Fattura Facile. Se non arriva, il foglio resta com'e'. */\n      var bottone = byId('btnChiudi'); if(bottone) bottone.disabled = true;\n      var id = STATE.assegnataId, tentativi = 0;\n      (function prova(){\n        conSoluzione(id, function(sol){\n          if(!sol && ++tentativi \u003c 3){ setTimeout(prova, 2000); return; }\n          if(bottone) bottone.disabled = false;\n          if(STATE.assegnataId !== id || !STATE.esercitazione) return;   // nel frattempo e' uscito dall'allenamento\n          if(!sol){ showAlert('La soluzione non è arrivata: controlla la connessione e premi di nuovo «' + TESTO_FINE_ALLENAMENTO + '». Il tuo allenamento è ancora qui.'); return; }\n          STATE.soluzioneCorrente = sol;\n          catturaEsercitazione();\n          // Allenamento concluso → la bozza locale riparte pulita al prossimo «Allenati» (resta un allenamento, non un lavoro in sospeso).\n          try{ localStorage.removeItem(chiaveLavoro(STATE.studente.pin, STATE.assegnataId)); }catch(e){}\n          mostraSoluzioneCompiti();\n        });\n      })();\n    });\n  }\n  function ricominciaEsercitazione(){\n    showConfirm('Ricominciare l\\'allenamento da capo? La compilazione attuale verrà azzerata.', function(){\n      try{ localStorage.removeItem(chiaveLavoro(STATE.studente.pin, STATE.assegnataId)); }catch(e){}\n      apriEsercitazione(FATTURE.find(function(x){ return x.id === STATE.assegnataId; }));\n    });\n  }\n\n  /* ===================== ARCHIVIO COMPITI A CASA (lato docente) ===================== */\n  // Elenco nomi → fatture consegnate → soluzione a confronto. Riusa la schermata \"menu-fatture\" e le viste soluzione.\n  var ARCH_FOLDERS_SVG = '\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"#534ab7\" stroke-width=\"2\" stroke-linecap=\"round\" stroke- byId('menu-title').innerHTML = ARCH_FOLDERS_SVG + 'Archivio compiti a casa';\n    var classi = Object.keys(STATE.archivioClassi || {}).sort(function(a, b){ return a.localeCompare(b, 'it'); });\n    byId('menu-sub').textContent = 'Scegli una classe per vedere i compiti consegnati.';\n    var list = byId('menu-list'); list.innerHTML = '';\n    var folderSmall = '\u003csvg viewBox=\"0 0 24 24\" width=\"19\" height=\"19\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 4h3l2 2h5a2 2 0 0 1 2 2v7a2 2 0 0 1 -2 2h-9a2 2 0 0 1 -2 -2v-9a2 2 0 0 1 2 -2\"/>\u003cpath d=\"M17 17v2a2 2 0 0 1 -2 2h-9a2 2 0 0 1 -2 -2v-9a2 2 0 0 1 2 -2h2\"/>\u003c/svg>';\n    classi.forEach(function(cl){\n      var c = STATE.archivioClassi[cl];\n      var nAl = Object.keys(c.byPin).length, nFat = 0;\n      Object.keys(c.byPin).forEach(function(p){ nFat += Object.keys(c.byPin[p].items).length; });\n      var row = document.createElement('div'); row.className = 'arch-row';\n      var av = document.createElement('div'); av.className = 'arch-av'; av.innerHTML = folderSmall;\n      var info = document.createElement('div'); info.className = 'arch-info';\n      var t = document.createElement('div'); t.className = 'arch-nm'; t.textContent = (cl === '—' ? 'Senza classe' : 'Classe ' + cl);\n      var sub = document.createElement('div'); sub.className = 'arch-mt'; sub.textContent = nAl + (nAl===1?' alunno · ':' alunni · ') + nFat + (nFat===1?' cedolino':' cedolini');\n      info.appendChild(t); info.appendChild(sub);\n      var b = document.createElement('button'); b.className = 'arch-apri'; b.textContent = 'Apri'; b.addEventListener('click', function(){ renderArchivioNomi(cl); });\n      row.appendChild(av); row.appendChild(info); row.appendChild(b); list.appendChild(row);\n    });\n    var esci = byId('btn-esci-menu'); if(esci) esci.textContent = '← Torna alla dashboard';\n    show('menu-fatture');\n  }\n  function renderArchivioNomi(classe){\n    var cl = (classe != null) ? classe : STATE.archivioClasseSel;\n    STATE.archivioClasseSel = cl;\n    var multiClasse = Object.keys(STATE.archivioClassi || {}).length > 1;\n    var byPin = ((STATE.archivioClassi || {})[cl] || { byPin:{} }).byPin;\n    STATE.archivioMode = true; STATE.modalitaCompiti = false; STATE.solExitFn = null;\n    STATE.menuBackFn = function(){ if(multiClasse){ renderArchivioClassi(); } else { tornaDashboardDaArchivio(); } };\n    byId('menu-fatture').classList.add('arch5');\n    var pins = Object.keys(byPin).sort(function(a, b){ return profInCima(byPin[a], byPin[b]) || (byPin[a].nome || '').localeCompare(byPin[b].nome || '', 'it'); });\n    byId('menu-title').innerHTML = ARCH_FOLDERS_SVG + 'Compiti a casa' + (cl && cl !== '—' ? ' · Classe ' + esc(cl) : '');\n    byId('menu-sub').textContent = pins.length\n      ? ('Alunni che hanno consegnato compiti: ' + pins.length + '. Clicca un nome per vedere i suoi cedolini e le soluzioni.')\n      : 'Ancora nessun compito consegnato.';\n    var list = byId('menu-list'); list.innerHTML = '';\n    var avatarSvg = '\u003csvg viewBox=\"0 0 24 24\" width=\"19\" height=\"19\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0\"/>\u003cpath d=\"M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2\"/>\u003c/svg>';\n    pins.forEach(function(pin){\n      var s = byPin[pin];\n      var nfat = Object.keys(s.items).length;\n      var row = document.createElement('div'); row.className = 'arch-row';\n      var av = document.createElement('div'); av.className = 'arch-av'; av.innerHTML = avatarSvg;\n      var info = document.createElement('div'); info.className = 'arch-info';\n      var t = document.createElement('div'); t.className = 'arch-nm'; t.textContent = s.nome;\n      var sub = document.createElement('div'); sub.className = 'arch-mt'; sub.textContent = nfat + (nfat === 1 ? ' cedolino consegnato' : '
