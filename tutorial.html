   var fAtt = (typeof FATTURE !== 'undefined' && FATTURE) ? FATTURE.find(function(x){ return x.id === STATE.assegnataId; }) : null;\n    var veraVerifica = !!(fAtt && fAtt.verifica) && !eserc;\n    var conSol = !veraVerifica;\n    var msgCons = conSol\n      ? (STATE.multiMode\n          ? 'Vuoi consegnare questo cedolino? Dopo la consegna vedrai subito la soluzione, ma non potrai più modificarlo.'\n          : 'Vuoi consegnare l\\'esercitazione? Dopo la consegna vedrai subito la soluzione, ma non potrai più modificarla.')\n      : (STATE.multiMode\n          ? 'Vuoi consegnare questo cedolino? Una volta consegnato non potrai più modificarlo né vedere le soluzioni.'\n          : 'Vuoi consegnare la verifica? Una volta consegnata non potrai più modificarla né vedere le soluzioni.');\n    showConfirm(msgCons, function(){\n      try{ salvaLavoro(); }catch(e){}                 // metto al sicuro l'ultimo tasto PRIMA di segnare consegnata (poi salvaLavoro si blocca)\n      STATE.consegnata = true;\n      mostraBloccoMsg('⏳', 'Invio in corso…', 'Sto inviando la tua consegna. Un attimo, non chiudere la pagina…', '#3f6b52');\n      catturaConsegnaCorrente(function(ok){\n        if(!ok){\n          // Consegna NON arrivata al cloud: non blocco, non dico \"consegnata\". Riporto l'alunno sul suo lavoro (intatto) e lo faccio riprovare.\n          STATE.consegnata = false;\n          entraAlunnoView();\n          showAlert('Consegna non riuscita: controlla la connessione e premi di nuovo «Chiudi e consegna». Tranquillo, il tuo lavoro è al sicuro, non è andato perso.');\n          return;\n        }\n        var tutteFatte = multiTutteConsegnate();\n        // Nel cloud: \"consegnato\" SOLO quando l'alunno ha finito TUTTE le fatture assegnate; altrimenti \"in_corso\".\n        if(SB && STATE.studente){\n          // Era rimasta una scrittura diretta sulla tabella: a permessi chiusi non faceva niente, e lo stato lo metteva\n          // cf_consegna con «consegnato» gia' al PRIMO cedolino (e perfino alla consegna di un compito a casa).\n          try{ SB.rpc('cf_dopo_consegna', { p_pin: STATE.studente.pin, p_sess: sessMia(), p_dispositivo: idDispositivo(), p_tutte_fatte: !!tutteFatte }).then(function(){}, function(){}); }catch(e){}\n          if(CLOUD_STUD[STATE.studente.pin]){ CLOUD_STUD[STATE.studente.pin].consegnata = tutteFatte; CLOUD_STUD[STATE.studente.pin].stato = (tutteFatte?'consegnato':'in_corso'); }\n        }\n        try{ if(tutteFatte && STATE.studente) sessionStorage.removeItem('cf_studente_attivo'); }catch(e){}\n        if(tutteFatte){ stopAssegnazioneWatcher(); stopConsegnaWatcher(); stopPresenza(); }\n        /* (25/09/2026, trovato da Mauro sul telefono) Il sorvegliante del consegnato parte SUBITO, non dopo «Ho finito»:\n           mentre l'alunno guarda la correzione il docente puo' riammetterlo (rientra da solo nel suo cedolino),\n           sospendere (va ai compiti) o fare Reset (schermata del PIN). Prima il Riammetti restava muto finche'\n           l'alunno non usciva e rientrava col PIN. */\n        if(tutteFatte) startBloccoWatcher();\n        var idCons = STATE.assegnataId;\n        var chiudi = function(){\n          if(tutteFatte){\n            mostraConsegnatoAlunno((conSol ? 'Esercitazione consegnata' : 'Verifica consegnata'),\n              conSol ? 'Hai consegnato: puoi rivedere la correzione o allenarti sullo stesso cedolino.'\n                     : 'Hai consegnato la verifica: non puoi più modificarla e le soluzioni non sono visibili. Se il docente ti riammette, potrai rientrare.');\n            startBloccoWatcher();\n          } else { mostraMenuFatture(); }\n        };\n        // VERIFICA VERA: la consegna è DEFINITIVA e SENZA feedback. Non mostriamo MAI la soluzione all'alunno.\n        if(!conSol){ chiudi(); return; }\n        // ESERCITAZIONE (in classe o col nome di verifica): subito la soluzione a confronto (le 4 viste dei compiti).\n        conSoluzione(idCons, function(sol){\n          if(sol){\n            STATE.soluzioneCorrente = sol;\n            try{ STATE.correctCortesiaHTML = buildCortesia(sol); }catch(e){}\n            try{ mostraSoluzioneCompilatore(true); commitValues(byId('editor')); STATE.correctDashboardHTML = byId('editor').innerHTML; }catch(e){}\n          }\n          mostraViewerCompiti({ esciTesto: (tutteFatte ? 'Ho finito' : '← I miei cedolini'), fatture:[{\n            id: idCons,\n            num: numeroFattura(idCons),\n            cortesiaAlunno: STATE.myCortesiaHTML || '',\n            cortesiaCorretta: STATE.correctCortesiaHTML || '',\n            dashboardAlunno: STATE.myDashboardHTML || '',\n            dashboardCorretta: STATE.correctDashboardHTML || ''\n          }] }, 'alunno', chiudi);\n        });\n      });\n    });\n  }\n  document.addEventListener('mousedown', function(e){ if(!e.target.closest('.ana-search-wrap')){ document.querySelectorAll('.ana-dd').forEach(function(d){ d.classList.remove('open'); }); } });\n\n  /* =========================================================\n     BOOT: ripristino da localStorage\n     ========================================================= */\n  try{ var c = localStorage.getItem('cf_classe'); if(c) CLASSE = JSON.parse(c); }catch(e){}\n  try{ var a = localStorage.getItem('cf_archivio'); if(a) FATTURE = JSON.parse(a); }catch(e){}\n  try{ var g = localStorage.getItem('cf_assegnata'); if(g){ STATE.assegnate = parseAssegnazione(g); STATE.assegnataId = assegnPrimoId(g); } }catch(e){}\n  buildRubrica();\n  // La riga qui sopra ha appena riempito FATTURE con la COPIA salvata su questo dispositivo (per partire\n  // subito e per stare offline). Ora chiedo al cloud l'archivio vero e aggiorno: senza questa richiesta il\n  // docente che aggiunge una fattura non la vede mai sul suo PC, perché la copia vecchia vince per sempre.\n  cloudAggiornaArchivio(function(){});\n  PRISTINE_EDITOR = byId('editor').innerHTML;\n  wireEditor();\n  recomputeAll();\n  // Auto-save: agganciato UNA sola volta sull'elemento #editor (persistente),\n  // con debounce, così NON viene duplicato dalle chiamate a wireEditor().\n  (function(){\n    // Il timer sta in STATE (e non in una variabile chiusa qui dentro) perche' chi apre un foglio nuovo o chiude\n    // la sessione deve poterlo fermare: vedi entraAlunnoView e mettiAlSicuroLavoro.\n    function programmaSalva(ms){\n      if(STATE.caricamentoFoglio) return;   // il foglio si sta montando: quello che c'e' dentro non e' ancora lavoro dell'alunno\n      if(STATE.saveTimer) clearTimeout(STATE.saveTimer);\n      STATE.saveTimer = setTimeout(function(){ STATE.saveTimer = null; salvaLavoro(); }, ms);\n    }\n    byId('editor').addEventListener('input', function(e){\n      if(e && e.isTrusted){ STATE.userTypedSinceLoad = true; STATE.ultimoTocco = Date.now(); }   // SOLO digitazione VERA dell'alunno (le modifiche\n                                                              // automatiche dell'editor hanno isTrusted=false)\n      programmaSalva(600);\n    });\n    // Anche i TOCCHI veri contano come «l'alunno ha messo mano al foglio»: menu delle voci, segni, cestini\n    // generano eventi «input» fatti dal codice (non fidati), e senza questo una risposta del cloud arrivata in\n    // ritardo poteva ridisegnare il foglio sopra quello che l'alunno aveva appena fatto a colpi di tocchi.\n    document.addEventListener('click', function(e){\n      if(!e || !e.isTrusted || !e.target || !e.target.closest) return;\n      if(e.target.closest('#editor') || e.target.closest('#ced-tendine')){ STATE.userTypedSinceLoad = true; STATE.ultimoTocco = Date.now(); }\n    }, true);\n    // Salva ANCHE quando l'alunno esce da un campo: il \"blur\" applica la formattazione (es. 10000 -> 10.000)\n    // DOPO l'ultimo tasto, e senza questo il valore formattato non finiva mai nel cloud (cambiando dispositivo\n    // ricompariva \"10000\" grezzo). focusout bolla fino a #editor, blur no.\n    byId('editor').addEventListener('focusout', function(){ programmaSalva(200); });\n  })();\n  // Ricalcolo automatico LIVE: solo nel livello Automatica, quando l'alunno digita\n  // quantità/prezzo/percentuali/spese o cambia l'IVA. I campi calcolati sono di sola\n  // lettura, quindi impostarli via codice non rigenera altri eventi (niente loop).\n  byId('editor').addEventListener('input', function(){ if(LIVELLO === 3) autocalc(); aggiornaNeretto(); });\n  byId('editor').addEventListener('change', function(e){ if(LIVELLO === 3 && e.target && e.target.classList.contains('iva')) autocalc(); aggiornaNeretto(); });\n  byId('editor').addEventListener('click', function(){ setTimeout(aggiornaNeretto, 0); }); // dopo aggiunta/rimozione articoli o sconti\n  // Dopo un F5: se c'è un alunno attivo, torna direttamente alla sua compilazione.\n  try{\n    var attivoDoc = sessionStorage.getItem('cf_docente_attivo');\n    var attivo = sessionStorage.getItem('cf_studente_attivo');\n    if(attivoDoc){\n      // DOCENTE: dopo un refresh resta nella sua dashboard, ma solo se Supabase lo riconosce ancora.\n      if(SB && SB.auth){\n        SB.auth.getSession().then(function(r){\n          if(r && r.data && r.data.session){ archivioDocente(function(){}); renderDocente(); show('docente'); startCollegatiTimer(); }\n          else { try{ sessionStorage.removeItem('cf_docente_attivo'); }catch(e){} goGate(); }\n        }, function(){ goGate(); });\n      } else { goGate(); }\n    } else if(attivo){\n      rientroSeNonAzzerato(attivo, function(){\n      var alu = (CLASSE && CLASSE.alunni) ? CLASSE.alunni.find(function(a){ return a.pin === attivo; }) : null;\n      // Dopo un F5 rientra passando dal contesto (menù se più fatture, singola se una sola).\n      if(alu){ STATE.studente = alu; buildRubrica(); ripristinaAlunno(alu.pin); }\n      else {\n        // Dispositivo dell'alunno senza classe caricata in locale: recupera l'alunno dal cloud e rientra dov'era.\n        cloudLoginPin(attivo, function(stud){\n          if(stud){ STATE.studente = stud; if(!CLASSE) CLASSE = { classe:(stud.classe||''), alunni:[stud] }; cloudCaricaContesto(function(){ buildRubrica(); ripristinaAlunno(attivo); }); }\n          else { goGate(); }\n        });\n      }\n      });\n    } else { provaRientroAutomatico(); }\n  }catch(e){ goGate(); }\n  /* (23/09/2026) DOPO IL RESET CI VUOLE IL PIN. I rientri senza PIN (F5 nella stessa scheda, riapertura entro\n     mezz'ora) prima guardano se da allora il docente ha fatto Reset o ricaricato la classe: se si', il lavoro\n     vecchio e' gia' stato buttato da allineaAzzeramento e si torna alla schermata del PIN. Rete muta = si\n     prosegue come prima (non so niente, non blocco nessuno). */\n  function rientroSeNonAzzerato(pin, avanti){\n    if(!SB || !pin){ avanti(); return; }\n    try{\n      SB.rpc('cf_stato', { p_pin: pin }).then(function(r){\n        var d = (r && !r.error) ? r.data : null;\n        if(d && allineaAzzeramento(pin, d.azzeramento)){\n          try{ sessionStorage.removeItem('cf_studente_attivo'); sessionStorage.removeItem('cf_sess'); localStorage.removeItem('cf_ultimo_pin'); }catch(e){}\n          STATE.studente = null; goGate(); return;\n        }\n        avanti();\n      }, function(){ avanti(); });\n    }catch(e){ avanti(); }\n  }\n  /* REGOLA DI MAURO (18/09/2026): se riapre l'app dallo STESSO dispositivo entro mezz'ora, rientra da solo,\n     senza ridigitare il PIN, e ritrova il lavoro dov'era. Se nel frattempo il posto e' stato preso da un\n     altro dispositivo, o se e' passata piu' di mezz'ora, si torna alla schermata del PIN come sempre.\n     La porta cf_rientro non disturba nessuno: se non e' lo stesso dispositivo, non fa niente. */\n  function provaRientroAutomatico(){\n    var pinR = null;\n    try{ pinR = localStorage.getItem('cf_ultimo_pin'); }catch(e){}\n    if(!pinR || !SB){ goGate(); return; }\n    rientroSeNonAzzerato(pinR, function(){\n    try{\n      SB.rpc('cf_rientro', { p_pin: pinR, p_dispositivo: idDispositivo() }).then(function(r){\n        var d = (r && !r.error) ? r.data : null;\n        if(!d || !d.allow){ goGate(); return; }\n        STATE.studente = { pin: pinR, nome: d.nome, cognome: d.cognome, classe: d.classe };\n        STATE.sessToken = d.sessione; STATE.sessTokenConfirmed = true;\n        try{ sessionStorage.setItem('cf_sess', d.sessione); }catch(e){}\n        try{ sessionStorage.setItem('cf_studente_attivo', pinR); }catch(e){}\n        if(!CLASSE || (d.classe && CLASSE.classe !== d.classe)) CLASSE = { classe:(d.classe || ''), alunni:[STATE.studente] };\n        cloudCaricaContesto(function(){\n          buildRubrica();\n          cloudModalitaAlunno(pinR, function(mode){\n            if(mode === 'compiti'){ avviaCompitiACasa(); return; }\n            cloudLeggiContestoAlunno(pinR, avviaAlunnoConLista);\n          });\n        });\n      }, function(){ goGate(); });\n    }catch(e){ goGate(); }\n    });\n  }\n  /* Controllo silenzioso del collegamento: parte all'apertura e ripete ogni 15 secondi finché il telefono non\n     riesce a raggiungere il cloud. Serve a scoprire i telefoni senza linea PRIMA della verifica, non durante.\n     Se il cloud risponde, l'alunno non vede assolutamente niente. (18/09/2026) */\n  (function(){\n    if(!SB) return;\n    var avviso = byId('err-alunno');\n    var mostraGuaio = function(){\n      if(byId('gate').style.display === 'none') return;\n      if(!avviso || avviso.textContent) return;   // non calpesto un messaggio già scritto dall'ingresso\n      avviso.textContent = 'Questo telefono non riesce a collegarsi: dillo al prof.';\n      avviso.setAttribute('data-rete', '1');\n    };\n    var togliGuaio = function(){\n      if(avviso && avviso.getAttribute('data-rete') === '1'){ avviso.textContent = ''; avviso.removeAttribute('data-rete'); }\n    };\n    var prova = function(){\n      if(byId('gate').style.display === 'none') return;   // solo sulla schermata del PIN: mentre l'alunno\n                                                          // lavora ci pensa il battito, niente richieste in più\n      try{\n        SB.rpc('cf_ping').then(function(r){\n          if(!r || r.error || r.data !== true){ mostraGuaio(); return; }\n          togliGuaio();\n        }, function(){ mostraGuaio(); });\n      }catch(e){ mostraGuaio(); }\n    };\n    prova();\n    setInterval(prova, 15000);\n  })();\n  /* AGGIORNAMENTO AUTOMATICO DELLE PAGINE VECCHIE (25/09/2026, chiesto da Mauro). Il 24/09 in 5I due alunni\n     lavoravano con una versione dell'app di giorni prima, rimasta aperta nel telefono: il telefono riprende la\n     scheda com'era, senza ricaricarla. Ora la pagina chiede al sito quale versione e' pubblicata (versione.txt,\n     da aggiornare INSIEME a VERSIONE_APP a ogni pubblicazione) all'avvio, quando torna in primo piano e ogni\n     5 minuti; se ce n'e' una piu' nuova si ricarica da sola, ma SOLO quando e' sicuro: alunno sulla schermata\n     del PIN, nella lista dei compiti o sul foglio senza averlo toccato nell'ultimo minuto (prima mette al sicuro\n     il lavoro, telefono e cloud). Mai sulla schermata del consegnato, mai durante una consegna, mai al docente.\n     Il ricarico e' un F5: in classe si torna sul foglio, nei compiti alla lista. Al massimo una volta ogni\n     10 minuti, cosi' un sito che risponde a meta' non la fa ricaricare in continuazione. */\n  var VERSIONE_APP = '20260929-03';\n  (function(){\n    var ultimo = 0, inCorso = false;\n    function visibile(id){ var el = byId(id); return !!(el && el.style.display !== 'none'); }\n    function momentoSicuro(){\n      if(STATE.consegnata || STATE.caricamentoFoglio) return false;\n      if(!STATE.studente) return visibile('gate');                         // docente o schermate sue: mai\n      if(visibile('menu-fatture')) return true;\n      if(visibile('editor')) return !((STATE.ultimoTocco || 0) > Date.now() - 60000);\n      return false;                                                        // consegnato, soluzione, attesa: si aspetta\n    }\n    function ricarica(){\n      if(inCorso) return; inCorso = true;\n      try{ sessionStorage.setItem('cf_aggiornata', String(Date.now())); }catch(e){}\n      // nei compiti la pagina non si segna l'alunno per il ricarico (lo fa solo l'ingresso in classe): senza questo\n      // dalla lista dei compiti si finirebbe sulla schermata del PIN\n      try{ if(STATE.studente && STATE.studente.pin) sessionStorage.setItem('cf_studente_attivo', STATE.studente.pin); }catch(e){}\n      try{ if(visibile('editor')) mettiAlSicuroLavoro(); }catch(e){}\n      var t0 = Date.now();\n      (function aspetta(){\n        if((STATE.bozzaInVolo || STATE.bozzaDaRimandare) && Date.now() - t0 \u003c 6000){ setTimeout(aspetta, 250); return; }\n        try{ if(STATE.bozzaInVolo || STATE.bozzaDaRimandare) pushBozzaSubito(); }catch(e){}\n        setTimeout(function(){ location.reload(); }, 300);\n      })();\n    }\n    function controlla(){\n      if(inCorso || Date.now() - ultimo \u003c 20000) return;\n      ultimo = Date.now();\n      try{ if(Date.now() - Number(sessionStorage.getItem('cf_aggiornata') || 0) \u003c 600000) return; }catch(e){}\n      try{\n        fetch('versione.txt?t=' + Date.now(), { cache: 'no-store' }).then(function(r){ return (r && r.ok) ? r.text() : ''; }).then(function(t){\n          t = String(t || '').trim();\n          if(!/^\\d{8}-\\d{2}$/.test(t) || t \u003c= VERSIONE_APP) return;\n          if(momentoSicuro()){ ricarica(); return; }\n          // non e' il momento: riprovo fra poco (il controllo al sito lo rifaccio, cosi' resta leggero)\n          setTimeout(function(){ ultimo = 0; controlla(); }, 30000);\n        }, function(){});\n      }catch(e){}\n    }\n    document.addEventListener('visibilitychange', function(){ if(document.visibilityState !== 'hidden') controlla(); });\n    window.addEventListener('pageshow', function(e){ if(e && e.persisted) controlla(); });\n    setInterval(function(){ if(document.visibilityState !== 'hidden') controlla(); }, 5 * 60 * 1000);\n    setTimeout(controlla, 4000);\n  })();\n  /* fine boot */\n})();\n\u003c/script>\n\u003cscript>\n/* colore, barra in alto e vista del docente per la calcolatrice di questa app */\nwindow.CALCX_ACCENT = '#3f6b52';\nwindow.CALCX_TESTATA = 'header.topbar';\nwindow.CALCX_ALLINEA = '.ff-badge';\nwindow.CALCX_NASCONDI = function(){ var d = document.getElementById('docente'); return !!(d && d.style.display !== 'none' && d.offsetParent !== null); };\n/* CALCOLATRICE DELL'APP (23/09/2026, chiesta da Mauro). Gli alunni non hanno la calcolatrice e quella di Windows o\n   del telefono fa uscire dalla pagina, e il pallino rosso si accende. Questa sta DENTRO la pagina: l'icona sta\n   DENTRO la barra in alto dell'app, a destra (la barra le fa posto con CALCX_TESTATA), e quando si scorre e la barra\n   sparisce resta fissa nell'angolo in alto a destra; la calcolatrice si apre SOLO col clic sull'icona (sul telefono non\n   deve comparire da sola) e si chiude con la X o con un altro clic sull'icona. Il display non e' una casella di\n   testo, cosi' sul telefono non si apre la tastiera. Tutto vive fuori dal resto dell'app (nomi calcx-*). */\n(function(){\n  if(window.__calcx) return; window.__calcx = true;\n  var ACC = window.CALCX_ACCENT || '#3f6b52';\n  var css = ''\n   + '.calcx-btn{position:fixed;top:10px;right:12px;z-index:8000;width:44px;height:44px;border-radius:50%;background:#fff;border:1.5px solid ' + ACC + ';color:' + ACC + ';display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 2px 8px rgba(26,32,44,.14);-webkit-tap-highlight-color:transparent;}'\n   + '.calcx-btn svg{width:23px;height:23px;display:block;}'\n   + '.calcx-btn.aperta{background:' + ACC + ';color:#fff;}'\n   + '.calcx-pan{position:fixed;top:64px;right:12px;z-index:8001;width:292px;background:#fff;border:1px solid #d9dee5;border-radius:16px;box-shadow:0 10px 30px rgba(26,32,44,.18);font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;color:#1a202c;display:none;user-select:none;-webkit-user-select:none;touch-action:manipulation;}'\n   + '.calcx-pan.aperta{display:block;}.calcx-pan:focus{outline:none;}'\n   + '.calcx-testa{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 6px 16px;cursor:move;touch-action:none;}'\n   + '.calcx-titolo{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;}'\n   + '.calcx-x{width:32px;height:32px;border:0;background:transparent;border-radius:8px;color:#6b7280;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}'\n   + '.calcx-x:hover{background:#f2f5f8;}'\n   + '.calcx-schermo{margin:0 12px 10px;padding:8px 12px 10px;background:#f2f5f8;border-radius:10px;text-align:right;min-height:64px;box-sizing:border-box;}'\n   + '.calcx-conto{font-size:13px;color:#6b7280;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}'\n   + '.calcx-num{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}'\n   + '.calcx-tasti{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:0 12px 12px;}'\n   + '.calcx-tasti button{height:46px;border-radius:10px;border:1px solid #e2e8f0;background:#fff;color:#1a202c;font-size:19px;font-weight:600;cursor:pointer;font-family:inherit;padding:0;-webkit-tap-highlight-color:transparent;}'\n   + '.calcx-tasti button:active{transform:scale(.96);}'\n   + '.calcx-tasti button.op{background:#f2f5f8;color:' + ACC + ';}'\n   + '.calcx-tasti button.fn{background:#f2f5f8;color:#4a5568;font-size:16px;}'\n   + '.calcx-tasti button.ug{background:' + ACC + ';border-color:' + ACC + ';color:#fff;}'\n   + '@media (max-width:600px){.calcx-btn{right:8px;}.calcx-pan{right:10px;width:calc(100vw - 20px);max-width:320px;}.calcx-tasti button{height:52px;font-size:21px;}}'\n   + '.calcx-via{display:none !important;}'\n   + (window.CALCX_TESTATA ? 'html.calcx-on ' + window.CALCX_TESTATA + '{padd n type=\"button\" class=\"' + (t[1] || '') + '\" data-k=\"' + (t[2] || t[0]) + '\">' + t[0] + '\u003c/button>';\n      }).join('') + '\u003c/div>';\n  function monta(){ document.body.appendChild(btn); document.body.appendChild(pan); }\n  if(document.body) monta(); else document.addEventListener('DOMContentLoaded', monta);\n\n  var elConto = pan.querySelector('.calcx-conto'), elNum = pan.querySelector('.calcx-num');\n\n  /* ---- il motore: come una calcolatrice da tavolo ---- */\n  var cur = '0', acc = null, op = null, fresco = true, errore = false, conto = '';\n  var SIMBOLO = { '+':'+', '-':'−', '*':'×', '/':'÷' };\n  /* I numeri sono DECIMALI ESATTI, cifra per cifra, come in una calcolatrice da tavolo: { n: intero BigInt, s: quanti\n     decimali }, cioe' n / 10^s. Niente virgola mobile del computer (quella che fa 0,1 + 0,2 = 0,30000000000000004).\n     Somma, sottrazione e moltiplicazione sono esatte; ogni risultato si arrotonda a 10 decimali, meta' lontano dallo\n     zero (le divisioni come 2 ÷ 3 non finiscono mai). Oltre 15 cifre intere: «Errore», come le calcolatrici vere. */\n  var B0 = BigInt(0), B1 = BigInt(1), B2 = BigInt(2), B10 = BigInt(10);\n  var MAXDEC = 10, MAXINT = 15;\n  function p10(k){ return BigInt('1' + new Array(k + 1).join('0')); }\n  function pulisci(x){ while(x.s > 0 && x.n % B10 === B0){ x = { n: x.n / B10, s: x.s - 1 }; } return x; }\n  function dividi(n, d, s){  // n / d arrotondato all'intero, meta' lontano dallo zero; il risultato ha s decimali\n    var neg = (n \u003c B0) !== (d \u003c B0);\n    if(n \u003c B0) n = -n; if(d \u003c B0) d = -d;\n    var q = n / d; if((n % d) * B2 >= d) q = q + B1;\n    return pulisci({ n: neg ? -q : q, s: s });\n  }\n  function tondo(x){ return x.s \u003c= MAXDEC ? pulisci(x) : dividi(x.n, p10(x.s - MAXDEC), MAXDEC); }\n  function inScala(x){  // null = fuori scala\n    var a = x.n \u003c B0 ? -x.n : x.n;\n    return a >= p10(MAXINT + x.s) ? null : x;\n  }\n  function val(s){  // da quello che si sta scrivendo (\"-1234,5\") al numero esatto\n    s = String(s); var neg = s.charAt(0) === '-'; if(neg) s = s.slice(1);\n    var p = s.split(','), i = p[0] || '0', f = p[1] || '';\n    var n = BigInt(i + f);\n    return pulisci({ n: neg ? -n : n, s: f.length });\n  }\n  function testoDi(x, punti){\n    var neg = x.n \u003c B0, t = (neg ? -x.n : x.n).toString(), i = t, f = '';\n    if(x.s > 0){ while(t.length \u003c= x.s) t = '0' + t; i = t.slice(0, t.length - x.s); f = t.slice(t.length - x.s); }\n    if(punti) i = i.replace(/\\B(?=(\\d{3})+(?!\\d))/g, '.');\n    return (neg ? (punti ? '−' : '-') : '') + i + (f ? ',' + f : '');\n  }\n  function fmtNum(x){ return x === null ? 'Errore' : testoDi(x, true); }\n  function fmtCur(s){  // quello che si sta scrivendo, coi punti delle migliaia\n    var neg = s.charAt(0) === '-'; if(neg) s = s.slice(1);\n    var p = s.split(',');\n    return (neg ? '−' : '') + p[0].replace(/\\B(?=(\\d{3})+(?!\\d))/g, '.') + (p.length > 1 ? ',' + p[1] : '');\n  }\n  function calcola(a, o, b){  // null = errore (diviso zero o fuori scala)\n    var r;\n    if(o === '+' || o === '-'){\n      var s = Math.max(a.s, b.s), x = a.n * p10(s - a.s), y = b.n * p10(s - b.s);\n      r = { n: o === '+' ? x + y : x - y, s: s };\n    } else if(o === '*'){ r = { n: a.n * b.n, s: a.s + b.s };\n    } else if(o === '/'){\n      if(b.n === B0) return null;\n      r = dividi(a.n * p10(b.s + MAXDEC), b.n * p10(a.s), MAXDEC);\n    } else { r = b; }\n    return inScala(tondo(r));\n  }\n  function centesimi(p){ return { n: p.n, s: p.s + 2 }; }  // p % = p / 100, esatto\n  function daNumero(x){ return testoDi(x, false); }\n  /* lo schermo: il numero si rimpicciolisce da solo finche' ci sta intero, mai tagliato */\n  function adatta(el, grande, piccolo){\n    el.style.fontSize = '';\n    if(!el.clientWidth) return;\n    var f = grande;\n    while(f > piccolo && el.scrollWidth > el.clientWidth){ f -= 1; el.style.fontSize = f + 'px'; }\n  }\n  function mostra(){\n    elNum.textContent = errore ? 'Errore' : fmtCur(cur);\n    elConto.textContent = conto;\n    adatta(elNum, 30, 12); adatta(elConto, 13, 9);\n  }\n  window.addEventListener('resize', function(){ mostra(); });\n  function azzera(){ cur = '0'; acc = null; op = null; fresco = true; errore = false; conto = ''; }\n  function chiudiConto(ris, testo){\n    if(ris === null){ azzera(); errore = true; conto = testo; return; }\n    conto = testo; cur = daNumero(ris); acc = null; op = null; fresco = true;\n  }\n  function premi(k){\n    if(errore && k !== 'azzera'){ azzera(); }\n    if(/^[0-9]$/.test(k)){\n      if(fresco){ cur = k; fresco = false; if(acc === null) conto = ''; }\n      else if(cur.replace(/[-,]/g, '').length \u003c 15){ cur = (cur === '0') ? k : (cur === '-0' ? '-' + k : cur + k); }\n    } else if(k === 'virgola'){\n      if(fresco){ cur = '0,'; fresco = false; if(acc === null) conto = ''; }\n      else if(cur.indexOf(',') \u003c 0){ cur += ','; }\n    } else if(k === 'azzera'){ azzera();\n    } else if(k === 'cancella'){\n      if(!fresco){ cur = cur.length > 1 && cur !== '-0' ? cur.slice(0, -1) : '0'; if(cur === '-') cur = '0'; }\n    } else if(k === 'segno'){\n      if(cur !== '0') cur = cur.charAt(0) === '-' ? cur.slice(1) : '-' + cur;\n    } else if(k === 'piu' || k === 'meno' || k === 'per' || k === 'diviso'){\n      var o = { piu:'+', meno:'-', per:'*', diviso:'/' }[k];\n      if(acc !== null && op && !fresco){\n        var r = calcola(acc, op, val(cur));\n        if(r === null){ chiudiConto(r, fmtNum(acc) + ' ' + SIMBOLO[op] + ' ' + fmtCur(cur)); mostra(); return; }\n        acc = r; cur = daNumero(acc);\n      } else if(acc === null || !op){ acc = val(cur); }\n      op = o; fresco = true; conto = fmtNum(acc) + ' ' + SIMBOLO[op];\n    } else if(k === 'uguale'){\n      if(acc !== null && op){\n        chiudiConto(calcola(acc, op, val(cur)), fmtNum(acc) + ' ' + SIMBOLO[op] + ' ' + fmtCur(cur) + ' =');\n      }\n    } else if(k === 'percento'){\n      var p = val(cur), ris;\n      if(acc !== null && op){\n        if(op === '+' || op === '-') ris = calcola(acc, op, { n: acc.n * p.n, s: acc.s + p.s + 2 });\n        else if(op === '*') ris = inScala(tondo({ n: acc.n * p.n, s: acc.s + p.s + 2 }));\n        else ris = calcola(acc, '/', centesimi(p));\n        chiudiConto(ris, fmtNum(acc) + ' ' + SIMBOLO[op] + ' ' + fmtCur(cur) + ' % =');\n      } else {\n        chiudiConto(inScala(tondo(centesimi(p))), fmtCur(cur) + ' % =');\n      }\n    }\n    mostra();\n  }\n  pan.querySelector('.calcx-tasti').addEventListener('click', function(ev){\n    var b = ev.target.closest('button[data-k]'); if(!b) return;\n    premi(b.getAttribute('data-k'));\n  });\n  /* tastiera del computer: solo quando si sta usando la calcolatrice (il fuoco e' dentro di lei), cosi' le cifre\n     scritte nelle caselle dell'app restano alle caselle */\n  pan.addEventListener('keydown', function(ev){\n    var k = ev.key, m = null;\n    if(/^[0-9]$/.test(k)) m = k;\n    else if(k === ',' || k === '.') m = 'virgola';\n    else if(k === '+') m = 'piu'; else if(k === '-') m = 'meno';\n    else if(k === '*' || k === 'x' || k === 'X') m = 'per'; else if(k === '/' || k === ':') m = 'diviso';\n    else if(k === '%') m = 'percento';\n    else if(k === 'Enter' || k === '=') m = 'uguale';\n    else if(k === 'Backspace') m = 'cancella';\n    else if(k === 'Delete') m = 'azzera';\n    else if(k === 'Escape'){ ev.preventDefault(); chiudi(); btn.focus(); return; }\n    if(m){ ev.preventDefault(); premi(m); }\n  });\n\n  /* ---- aprire, chiudere, spostare ---- */\n  function apri(){ posiziona(); pan.classList.add('aperta'); mostra(); btn.classList.add('aperta'); btn.setAttribute('aria-expanded', 'true'); try{ pan.focus({ preventScroll:true }); }catch(e){} }\n  function chiudi(){ pan.classList.remove('aperta'); btn.classList.remove('aperta'); btn.setAttribute('aria-expanded', 'false'); }\n  btn.addEventListener('click', function(){ if(pan.classList.contains('aperta')) chiudi(); else apri(); });\n  pan.querySelector('.calcx-x').addEventListener('click', function(){ chiudi(); });\n  var testa = pan.querySelector('.calcx-testa'), trascina = null;\n  testa.addEventListener('pointerdown', function(ev){\n    if(ev.target.closest('.calcx-x')) return;\n    var r = pan.getBoundingClientRect();\n    trascina = { dx: ev.clientX - r.left, dy: ev.clientY - r.top };\n    try{ testa.setPointerCapture(ev.pointerId); }catch(e){}\n    ev.preventDefault();\n  });\n  testa.addEventListener('pointermove', function(ev){\n    if(!trascina) return;\n    var w = pan.offsetWidth, h = pan.offsetHeight;\n    var x = Math.max(4, Math.min(window.innerWidth - w - 4, ev.clientX - trascina.dx));\n    var y = Math.max(4, Math.min(window.innerHeight - 60, ev.clientY - trascina.dy));\n    pan.style.left = x + 'px'; pan.style.top = y + 'px'; pan.style.right = 'auto';\n  });\n  function lascia(){ trascina = null; }\n  testa.addEventListener('pointerup', lascia); testa.addEventListener('pointercancel', lascia);\n  window.addEventListener('resize', function(){\n    if(!pan.style.left) return;\n    var x = parseFloat(pan.style.left), y = parseFloat(pan.style.top), w = pan.offsetWidth;\n    if(x + w > window.innerWidth - 4 || y > window.innerHeight - 60){ pan.style.left = ''; pan.style.top = ''; pan.style.right = ''; posiziona(); }\n  });\n  /* nella dashboard del docente l'icona non serve e coprirebbe i pulsanti del cruscotto: ogni app dice con\n     CALCX_NASCONDI quando e' la vista del docente */\n  setInterval(function(){\n    var via = false;\n    try{ via = typeof window.CALCX_NASCONDI === 'function' && !!window.CALCX_NASCONDI(); }catch(e){}\n    btn.classList.toggle('calcx-via', via); pan.classList.toggle('calcx-via', via);\n    document.documentElement.classList.toggle('calcx-on', !via);\n    posiziona();\n  }, 700);\n  /* l'icona sta a meta' altezza della barra in alto finche' la barra si vede; poi nell'angolo */\n  function posiziona(){\n    var top = 10;\n    try{\n      var H var TESTI = JSON.parse("{\"p01-1\": \"Questo è il tutorial di Cedolino Facile. Qui la busta paga non è un modulo già pronto: parti da un foglio bianco e la costruisci tu, voce per voce, leggendo il testo dell'esercizio. La costruiamo insieme, nell'ordine giusto, su un cedolino d'esempio, lavorando da casa, coi compiti.\", \"p01-2\": \"In ogni passo, sotto lo schermo, tocca Guarda l'animazione: il puntatore rifà i gesti mentre ti spiego. Con le frecce torni indietro, o salti avanti di una frase. Quando hai capito, tocca Avanti.\", \"p02-1\": \"Apri l'app dal pulsante del modulo. Nella schermata di accesso scrivi il tuo PIN: cinque cifre, senza spazi.\", \"p02-2\": \"Poi tocca Entra, una volta sola. Il PIN te lo dà il prof: con quel PIN l'app sa chi sei, e salva il tuo lavoro.\", \"p03-1\": \"Da casa, dopo il PIN, arrivi ai compiti a casa: tutti i cedolini che ti ha dato il prof, uno per riga, ognuno col suo stato.\", \"p03-2\": \"Qui, in cima, c'è l'esempio di questo tutorial; nella tua lista trovi gli esercizi del prof. Scegli il cedolino, e tocca Compila: si apre il foglio.\", \"p03-3\": \"Il lavoro si salva da solo, e lo ritrovi su qualsiasi dispositivo, anche in classe.\", \"p04-1\": \"Ecco il foglio. In classe, quando il prof ti assegna un cedolino, dopo il PIN arrivi direttamente qui.\", \"p04-2\": \"In alto c'è il tuo nome, con la classe: controlla subito che sia tu.\", \"p04-3\": \"Accanto c'è Torna ai compiti: salva, e ti riporta alla lista.\", \"p04-4\": \"Sotto c'è il testo dell'esercizio: tutti i numeri che ti servono stanno lì.\", \"p05-1\": \"Prima di cominciare, leggi tutto il testo dell'esercizio. Fai caso a importi, ore, familiari a carico e mensilità.\", \"p05-2\": \"Il pulsante meno chiude il testo, per farti spazio. Il più lo riapre. E si richiude con un tocco: ricontrollare un numero è sempre facile.\", \"p05-3\": \"In alto a destra c'è la calcolatrice. I conti li fai tu, e lei è sempre lì.\", \"p06-1\": \"Sotto il testo c'è il tuo cedolino, anco  testo.\", \"p15-1\": \"Inserisci Contributi previdenziali: è la parte che l'INPS trattiene al lavoratore.\", \"p15-2\": \"Il segno è meno, perché i contributi sono una trattenuta.\", \"p15-3\": \"Poi scrivi l'imponibile previdenziale, cioè la retribuzione lorda del blocco di sopra. E l'aliquota del testo: nove virgola diciannove.\", \"p15-4\": \"La moltiplicazione la fa l'app: duecentoquarantadue e sessantaquattro di contributi.\", \"p15-5\": \"Sotto compare l'imponibile fiscale: la retribuzione meno i contributi. È la base su cui si calcola l'IRPEF.\", \"p16-1\": \"Inserisci IRPEF lorda. Compare la tabella degli scaglioni duemilaventisei, già divisi per mese.\", \"p16-2\": \"Nella colonna Imponibile del mese scrivi quanta parte del tuo imponibile fiscale cade in ogni scaglione.\", \"p16-3\": \"L'aliquota c'è già. L'imposta di ogni riga, e il totale, li calcola l'app.\", \"p17-1\": \"L'imponibile fiscale di Gallesio è duemilatrecentonovantasette e sessantuno: supera il tetto del primo scaglione.\", \"p17-2\": \"Allora nel primo scaglione scrivi tutto lo scaglione: duemilatrecentotrentatré e trentatré.\", \"p17-3\": \"Nel secondo, solo quello che avanza: sessantaquattro e ventotto. Il terzo resta vuoto.\", \"p17-4\": \"L'IRPEF lorda è la somma delle due imposte: cinquecentocinquantasette e ottantotto.\", \"p18-1\": \"Le detrazioni dipendono da quanto si guadagna in un anno intero. Inserisci il blocco Detrazioni.\", \"p18-2\": \"In cima scrivi il reddito fiscale del mese, cioè l'imponibile fiscale. Poi il numero delle mensilità, dal testo: tredici.\", \"p18-3\": \"L'app moltiplica: trentunmilacentosessantotto e novantatré. È il reddito annuo presunto.\", \"p19-1\": \"Nella riga vuota tocca Scegli la voce, e prendi Detrazione per lavoro dipendente.\", \"p19-2\": \"Poi la fascia di reddito: trentunmila sta fra ventottomila e cinquantamila.\", \"p19-3\": \"Da qui fa tutto l'app: la formula, l'aggiunta di sessantacinque euro prevista dalla legge, e la detrazione del mese: centoquarantuno e sessantasei.\", \"p20-1\": \"Per ogni altra detrazione premi Aggiungi una detrazione. Gallesio ha la moglie a carico, senza redditi: scegli Detrazione per coniuge a carico.\", \"p20-2\": \"La fascia però si sceglie sul reddito di Gallesio, non su quello della moglie: da quindicimila a quarantamila.\", \"p20-3\": \"Poi il taglio del cuneo fiscale, che spetta fra ventimila e quarantamila euro l'anno. Aggiungi una detrazione, scegli Ulteriore detrazione, e la fascia fino a trentaduemila.\", \"p20-4\": \"Il totale delle detrazioni, per ora, è duecentottantaquattro e sedici.\", \"p21-1\": \"Gallesio ha anche due figli. Aggiungi una detrazione, apri l'elenco, e leggi sotto Detrazione per figli a carico: solo dai ventuno ai ventinove anni.\", \"p21-2\": \"Il figlio di ventitré anni ha l'età giusta, e non ha redditi: a lui spetta. Scegli la voce, e poi la fascia: fino a novantacinquemila.\", \"p21-3\": \"La figlia di dieci anni no. Per i figli più piccoli, in busta paga, non c'è nessuna detrazione: c'è l'assegno unico, che l'INPS versa direttamente sul conto dei genitori.\", \"p21-4\": \"Attento a un tranello: la spiegazione dice che, con più figli, il limite di novantacinquemila sale. Vale solo per i figli che hanno la detrazione. Qui ce n'è uno solo, quindi la formula resta questa.\", \"p21-5\": \"Detrazione del mese: cinquantatré e diciannove. E il totale delle detrazioni diventa trecentotrentasette e trentacinque.\", \"p22-1\": \"Inserisci IRPEF netta. Ci sono due caselle e un segno in mezzo, e nessuna scritta ti dice che cosa va dove: devi saperlo tu.\", \"p22-2\": \"Prima il segno: le detrazioni si tolgono.\", \"p22-3\": \"Nella prima casella l'IRPEF lorda, cinquecentocinquantasette e ottantotto. Nella seconda il totale delle detrazioni, trecentotrentasette e trentacinque.\", \"p22-4\": \"Il risultato lo scrive l'app: duecentoventi e cinquantatré. E sopra le caselle compaiono le scritte IRPEF lorda e Detrazioni: è la conferma che hai preso i numeri onsegna è definitiva: da quel momento il cedolino non si modifica più. Mentre compare Invio in corso, non chiudere la pagina.\", \"p28-3\": \"In un attimo il lavoro arriva al prof, e tu vedi subito la correzione.\", \"p29-1\": \"Dopo la consegna trovi quattro schede. Il mio cedolino è quello che hai costruito tu. Cedolino corretto è lo stesso, senza errori.\", \"p29-2\": \"La mia dashboard è il tuo foglio di lavoro, blocco per blocco. La dashboard corretta è il foglio compilato senza errori.\", \"p29-3\": \"Scarica PDF salva il cedolino, per stamparlo o tenerlo.\", \"p30-1\": \"Per trovare gli errori, passa avanti e indietro fra la tua scheda e quella corretta.\", \"p30-2\": \"L'app ti tiene nello stesso punto del foglio: così quello che cambia salta all'occhio.\", \"p30-3\": \"In cima alle due dashboard c'è di nuovo il testo dell'esercizio. Nel nostro esempio non ci sono errori: le due versioni sono identiche.\", \"p31-1\": \"Quando hai finito di confrontare, tocca Torna ai compiti.\", \"p31-2\": \"Nella lista il cedolino adesso risulta consegnato. Vedi soluzione riapre le quattro schede.\", \"p31-3\": \"Allenati ti fa rifare lo stesso cedolino, da zero. Al prof non arriva niente: è il modo migliore per prepararti alla verifica.\", \"p31-4\": \"In una verifica vera, invece, dopo la consegna la correzione non si vede. Il voto arriva quando il prof lo pubblica.\", \"p32-1\": \"Nella lista dei compiti, ogni cedolino ha il suo stato.\", \"p32-2\": \"In cima, quando il prof la pubblica, trovi la tua valutazione.\", \"p32-3\": \"Consegnato: con Vedi soluzione rivedi la correzione, con Allenati lo rifai.\", \"p32-4\": \"In corso in classe: l'hai cominciato a scuola, e con Continua lo ritrovi com'era.\", \"p32-5\": \"Svolto in classe, da consegnare: il prof ha chiuso la prova, ma tu puoi finirlo e consegnarlo.\", \"p32-6\": \"E da fare: compila, e comincia.\", \"p33-1\": \"Da casa entri col tuo PIN da qualsiasi dispositivo. Il foglio è lo stesso della classe: quello che hai cominciato a scuola, lo ritrovi a casa.\", \"p33-2\": \"Si compila e si consegna allo stesso modo, a casa e in classe. Ogni cedolino si consegna una volta sola.\", \"p33-3\": \"Il lavoro si salva da solo mentre scrivi. E se il prof ti assegna un cedolino mentre sei nei compiti, l'app ti porta lì da sola.\", \"p34-1\": \"E in classe? Si lavora allo stesso modo, con qualche differenza. Quando il prof avvia l'esercitazione, dopo il PIN entri direttamente nel cedolino assegnato, senza passare dalla lista.\", \"p34-2\": \"Dopo la consegna, al posto di Torna ai compiti trovi Ho finito, che ti porta alla schermata Esercitazione consegnata.\", \"p34-3\": \"E in classe il PIN si usa su un dispositivo alla volta. Se entri da un secondo telefono o computer, lì compare Accesso bloccato.\", \"p34-4\": \"Se il primo dispositivo è ancora aperto, torna a lavorare su quello. Se invece si è spento, o l'hai chiuso, avvisa il prof: ti sblocca, e rientri col lavoro dov'era.\", \"p35-1\": \"Prima di premere Chiudi e consegna, ripassa sempre questa lista.\", \"p35-2\": \"Le due anagrafiche, col cognome prima del nome. Un segno su ogni riga. La retribuzione lorda che torna col testo. L'imponibile fiscale più basso della retribuzione.\", \"p35-3\": \"Il primo scaglione pieno, prima di passare al secondo. Solo le detrazioni che spettano, ognuna con la sua fascia. E sopra l'IRPEF netta, le scritte IRPEF lorda e Detrazioni.\", \"p35-4\": \"Nel netto, IRPEF netta e addizionali col meno; la somma integrativa, se spetta, col più. Adesso tocca a te: torna al modulo, e apri l'app.\"}"); /* e il suo testo: servono a sapere quando la voce arriva a una parola */

async function parla(id, azioni, ritardo){

  }

  VOCE.el = null; VOCE.fine = null; VOCE.id = null;

}
/* A che secondo la battuta arriva alla parola «chiave»: le lettere scorrono in proporzione sul tempo di parlato,
   saltando le pause misurate. */
function tempoDi(id, chiave){
  var t = TESTI[id], pt = TEMPI[id];
  if(!t || !pt || !pt.length) return 0;
  var i = t.indexOf(chiave);
  if(i < 0){ console.error('voce: parola non trovata', id, chiave); return 0; }
  /* 27/09/2026: TEMPI sono i punti [lettere dette, secondo] della mappa di fai_tutorial.py (pause abbinate alla
     punteggiatura). La versione di prima li leggeva come tratti [inizio, fine]: tempi negativi, gesti mai in attesa. */
  var x = (t.slice(0, i).match(/[0-9A-Za-zÀ-ÿ]/g) || []).length, k = 0;
  for(var z = 0; z < pt.length; z++) if(pt[z][0] <= x) k = z;
  if(k >= pt.length - 1) return pt[pt.length - 1][1];
  var a = pt[k], b = pt[k + 1];
  if(b[0] === a[0]) return b[1];
  return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
}
/* dentro i gesti di una battuta: si aspetta che la voce arrivi alla parola (anticipo in secondi: il puntatore parte

async function quando(chiave, anticipo){

  if(!a || !id || S.fattore === 0) return;
  var g = S.gen, t = tempoDi(id, chiave) - (anticipo == null ? 0.5 : anticipo);

    vivo(g);
  }
}

async function scorriA(el){
  var g = S.gen;
  var r = el.getBoundingClientRect(), vh = S.win.innerHeight;
  var alto = 76, basso = 30;
  var fisso = q('.vc-fissa'); if(fisso && visibile(fisso)) alto = Math.max(alto, fisso.getBoundingClientRect().bottom + 16);
  if(r.top >= alto && r.bottom <= vh - basso) return;
  var y = S.win.scrollY + r.top - (r.height > vh - alto - basso ? alto : Math.max(alto, (vh - r.height) * 0.38));
  y = Math.max(0, y);
  await scorriDolce(S.win, y);
}
/* scorrimento fatto a mano, a piccoli passi: uguale in Chrome e in Firefox, e si ferma se si cambia passo */
async function scorriDolce(bersaglio, y, suElemento){
  var g = S.gen;
  var lato = suElemento === 'x';
  var leggi = function(){ return lato ? bersaglio.scrollLeft : (suElemento ? bersaglio.scrollTop : bersaglio.scrollY); };
  var metti = function(v){ if(lato) bersaglio.scrollLeft = v; else if(suElemento) bersaglio.scrollTop = v; else bersaglio.scrollTo(0, v); };
  var y0 = leggi(), dy = y - y0;
  if(Math.abs(dy) < 2){ return; }
  if(S.fattore === 0){ metti(y); return; }
  var n = Math.max(8, Math.min(34, Math.round(Math.abs(dy) / 22)));
  for(var i = 1; i <= n; i++){
    var t = i / n, e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    metti(y0 + dy * e);
    await att(16); vivo(g);
  }
}
function scatolaX(el){ var b = el && el.closest ? el.closest('.scrollx, .ced-scroll') : null; return (b && b.scrollWidth > b.clientWidth + 2) ? b : null; }
async function inVistaX(el){
  var box = scatolaX(el); if(!box) return;
  var br = box.getBoundingClientRect(), r = el.getBoundingClientRect(), dx = 0;
  if(r.right > br.right - 6) dx = r.right - br.right + 14;
  else if(r.left < br.left + 6) dx = r.left - br.left - 14;
  if(dx) await scorriDolce(box, Math.max(0, box.scrollLeft + dx), 'x');
}
async function muovi(el, o){
  o = o || {};
  var g = S.gen;
  if(!el) return;
  if(!o.fermo){ await scorriA(el); await inVistaX(el); }
  vivo(g);
  var r = el.getBoundingClientRect();
  var x = o.sinistra ? r.left + Math.min(26, r.width * 0.3) : r.left + r.width * 0.5;
  var y = r.top + Math.min(r.height * 0.55, 24);
  var c = cursore();
  if(S.fattore === 0){ c.style.opacity = '0'; c._x = x; c._y = y; return; }
  c.style.opacity = '1';
  var d = Math.hypot(x - c._x, y - c._y);
  var dur = o.tasto ? 110 : Math.max(280, Math.min(750, d * 1.1)) * (o.veloce ? 0.7 : 1);   /* tasto: calcolatrice, tasti vicini */
  c.style.transitionDuration = Math.round(dur * S.fattore) + 'ms, .25s';
  c.style.transform = 'translate(' + (x - 3) + 'px,' + (y - 2) + 'px)';
  c._x = x; c._y = y;
  await att(dur + 40);
}
async function premi(el, o){
  o = o || {};
  var g = S.gen;
  await muovi(el, o); vivo(g);
  if(S.fattore > 0){
    var c = cursore(); c.classList.add('giu');
    var onda = S.doc.createElement('div'); onda.className = 'tut-onda';
    onda.style.left = c._x + 'px'; onda.style.top = c._y + 'px';
    S.doc.body.appendChild(onda); setTimeout(function(){ onda.remove(); }, 700);
    await att(o.tasto ? 70 : 120);
    c.classList.remove('giu');
  }
}
async function clic(el, o){
  o = o || {};
  var g = S.gen;
  await premi(el, o); vivo(g);
  if(!o.finto) clicVero(el);
  await att(o.dopo != null ? o.dopo : 260);
}
async function scrivi(inp, t, o){
  o = o || {};
  var g = S.gen;
  await premi(inp, { sinistra:true, veloce:o.veloce }); vivo(g);
  inp.classList.add('tut-fuoco');
  inp.value = ''; inp.dispatchEvent(new S.win.Event('input', { bubbles:true }));
  var passo = o.veloce ? 42 : 70;
  for(var i = 0; i < t.length; i++){
    inp.value += t.charAt(i);
    inp.dispatchEvent(new S.win.Event('input', { bubbles:true }));
    await att(passo);
  }
  await att(o.sospendi != null ? o.sospendi : (o.veloce ? 120 : 260));
  if(o.esci) await quando(o.esci, 0);   /* si esce dalla casella quando la voce lo dice */
  inp.dispatchEvent(new S.win.FocusEvent('blur'));
  inp.classList.remove('tut-fuoco');
  await att(o.veloce ? 80 : 180);
}
/* un menu dell'app: si apre col suo pulsante, si porta in vista la voce, la si sceglie */
async function scegli(apri, voce, o){
  o = o || {};
  var g = S.gen;
  if(o.aperto){ if(!menuAperto()) clicVero(apri); }   /* elenco gia' aperto prima della battuta (preparaRiga) */
  else { await clic(apri, { veloce:o.veloce, dopo:220 }); vivo(g); }
  if(o.pausaMenu) await att(o.pausaMenu);
  if(o.dire) await quando(o.dire, o.anticipo != null ? o.anticipo : 0.6);   /* tendina aperta: si sceglie sulla parola */
  var it = voceMenu(voce);
  /* l'app chiude le tendine a ogni scorrimento della pagina, e l'avviso dello scorrimento arriva un attimo dopo:
     quando si va veloci (passo appena aperto) puo' richiudere la tendina appena aperta. Si aspetta e la si riapre. */
  for(var k = 0; !it && k < 8; k++){
    await new Promise(function(ok){ setTimeout(ok, 50); }); vivo(g);
    if(!menuAperto()) clicVero(apri);
    it = voceMenu(voce);
  }
  if(!it) throw new Error('voce di menu non trovata: ' + voce);
  var m = it.closest('.menu, .scelte') || menuAperto();
  if(m && m.scrollHeight > m.clientHeight){
    var mr = m.getBoundingClientRect(), ir = it.getBoundingClientRect();
    if(ir.bottom > mr.bottom - 6 || ir.top < mr.top + 6){
      var dest = m.scrollTop + (ir.top - mr.top) - m.clientHeight / 2 + ir.height / 2;
      await scorriDolce(m, Math.max(0, dest), true); await att(120);
    }
  }
  if(o.solo){ await muovi(it, { fermo:true }); it.classList.add('tut-sopra'); return it; }
  await clic(it, { fermo:true, veloce:o.veloce, dopo:o.veloce ? 200 : 320 });
}
async function inserisci(nome, o){
  var g = S.gen;
  await scegli(q('#btn-root'), nome, o); vivo(g);
  await att(150);
}

async function voce(riga, nome, o){ await scegli(q('.voce .cur', riga), nome, o); }
async function fascia(riga, nome, o){ await scegli(q('.campo-fascia .cur', riga), nome, o); }
async function riga(sez, s, nome, v, o){

  await segno(r, s > 0, o); await voce(r, nome, o); await scrivi(q('.imp input', r), v, o);

}
/* 27/09/2026: nelle battute corte la voce nomina SUBITO la voce del cedolino, e aggiungere la riga + il segno + aprire
   l'elenco richiede 3 secondi: la freccetta arrivava fino a 7 s in ritardo. Questi gesti si fanno PRIMA della battuta,
   senza voce; nella battuta si sceglie la voce sulla parola (voce(..., { aperto:true, dire })) e si scrive l'importo. */

}

async function indica(lista, pausa){

/* ---------- i segni numerati sullo schermo ---------- */
function togliSegni(){
  S.segni.forEach(function(s){ if(s.anello) s.anello.remove(); if(s.num) s.num.remove(); });
  S.segni = [];
  if(S.segniTimer){ clearInterval(S.segniTimer); S.segniTimer = null; }
}
function piazzaSegni(){
  var vw = S.win.innerWidth, vh = S.win.innerHeight, fatti = [];
  S.segni.forEach(function(s){
    var el = s.el;
    var via = function(){ s.anello.style.display = 'none'; s.num.style.display = 'none'; };
    if(!el || !el.isConnected || !visibile(el)) return via();
    var r = el.getBoundingClientRect();
    var L = r.left, T = r.top, R = r.right, B = r.bottom;
    var box = scatolaX(el);
    if(box){ var br = box.getBoundingClientRect(); L = Math.max(L, br.left); R = Math.min(R, br.right); }
    if(R - L < 4 || B - T < 2 || B < 4 || T > vh - 4 || R < 4 || L > vw - 4) return via();
    s.anello.style.display = ''; s.num.style.display = '';
    var pad = (el.closest && el.closest('#ced-tendine')) ? 0 : 4;   /* nelle tendine le voci sono attaccate: anelli stretti */
    s.anello.style.left = (L - pad) + 'px'; s.anello.style.top = (T - pad) + 'px';
    s.anello.style.width = (R - L + 2 * pad) + 'px'; s.anello.style.height = (B - T + 2 * pad) + 'px';
    var x = Math.max(2, L - 13), y = Math.max(2, T - 13);
    for(var k = 0; k < 12; k++){
      var urto = fatti.some(function(p){ return Math.abs(p[0] - x) < 25 && Math.abs(p[1] - y) < 25; });
      if(!urto) break;
      x += 27;
    }
    fatti.push([x, y]);
    s.num.style.left = x + 'px'; s.num.style.top = y + 'px';
  });
}
/* a fine animazione lo schermo inquadra i punti della spiegazione (se una tendina e' aperta, non si tocca niente) */
function fisso(el){
  for(var e = el; e && e !== S.doc.body; e = e.parentElement){
    var pos = S.win.getComputedStyle(e).position;
    if(pos === 'fixed' || pos === 'sticky') return true;
  }
  return false;
}
async function inquadra(passo){
  if(menuAperto()) return;
  var els = (passo.punti || []).map(function(p){ try{ return p.el ? p.el() : null; }catch(e){ return null; } })
    .filter(function(el){ return el && visibile(el) && !fisso(el); });
  if(!els.length) return;
  /* tabelle che scorrono di lato: se i punti ci stanno tutti si mostrano tutti, se no si torna al primo */
  var xs = els.filter(function(el){ return scatolaX(el); });
  if(xs.length){
    var box = scatolaX(xs[0]), br = box.getBoundingClientRect(), sl = box.scrollLeft, w = box.clientWidth;
    var minL = Infinity, maxR = -Infinity;
    xs.forEach(function(el){ if(scatolaX(el) !== box) return; var r = el.getBoundingClientRect(); minL = Math.min(minL, r.left - br.left + sl); maxR = Math.max(maxR, r.right - br.left + sl); });
    var basso = maxR - w + 10, alto2 = minL - 10;
    var dest = basso <= alto2 ? Math.min(Math.max(sl, basso), alto2) : alto2;
    await scorriDolce(box, Math.max(0, dest), 'x');
  }
  var sy = S.win.scrollY, vh = S.win.innerHeight;
  var alto = 76, fissa = q('.vc-fissa'); if(fissa && visibile(fissa)) alto = Math.max(alto, fissa.getBoundingClientRect().bottom + 16);
  var top = Infinity, bot = -Infinity;
  els.forEach(function(el){ var r = el.getBoundingClientRect(); top = Math.min(top, r.top + sy); bot = Math.max(bot, r.bottom + sy); });
  var h = bot - top, spazio = vh - alto - 24;
  if(top - sy >= alto && bot - sy <= vh - 24) return;
  var y = h <= spazio ? top - alto - (spazio - h) * 0.4 : top - alto - 8;
  await scorriDolce(S.win, Math.max(0, y));
}
function mettiSegni(passo){
  togliSegni();
  (passo.punti || []).forEach(function(p, i){
    var el = null; try{ el = p.el ? p.el() : null; }catch(e){}
    if(!el) return;
    var col = COLORI[p.tipo] || COLORI.info;
    var an = S.doc.createElement('div'); an.className = 'tut-anello'; an.style.borderColor = col[0]; an.style.setProperty('--alone', col[1]);
    var nu = S.doc.createElement('div'); nu.className = 'tut-num'; nu.style.background = col[0]; nu.textContent = String(i + 1);
    S.doc.body.appendChild(an); S.doc.body.appendChild(nu);
    S.segni.push({ el:el, anello:an, num:nu, i:i });
  });
  piazzaSegni();
  S.segniTimer = setInterval(piazzaSegni, 120);
}
function accendi(i, porta){
  var s = S.segni.filter(function(x){ return x.i === i; })[0];
  if(!s) return;
  if(porta && !menuAperto() && s.el){
    var r = s.el.getBoundingClientRect();
    if(r.top < 60 || r.bottom > S.win.innerHeight - 20){ var f0 = S.fattore; S.fattore = 1; scorriDolce(S.win, Math.max(0, S.win.scrollY + r.top - S.win.innerHeight * 0.35)).catch(function(){}); S.fattore = f0; }
  }
  s.anello.classList.remove('acceso'); void s.anello.offsetWidth; s.anello.classList.add('acceso');
}

async function riapriTendina(p, g){

async function vaiA(i){
  if(!S.pronta) return;
  i = Math.max(0, Math.min(PASSI.length - 1, i));
  S.gen++; var g = S.gen;
  S.idx = i; S.pausa = false; fermaVoce(); giocando(false);
  try{ history.replaceState(null, '', '#tutorial-' + (i + 1)); }catch(e){}
  disegnaPannello(i);
  S.nFrase = 0; S.salta = 0; S.saltando = false; S.frase = 0;
  disegnaBarra();
  statoBottone('pronto');
  var sch = document.querySelector('.schermo'); sch.classList.add('velo');
  S.fattore = 0;
  try{
    pulisciApp(); nascondiCursore(); PASSI[i].prepara();
    if(PASSI[i].anima) await PASSI[i].anima();
    if(g !== S.gen) return;
    finePasso(PASSI[i]);
    await inquadra(PASSI[i]);
    await riapriTendina(PASSI[i], g);
  }catch(e){ if(e !== ANNULLATO) console.error('passo', i, e); }

/* Dalla frase j: il passo si rifa' di colpo fino alla frase j (schermo velato), poi piano con la voce */
async function daFrase(j){
  var i = S.idx, p = PASSI[i];
  if(!S.pronta || !p || !p.anima) return;
  j = Math.max(0, Math.min(S.frasi.length, j));

  try{ pulisciApp(); nascondiCursore(); p.prepara(); }catch(e){ console.error('prepara', i, e); }
  if(!S.saltando){ sch.classList.remove('velo'); S.fattore = RIDOTTO ? 0 : LENTO; }
  giocando(true); statoBottone('gioca');
  try{
    if(!S.saltando) await att(500);
    await p.anima();
    if(S.saltando){ S.saltando = false; sch.classList.remove('velo'); S.fattore = RIDOTTO ? 0 : LENTO; }   /* saltato oltre l'ultima frase */
    await att(300);
    if(g !== S.gen) return;
    finePasso(p);
    await inquadra(p);
    await riapriTendina(p, g);
    if(g !== S.gen) return;
    mettiSegni(p);
  }catch(e){
    if(e !== ANNULLATO) console.error('anima', i, e);
  }finally{
    if(g === S.gen){ giocando(false); S.pausa = false; statoBottone('rifai'); }
  }
}
function pausa(){
  if(!S.giocando) return;
  S.pausa = !S.pausa;
  if(VOCE.el){ try{ if(S.pausa) VOCE.el.pause(); else VOCE.el.play(); }catch(e){} }
  statoBottone();
}

/* ---------------- avvio dello schermo ---------------- */
function avviso(){
  var a = document.getElementById('schermo-avviso');
  a.classList.add('su'); clearTimeout(avviso._t); avviso._t = setTimeout(function(){ a.classList.remove('su'); }, 2200);
}
function preparaSchermo(){
  if(fr._avviato) return;
  fr._avviato = true;
  fr.addEventListener('load', function(){
    var w = fr.contentWindow;
    (function aspetta(n){
      if(!w.__T){ if(n > 200) return; return setTimeout(function(){ aspetta(n + 1); }, 50); }
      S.win = w; S.doc = w.document; S.T = w.__T;
      var st = S.doc.createElement('style'); st.textContent = STILE; S.doc.head.appendChild(st);
      /* lo schermo e' dimostrativo: i tocchi dell'utente non arrivano all'app, solo quelli del pilota */
      ['click', 'mousedown', 'touchend', 'dblclick', 'contextmenu'].forEach(function(tipo){
        w.addEventListener(tipo, function(e){
          if(S.driver) return;
          e.stopPropagation(); e.preventDefault();
          if(tipo === 'click' || tipo === 'touchend') avviso();
        }, { capture:true, passive:false });
      });
      w.addEventListener('keydown', function(e){
        if(S.driver) return;
        e.stopPropagation(); e.preventDefault();
        tastiera(e);
      }, true);
      w.addEventListener('focusin', function(e){ if(!S.driver && e.target && e.target.blur && e.target.tagName === 'INPUT') e.target.blur(); }, true);
      w.addEventListener('resize', function(){ if(S.segni.length) piazzaSegni(); });
      var fatto = function(){ document.getElementById('schermo-carica').style.display = 'none'; S.pronta = true; vaiA(S.idx); };
      try{ (S.doc.fonts && S.doc.fonts.ready ? S.doc.fonts.ready : Promise.resolve()).then(function(){ setTimeout(fatto, 150); }); }catch(e){ fatto(); }
    })(0);
  });
  fr.srcdoc = APP_HTML;
}
function tastiera(e){
  if(document.getElementById('indice').classList.contains('su')){ if(e.key === 'Escape') chiudiIndice(); return; }
  if(e.key === ' ' || e.key === 'Spacebar'){ var gb = document.getElementById('btn-guarda'); if(!gb.hidden) gb.click(); }
  else if(e.key === 'ArrowRight' || e.key === 'PageDown'){ avanti(); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ if(S.idx > 0) vaiA(S.idx - 1); }
}
function avanti(){ if(S.idx < PASSI.length - 1) vaiA(S.idx + 1); else esciTutorial(); }

function apriTutorial(da){
  document.body.classList.add('in-tut');
  S.idx = da || 0;
  preparaSchermo();
  if(S.pronta) vaiA(S.idx);
}
function esciTutorial(){
  S.gen++; fermaVoce(); S.pausa = false; giocando(false);
  if(ONLINE){   /* aperto dal modulo in una scheda nuova: la si chiude; se il browser non lo permette, si va al modulo */
    try{ window.close(); }catch(e){}
    setTimeout(function(){ location.href = MODULO; }, 300);
    return;
  }
  document.body.classList.remove('in-tut');
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  window.scrollTo(0, 0);
}

disegnaIndice();
if(!ONLINE) document.getElementById('apri-tutorial').addEventListener('click', function(){ apriTutorial(0); });
document.getElementById('btn-chiudi-tut').addEventListener('click', esciTutorial);
document.getElementById('btn-av').addEventListener('click', avanti);
document.getElementById('btn-ind').addEventListener('click', function(){ if(S.idx > 0) vaiA(S.idx - 1); });
document.getElementById('btn-guarda').addEventListener('click', function(){ if(S.giocando) pausa(); else guarda(); });
document.getElementById('btn-frase-ind').addEventListener('click', fraseIndietro);
document.getElementById('btn-frase-av').addEventListener('click', fraseAvanti);
document.getElementById('btn-indice').addEventListener('click', apriIndice);
document.getElementById('btn-indice-x').addEventListener('click', chiudiIndice);
document.getElementById('indice').addEventListener('click', function(e){ if(e.target === this) chiudiIndice(); });
document.addEventListener('keydown', function(e){
  if(!document.body.classList.contains('in-tut')) return;
  if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  tastiera(e);
});
var m = /^#tutorial(?:-(\d+))?$/.exec(location.hash);
if(m) apriTutorial(m[1] ? Math.max(0, Number(m[1]) - 1) : 0);
else if(ONLINE) apriTutorial(0);
})();
</script>
